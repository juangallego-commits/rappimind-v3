<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">

</style>
</head><body>
<div class="main">
  <div class="wordmark">RappiAds<br>Design<br>System</div>
</div>
<div class="strip">
  <div class="swatch" style="background:#FFF0DD"></div>
  <div class="swatch" style="background:#FF7A4D"></div>
  <div class="swatch" style="background:#FF2526"></div>
  <div class="swatch" style="background:#0A0A0A"></div>
</div>
</body></html>
