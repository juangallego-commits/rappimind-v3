(function () {
'use strict';

/**
 * La hoja: el T&C que se va llenando mientras el comercial responde.
 *
 * Es el elemento protagonista de la interfaz. Usa el mismo motor de src/core
 * que genera el documento de verdad, asi que lo que se ve aqui es literalmente
 * lo que va a salir.
 *
 * Todo dato del usuario entra como texto, nunca como HTML.
 */

var RM = window.RM;
var crear = RM.util.crear;
var vaciar = RM.util.vaciar;

/** Convierte una linea con marcas ** en nodos, respetando las negritas. */
function nodosConNegritas(texto, destino) {
  var partes = String(texto).split('**');
  for (var i = 0; i < partes.length; i++) {
    if (!partes[i]) continue;
    if (i % 2 === 1 && i < partes.length - (partes.length % 2 === 0 ? 1 : 0)) {
      destino.appendChild(crear('strong', { texto: partes[i] }));
    } else {
      destino.appendChild(document.createTextNode(partes[i]));
    }
  }
}

/** El tipo de bloque de una linea del texto renderizado. */
function claseDeLinea(linea) {
  if (linea.indexOf('## ') === 0) return { clase: 'doc-subtitulo', desde: 3 };
  if (linea.indexOf('# ') === 0) return { clase: 'doc-titulo', desde: 2 };
  if (linea.indexOf('• ') === 0) return { clase: 'doc-vineta', desde: 2 };
  if (/^\*\*\d+\.\s/.test(linea)) return { clase: 'doc-clausula', desde: 0 };
  return { clase: 'doc-parrafo', desde: 0 };
}

/**
 * Dibuja el documento.
 *
 * texto: salida de renderizarVistaPrevia (puede traer huecos marcados)
 * anterior: el texto de la vez pasada, para saber que cambio y resaltarlo
 */
function dibujar(contenedor, texto, anterior) {
  vaciar(contenedor);

  if (!texto) {
    contenedor.appendChild(crear('p', {
      clase: 'hoja-vacia',
      texto: RM.estado.T('Tu documento aparece aquí y se va llenando mientras respondes.'),
    }));
    return null;
  }

  var lineas = texto.split('\n');
  var lineasAnteriores = (anterior || '').split('\n');
  var primeraCambiada = null;

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    var forma = claseDeLinea(linea);
    var contenido = linea.slice(forma.desde);
    var parrafo = crear('p', { clase: forma.clase });

    // Cambió esta línea respecto al render anterior. Solo se marca si antes
    // había algo: la primera vez no se resalta el documento entero.
    var cambio = anterior && lineasAnteriores[i] !== linea;

    var tramos = tramosDeVistaPrevia(contenido);
    for (var t = 0; t < tramos.length; t++) {
      var tramo = tramos[t];

      if (tramo.tipo === 'hueco') {
        parrafo.appendChild(crear('span', {
          clase: 'falta',
          texto: 'falta ' + nombreDelHueco(tramo.valor),
          'data-hueco': tramo.valor,
        }));
        continue;
      }

      if (cambio) {
        var resaltado = crear('mark');
        nodosConNegritas(tramo.valor, resaltado);
        parrafo.appendChild(resaltado);
      } else {
        nodosConNegritas(tramo.valor, parrafo);
      }
    }

    if (cambio && primeraCambiada === null) {
      parrafo.setAttribute('data-cambio', '1');
      primeraCambiada = parrafo;
    }
    contenedor.appendChild(parrafo);
  }

  return primeraCambiada;
}

/** Lleva la hoja hasta la frase que acaba de cambiar. */
function desplazarHasta(contenedor, parrafo) {
  if (!parrafo) return;
  var arriba = parrafo.offsetTop - contenedor.offsetTop - 60;
  if (typeof contenedor.scrollTo === 'function') {
    contenedor.scrollTo({ top: Math.max(0, arriba), behavior: 'smooth' });
  } else {
    contenedor.scrollTop = Math.max(0, arriba);
  }
}

RM.documento = {
  dibujar: dibujar,
  desplazarHasta: desplazarHasta,
  claseDeLinea: claseDeLinea,
};

        crear('span', { clase: 'opcion-nota', texto: razon || opcion.nota || '' }),
      ]);

      boton.addEventListener('keydown', function (evento) {
        if (evento.key !== 'ArrowDown' && evento.key !== 'ArrowUp') return;
        evento.preventDefault();
        var hermanos = grupo.querySelectorAll('.opcion:not([disabled])');
        var actual = Array.prototype.indexOf.call(hermanos, boton);
        var siguiente = evento.key === 'ArrowDown' ? actual + 1 : actual - 1;
        if (hermanos[siguiente]) hermanos[siguiente].focus();
      });

      grupo.appendChild(boton);
    })(opciones[i], i);
  }
  return grupo;
}

/** Casillas: cuando se pueden marcar varias. */
function controlCasillas(campo, pregunta, opciones, alCambiar) {
  var marcadas = estado.entrada()[campo.id] || [];
  var grupo = crear('fieldset', { clase: 'casillas' });

  for (var i = 0; i < opciones.length; i++) {
    (function (opcion) {
      var casilla = crear('input', {
        type: 'checkbox',
        value: opcion.valor,
        checked: marcadas.indexOf(opcion.valor) !== -1,
      });
      casilla.addEventListener('change', function () {
        var actuales = (estado.entrada()[campo.id] || []).slice();
        var posicion = actuales.indexOf(opcion.valor);
        if (casilla.checked && posicion === -1) actuales.push(opcion.valor);
        if (!casilla.checked && posicion !== -1) actuales.splice(posicion, 1);
        alCambiar(actuales);
      });

      grupo.appendChild(crear('label', { clase: 'casilla' }, [
        casilla,
        crear('span', {}, [
          document.createTextNode(opcion.etiqueta),
          opcion.nota ? crear('small', { texto: opcion.nota }) : null,
        ]),
      ]));
    })(opciones[i]);
  }
  return grupo;
}

function controlCasillaUnica(campo, pregunta, alCambiar) {
  var casilla = crear('input', { type: 'checkbox', id: 'campo-' + campo.id, checked: !!estado.entrada()[campo.id] });
  casilla.addEventListener('change', function () { alCambiar(casilla.checked); });
  return crear('label', { clase: 'casilla' }, [casilla, crear('span', { texto: pregunta.ayuda })]);
}

/**
 * Dibuja una pregunta completa.
 *
 * opciones: { pais, error, confirmacion, deshabilitadas, alCambiar, alAvanzar }
 */
function dibujarPregunta(campo, config) {
  var pregunta = RM.estado.pregunta(campo.id);
  if (!pregunta || !pregunta.pregunta) return null;

  var bloque = crear('div', { clase: 'pregunta' + (config.error ? ' campo-error' : ''), 'data-campo': campo.id });

  var titulo = crear('h2', { clase: 'pregunta-titulo', id: 'pregunta-' + campo.id, texto: pregunta.pregunta });
  // Una pregunta opcional tiene que verse opcional. Sin esta marca el comercial
  // se queda atascado buscando que contestar.
  if (pregunta.opcional) {
    titulo.appendChild(crear('span', { clase: 'marca-opcional', texto: RM.estado.T('Opcional') }));
  }
  bloque.appendChild(titulo);
  bloque.appendChild(crear('p', { clase: 'pregunta-ayuda' }, [conGlosario(pregunta.ayuda)]));

  // Devuelve true cuando el cambio ya cambio de pantalla: en ese caso nadie
  // puede avanzar encima.
  function alCambiar(valor) {
    return config.alCambiar(campo.id, valor);
  }

  var control;
  if (campo.tipo === 'numero') control = controlNumero(campo, pregunta, alCambiar, config.pais);
  else if (campo.tipo === 'fecha' || campo.tipo === 'hora') control = controlFechaUHora(campo, alCambiar);
  else if (campo.tipo === 'lista' || campo.tipo === 'tarjetas') {
    control = controlOpciones(campo, pregunta, function (valor) {
      if (alCambiar(valor)) return;
      if (pregunta.avanzaSola && config.alAvanzar) config.alAvanzar();
    }, config.deshabilitadas, config.opciones);
  } else if (campo.tipo === 'casillas') {
    control = controlCasillas(campo, pregunta, config.opciones || pregunta.opciones || [], alCambiar);
  } else if (campo.tipo === 'casilla') {
    control = controlCasillaUnica(campo, pregunta, alCambiar);
  } else {
    control = controlTexto(campo, pregunta, alCambiar);
  }
  bloque.appendChild(control);

  if (config.error) {
    bloque.appendChild(crear('p', { clase: 'mensaje-error', role: 'alert' }, [
      RM.util.icono('alerta', 16), document.createTextNode(config.error),
    ]));
  } else if (config.confirmacion) {
    bloque.appendChild(crear('p', { clase: 'mensaje-ok' }, [
      RM.util.icono('visto', 16), document.createTextNode(config.confirmacion),
    ]));
  }

  /*
   * El aviso puede ser una frase o un bloque ya armado.
   *
   * Empezo siendo siempre una frase (la de la fecha de inicio muy proxima). El
   * panel de como se firma el acuerdo de transferencia de datos es un titulo mas
   * diez pasos numerados, que como frase no se lee. Al pasarlo aqui salia
   * impreso "[object HTMLDivElement]", porque texto: lo convertia a cadena.
   */
  if (config.aviso) {
    bloque.appendChild(config.aviso.nodeType
      ? config.aviso
      : crear('div', { clase: 'aviso', texto: config.aviso }));
  }

  var frase = asiQueda(campo.id, config.pais);
  if (frase) bloque.appendChild(frase);

  bloque.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: RM.estado.T('¿Por qué te preguntamos esto?') }),
    crear('p', {}, [conGlosario(pregunta.porQue)]),
  ]));

  return bloque;
}

/** Una respuesta ya dada, en una línea, con el botón para cambiarla. */
function dibujarRespondida(campo, textoValor, alEditar) {
  var pregunta = RM.estado.pregunta(campo.id);
  return crear('div', { clase: 'ficha-seccion', 'data-campo': campo.id }, [
    crear('div', { clase: 'ficha-encabezado' }, [
      crear('h3', { texto: pregunta.pregunta }),
      crear('button', { clase: 'boton-texto', type: 'button', texto: RM.estado.T('Cambiar'), onclick: alEditar }),
    ]),
    crear('p', { clase: 'pregunta-ayuda', texto: textoValor }),
  ]);
}

RM.campos = {

(function () {
'use strict';

/**
 * El flujo de generacion: inicio, filtro de entrada, los pasos, el resumen y la
 * pantalla final.
 *
 * Dentro de cada paso va UNA pregunta a la vez. Las ya respondidas quedan
 * arriba en una linea, con boton para cambiarlas. Se avanza solo cuando la
 * respuesta es inequivoca (elegir una opcion); si hay que escribir algo, el
 * comercial confirma con Siguiente.
 */

var RM = window.RM;
var crear = RM.util.crear;
var vaciar = RM.util.vaciar;
var estado = RM.estado;
var E = estado.estado;

/** Los pasos que tienen alguna pregunta visible para el tipo elegido. */
function pasosDelTipo(entrada) {
  if (!entrada.tipo) return [];
  var visibles = camposVisibles(entrada.tipo, entrada);
  var conPreguntas = {};
  for (var i = 0; i < visibles.length; i++) {
    var pregunta = preguntaDe(visibles[i].id);
    if (pregunta && pregunta.pregunta) conPreguntas[visibles[i].paso] = true;
  }
  // El paso de confirmación no entra al formulario: la casilla de declaración
  // va en el resumen, que es donde el comercial ve todo junto antes de generar.
  return PASOS.filter(function (paso) {
    return conPreguntas[paso.id] && paso.id !== 'confirmacion';
  });
}

function camposDelPaso(entrada, pasoId) {
  var visibles = camposVisibles(entrada.tipo, entrada);
  var campos = [];
  for (var i = 0; i < visibles.length; i++) {
    if (visibles[i].paso !== pasoId) continue;
    var pregunta = preguntaDe(visibles[i].id);
    if (pregunta && pregunta.pregunta) campos.push(visibles[i]);
  }
  return campos;
}

function tieneRespuesta(campoId) {
  // Un valor por defecto no basta: la pregunta se muestra igual, preseleccionada.
  if (!E.respondidas[campoId]) return false;

  var valor = estado.entrada()[campoId];
  if (campoId === 'maxPedidos') return opcionDeVeces() !== null && (opcionDeVeces() !== 'varias' || valor > 1);
  if (valor === null || valor === undefined || valor === '') return false;
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor.length > 0;
  if (valor === false) return false;
  return true;
}

/** "¿Cuántas veces puede ganar?" reúne maxPedidos y sinLimite en una pregunta. */
function opcionDeVeces() {
  var entrada = estado.entrada();
  if (entrada.sinLimite) return 'sin_limite';
  if (entrada.maxPedidos === 1) return 'una';
  if (entrada.maxPedidos > 1) return 'varias';
  if (entrada.__veces) return entrada.__veces;
  return null;
}

function fijarVeces(valor) {
  E.respondidas.maxPedidos = true;
  if (valor === 'una') estado.fijarVarios({ __veces: 'una', maxPedidos: 1, sinLimite: false });
  else if (valor === 'sin_limite') estado.fijarVarios({ __veces: 'sin_limite', maxPedidos: null, sinLimite: true });
  else estado.fijarVarios({ __veces: 'varias', maxPedidos: null, sinLimite: false });
}

/** Errores de la solicitud, indexados por campo. */
function erroresPorCampo() {
  var pais = paisElegido();
  if (!pais || !estado.entrada().tipo) return {};

  var revision = validarSolicitud(estado.entrada(), pais, {
    fechaReferencia: E.configuracion.hoy || RM.util.hoyEnElNavegador(),
    usuarioEnEquipo: puedeVerPiloto(E.configuracion.rol),
    // Los mensajes salen en el idioma de la interfaz; el documento no cambia.
    idioma: estado.idiomaInterfaz(),
  });

  var porCampo = {};
  for (var i = 0; i < revision.errores.length; i++) {
    var error = revision.errores[i];
    if (!porCampo[error.campo]) porCampo[error.campo] = error.mensaje;
  }
  return porCampo;
}

function paisElegido() {
  return paisPorCodigo(E.configuracion.paises, estado.entrada().pais);
}

function modeloDelTipo() {
  var esquema = esquemaDe(estado.entrada().tipo);
  return esquema ? esquema.modelo : null;
}

// --- Vista previa ------------------------------------------------------------

function refrescarDocumento() {
  var contenedores = document.querySelectorAll('[data-hoja]');
  if (contenedores.length === 0) return;

  var pais = paisElegido();
  var modelo = modeloDelTipo();

  // Todavía sin tipo de campaña: la hoja explica qué va a pasar ahí.
  if (!pais || !modelo) {
    for (var v = 0; v < contenedores.length; v++) RM.documento.dibujar(contenedores[v], '', '');
    var sinTipo = RM.util.porId('cuenta-huecos');
    if (sinTipo) sinTipo.textContent = estado.T('Sin empezar');
    E.ultimoTextoVistaPrevia = '';
    return;
  }

  var resultado = renderizarVistaPrevia(modelo, estado.entrada(), pais, MODELOS);

  for (var i = 0; i < contenedores.length; i++) {
    var cambiada = RM.documento.dibujar(contenedores[i], resultado.texto, E.ultimoTextoVistaPrevia);
    RM.documento.desplazarHasta(contenedores[i], cambiada);
  }

  var cuenta = RM.util.porId('cuenta-huecos');
  if (cuenta) {
    cuenta.textContent = resultado.huecos.length === 0
      ? estado.T('Completo')
      : (resultado.huecos.length === 1
        ? estado.T('Falta 1 dato')
        : estado.T('Faltan {n} datos').replace('{n}', resultado.huecos.length));
  }
  E.ultimoTextoVistaPrevia = resultado.texto;
}

function pantallaFiltro(raiz) {
  var contenido = crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('h1', { texto: estado.T('¿Esta campaña la puedo hacer aquí?') }),

  ]);

  // Primero el tipo, porque el filtro depende de él.
  var preguntas = [
    { id: 'azar', texto: '¿Hay azar: sorteo, rifa, raspa y gana o ruleta?', razon: 'Las dinámicas con azar necesitan permiso previo de la autoridad. Legal tiene que revisarlas antes de lanzarlas.' },
    { id: 'tycPropios', texto: '¿La tienda o la marca exige sus propios T&C?', razon: 'Si el aliado impone su documento, hay que revisarlo con Legal antes de publicarlo.' },
  ];

  var respuestas = {};
  var lista = crear('div', {});

  function revisar() {
    for (var i = 0; i < preguntas.length; i++) {

        E.motivoDeLegal = estado.T(preguntas[i].razon);
        RM.app.ir('legal');
        return;
      }
    }
    var todas = preguntas.every(function (p) { return respuestas[p.id] === false; });
    if (todas) {
      E.filtroRespondido = true;

  for (var i = 0; i < preguntas.length; i++) {

      ]);

      [['no', 'No', false], ['si', 'Sí', true]].forEach(function (par) {
        grupo.appendChild(crear('button', {
          clase: 'opcion', type: 'button', texto: estado.T(par[1]),
          role: 'radio', 'aria-checked': 'false', 'aria-pressed': 'false',
          onclick: function () {
            respuestas[pregunta.id] = par[2];
            var hermanos = grupo.querySelectorAll('.opcion');

              hermanos[k].setAttribute('aria-checked', 'false');
              hermanos[k].setAttribute('aria-pressed', 'false');

            this.setAttribute('aria-checked', 'true');
            this.setAttribute('aria-pressed', 'true');
            revisar();

        }));

  contenido.appendChild(lista);

/** Valor de un campo en palabras, para el resumen y las respuestas cerradas. */
function comoTexto(campo) {
  var entrada = estado.entrada();
  var valor = entrada[campo.id];
  var pregunta = estado.pregunta(campo.id);

  if (campo.id === 'maxPedidos') {
    var opcion = flujo.opcionDeVeces();
    if (opcion === 'sin_limite') return estado.T('Sin límite');
    if (opcion === 'una') return estado.T('Una sola vez');
    if (opcion === 'varias') return valor ? estado.T('{n} veces').replace('{n}', valor) : estado.T('Varias veces');
    return '';
  }
  if (valor === null || valor === undefined || valor === '') return '';
  if (campo.tipo === 'casilla') return valor ? estado.T('Confirmado') : '';

  // País y tipo traen sus nombres del servidor, no del esquema.
  if (campo.id === 'pais') {
    var pais = paisPorCodigo(E.configuracion.paises, valor);
    return pais ? pais.nombre : String(valor);
  }
  if (campo.id === 'tipo') {
    for (var t = 0; t < E.configuracion.tipos.length; t++) {
      if (E.configuracion.tipos[t].id === valor) return E.configuracion.tipos[t].nombre;
    }
    return String(valor);
  }

  if (Object.prototype.toString.call(valor) === '[object Array]') {
    if (campo.id === 'tiendas') return valor.length + (valor.length === 1 ? ' tienda' : ' tiendas');
    var etiquetas = valor.map(function (v) {
      var encontrada = (pregunta.opciones || campo.opciones || []).filter(function (o) { return o.valor === v; })[0];
      return encontrada ? encontrada.etiqueta : v;
    });
    return etiquetas.join(', ');
  }

  // Las opciones que salen de los datos no estan en el esquema ni en la
  // pregunta. Sin esto, la categoria respondida se leia arriba como
  // "medicamento", que es el nombre interno y no lo que dice la opcion.
  var opciones = opcionesDeLosDatos(campo) || pregunta.opciones || campo.opciones;
  if (opciones) {
    var elegida = opciones.filter(function (o) { return o.valor === valor; })[0];
    if (elegida) return elegida.etiqueta;
  }

  // En el idioma del pais, como en el documento: una campana de Brasil decia
  // "1 de octubre de 2026" arriba y "1 de outubro de 2026" en el T&C de al lado.
  if (campo.tipo === 'fecha') return formatearFechaDelPais(valor, flujo.paisElegido());
  if (campo.tipo === 'hora') return formatearHoraDelPais(valor, flujo.paisElegido());

  // La identificación se muestra como va en el documento, no como se escribió.
  if (campo.tipo === 'identificacion') {
    var paisId = flujo.paisElegido();
    if (paisId) {
      var revision = validarIdentificacion(paisId.codigo, valor);
      if (revision.valido) return revision.formateado;
    }
    return String(valor);
  }
  if (campo.id === 'porcentaje') return valor + '%';
  if (pregunta.moneda) {
    var paisMoneda = flujo.paisElegido();
    return (paisMoneda ? paisMoneda.moneda_simbolo : '$') + formatearMiles(valor, paisMoneda ? paisMoneda.separador_miles : '.');
  }
  return String(valor);
}

function opcionesDeLosDatos(campo) {
  var pais = flujo.paisElegido();

  if (campo.id === 'secciones') {

  if (campo.id === 'acuerdoDatos') {

    var pregunta = estado.pregunta('acuerdoDatos');

    var opciones = [{

/** La calculadora de ejemplo del Cashback. */
function calculadora() {
  var entrada = estado.entrada();
  if (entrada.tipo !== 'cashback' && entrada.tipo !== 'cashback_day') return null;
  if (!entrada.porcentaje) return null;

  var pais = flujo.paisElegido();
  if (!pais) return null;

  var simbolo = pais.moneda_simbolo;
  var separador = pais.separador_miles;
  var ejemplo = 100000;
  var bruto = Math.round(ejemplo * Number(entrada.porcentaje) / 100);
  var recibe = entrada.tope ? Math.min(bruto, Number(entrada.tope)) : bruto;

  var lineas = [
    crear('p', {
      texto: 'Con estos datos, un pedido de ' + simbolo + formatearMiles(ejemplo, separador) +
        ' recibe ' + simbolo + formatearMiles(recibe, separador) + ' en Créditos.',
    }),
  ];
  if (entrada.tope && bruto > Number(entrada.tope)) {
    lineas.push(crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'El tope lo frena: sin tope habrían sido ' + simbolo + formatearMiles(bruto, separador) + '.',
    }));
  }
  if (entrada.tope && entrada.presupuesto && Number(entrada.tope) > Number(entrada.presupuesto)) {
    lineas.push(crear('p', {
      clase: 'mensaje-error',
      texto: 'Ojo: el tope por pedido es mayor que el presupuesto total. El primer pedido se llevaría toda la campaña.',
    }));
  }
  return crear('div', { clase: 'aviso' }, lineas);
}

/**

function barraDeProgreso(pasos) {

/**

 * pantalla y decidir a donde ir al pulsar Siguiente. Con listas distintas el
 * indice de la pregunta abierta apuntaba a otra pregunta y el asistente se
 * saltaba la del negocio.
 */
function camposDeArranque() {
  return [
    { id: 'pais', tipo: 'lista', paso: 'campana', etiqueta: 'País' },
    { id: 'negocio', tipo: 'lista', paso: 'campana', etiqueta: 'Negocio', opciones: preguntaDe('negocio').opciones },
    { id: 'tipo', tipo: 'tarjetas', paso: 'campana', etiqueta: 'Tipo' },
  ];
}

function pantallaPasos(raiz) {
  var entrada = estado.entrada();
  var pasos = flujo.pasosDelTipo(entrada);

  // Sin tipo elegido todavía: se pregunta país y tipo primero.
  if (pasos.length === 0) {
    pasos = [pasoDe('campana')];
  }
  if (E.pasoActual >= pasos.length) E.pasoActual = pasos.length - 1;

  var pasoActual = pasos[E.pasoActual];
  var campos = flujo.camposDelPaso(entrada, pasoActual.id);
  if (campos.length === 0 && !entrada.tipo) campos = camposDeArranque();

  var errores = flujo.erroresPorCampo();

  // Cuál pregunta está abierta: la que se pidió editar, o la primera sin responder.
  var indiceAbierto = 0;
  if (E.campoAbierto) {
    for (var i = 0; i < campos.length; i++) if (campos[i].id === E.campoAbierto) indiceAbierto = i;
  } else {
    indiceAbierto = campos.length - 1;
    for (var j = 0; j < campos.length; j++) {
      if (!flujo.tieneRespuesta(campos[j].id)) { indiceAbierto = j; break; }
    }
  }

  var columna = crear('div', { clase: 'columna-preguntas' });
  columna.appendChild(barraDeProgreso(pasos));
  columna.appendChild(crear('h1', { texto: estado.T(pasoActual.titulo || pasoActual.nombre) }));

  // El aviso del pais en pruebas acompana todo el formulario: al elegir el pais
  // el asistente avanza solo, asi que colgarlo de esa pregunta era no mostrarlo.
  var enPruebas = avisoDePaisEnPruebas();
  if (enPruebas) columna.appendChild(enPruebas);

  // Respondidas, en una línea.
  var respondidas = crear('div', { clase: 'ficha' });
  var cuantasRespondidas = 0;
  for (var r = 0; r < indiceAbierto; r++) {
    (function (campo) {
      if (!flujo.tieneRespuesta(campo.id)) return;
      cuantasRespondidas += 1;
      respondidas.appendChild(RM.campos.dibujarRespondida(campo, comoTexto(campo), function () {
        E.campoAbierto = campo.id;
        RM.app.dibujar();
      }));
    })(campos[r]);
  }
  if (cuantasRespondidas > 0) columna.appendChild(respondidas);

  // La pregunta abierta.
  var campoAbierto = campos[indiceAbierto];
  if (campoAbierto) {
    var opcionesEspeciales = opcionesDeLosDatos(campoAbierto);
    var bloque = RM.campos.dibujarPregunta(campoAbierto, {
      pais: flujo.paisElegido(),
      error: E.errores[campoAbierto.id] ? errores[campoAbierto.id] : null,
      confirmacion: confirmacionDe(campoAbierto),
      deshabilitadas: opcionesDeshabilitadas(campoAbierto),
      opciones: opcionesEspeciales,
      aviso: avisoDe(campoAbierto),
      alCambiar: function (campoId, valor) { return alResponder(campoId, valor, campos, indiceAbierto); },
      alAvanzar: function () { avanzar(campos, indiceAbierto, pasos); },
    });

    if (bloque) {
      // País y tipo se dibujan a mano porque sus opciones salen del servidor.
      if (campoAbierto.id === 'pais' || campoAbierto.id === 'tipo') {
        bloque = preguntaDeCatalogo(campoAbierto, campos, indiceAbierto, pasos);
      }
      if (campoAbierto.id === 'maxPedidos') {
        bloque = preguntaDeVeces(campos, indiceAbierto, pasos, errores);
      }
      if (campoAbierto.id === 'tiendas') {
        bloque = RM.tiendas.dibujar(function () { RM.app.dibujar(); });
      }
      columna.appendChild(bloque);
    }

    var extra = campoAbierto.id === 'tope' || campoAbierto.id === 'presupuesto' || campoAbierto.id === 'porcentaje'
      ? calculadora() : null;
    if (extra) columna.appendChild(extra);


  }

  // Cuántas faltan en este paso.
  var faltan = campos.length - indiceAbierto - 1;
  if (faltan > 0) {
    columna.appendChild(crear('p', {
      clase: 'pregunta-ayuda',
      texto: faltan === 1
        ? estado.T('Queda 1 pregunta en este paso.')
        : estado.T('Quedan {n} preguntas en este paso.').replace('{n}', faltan),
    }));
  }

  columna.appendChild(crear('div', { clase: 'fila-botones' }, [
    E.pasoActual > 0 || indiceAbierto > 0
      ? crear('button', {
          clase: 'boton boton-secundario', type: 'button', texto: estado.T('Atrás'),
          onclick: function () { retroceder(campos, indiceAbierto, pasos); },
        })
      : null,
    crear('button', {
      clase: 'boton', type: 'button',
      texto: entrada.tipo && indiceAbierto === campos.length - 1 && E.pasoActual === pasos.length - 1
        ? estado.T('Revisar y generar') : estado.T('Siguiente'),
      onclick: function () { avanzar(campos, indiceAbierto, pasos); },
    }),
  ]));

  var contenido = crear('div', { clase: 'pagina' }, [
    crear('div', { clase: 'dos-columnas' }, [columna, columnaDocumento()]),
  ]);
  raiz.appendChild(contenido);
  RM.app.agregarHojaDeCelular(raiz);
  flujo.refrescarDocumento();
}

function confirmacionDe(campo) {
  if (campo.id !== 'organizadorId') return null;
  var valor = estado.entrada().organizadorId;
  if (!valor) return null;
  var pais = flujo.paisElegido();
  if (!pais) return null;
  var revision = validarIdentificacion(pais.codigo, valor);
  return revision.valido ? revision.formateado + ' válido' : null;
}

/** País y tipo: las opciones vienen del servidor, no del esquema. */
function preguntaDeCatalogo(campo, campos, indice, pasos) {
  var pregunta = estado.pregunta(campo.id);
  var bloque = crear('div', { clase: 'pregunta' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.pregunta }),
    crear('p', { clase: 'pregunta-ayuda' }, [RM.campos.conGlosario(pregunta.ayuda)]),
  ]);

  var elegido = estado.entrada()[campo.id];
  var grupo = crear('div', { clase: 'opciones', role: 'radiogroup' });

  var opciones;
  if (campo.id === 'pais') {
    opciones = E.configuracion.paises.map(function (p) {
      return { valor: p.codigo, etiqueta: p.nombre, nota: p.estado === 'piloto' ? estado.T('En piloto: solo para el equipo de pruebas.') : estado.T('Disponible.') };
    });
  } else {
    // Solo los tipos del negocio elegido: Rappi y Rappi Travel son dos empresas
    // distintas y mezclar sus tipos en la misma lista confunde.
    var pais = flujo.paisElegido();
    var negocio = estado.entrada().negocio || 'rappi';
    opciones = tiposDelPais(pais || { modelos: [] }, E.configuracion.tipos)
      .filter(function (t) { return (t.esDeTravel ? 'travel' : 'rappi') === negocio; })
      .map(function (t) { return { valor: t.id, etiqueta: t.nombre, nota: estado.T(t.descripcion) }; });
  }

  for (var i = 0; i < opciones.length; i++) {
    (function (opcion) {
      grupo.appendChild(crear('button', {
        clase: 'opcion' + (elegido === opcion.valor ? ' elegida' : ''),
        type: 'button', role: 'radio', 'aria-checked': String(elegido === opcion.valor),
        onclick: function () {
          if (alResponder(campo.id, opcion.valor, campos, indice)) return;
          E.campoAbierto = null;
          seguirDespuesDeUnaTarjeta();
        },
      }, [
        crear('span', { clase: 'opcion-titulo', texto: opcion.etiqueta }),
        crear('span', { clase: 'opcion-nota', texto: opcion.nota }),
      ]));

/**
 * Guarda una respuesta.
 *
 * Devuelve true cuando la respuesta ya cambio de pantalla. Quien llama tiene
 * que respetarlo y no avanzar encima: avanzar despues de navegar mandaba al
 * resumen con el formulario vacio.
 */
/**
 * Que hacer despues de elegir el pais, el negocio o el tipo.
 *
 * Si el paso todavia tiene preguntas sin responder, se abre la siguiente. Si no
 * queda ninguna, se pasa al paso siguiente: en Rappi Travel el paso de la
 * campana se acaba con el tipo, y quedarse quieto dejaba al comercial mirando
 * la pregunta que acababa de contestar.
 */
/** true si el pais elegido ofrece algun tipo de Rappi Travel. */
function hayTravelEnElPais() {
  var pais = flujo.paisElegido();
  if (!pais) return false;
  var disponibles = tiposDelPais(pais, E.configuracion.tipos);
  for (var i = 0; i < disponibles.length; i++) {
    if (disponibles[i].esDeTravel) return true;
  }
  return false;
}

/**
 * Por que este pais no puede hacer Travel hoy, o cadena vacia si si puede.
 *
 * Son dos cosas distintas y el comercial merece saber cual: que el pais no
 * tenga habilitados los tipos de Travel, o que los tenga pero le falte un dato
 * legal (el RNT, la razon social de la agencia). Lo segundo se arregla llenando
 * el Sheet, asi que el mensaje lo dice con nombre propio en vez de mandarlo a
 * redactar el documento a mano.
 */
function razonParaNoHacerTravel() {
  var pais = flujo.paisElegido();
  if (!hayTravelEnElPais()) {
    return 'Rappi Travel todavía no está habilitado en ' + ((pais || {}).nombre || 'tu país') +
      '. Las campañas de viajes de ese país las redacta Legal a mano.';
  }
  var revision = travelDisponible(pais, E.configuracion.hoy || RM.util.hoyEnElNavegador());
  return revision.disponible ? '' : revision.motivo;
}

function seguirDespuesDeUnaTarjeta() {
  var ahora = situacionActual();
  for (var i = 0; i < ahora.campos.length; i++) {
    if (!flujo.tieneRespuesta(ahora.campos[i].id)) {
      RM.app.dibujar();
      return;
    }
  }
  if (ahora.campos.length > 0 && E.pasoActual < ahora.pasos.length - 1) E.pasoActual += 1;
  RM.app.dibujar();
}

function alResponder(campoId, valor, campos, indice) {
  estado.fijar(campoId, valor);
  E.errores[campoId] = true;
  E.respondidas[campoId] = true;

  // Al elegir el día de inicio se propone el mismo día de fin: tres de cada
  // cuatro campañas de cashback duran un solo día. Y si el tipo no pregunta la
  // fecha de fin (el ETA es de un solo día), el fin ES el inicio y se mantiene
  // igual siempre: antes se fijaba una sola vez, y al cambiar el día de inicio
  // quedaba una fecha de fin vieja que ninguna pregunta dejaba corregir.
  if (campoId === 'fechaInicio') {
    var preguntaElFin = tieneCampo(esquemaDe(estado.entrada().tipo), 'fechaFin');
    if (!estado.entrada().fechaFin || !preguntaElFin) estado.fijar('fechaFin', valor);
  }
  if (campoId === 'pais') estado.fijar('tipo', null);

  // Cambiar de negocio invalida el tipo elegido: los tipos de Rappi no son los
  // de Rappi Travel.
  if (campoId === 'negocio') {
    estado.fijar('tipo', null);
    E.respondidas.tipo = false;

    // Rappi Travel solo existe donde el pais lo tiene habilitado. En los demas
    // sigue siendo un caso de Legal, y hay que decirlo aqui: mandarlo al
    // formulario de Travel seria ofrecerle algo que no se le puede dar.
    if (valor === 'travel') {
      var porQueNo = razonParaNoHacerTravel();
      if (porQueNo) {
        E.motivoDeLegal = porQueNo;
        RM.app.ir('legal');
        return true;
      }
    }

    // Rappi Travel tiene su propio filtro de nueve preguntas. Va aqui, apenas
    // se sabe que la campana es de viajes, para no hacerle llenar media
    // campana a alguien que va a terminar en Legal.
    if (valor === 'travel' && !E.filtroDeTravelRespondido) {
      flujo.refrescarDocumento();
      RM.app.ir('filtroTravel');
      return true;
    }

    E.campoAbierto = 'tipo';
    flujo.refrescarDocumento();
    RM.app.dibujar();
    return true;
  }
  if (campoId === 'criterioGanador' && estado.entrada().desempate === valor) estado.fijar('desempate', null);

  flujo.refrescarDocumento();
  actualizarValidacionEnVivo(campoId);
  return false;
}

/** Refresca solo el mensaje de error del campo abierto, sin redibujar todo. */
function actualizarValidacionEnVivo(campoId) {
  var bloque = document.querySelector('[data-campo="' + campoId + '"]');
  if (!bloque) return;

  var errores = flujo.erroresPorCampo();
  var viejo = bloque.querySelector('.mensaje-error, .mensaje-ok');
  if (viejo) viejo.parentNode.removeChild(viejo);

  var control = bloque.querySelector('input, select, .opciones');
  var mensaje = null;

  if (errores[campoId]) {
    bloque.classList.add('campo-error');
    mensaje = crear('p', { clase: 'mensaje-error', role: 'alert' }, [
      RM.util.icono('alerta', 16), document.createTextNode(errores[campoId]),
    ]);
  } else {
    bloque.classList.remove('campo-error');
    var confirmacion = confirmacionDe({ id: campoId });
    if (confirmacion) {
      mensaje = crear('p', { clase: 'mensaje-ok' }, [
        RM.util.icono('visto', 16), document.createTextNode(confirmacion),
      ]);
    }
  }
  if (mensaje && control) control.parentNode.insertBefore(mensaje, control.nextSibling);

  var frase = RM.campos.asiQueda(campoId, flujo.paisElegido());
  var vieja = bloque.querySelector('.asi-queda');
  if (vieja) vieja.parentNode.removeChild(vieja);
  if (frase) {
    var detalle = bloque.querySelector('.por-que');
    bloque.insertBefore(frase, detalle);
  }
}

/**
 * Recalcula los pasos y las preguntas del momento.
 *
 * Hay que recalcular siempre: elegir el país o el tipo cambia qué pasos existen
 * y qué preguntas se ven, así que las listas que se armaron para dibujar la
 * pantalla anterior ya no sirven para decidir a dónde ir.
 */
function situacionActual() {
  var entrada = estado.entrada();
  var pasos = flujo.pasosDelTipo(entrada);
  if (pasos.length === 0) pasos = [pasoDe('campana')];
  if (E.pasoActual >= pasos.length) E.pasoActual = pasos.length - 1;

  var campos = flujo.camposDelPaso(entrada, pasos[E.pasoActual].id);
  if (campos.length === 0 && !entrada.tipo) campos = camposDeArranque();
  return { pasos: pasos, campos: campos };
}

function avanzar(camposViejos, indiceViejo, pasosViejos) {
  var ahora = situacionActual();
  var campos = ahora.campos;
  var pasos = ahora.pasos;

  // El índice se vuelve a buscar por identificador: la lista pudo cambiar.
  var indice = indiceViejo;
  if (camposViejos && camposViejos[indiceViejo]) {
    var buscado = camposViejos[indiceViejo].id;
    for (var b = 0; b < campos.length; b++) if (campos[b].id === buscado) indice = b;
  }
  if (indice >= campos.length) indice = campos.length - 1;

  var errores = flujo.erroresPorCampo();
  var campo = campos[indice];

  if (campo && errores[campo.id]) {
    E.errores[campo.id] = true;
    E.campoAbierto = campo.id;
    RM.app.dibujar();
    RM.util.anunciar(errores[campo.id]);
    return;
  }

  if (campo) E.respondidas[campo.id] = true;

  E.campoAbierto = null;
  if (indice < campos.length - 1) {
    E.campoAbierto = campos[indice + 1].id;
    RM.app.dibujar();
    return;
  }
  if (E.pasoActual < pasos.length - 1) {
    E.pasoActual += 1;
    RM.app.dibujar();
    return;
  }
  RM.app.ir('resumen');
}

function retroceder(camposViejos, indiceViejo, pasosViejos) {
  var ahora = situacionActual();
  var campos = ahora.campos;
  var pasos = ahora.pasos;
  var indice = Math.min(indiceViejo, campos.length - 1);

  E.campoAbierto = null;
  if (indice > 0) {
    E.campoAbierto = campos[indice - 1].id;
    RM.app.dibujar();
    return;
  }
  if (E.pasoActual > 0) {
    E.pasoActual -= 1;
    RM.app.dibujar();
    return;
  }
  RM.app.ir('filtro');
}

RM.pasos = {
  pantallaPasos: pantallaPasos,
  avanzar: avanzar,
  comoTexto: comoTexto,
  columnaDocumento: columnaDocumento,
  calculadora: calculadora,
  avisoDePaisEnPruebas: avisoDePaisEnPruebas,
};

/**

 * Hay campanas para las que NO hay que generar nada: descuentos, cupones,

 * Por eso esta pantalla se lee como una buena noticia y no como una negativa:

/** El pais de la campana, o Colombia si todavia no se eligio ninguno. */
function codigoDelPais() {
  var pais = RM.flujo.paisElegido();

}

function hoy() {
  return (E.configuracion && E.configuracion.hoy) || RM.util.hoyEnElNavegador();
}

/**
 * La tarjeta que lleva aqui desde la lista de tipos de campana.

 */
function tarjetaDeAtajo() {
  var codigo = codigoDelPais();
  if (!hayTycGenericos(codigo)) return null;

  // La buena noticia solo se da si hay algo que dar. Catorce de los quince
  // vencen el 31 de diciembre de 2026: si nadie actualiza la lista, la tarjeta

  var quedan = hayTycGenericosUsables(codigo, hoy());

/** Paso 1: los T&C publicados, con su descripcion y su vigencia. */

  }));

/** La descripcion, salvo cuando el Excel repite el nombre: no se muestra dos veces. */
function descripcionSinRepetir(tyc) {
  var descripcion = descripcionDeTycGenerico(tyc);
  return descripcion === tyc.nombre ? null : descripcion;
}

function tarjetaDeUno(tyc) {
  var revision = estadoDeTycGenerico(tyc, hoy());

  var partes = [crear('span', { clase: 'opcion-titulo', texto: tyc.nombre })];
  if (tyc.beneficio) partes.push(crear('span', { clase: 'opcion-nota', texto: tyc.beneficio }));
  var descripcion = descripcionSinRepetir(tyc);
  if (descripcion) partes.push(crear('span', { clase: 'opcion-nota', texto: descripcion }));
  // Lo que Legal dejo sin resolver se dice ya en la lista, no solo al abrirlo:
  // el mismo T&C aparece dos veces con enlaces distintos, y quien lo ve por
  // primera vez ahi es donde se confunde.
  if (tyc.advertencia) partes.push(crear('span', { clase: 'opcion-nota', texto: tyc.advertencia }));
  partes.push(crear('span', {
    clase: 'opcion-nota' + (revision.usable ? '' : ' opcion-nota-vencido'),
    texto: revision.mensaje ? revision.mensaje : revision.vigencia,
  }));

  // Un T&C vencido o que todavia no arranca se queda a la vista con su razon,
  // no desaparece: si desapareciera, el comercial creeria que la herramienta no
  // lo tiene y volveria a escribirle a Legal. Y no va con disabled: un boton
  // deshabilitado no recibe foco, y quien navega con teclado o con lector de
  // pantalla pasaria de largo sin enterarse de que existe ni de que vencio.
  return crear('button', {
    clase: 'opcion' + (revision.usable ? '' : ' opcion-vencida'), type: 'button',
    'aria-disabled': revision.usable ? null : 'true',
    onclick: function () {
      if (!revision.usable) return;
      E.tycGenericoElegido = tyc.id;
      RM.app.dibujar();
      window.scrollTo(0, 0);

/** Paso 2: el enlace, que es lo unico que el comercial se lleva de aqui. */
function detalle(tyc) {
  var revision = estadoDeTycGenerico(tyc, hoy());

  var contenido = crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('h1', { texto: tyc.nombre }),
  ]);

  if (!revision.usable) {
    contenido.appendChild(crear('div', { clase: 'aviso aviso-serio' }, [
      crear('p', { texto: revision.mensaje }),
    ]));
    contenido.appendChild(crear('div', { clase: 'fila-botones' }, [botonVolverALaLista(), botonVolverALosTipos()]));
    return contenido;
  }

  // Lo que Legal dejo sin resolver en su lista se dice ANTES del enlace, no
  // despues: estaba al final, debajo de una caja que ordenaba "copia el enlace
  // y ponlo en la pieza, tal cual", y en una pantalla normal no se veia sin
  // hacer scroll. El comercial copiaba y se iba sin leer "confirma con Legal
  // cuál va". Aqui no se arregla nada del Excel: corregirlo por cuenta propia
  // seria publicar una pieza con un respaldo que nadie aprobo.
  var pendientes = [];
  if (tyc.advertencia) pendientes.push(tyc.advertencia);
  if (!String(tyc.paraQue || '').trim()) pendientes.push(descripcionDeTycGenerico(tyc));
  if (revision.mensaje) pendientes.push(revision.mensaje);

  if (pendientes.length > 0) {
    var avisoPendiente = crear('div', { clase: 'aviso aviso-serio', 'data-pendiente': '1' }, [
      crear('h3', { texto: 'Antes de usar este enlace, confirma con Legal' }),
    ]);
    for (var p = 0; p < pendientes.length; p++) avisoPendiente.appendChild(crear('p', { texto: pendientes[p] }));
    contenido.appendChild(avisoPendiente);
  }

  contenido.appendChild(crear('div', { clase: 'aviso' }, pendientes.length > 0
    ? [
      crear('h3', { texto: 'Este es el enlace que Legal tiene publicado' }),
      crear('p', { texto: 'No generas ningún documento. Cuando Legal te confirme lo de arriba, este es el enlace que va en la pieza.' }),
    ]
    : [

    ]),

  var ficha = crear('div', { clase: 'ficha' });

(function () {
'use strict';

/**
 * La lista de tiendas del Cashback Day.
 *
 * Es el unico componente repetible. Cada tienda entra con su marca, su razon
 * social, su NIT, su cobertura y su presupuesto, porque cada una organiza su
 * propio beneficio y responde por el.
 *
 * Tambien acepta pegar filas desde Excel: 78 de las solicitudes reales meten
 * tres o mas tiendas dentro de un campo de texto, asi que pegar es como
 * trabajan de verdad.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;

var COLUMNAS = ['marca', 'razonSocial', 'id', 'ciudades', 'presupuesto'];

function tiendas() {
  if (!estado.entrada().tiendas) estado.fijar('tiendas', []);
  return estado.entrada().tiendas;
}

function tiendaVacia() {
  return { marca: '', razonSocial: '', id: '', ciudades: '', nacional: false, presupuesto: null };
}

/** Revisa una fila y devuelve los problemas, campo por campo. */
function revisarTienda(tienda, indice, todas) {
  var pais = RM.flujo.paisElegido();
  var problemas = {};
  var textos = preguntaDe('tiendas').camposPorTienda;

  if (!tienda.marca) problemas.marca = 'Falta ' + textos.marca.pregunta.toLowerCase() + '.';
  if (!tienda.razonSocial) problemas.razonSocial = 'Falta la razón social.';
  if (!tienda.presupuesto) problemas.presupuesto = 'Falta el presupuesto de esta tienda.';
  if (!tienda.nacional && !tienda.ciudades) problemas.ciudades = 'Escribe las ciudades o marca cobertura nacional.';

  if (!tienda.id) {
    problemas.id = 'Falta el NIT de esta tienda.';
  } else if (pais) {
    var revision = validarIdentificacion(pais.codigo, tienda.id);
    if (!revision.valido) {
      problemas.id = revision.mensaje;
    } else {
      for (var i = 0; i < todas.length; i++) {
        if (i === indice || !todas[i].id) continue;
        var otra = validarIdentificacion(pais.codigo, todas[i].id);
        if (otra.valido && otra.formateado === revision.formateado) {
          problemas.id = preguntaDe('tiendas').errores.repetida;
          break;
        }
      }
    }
  }
  return problemas;
}

function filaDeTienda(tienda, indice, alCambiar) {
  var textos = preguntaDe('tiendas').camposPorTienda;
  var pais = RM.flujo.paisElegido();
  var problemas = revisarTienda(tienda, indice, tiendas());

  var fila = crear('div', { clase: 'ficha-seccion', 'data-tienda': String(indice) }, [
    crear('div', { clase: 'ficha-encabezado' }, [
      crear('h3', { texto: 'Tienda ' + (indice + 1) + (tienda.marca ? ': ' + tienda.marca : '') }),
      crear('button', {
        clase: 'boton-texto', type: 'button', texto: 'Quitar',
        onclick: function () {
          var lista = tiendas().slice();
          lista.splice(indice, 1);
          estado.fijar('tiendas', lista);
          alCambiar();
        },
      }),
    ]),
  ]);

  function campoTexto(llave, esMonto) {
    var control = crear('input', {
      type: 'text',
      inputmode: esMonto ? 'numeric' : null,
      value: esMonto
        ? (tienda[llave] ? RM.util.conSeparadorDeMiles(tienda[llave], pais ? pais.separador_miles : '.') : '')
        : (tienda[llave] || ''),
      placeholder: textos[llave].ejemplo || '',
      'aria-label': textos[llave].pregunta + ' de la tienda ' + (indice + 1),
      disabled: llave === 'ciudades' && tienda.nacional,
    });
    control.addEventListener('input', function () {
      var lista = tiendas().slice();
      if (esMonto) {
        var digitos = RM.util.soloDigitos(control.value);
        control.value = RM.util.conSeparadorDeMiles(digitos, pais ? pais.separador_miles : '.');
        lista[indice][llave] = digitos ? Number(digitos) : null;
      } else {
        lista[indice][llave] = control.value;
      }
      estado.fijar('tiendas', lista);
      RM.flujo.refrescarDocumento();
    });
    control.addEventListener('blur', alCambiar);

    return crear('label', { clase: 'campo' }, [
      crear('p', { clase: 'pregunta-ayuda', texto: textos[llave].pregunta + '. ' + textos[llave].ayuda }),
      crear('div', { clase: 'campo-caja' + (esMonto ? ' con-moneda' : '') }, [
        esMonto ? crear('span', { clase: 'simbolo-moneda', texto: pais ? pais.moneda_simbolo : '$' }) : null,
        control,
      ]),
      problemas[llave] ? crear('p', { clase: 'mensaje-error', texto: problemas[llave] }) : null,
    ]);
  }

  fila.appendChild(campoTexto('marca', false));
  fila.appendChild(campoTexto('razonSocial', false));
  fila.appendChild(campoTexto('id', false));

  var nacional = crear('input', { type: 'checkbox', checked: !!tienda.nacional });
  nacional.addEventListener('change', function () {
    var lista = tiendas().slice();
    lista[indice].nacional = nacional.checked;
    if (nacional.checked) lista[indice].ciudades = '';
    estado.fijar('tiendas', lista);
    alCambiar();
  });
  fila.appendChild(crear('label', { clase: 'casilla' }, [
    nacional, crear('span', { texto: textos.nacional.pregunta }),
  ]));

  fila.appendChild(campoTexto('ciudades', false));
  fila.appendChild(campoTexto('presupuesto', true));
  return fila;
}

/** Pegar desde Excel: una fila por tienda, columnas separadas por tabulación. */
function bloqueDePegar(alCambiar) {
  var area = crear('textarea', {
    rows: '4',
    placeholder: 'Beer Station\tCervecerías del Sur S.A.S.\t900.777.888-2\tBogotá, Medellín\t5000000',
    'aria-label': 'Pega aquí las filas copiadas de Excel',
  });

  var resultado = crear('div', {});

  function procesar() {
    var lineas = area.value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (lineas.length === 0) return;

    var nuevas = [];
    var rechazadas = [];

    for (var i = 0; i < lineas.length; i++) {
      var celdas = lineas[i].split(/\t|;/).map(function (c) { return c.trim(); });
      if (celdas.length === 1) celdas = lineas[i].split(/\s{2,}/).map(function (c) { return c.trim(); });
      if (celdas.length < 3) { rechazadas.push('Fila ' + (i + 1) + ': necesita al menos marca, razón social y NIT.'); continue; }

      var tienda = tiendaVacia();
      tienda.marca = celdas[0] || '';
      tienda.razonSocial = celdas[1] || '';
      tienda.id = celdas[2] || '';
      var cobertura = celdas[3] || '';
      if (/^nacional$/i.test(cobertura)) tienda.nacional = true;
      else tienda.ciudades = cobertura;
      tienda.presupuesto = celdas[4] ? Number(RM.util.soloDigitos(celdas[4])) : null;
      nuevas.push(tienda);
    }

    var lista = tiendas().slice().filter(function (t) { return t.marca || t.razonSocial || t.id; });
    estado.fijar('tiendas', lista.concat(nuevas));
    area.value = '';

    RM.util.vaciar(resultado);
    resultado.appendChild(crear('p', {
      clase: 'mensaje-ok',
      texto: nuevas.length + (nuevas.length === 1 ? ' tienda agregada.' : ' tiendas agregadas.') + ' Revisa que cada una haya quedado bien.',
    }));
    for (var r = 0; r < rechazadas.length; r++) {
      resultado.appendChild(crear('p', { clase: 'mensaje-error', texto: rechazadas[r] }));
    }
    alCambiar();
  }

  return crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: 'Pegar varias tiendas desde Excel' }),
    crear('div', {}, [
      crear('p', {
        clase: 'pregunta-ayuda',
        texto: 'Copia las filas de tu hoja de cálculo con las columnas en este orden: marca, razón social, NIT, ciudades (o la palabra Nacional) y presupuesto.',
      }),
      area,
      crear('div', { clase: 'fila-botones' }, [
        crear('button', { clase: 'boton boton-secundario', type: 'button', texto: 'Agregar estas tiendas', onclick: procesar }),
      ]),
      resultado,
    ]),
  ]);
}

function dibujar(alCambiar) {
  var pregunta = preguntaDe('tiendas');
  var lista = tiendas();

  var bloque = crear('div', { clase: 'pregunta', 'data-campo': 'tiendas' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.pregunta }),
    crear('p', { clase: 'pregunta-ayuda' }, [RM.campos.conGlosario(pregunta.ayuda)]),
  ]);

  var ficha = crear('div', { clase: 'ficha' });
  for (var i = 0; i < lista.length; i++) {
    ficha.appendChild(filaDeTienda(lista[i], i, alCambiar));
  }
  if (lista.length === 0) {
    ficha.appendChild(crear('div', { clase: 'ficha-seccion' }, [
      crear('p', { clase: 'pregunta-ayuda', texto: 'Todavía no has agregado ninguna tienda.' }),
    ]));
  }
  bloque.appendChild(ficha);

  if (lista.length < 2) {
    bloque.appendChild(crear('p', { clase: 'mensaje-error', texto: pregunta.errores.minimo }));
  }
  if (lista.length > 60) {
    bloque.appendChild(crear('p', { clase: 'mensaje-error', texto: pregunta.errores.maximo }));
  }

  bloque.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: 'Agregar tienda',
      disabled: lista.length >= 60,
      onclick: function () {
        estado.fijar('tiendas', lista.concat([tiendaVacia()]));
        alCambiar();
      },
    }),
  ]));

  bloque.appendChild(bloqueDePegar(alCambiar));
  bloque.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: estado.T('¿Por qué te preguntamos esto?') }),
    crear('p', { texto: pregunta.porQue }),
  ]));

  return bloque;
}

RM.tiendas = { dibujar: dibujar, revisarTienda: revisarTienda, COLUMNAS: COLUMNAS };

(function () {
'use strict';

/**
 * El resumen antes de generar, y la pantalla final.
 *
 * El boton "Generar T&C" esta deshabilitado, y se ve deshabilitado, hasta que
 * no falte nada. Debajo, la lista "Te falta" dice exactamente que.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;
var flujo = RM.flujo;

// Los pasos de Squarespace viven en src/core/ayuda.js, para que la pantalla
// final y la de Ayuda digan exactamente lo mismo.

function seccionesDelResumen() {
  var entrada = estado.entrada();
  var pasos = flujo.pasosDelTipo(entrada);
  var secciones = [];

  for (var i = 0; i < pasos.length; i++) {
    var campos = flujo.camposDelPaso(entrada, pasos[i].id);
    var filas = [];
    for (var c = 0; c < campos.length; c++) {
      var campo = campos[c];
      if (campo.id === 'declaracion') continue;
      var pregunta = estado.pregunta(campo.id);
      filas.push({ campo: campo, etiqueta: pregunta.pregunta, valor: RM.pasos.comoTexto(campo) });
    }
    if (filas.length > 0) secciones.push({ paso: pasos[i], indice: i, filas: filas });
  }
  return secciones;
}

/** Lo que falta, en palabras del comercial. */
function loQueFalta() {
  var pais = flujo.paisElegido();
  if (!pais) return [estado.T('Elige el país de la campaña.')];

  var revision = validarSolicitud(estado.entrada(), pais, {
    fechaReferencia: E.configuracion.hoy || RM.util.hoyEnElNavegador(),
    usuarioEnEquipo: puedeVerPiloto(E.configuracion.rol),
    idioma: estado.idiomaInterfaz(),
  });
  return revision.errores.map(function (error) { return error.mensaje; });
}

function pantallaResumen(raiz) {
  var faltantes = loQueFalta();
  var completo = faltantes.length === 0;

  var columna = crear('div', { clase: 'columna-preguntas' }, [
    crear('h1', { texto: estado.T('Revisa antes de generar') }),
    crear('p', { clase: 'pregunta-ayuda', texto: estado.T('Este es el resumen de lo que respondiste. Puedes cambiar cualquier cosa antes de generar el documento.') }),
  ]);

  // El aviso se repite aqui a proposito: entre elegir el pais y llegar al
  // resumen pasan quince preguntas, y este es el momento en que de verdad se
  // decide publicar.
  var pais = flujo.paisElegido();
  if (paisEnPruebas(pais)) {
    // OJO: esta lista no se puede llamar `faltantes`. Se llamo asi, y como var
    // es de toda la funcion, pisaba la lista de arriba: en un pais en pruebas
    // "Te falta:" mostraba los datos legales por confirmar del pais en vez de
    // lo que le faltaba al comercial, que era marcar la casilla.
    var porConfirmar = datosPorConfirmar(pais);
    var aviso = crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: pais.nombre + estado.T(' está en pruebas: no publiques este documento todavía') }),
      crear('p', {
        texto: estado.T('Genera el documento, léelo y dinos si los datos legales de tu país están bien. Los propuso la herramienta por analogía con Colombia y no los ha confirmado nadie.'),
      }),
    ]);
    if (porConfirmar.length > 0) {
      var listaPorConfirmar = crear('ul');
      for (var f = 0; f < porConfirmar.length; f++) listaPorConfirmar.appendChild(crear('li', { texto: porConfirmar[f] }));
      aviso.appendChild(listaPorConfirmar);
    }
    columna.appendChild(aviso);
  }

  var ficha = crear('div', { clase: 'ficha' });
  var secciones = seccionesDelResumen();

  for (var s = 0; s < secciones.length; s++) {
    (function (seccion) {
      var lista = crear('dl');
      for (var f = 0; f < seccion.filas.length; f++) {
        lista.appendChild(crear('dt', { texto: seccion.filas[f].etiqueta }));
        lista.appendChild(crear('dd', { texto: seccion.filas[f].valor || estado.T('Falta') }));
      }
      ficha.appendChild(crear('div', { clase: 'ficha-seccion' }, [
        crear('div', { clase: 'ficha-encabezado' }, [
          crear('h3', { texto: estado.T(seccion.paso.nombre) }),
          crear('button', {
            clase: 'boton-texto', type: 'button', texto: estado.T('Cambiar'),
            onclick: function () {
              E.pasoActual = seccion.indice;
              E.campoAbierto = seccion.filas[0].campo.id;
              RM.app.ir('pasos');
            },
          }),
        ]),
        lista,
      ]));
    })(secciones[s]);
  }
  columna.appendChild(ficha);

  // Declaración.
  var declaracion = crear('input', { type: 'checkbox', id: 'declaracion', checked: !!estado.entrada().declaracion });
  declaracion.addEventListener('change', function () {
    estado.fijar('declaracion', declaracion.checked);
    RM.app.dibujar();
  });
  columna.appendChild(crear('div', { clase: 'pregunta' }, [
    crear('label', { clase: 'casilla' }, [
      declaracion,
      crear('span', {}, [
        document.createTextNode(estado.pregunta('declaracion').ayuda),
        crear('small', { texto: estado.pregunta('declaracion').porQue }),
      ]),
    ]),
  ]));

  if (!completo) {
    var listaFalta = crear('ul', { clase: 'te-falta' });
    for (var i = 0; i < faltantes.length; i++) listaFalta.appendChild(crear('li', { texto: faltantes[i] }));
    columna.appendChild(crear('div', {}, [
      crear('h3', { texto: estado.T('Te falta:') }),
      listaFalta,
    ]));
  }

  var boton = crear('button', {
    clase: 'boton', type: 'button', texto: estado.T('Generar T&C'),
    disabled: !completo,
    onclick: function () { generar(boton); },
  });

  columna.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Atrás'),
      onclick: function () { RM.app.ir('pasos'); },
    }),
    boton,
  ]));

  raiz.appendChild(crear('div', { clase: 'pagina' }, [
    crear('div', { clase: 'dos-columnas' }, [columna, RM.pasos.columnaDocumento()]),
  ]));
  RM.app.agregarHojaDeCelular(raiz);
  flujo.refrescarDocumento();
}

function generar(boton) {
  boton.disabled = true;
  boton.textContent = estado.T('Generando...');
  RM.util.anunciar(estado.T('Generando el documento.'));

  RM.servidor.llamar('generar', estado.entrada()).then(function (resultado) {
    if (!resultado.valido) {
      boton.disabled = false;
      boton.textContent = estado.T('Generar T&C');
      RM.app.mostrarError(resultado.errores.map(function (e) { return e.mensaje; }).join(' '));
      return;
    }
    E.resultado = resultado;
    estado.borrarBorrador();
    RM.app.ir('listo');
  }).catch(function (error) {
    boton.disabled = false;
    boton.textContent = estado.T('Generar T&C');
    RM.app.mostrarError('No pudimos generar el documento: ' + error.message);
  });
}

/**
 * Quien puede publicar en Squarespace. No es todo el mundo: la cuenta la tienen
 * unas pocas personas por pais. Si el comercial no es una de ellas, el paso de
 * publicar no es suyo y tiene que pedirlo por el canal.
 */
function bloqueDeQuienPublica(codigoDePais, tipo) {
  var accesos = ACCESOS_SQUARESPACE[codigoDePais];
  var caja = crear('div', { clase: 'aviso' }, [crear('h3', { texto: estado.T('¿Quién puede publicar?') })]);

  var esConcurso = tipo === 'carrera_compras';
  var personas = accesos ? (esConcurso ? accesos.concursos : accesos.cashback) || [] : [];

  if (personas.length > 0) {
    caja.appendChild(crear('p', { texto: 'En tu país tienen usuario de Squarespace:' }));
    var lista = crear('ul');
    for (var i = 0; i < personas.length; i++) {
      lista.appendChild(crear('li', { texto: personas[i].nombre + ' · ' + personas[i].correo }));
    }
    caja.appendChild(lista);
    caja.appendChild(crear('p', {
      texto: 'Si no eres una de estas personas, pásales el documento, el título y la dirección que te dio RappiMind.',
    }));
  } else if (accesos && esConcurso && accesos.notaConcursos) {
    caja.appendChild(crear('p', { texto: accesos.notaConcursos }));
  } else {
    caja.appendChild(crear('p', {
      texto: 'Todavía no tenemos la lista de tu país. Pide la publicación en #tyc-rappi.',
    }));
  }

  caja.appendChild(crear('p', {}, [
    document.createTextNode(CANAL_TC.para + ' '),
    crear('a', { href: CANAL_TC.url, target: '_blank', rel: 'noopener', texto: CANAL_TC.nombre }),
  ]));
  return caja;
}

/**
 * Todo lo que el comercial necesita para publicar: que pegar, donde y quien
 * puede hacerlo. Se usa igual en la demostracion y en produccion.
 */
function bloqueDePublicacion(resultado) {
  var contenido = crear('div', {});
  // Lo que hay que pegar en Squarespace, listo para copiar. El titulo y la
  // direccion salen de las respuestas: escribirlos a mano es como el titulo
  // termino diciendo 99% cuando la clausula decia 50%.
  contenido.appendChild(crear('h2', { texto: estado.T('Lo que vas a pegar en Squarespace') }));

    estado.T('Va tal cual en el título del evento. No lo cambies: es el mismo nombre que quedó en el documento.')
  ));

  var pais = flujo.paisElegido();
  var rutaDelPais = (pais && pais.nombre ? pais.nombre : '').toLowerCase();
  contenido.appendChild(RM.util.paraCopiar(
    estado.T('Dirección del evento'),
    resultado.direccionSugerida || '',
    'Va en la pestaña Opciones, en "URL del evento". La parte de ' + rutaDelPais + ' la pone Squarespace sola: reemplaza solo lo que va después.'
  ));

  if (entrada.fechaInicio && entrada.fechaFin) {
    contenido.appendChild(crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: estado.T('Las fechas del evento') }),
      crear('p', {
        texto: estado.T('Inicio: {inicio}. Fin: {fin}. Tienen que ser iguales a la vigencia del documento.')
          .replace('{inicio}', formatearFechaDelPais(entrada.fechaInicio, pais))
          .replace('{fin}', formatearFechaDelPais(entrada.fechaFin, pais)),
      }),
    ]));
  }

  contenido.appendChild(crear('h2', { texto: estado.T('Cómo publicarlo, paso a paso') }));
  var pasos = crear('ol', { clase: 'pasos-publicar' });
  for (var i = 0; i < PASOS_SQUARESPACE.length; i++) {
    pasos.appendChild(crear('li', {}, [
      crear('p', { texto: PASOS_SQUARESPACE[i].hace }),
      crear('p', { clase: 'pregunta-ayuda', texto: 'Deberías ver: ' + PASOS_SQUARESPACE[i].ve }),
    ]));
  }
  contenido.appendChild(pasos);
  contenido.appendChild(bloqueDeQuienPublica(resultado.pais || entrada.pais, entrada.tipo));

  return contenido;
}

/**
 * Las leyendas de las piezas publicitarias, una por formato.
 *
 * Es lo ultimo que se construyo del encargo 03 y lo unico que el comercial ve
 * de todo aquello. Hasta ahora este texto se lo pedia a Legal por correo; aqui
 * sale con el documento, ya lleno con los mismos datos, para que la pieza y el
 * T&C no se puedan contradecir.
 *
 * No se pregunta en que pieza va: se entregan las cuatro y el comercial copia la
 * que necesite (seccion 7B.4 de la respuesta).
 */
function bloqueDeLeyendas(leyendas) {
  if (!leyendas) return null;

  var caja = crear('div', { clase: 'pagina-seccion' }, [
    crear('h2', { texto: estado.T('El texto legal de tus piezas') }),
  ]);

  // Un pais sin leyenda aprobada, o una campana con algo que Legal no ha
  // definido. Se dice cual es el caso, como en la pantalla de Legal: un aviso
  // sin razon concreta no le sirve a nadie.
  if (!leyendas.hay) {
    var razones = (leyendas.faltantes || []).slice();
    var aviso = crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: estado.T('Para esta campaña todavía no tenemos leyenda') }),
      crear('p', {
        texto: razones.length > 0
          ? estado.T('Nos falta que Legal defina esto, y sin eso la pieza saldría incompleta:')
          : estado.T('Todavía no hay leyenda aprobada para las piezas de este país. Escríbele a Legal de tu país con el enlace de tu T&C.'),
      }),
    ]);
    if (razones.length > 0) {
      var lista = crear('ul');
      for (var r = 0; r < razones.length; r++) lista.appendChild(crear('li', { texto: razones[r] }));
      aviso.appendChild(lista);
      aviso.appendChild(crear('p', { texto: estado.T('Escríbele a Legal con el enlace de tu T&C y te la damos.') }));
    }
    caja.appendChild(aviso);
    return caja;
  }

  // El estado del enlace. Mientras no este confirmado, la leyenda esta completa
  // pero el enlace todavia no existe: publicar la pieza antes que el T&C es el
  // unico riesgo que queda del camino 4.
  if (leyendas.enlaceCambio) {
    caja.appendChild(crear('div', { clase: 'aviso aviso-serio' }, [
      crear('h3', { texto: estado.T('La leyenda cambió. Cambia el arte antes de publicarlo.') }),
      crear('p', { texto: estado.T('El enlace que publicaste no es el que habíamos previsto, así que rehicimos las leyendas con el enlace real.') }),
    ]));
  } else if (leyendas.enlaceConfirmado) {
    caja.appendChild(crear('p', { clase: 'mensaje-ok', texto: estado.T('Enlace confirmado: estas leyendas ya llevan la dirección publicada.') }));
  } else {
    caja.appendChild(crear('p', {
      clase: 'pregunta-ayuda',
      texto: estado.T('Enlace por confirmar. Cuando publiques la página y pegues el enlace aquí abajo, comparamos y te avisamos si la leyenda cambia.'),
    }));
  }

  for (var i = 0; i < leyendas.leyendas.length; i++) {
    (function (leyenda) {
      var ayuda = leyenda.largo + ' de ' + leyenda.largo_max + ' caracteres.';
      // Decir "recortada para que quepa" encima de un aviso de que no cabe es
      // decir dos cosas distintas en la misma pantalla.
      if (leyenda.recortada) {
        ayuda += ' ' + (leyenda.cabe
          ? estado.T('Recortada para que quepa.')
          : estado.T('Recortada hasta el mínimo, y aun así se pasa.'));
      }
      caja.appendChild(RM.util.paraCopiar(estado.T(leyenda.nombre), leyenda.texto, ayuda));

      if (!leyenda.cabe) {
        // Con los números, no solo con el "no cabe": cuánto se pasa y cuánto de
        // eso se lo están comiendo los enlaces, que suelen ser la mitad.
        var porCuanto = estado.T('Se pasa por {n} caracteres.').replace('{n}', leyenda.sobra);
        if (leyenda.enlaces > 0) {
          porCuanto += ' ' + estado.T('Los enlaces ocupan {n} de los {total}.')
            .replace('{n}', leyenda.caracteresEnEnlaces).replace('{total}', leyenda.largo);
        }
        caja.appendChild(crear('div', { clase: 'aviso aviso-serio' }, [
          crear('p', { texto: porCuanto }),
          crear('p', {
            texto: estado.T('No hay nada más que se pueda quitar: todo lo que queda es obligatorio. Usa un formato más grande o escríbele a Legal antes de mandar a diseñar.'),
          }),
        ]));
      }
    })(leyendas.leyendas[i]);
  }

  // Los formatos que esperan una decision, con su razon. No son un error: la
  // push necesita el enlace corto, que todavia no existe.
  for (var p = 0; p < (leyendas.pendientes || []).length; p++) {
    (function (pendiente) {
      caja.appendChild(crear('div', { clase: 'aviso' }, [
        crear('h3', { texto: estado.T(pendiente.nombre) + estado.T(': todavía no') }),
        crear('p', { texto: pendiente.razones.join('. ') + '.' }),
      ]));
    })(leyendas.pendientes[p]);
  }

  return caja;
}

/**
 * El recordatorio del acuerdo de transferencia de datos en la pantalla final.
 *
 * La respuesta del encargo 01 pide que el aviso se repita aqui, y tiene razon:
 * entre el formulario y la entrega del premio pasan semanas, y para entonces el
 * comercial ya no se acuerda de que dijo "no se". Sin el acuerdo firmado, el dia
 * de la entrega ni Producto ni Data le pueden dar los datos del ganador.
 */
function avisoDeAcuerdoDeDatos() {
  if (estado.entrada().acuerdoDatos !== 'no_o_no_se') return null;

  var pais = flujo.paisElegido();
  var caja = crear('div', { clase: 'aviso' }, [
    crear('h3', { texto: estado.T('Te falta el acuerdo de transferencia de datos') }),
    crear('p', {
      texto: estado.T('Tu T&C ya está, pero sin ese acuerdo firmado no te van a poder entregar los datos del ganador el día de la entrega. Arranca el trámite ahora, que toma tiempo.'),
    }),
  ]);

  if (pais && pais.url_acuerdo_datos) {
    caja.appendChild(crear('div', { clase: 'fila-botones' }, [
      crear('a', {
        clase: 'boton boton-secundario', href: pais.url_acuerdo_datos,
        target: '_blank', rel: 'noopener',
      }, [
        document.createTextNode(estado.T('Abrir el modelo de acuerdo')), RM.util.icono('abrir', 16),
      ]),
    ]));
  }
  return caja;
}

/**
 * Agrega un bloque solo si existe.
 *
 * appendChild(null) lanza una excepcion, y como esto corre a mitad de pintar la
 * pantalla final, lo que ve el comercial es "No pudimos generar el documento"
 * sobre un documento que si se genero. Paso con el aviso del acuerdo de datos,
 * que solo sale en Carrera: en un cashback devolvia null y tumbaba la pantalla.
 */
function agregarSiHay(destino, bloque) {
  if (bloque) destino.appendChild(bloque);
}

// --- Pantalla final ----------------------------------------------------------

function pantallaListo(raiz) {
  var resultado = E.resultado || {};
  var contenido = crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('h1', { texto: estado.T('Tu T&C está listo') }),
    // En un pais en pruebas el aviso de "no publiques" tiene que estar en la
    // pantalla que explica como publicar, no solo en las de antes.
    RM.pasos.avisoDePaisEnPruebas(),
  ]);

  if (resultado.demostracion) {
    contenido.appendChild(crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: estado.T('Modo demostración') }),
      crear('p', { texto: estado.T('No se creó ningún documento ni se envió ningún correo. Este es el texto que habría salido.') }),
    ]));
    var hoja = crear('div', { clase: 'hoja' });
    RM.documento.dibujar(hoja, resultado.texto, '');
    contenido.appendChild(hoja);
    contenido.appendChild(bloqueDePublicacion(resultado));
    agregarSiHay(contenido, avisoDeAcuerdoDeDatos());
    agregarSiHay(contenido, bloqueDeLeyendas(resultado.leyendas));
    contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
      crear('button', {
        clase: 'boton boton-secundario', type: 'button', texto: estado.T('Hacer otra campaña'),
        onclick: function () { estado.reiniciarFormulario({}); RM.app.ir('inicio'); },
      }),
    ]));
    raiz.appendChild(contenido);
    return;
  }

  contenido.appendChild(crear('p', {
    clase: 'pregunta-ayuda',
    texto: 'Te mandamos el documento por correo. Solicitud ' + (resultado.id || '') + '.',
  }));

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
    resultado.linkDoc
      ? crear('a', { clase: 'boton', href: resultado.linkDoc, target: '_blank', rel: 'noopener' }, [
          document.createTextNode(estado.T('Abrir el documento')), RM.util.icono('abrir', 16),
        ])
      : null,
  ]));

  contenido.appendChild(bloqueDePublicacion(resultado));
  agregarSiHay(contenido, avisoDeAcuerdoDeDatos());

  // Las leyendas van aqui, entre como publicar y el campo del enlace: el
  // comercial las copia en el mismo momento en que se lleva el documento, y
  // justo debajo esta el campo que las confirma.
  var cajaDeLeyendas = bloqueDeLeyendas(resultado.leyendas);
  agregarSiHay(contenido, cajaDeLeyendas);

  // Link publicado.
  contenido.appendChild(crear('h2', { texto: estado.T('Cuando ya esté publicado') }));
  var campo = crear('input', {
    type: 'text', id: 'link-publicado',
    placeholder: 'https://promos.rappi.com/',
    'aria-label': 'Enlace de la página publicada',
  });
  var mensaje = crear('p', { clase: 'pregunta-ayuda', texto: 'Pega el enlace de la página que publicaste.' });

  var guardar = crear('button', {
    clase: 'boton', type: 'button', texto: 'Marcar como publicado',
    onclick: function () {
      var revision = validarLinkPublicado(campo.value);
      if (!revision.valido) {
        mensaje.className = 'mensaje-error';
        mensaje.textContent = revision.mensaje;
        campo.focus();
        return;
      }
      guardar.disabled = true;
      guardar.textContent = 'Guardando...';
      RM.servidor.llamar('marcarPublicado', resultado.id, revision.url).then(function (respuesta) {
        guardar.disabled = false;
        guardar.textContent = 'Marcar como publicado';
        if (!respuesta.valido) {
          mensaje.className = 'mensaje-error';
          mensaje.textContent = respuesta.errores[0].mensaje;
          return;
        }
        mensaje.className = 'mensaje-ok';
        mensaje.textContent = 'Listo: tu campaña quedó marcada como publicada.';
        campo.disabled = true;
        guardar.disabled = true;

        // Paso 3 del camino 4: con el enlace real, las leyendas se rehacen y
        // el bloque se cambia entero. Si el enlace resulto distinto, el aviso
        // rojo aparece ahi mismo, no en un correo que nadie abre.
        if (respuesta.leyendas && cajaDeLeyendas && cajaDeLeyendas.parentNode) {
          var rehecho = bloqueDeLeyendas(respuesta.leyendas);
          if (rehecho) {
            cajaDeLeyendas.parentNode.replaceChild(rehecho, cajaDeLeyendas);
            cajaDeLeyendas = rehecho;
            rehecho.scrollIntoView({ block: 'nearest' });
          }
        }
      }).catch(function (error) {
        guardar.disabled = false;
        guardar.textContent = 'Marcar como publicado';
        mensaje.className = 'mensaje-error';
        mensaje.textContent = 'No pudimos guardarlo: ' + error.message;
      });
    },
  });

  contenido.appendChild(crear('div', { clase: 'pregunta' }, [
    crear('div', { clase: 'campo-caja' }, [campo]),
    mensaje,
    crear('div', { clase: 'fila-botones' }, [guardar]),
  ]));

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Hacer otra campaña'),
      onclick: function () { estado.reiniciarFormulario({}); RM.app.ir('inicio'); },
    }),
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Ver mis campañas'),
      onclick: function () { RM.app.ir('historial'); },
    }),
  ]));

  raiz.appendChild(contenido);
}

RM.resumen = {
  pantallaResumen: pantallaResumen,
  pantallaListo: pantallaListo,
  loQueFalta: loQueFalta,
};

})();

(function () {
'use strict';

/** Historial, Ayuda y Administración. */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;

// --- Historial ---------------------------------------------------------------

function pantallaHistorial(raiz) {
  var contenido = crear('div', { clase: 'pagina' }, [
    crear('h1', { texto: 'Tus campañas' }),
    crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'Abre tus documentos, márcalos como publicados o usa uno como base para una campaña nueva.',
    }),
  ]);

  var buscador = crear('input', {
    clase: 'buscador', type: 'search', placeholder: 'Busca por nombre, tienda o país', 'aria-label': 'Buscar en tu historial',
  });
  buscador.addEventListener('input', RM.util.conRetraso(function () { cargar(buscador.value); }, 250));

  contenido.appendChild(crear('div', { clase: 'pregunta' }, [
    crear('div', { clase: 'campo-caja' }, [buscador]),
  ]));

  var destino = crear('div', {});
  contenido.appendChild(destino);
  raiz.appendChild(contenido);

  function cargar(busqueda) {
    RM.util.vaciar(destino);
    destino.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: estado.T('Cargando...') }));

    RM.servidor.llamar('historial', busqueda || '').then(function (respuesta) {
      RM.util.vaciar(destino);

      // Si el servidor no devuelve una lista, se dice que pasó en vez de
      // reventar con un error que no le sirve a nadie.
      if (!respuesta || typeof respuesta.length !== 'number') {
        destino.appendChild(crear('p', {
          clase: 'mensaje-error',
          texto: 'El servidor no devolvió tu historial. Vuelve a cargar la página y, si sigue igual, avísale a Legal por el canal de ayuda.',
        }));
        return;
      }
      var filas = respuesta;

      if (filas.length === 0) {
        destino.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: busqueda ? 'No encontramos ninguna campaña con eso.' : 'Todavía no has generado ninguna campaña.' }));
        return;
      }

      var tabla = crear('table', { clase: 'tabla' });
      tabla.appendChild(crear('thead', {}, [
        crear('tr', {}, [
          crear('th', { texto: estado.T('Campaña') }),
          crear('th', { texto: 'País' }),
          crear('th', { texto: 'Fecha' }),
          crear('th', { texto: 'Estado' }),
          crear('th', { texto: '' }),
        ]),
      ]));

      var cuerpo = crear('tbody');
      for (var i = 0; i < filas.length; i++) {
        (function (fila) {
          var publicado = String(fila.estado) === 'publicado';
          cuerpo.appendChild(crear('tr', {}, [
            crear('td', {}, [
              crear('strong', { texto: fila.nombre_campana || '(sin nombre)' }),
              fila.tienda ? crear('small', { clase: 'pregunta-ayuda', texto: ' ' + fila.tienda }) : null,
            ]),
            crear('td', { texto: fila.pais || '' }),
            crear('td', { texto: String(fila.fecha || '').slice(0, 10) }),
            crear('td', {}, [
              crear('span', { clase: 'estado ' + (publicado ? 'estado-publicado' : 'estado-generado') }, [
                crear('span', { clase: 'punto' }),
                document.createTextNode(publicado ? 'Publicado' : 'Generado'),
              ]),
            ]),
            crear('td', {}, [
              fila.link_doc ? crear('a', { clase: 'boton-texto', href: fila.link_doc, target: '_blank', rel: 'noopener', texto: 'Abrir' }) : null,
              document.createTextNode(' '),
              crear('button', {
                clase: 'boton-texto', type: 'button', texto: 'Usar como base',
                onclick: function () { usarComoBase(fila.id); },
              }),

      tabla.appendChild(cuerpo);

    }).catch(function (error) {
      RM.util.vaciar(destino);
