  var texto = entrada.metodoPago === 'emisor'
    ? textoMetodoPagoDeEmisor(entrada.nombreMedioPago)
    : (TEXTO_METODO_PAGO_TRAVEL_POR_OPCION[entrada.metodoPago] || '');
  if (!texto) return '';
  if (entrada.tipo === 'descuento_travel') {
    return texto.replace(EXCLUSION_DE_PAGOS_CON_CREDITOS, '');
  }
  return texto;
}

/** ORACION: que productos participan. */
function textoProductosTravel(entrada, pais) {
  var categorias = categoriasDe(entrada);
  if (categorias.length === 0) return '';

  var donde = sonTodasLasCategorias(categorias, pais) ? 'todas las categorías' : frasePorCategorias(categorias);
  var marca = String(entrada.marcaAliado || '').trim();
  var deLaMarca = marca ? 'de **' + marca + '** ' : '';

  return (
    'Participan exclusivamente las compras de productos ' + deLaMarca + 'en ' + donde +
    ' de los Sistemas Rappi Travel, realizadas durante la vigencia de la Campaña (en adelante, los “Productos Participantes”).'
  );
}

/**
 * ORACION: nacionales, internacionales o los dos. Vacio cuando son los dos.
 *
 * La frase se parte segun las categorias marcadas (decision 43 de Legal): una
 * campana de hoteles que habla de vuelos confunde sobre que compra aplica.
 * Solo se acorta cuando no hay duda: "solo vuelos" es la categoria Vuelos y
 * nada mas, y "sin vuelos" es que no haya ninguna categoria aerea. Un Paquete
 * lleva vuelo y alojamiento, asi que cae en la frase completa, que es la
 * aprobada y la que nombra las dos cosas.
 */
function textoAmbitoTravel(entrada, pais) {
  var paisLegal = (pais && pais.pais_legal) || '';
  if (entrada.ambito !== 'nacional' && entrada.ambito !== 'internacional') return '';

  var marcadas = categoriasDe(entrada);
  var soloVuelos = marcadas.length === 1 && marcadas[0] === 'Vuelos';
  var sinVuelos = marcadas.length > 0 && !hayAereasDeTravel(entrada);

  if (entrada.ambito === 'nacional') {
    if (soloVuelos) return 'Aplica únicamente para vuelos con origen y destino en ' + paisLegal + '.';
    if (sinVuelos) return 'Aplica únicamente para servicios que se presten en ' + paisLegal + '.';
    return 'Aplica únicamente para vuelos con origen y destino en ' + paisLegal +
      ' y para servicios que se presten en ' + paisLegal + '.';
  }

  if (soloVuelos) return 'Aplica únicamente para vuelos con origen o destino fuera de ' + paisLegal + '.';
  if (sinVuelos) return 'Aplica únicamente para servicios que se presten fuera de ' + paisLegal + '.';
  return 'Aplica únicamente para vuelos con origen o destino fuera de ' + paisLegal +
    ' y para servicios que se presten fuera de ' + paisLegal + '.';
}

/** ORACION: los destinos, si la campana los limita. */
function textoDestinosTravel(entrada) {
  var destinos = separarPorComas(entrada.destinos);
  if (destinos.length === 0) return '';
  return 'Aplica únicamente para los siguientes destinos: ' + listaY(destinos) + '.';
}

/** ORACION: que hoteles participan. */
function textoHotelesTravel(entrada) {
  if (entrada.hotelesModo === 'etiqueta') {
    return 'En las categorías de alojamiento, participan únicamente los hoteles identificados con la etiqueta de la Campaña en los Sistemas Rappi Travel.';
  }
  if (entrada.hotelesModo !== 'algunos') return '';

  var hoteles = separarPorComas(entrada.hotelesLista);
  if (hoteles.length === 0) return '';
  return 'En las categorías de alojamiento, participan únicamente los siguientes hoteles: ' + listaY(hoteles) + '.';
}

/**
 * Las vinetas de la clausula de condiciones, en el orden del modelo base.
 * Cada una es una ORACION. Devuelve una lista, que el motor convierte en
 * vinetas.
 */
function vinetasDeCondicionesTravel(entrada, pais) {
  var vinetas = [];
  var aerolinea = String(entrada.aerolinea || '').trim();

  if (aerolinea && entrada.soloOperados) {
    vinetas.push(
      'Los vuelos deben ser operados directamente por **' + aerolinea +
      '**. Quedan excluidos los vuelos operados por aerolíneas aliadas bajo acuerdos de código compartido y las rutas operadas por otras compañías aéreas.'
    );
  } else if (aerolinea) {
    vinetas.push('Los vuelos deben ser de **' + aerolinea + '**.');
  }

  if (entrada.trayecto === 'ida_y_regreso') {
    vinetas.push('La compra debe ser de vuelos de ida y regreso. No aplica para compras solo de ida ni para itinerarios con varios destinos.');
  } else if (entrada.trayecto === 'solo_ida') {
    vinetas.push('La compra debe ser de vuelos solo de ida.');
  }

  if (entrada.ambasFechasDentro) {
    vinetas.push('En las compras de ida y regreso, las fechas de los dos trayectos deben estar dentro del periodo de viaje de la Campaña; de lo contrario, el Beneficio no aplica para ninguno de los dos trayectos.');
  }

  var clases = separarPorComas(entrada.clasesExcluidas);
  if (clases.length > 0) {
    vinetas.push('No aplica para las clases tarifarias ' + listaY(clases) + '.');
  }

  if (entrada.soloOrigenPais) {
    vinetas.push('Los vuelos deben tener origen en ' + ((pais && pais.pais_legal) || '') + '.');
  }

  if (tieneValorTravel(entrada.anticipacionDias)) {
    // Con un solo dia salia "al menos un (1) dias calendario de anticipacion".
    var diasAnticipacion = Number(entrada.anticipacionDias);
    vinetas.push(
      'La compra debe hacerse con al menos ' + letrasYCifra(diasAnticipacion) +
      (diasAnticipacion === 1 ? ' día calendario' : ' días calendario') +
      ' de anticipación a la fecha de salida.'
    );
  }

  if (tieneValorTravel(entrada.periodoViajeInicio) && tieneValorTravel(entrada.periodoViajeFin)) {
    vinetas.push(
      'El viaje o el uso del servicio debe realizarse entre el ' + formatearFecha(entrada.periodoViajeInicio) +
      ' y el ' + formatearFecha(entrada.periodoViajeFin) + '.'
    );
  }

  var excluidas = separarPorComas(entrada.fechasExcluidas);
  if (excluidas.length > 0) {
    var enLetras = [];
    for (var f = 0; f < excluidas.length; f++) {
      var comoFecha = formatearFecha(excluidas[f]);
      enLetras.push(comoFecha || excluidas[f]);
    }
    vinetas.push('No aplica para viajes o servicios en las siguientes fechas: ' + listaY(enLetras) + '.');
  }

  if (tieneValorTravel(entrada.nochesMinimas)) {
    // Con una sola noche salia "debe ser de una (1) noches o mas".
    var noches = Number(entrada.nochesMinimas);
    vinetas.push('La reserva de hotel debe ser de ' + letrasYCifraFemenino(noches) +
      (noches === 1 ? ' noche' : ' noches') + ' o más.');
  }

  if (tieneValorTravel(entrada.diasAlquilerMinimo) && tieneValorTravel(entrada.diasAlquilerMaximo)) {
    // El minimo y el maximo pueden ser el mismo numero: la validacion solo
    // impide que el minimo sea mayor. Con los dos en 1 salia "entre un (1) y
    // un (1) dias", que repite el numero y ademas lo deja en plural.
    var alquilerMinimo = Number(entrada.diasAlquilerMinimo);
    var alquilerMaximo = Number(entrada.diasAlquilerMaximo);
    if (alquilerMinimo === alquilerMaximo) {
      vinetas.push('El alquiler de auto debe ser de ' + letrasYCifra(alquilerMinimo) +
        (alquilerMinimo === 1 ? ' día.' : ' días.'));
    } else {
      vinetas.push(
        'El alquiler de auto debe ser de entre ' + letrasYCifra(alquilerMinimo) +
        ' y ' + letrasYCifra(alquilerMaximo) + ' días.'
      );
    }
  }

  if (!entrada.sinCompraMinima && tieneValorTravel(entrada.compraMinima)) {
    vinetas.push('El valor pagado por la orden debe ser igual o superior a **' + montoConMoneda(entrada.compraMinima, pais) + '**.');
  }

  return vinetas;
}

/** FRAGMENTO: en que consiste el beneficio del cashback. */
function textoBeneficioTravel(entrada, pais) {
  if (entrada.formaBeneficio === 'monto_fijo') {
    if (!tieneValorTravel(entrada.montoFijo)) return '';
    return '**' + cantidadCreditos(entrada.montoFijo, pais) + '** por cada orden que cumpla las condiciones de la Campaña';
  }

  if (!tieneValorTravel(entrada.porcentaje)) return '';
  var porcentaje = '**' + porcentajeEnLetras(entrada.porcentaje) + '**';

  if (entrada.sinTope) return 'el ' + porcentaje + ' del valor pagado por tu orden, sin un tope por orden';
  if (!tieneValorTravel(entrada.tope)) return '';
  return 'el ' + porcentaje + ' del valor pagado por tu orden, sin que puedas recibir más de **' +
    cantidadCreditos(entrada.tope, pais) + '** por orden';
}

/** ORACION: sobre que valor se calcula el cashback. */
function textoBaseCalculoTravel(entrada) {
  if (entrada.formaBeneficio !== 'porcentaje') return '';

  var conAsistencia = categoriasDe(entrada).indexOf('Asistencia') !== -1;
  var excluidos = conAsistencia
    ? 'sin incluir cargos por servicio ni otros servicios adicionales'
    : 'sin incluir cargos por servicio, asistencias o seguros de viaje ni otros servicios adicionales';

  return 'El Beneficio aplica únicamente sobre el valor pagado con dinero real por la tarifa o la reserva de los ' +
    'Productos Participantes, antes de impuestos, tasas y contribuciones, ' + excluidos + '. ' +
    'No hacen parte de la base de cálculo el IVA, las tasas aeroportuarias ni ningún otro impuesto, tasa o ' +
    'contribución incluido en el precio total.';
}

/**
 * ORACION: el ejemplo del tope, en cifras.
 *
 * Existe por el reclamo de agosto de 2025: una etiqueta prometia 250.000 de
 * cashback sin la palabra "hasta" y la usuaria reclamo publicidad enganosa.
 */
function textoEjemploTopeTravel(entrada, pais) {
  if (entrada.formaBeneficio !== 'porcentaje' || entrada.sinTope) return '';
  if (!tieneValorTravel(entrada.tope) || !tieneValorTravel(entrada.porcentaje)) return '';

  var porcentaje = Number(entrada.porcentaje);
  var tope = Number(entrada.tope);
  if (!isFinite(porcentaje) || porcentaje <= 0 || !isFinite(tope) || tope <= 0) return '';

  var umbral = Math.ceil(tope * 100 / porcentaje);
  // Cifras sin letras: es un ejemplo para leer rapido, no una clausula.
  return (
    'Por ejemplo, para recibir el máximo de ' + formatearMiles(tope, pais.separador_miles) +
    ' Créditos en una orden, el valor que cuenta para el cálculo del Beneficio debe ser de al menos ' +
    pais.moneda_simbolo + formatearMiles(umbral, pais.separador_miles) +
    '; si es menor, recibirás el ' + porcentaje + '% de ese valor.'
  );
}

/** FRAGMENTO: cuantas ordenes con beneficio puede tener cada persona. */
function textoLimiteOrdenesTravel(entrada) {
  if (entrada.sinLimitePorUsuario) return 'no hay un límite de órdenes por Usuario/Consumidor.';
  if (!tieneValorTravel(entrada.limitePorUsuario)) return '';

  var cuantas = Number(entrada.limitePorUsuario);
  var enPalabras = cuantas === 1 ? 'en una (1) orden' : 'hasta en ' + letrasYCifraFemenino(cuantas) + ' órdenes';
  return 'cada Usuario/Consumidor podrá recibir el Beneficio ' + enPalabras + ' durante la vigencia de la Campaña.';
}

/** FRAGMENTO: que agota la campana antes de la fecha de fin. */
function textoAgotamientoVigenciaTravel(entrada, pais) {
  if (entrada.tipo === 'descuento_travel') {
    if (entrada.sinUnidades || !tieneValorTravel(entrada.unidades)) return '';
    // Con una sola unidad salia "hasta agotar las una (1) unidades con descuento".
    if (Number(entrada.unidades) === 1) return 'la única unidad con descuento';
    return 'las ' + letrasYCifraFemenino(entrada.unidades) + ' unidades con descuento';
  }

  if (!tieneValorTravel(entrada.presupuesto)) return '';
  var presupuesto = 'el presupuesto disponible de **' + cantidadCreditos(entrada.presupuesto, pais) + '**';
  if (entrada.sinMaxOrdenes || !tieneValorTravel(entrada.maxOrdenes)) return presupuesto;
  return presupuesto + ' o el máximo de ' + letrasYCifraFemenino(entrada.maxOrdenes) + ' órdenes con Beneficio';
}

/** ORACION: el limite de toda la campana. */
function textoLimiteCampanaTravel(entrada, pais) {
  if (entrada.tipo === 'descuento_travel') {
    if (entrada.sinUnidades || !tieneValorTravel(entrada.unidades)) return '';
    // Con una sola unidad salia "cuenta con una (1) unidades ... Una vez agotadas".
    if (Number(entrada.unidades) === 1) {
      return 'La Campaña cuenta con una (1) unidad con descuento. Una vez agotada, la Campaña finalizará ' +
        'automáticamente, aunque no haya terminado su vigencia.';
    }
    return 'La Campaña cuenta con ' + letrasYCifraFemenino(entrada.unidades) +
      ' unidades con descuento. Una vez agotadas, la Campaña finalizará automáticamente, aunque no haya terminado su vigencia.';
  }

  if (!tieneValorTravel(entrada.presupuesto)) return '';
  var presupuesto = '**' + cantidadCreditos(entrada.presupuesto, pais) + '**';

  if (entrada.sinMaxOrdenes || !tieneValorTravel(entrada.maxOrdenes)) {
    return 'La Campaña tiene un presupuesto total de ' + presupuesto +
      '. Una vez agotado, la Campaña finalizará automáticamente, aunque no haya terminado su vigencia.';
  }
  return 'La Campaña tiene un presupuesto total de ' + presupuesto + ' y un máximo de ' +
    letrasYCifraFemenino(entrada.maxOrdenes) +
    ' órdenes con Beneficio. Cuando se agote cualquiera de los dos, la Campaña finalizará automáticamente, aunque no haya terminado su vigencia.';
}

/** FRAGMENTO: como cuenta una compra de ida y regreso. */
function textoConteoIdaRegresoTravel(entrada) {
  if (!hayAereasDeTravel(entrada) || entrada.trayecto === 'solo_ida') return '';
  if (entrada.conteoIdaRegreso === 'por_trayecto') {
    return 'en una compra de ida y regreso, cada trayecto cuenta como una (1) orden, y el Beneficio se calcula sobre el valor pagado por cada trayecto.';
  }
  if (entrada.conteoIdaRegreso === 'una_orden') {
    return 'una compra de ida y regreso cuenta como una (1) orden, y el Beneficio se calcula sobre el valor total pagado por la compra.';
  }
  return '';
}

/** FRAGMENTO: cuando llegan los Creditos. */
function textoCargaTravel(entrada) {
  if (entrada.carga === 'al_confirmarse') return 'una vez se confirme la emisión de tu reserva';
  if (!tieneValorTravel(entrada.diasCarga)) return '';

  // Con un solo dia salia "dentro de los un (1) dias calendario siguientes".
  var diasCarga = Number(entrada.diasCarga);
  var variosDiasCarga = diasCarga !== 1;
  var articuloCarga = variosDiasCarga ? 'los ' : '';
  if (entrada.carga === 'dias_calendario') {
    return 'dentro de ' + articuloCarga + letrasYCifra(diasCarga) +
      (variosDiasCarga ? ' días calendario siguientes' : ' día calendario siguiente') +
      ' a la finalización de la Campaña, siempre que tu reserva esté confirmada';
  }
  if (entrada.carga === 'dias_habiles') {
    return 'dentro de ' + articuloCarga + letrasYCifra(diasCarga) +
      (variosDiasCarga ? ' días hábiles siguientes' : ' día hábil siguiente') +
      ' a la finalización de la Campaña, siempre que tu reserva esté confirmada';
  }
  return '';
}

/*
 * La verificacion de elegibilidad de Travel, segun cuando llegan los Creditos.
 *
 * Mismo caso que en delivery (decision 18): con carga al confirmarse la
 * reserva, "verificar antes de acreditar" contradice a "acreditar al
 * confirmarse", y la contradiccion impresa se lee a favor del usuario.
 */
var TEXTO_VERIFICACION_TRAVEL_ANTES =
  'Rappi Travel se reserva el derecho de verificar la elegibilidad de cada orden antes de acreditar el Beneficio; ' +
  'si la verificación determina que la orden no cumple las condiciones de la Campaña, los Créditos no serán ' +
  'acreditados y se te informará a través de la Plataforma Rappi.';

var TEXTO_VERIFICACION_TRAVEL_DESPUES =
  'Rappi Travel podrá verificar la elegibilidad de cada orden después de acreditar el Beneficio; ' +
  'si la verificación determina que la orden no cumple las condiciones de la Campaña, Rappi Travel podrá ' +
  'descontar o revocar los Créditos acreditados y te lo informará a través de la Plataforma Rappi.';

/** ORACION: como se verifica la elegibilidad de la orden. */
function textoVerificacionTravel(entrada) {
  return entrada.carga === 'al_confirmarse' ? TEXTO_VERIFICACION_TRAVEL_DESPUES : TEXTO_VERIFICACION_TRAVEL_ANTES;
}

/** ORACION: donde se pueden gastar los Creditos. */
function textoRedencionTravel(entrada, pais) {
  if (entrada.redencion === 'travel_y_plataforma') {
    return 'Los Créditos podrán redimirse en cualquier categoría de los Sistemas Rappi Travel y en cualquier sección de la Plataforma Rappi habilitada para el uso de Créditos.';
  }
  if (entrada.redencion === 'todo_travel') {
    return 'Los Créditos podrán redimirse en cualquier categoría de los Sistemas Rappi Travel.';
  }
  if (entrada.redencion !== 'categorias') return '';

  var elegidas = (entrada.categoriasRedencion || []);
  if (elegidas.length === 0) return '';
  if (sonTodasLasCategorias(elegidas, pais)) {
    return 'Los Créditos podrán redimirse en cualquier categoría de los Sistemas Rappi Travel.';
  }

  var fuera = categoriasRestantes(elegidas, pais);
  return 'Los Créditos podrán redimirse únicamente en ' + frasePorCategorias(elegidas) +
    ' de los Sistemas Rappi Travel y no podrán usarse en ' + frasePorCategorias(fuera) + '.';
}

/** FRAGMENTO: en que consiste el descuento. */
function textoDescuentoTravel(entrada) {
  if (!tieneValorTravel(entrada.porcentaje)) return '';
  if (entrada.formaDescuento === 'fijo') {
    return 'un descuento del **' + porcentajeEnLetras(entrada.porcentaje) + '**';
  }
  if (!tieneValorTravel(entrada.porcentajeMinimo)) return '';
  // "segun el Producto Participante" va al final de la frase, no aqui: en medio
  // partia la oracion ("...segun el Producto Participante sobre el valor de la
  // tarifa..."). Son las mismas palabras del modelo base, en otro orden.
  return 'un descuento de entre el **' + porcentajeEnLetras(entrada.porcentajeMinimo) +
    '** y el **' + porcentajeEnLetras(entrada.porcentaje) + '**';
}

/**
 * ORACION: a cuantos productos llega el descuento maximo.
 *
 * La SIC admite anunciar un rango de descuento siempre que se diga a cuantos
 * productos aplica el maximo. Sin esta frase, "hasta 40%" es enganoso.
 */
function textoMaximoDisponibleTravel(entrada) {
  if (entrada.formaDescuento !== 'variable') return '';
  if (!tieneValorTravel(entrada.productosConMaximo) || !tieneValorTravel(entrada.porcentaje)) return '';
  // "un (1)" solo va delante de un sustantivo. Aqui la cifra va sola, asi que
  // con un producto se escribe "uno (1) de los Productos Participantes".
  var conMaximo = Number(entrada.productosConMaximo);
  return 'El descuento máximo del **' + porcentajeEnLetras(entrada.porcentaje) + '** aplica a ' +
    (conMaximo === 1 ? 'uno (1)' : letrasYCifra(conMaximo)) + ' de los Productos Participantes.';
}

/** FRAGMENTO: donde ve el usuario el descuento. */
function textoVisibilidadTravel(entrada) {
  var marcadas = entrada.visibilidad || [];
  var textos = [];
  var orden = ['inicio', 'etiqueta', 'precio_tachado'];
  for (var i = 0; i < orden.length; i++) {
    if (marcadas.indexOf(orden[i]) !== -1) textos.push(TEXTO_VISIBILIDAD_POR_OPCION[orden[i]]);
  }
  return textos.length === 0 ? '' : listaY(textos);
}

/** ORACION: el descuento de una asistencia no cubre el vuelo con el que se compra. */
function textoAsistenciaTravel(entrada) {
  var categorias = categoriasDe(entrada);
  if (categorias.length !== 1 || categorias[0] !== 'Asistencia') return '';
  return 'El descuento aplica únicamente sobre el valor de la asistencia al viajero y no sobre el valor de los vuelos o paquetes con los que se compre.';
}

/** FRAGMENTO: la vigencia de los Creditos. En Travel siempre es por dias. */
function textoVigenciaCreditosTravel(entrada, pais) {
  if (!tieneValorTravel(entrada.diasVigencia)) return '';
  // Con un solo dia salia "un (1) dias calendario contados a partir de su carga".
  var diasVigenciaTravel = Number(entrada.diasVigencia);
  var conTermino = pais && pais.termino_dias ? pais : { termino_dias: 'días calendario' };
  return 'tendrán una vigencia de ' + letrasYCifra(diasVigenciaTravel) + ' ' +
    terminoDeDias(conTermino, diasVigenciaTravel) + (diasVigenciaTravel === 1 ? ' contado' : ' contados') +
    ' a partir de su carga';
}

/**
 * Parrafo opcional para cuando los Creditos se pueden usar fuera de Travel.
 *
 * PENDIENTE (R2 de docs/MODELO_BASE_TRAVEL.md): Travel Moustache otorga estos
 * Creditos, asi que su uso dentro de Travel se rige por este documento. Si se
 * gastan en el resto de la Plataforma, mandan los T&C de Creditos de Rappi.
 */
function textoCreditosFueraDeTravel(entrada, pais) {
  if (entrada.redencion !== 'travel_y_plataforma') return '';
  return 'Cuando uses estos Créditos por fuera de los Sistemas Rappi Travel, su uso se regirá además por los Términos y Condiciones de Funcionamiento de los Créditos de la Plataforma Rappi, disponibles en: ' +
    ((pais && pais.url_tc_creditos) || '') + '.';
}

/**
 * Los valores de Travel que entran a los modelos.
 *
 * Se llaman igual que en docs/MODELO_BASE_TRAVEL.md. Los valores comunes con
 * delivery (fechas, horas, territorio, pais) los pone calcularDerivados.
 */
function calcularDerivadosTravel(entrada, pais) {
  var valores = {};
  var datos = entrada || {};
  var p = pais || {};

  // Datos de la entidad de Travel, que no son los de Rappi S.A.S.
  valores.ENTIDAD_TRAVEL = p.travel_entidad || '';
  valores.ID_FISCAL_TRAVEL = p.travel_id_fiscal || '';
  valores.RNT_TRAVEL = p.travel_rnt || '';
  valores.URL_SITIO_TRAVEL = p.travel_url_sitio || '';
  valores.URL_TC_TRAVEL = p.travel_url_tc || '';

/**
 * Las notas de modificacion, al final del documento.
 *
 * Una campana que ya empezo no cambia sus condiciones en silencio: cada
 * ampliacion deja constancia con su fecha. Ver docs/MODELO_BASE_TRAVEL.md,
 * seccion 9.
 */
function textoNotasDeModificacion(entrada, pais) {
  var notas = entrada.modificaciones || [];
  if (notas.length === 0) return '';

  var esDescuento = entrada.tipo === 'descuento_travel';
  var cierre = esDescuento ? 'los descuentos ya aplicados se mantienen' : 'los Beneficios ya otorgados se mantienen';
  var parrafos = [];

  for (var i = 0; i < notas.length; i++) {
    var nota = notas[i] || {};
    var cambios = [];

    if (nota.fechaFin) {
      cambios.push('la vigencia de la Campaña se amplía hasta las ' + formatearHoraTravel(nota.horaFin) +
        ' del ' + formatearFecha(nota.fechaFin));
    }
    if (tieneValorTravel(nota.presupuesto)) {
      cambios.push('el presupuesto de la Campaña se amplía a **' + cantidadCreditos(nota.presupuesto, pais) + '**');
    }
    if (tieneValorTravel(nota.maxOrdenes)) {
      cambios.push('el máximo de órdenes con Beneficio se amplía a ' + letrasYCifraFemenino(nota.maxOrdenes));
    }
    if (tieneValorTravel(nota.unidades)) {
      cambios.push('las unidades con descuento se amplían a ' + letrasYCifraFemenino(nota.unidades));
    }
    if (cambios.length === 0) continue;

    parrafos.push(
      '**Modificación del ' + formatearFecha(nota.fecha) + '.** A partir de esta fecha, ' +
      listaY(cambios) + '. Las demás condiciones de la Campaña no cambian y ' + cierre + '.'
    );
  }
  return parrafos.join('\n');
}

/** La hora de una nota, con el formato del documento. */
function formatearHoraTravel(hora) {
  if (typeof formatearHora === 'function') return formatearHora(hora || '23:59');
  return String(hora || '23:59');
}

'use strict';

/**
 * Estructura intermedia del documento.
 *
 * Convierte el texto final del motor en una lista de bloques con formato, sin
 * saber nada de Google. El adaptador de Apps Script (src/server/Documento.js)
 * solo traduce esta estructura a llamadas de DocumentApp.
 *
 * Asi la parte dificil (que es texto, que va en negrita, que es vineta) se
 * prueba entera en Node y el adaptador queda tan simple que casi no puede fallar.
 *
 * Bloques: { tipo, partes } donde tipo es titulo, subtitulo, clausula, parrafo
 * o vineta, y partes es [{ texto, negrita }].
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTextoDoc = require('./texto.js');
  var normalizarTexto = moduloTextoDoc.normalizarTexto;
}

/**
 * Parte un texto con marcas ** en tramos con y sin negrita.
 * "a **b** c" -> [{texto:'a ',negrita:false},{texto:'b',negrita:true},{texto:' c',negrita:false}]
 * Un ** sin cerrar se trata como texto normal, para no perder contenido.
 */
function partirEnNegritas(linea) {
  var tramos = String(linea).split('**');
  var partes = [];

  // Con un numero par de marcas queda un tramo impar: el reparto alterna bien.
  var marcasImpares = tramos.length % 2 === 0;

  for (var i = 0; i < tramos.length; i++) {
    var texto = tramos[i];
    if (!texto) continue;
    var negrita = i % 2 === 1;
    if (marcasImpares && i === tramos.length - 1) negrita = false;
    partes.push({ texto: texto, negrita: negrita });
  }

  if (partes.length === 0) partes.push({ texto: '', negrita: false });
  return partes;
}

/** Une tramos contiguos con el mismo formato. */
function unirPartesIguales(partes) {
  var unidas = [];
  for (var i = 0; i < partes.length; i++) {
    var ultima = unidas[unidas.length - 1];
    if (ultima && ultima.negrita === partes[i].negrita) {
      ultima.texto += partes[i].texto;
    } else {
      unidas.push({ texto: partes[i].texto, negrita: partes[i].negrita });
    }
  }
  return unidas;
}

/**
 * Texto final del motor -> lista de bloques.
 * No inventa ni reordena nada: cada linea no vacia produce exactamente un bloque.
 */
function estructuraDelDocumento(texto) {
  var lineas = normalizarTexto(texto).split('\n');
  var bloques = [];

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    if (!linea.trim()) continue;

    var tipo = 'parrafo';
    var contenido = linea;

    if (linea.indexOf('## ') === 0) {
      tipo = 'subtitulo';
      contenido = linea.slice(3);
    } else if (linea.indexOf('# ') === 0) {
      tipo = 'titulo';
      contenido = linea.slice(2);
    } else if (linea.indexOf('• ') === 0) {
      tipo = 'vineta';
      contenido = linea.slice(2);
    } else if (/^\*\*\d+\.\s/.test(linea)) {
      // Clausula numerada: "**1. Titulo.** resto".
      tipo = 'clausula';
    }

    bloques.push({ tipo: tipo, partes: unirPartesIguales(partirEnNegritas(contenido)) });
  }

  return bloques;
}

/** El texto plano de un bloque, sin formato. Sirve para probar y para el correo. */
function textoDelBloque(bloque) {
  var texto = '';
  for (var i = 0; i < bloque.partes.length; i++) {
    texto += bloque.partes[i].texto;
  }
  return texto;
}

/** Titulo del documento: "T&C · {campana} · {pais} · {id}". */
function tituloDelDocumento(nombreCampana, nombrePais, id) {
  return 'T&C · ' + nombreCampana + ' · ' + nombrePais + ' · ' + id;
}

/** Identificador de solicitud con la forma RM-AAAAMMDD-NNNN. */
function identificadorDeSolicitud(fechaIso, consecutivo) {
  var compacta = String(fechaIso || '').replace(/-/g, '');
  var numero = String(Math.trunc(Number(consecutivo) || 0));
  while (numero.length < 4) numero = '0' + numero;
  return 'RM-' + compacta + '-' + numero;
}

if (typeof module !== 'undefined') {
  module.exports = {
    estructuraDelDocumento: estructuraDelDocumento,
    partirEnNegritas: partirEnNegritas,
    textoDelBloque: textoDelBloque,
    tituloDelDocumento: tituloDelDocumento,
    identificadorDeSolicitud: identificadorDeSolicitud,
  };
}

/** Inserta un campo justo despues de otro, por identificador. */
function insertarDespuesDe(campos, id, nuevo) {
  var salida = [];
  for (var i = 0; i < campos.length; i++) {
    salida.push(campos[i]);
    if (campos[i].id === id) salida.push(nuevo);
  }
  return salida;
}

function unir() {
  var todos = [];
  for (var i = 0; i < arguments.length; i++) {
    todos = todos.concat(arguments[i]);
  }
  return todos;
}

/* --- Rappi Travel ---------------------------------------------------------
 *
 * Dos tipos: cashback_travel y descuento_travel. Comparten casi todo el
 * formulario y se separan en el paso del beneficio. La especificacion completa
 * esta en docs/MODELO_BASE_TRAVEL.md, seccion 4.
 *
 * Travel no tiene "tienda": tiene categorias de la app y, opcionalmente, una
 * marca aliada. Por eso no reusa CAMPOS_TIENDA_Y_ORGANIZADOR.
 */

/** Las categorias marcadas, como lista. */
function categoriasDe(entrada) {
  var valor = (entrada && entrada.categorias) || [];
  return Object.prototype.toString.call(valor) === '[object Array]' ? valor : [];
}

/** true si alguna categoria marcada esta en el grupo. */
function hayGrupoDeTravel(entrada, grupo) {
  if (typeof CATEGORIAS_TRAVEL === 'undefined') return false;
  var delGrupo = (CATEGORIAS_TRAVEL.grupos || {})[grupo] || [];
  var marcadas = categoriasDe(entrada);
  for (var i = 0; i < marcadas.length; i++) {
    if (delGrupo.indexOf(marcadas[i]) !== -1) return true;
  }
  return false;
}

function hayAereasDeTravel(entrada) {
  return hayGrupoDeTravel(entrada, 'aereas');
}

function hayAlojamientoDeTravel(entrada) {
  return hayGrupoDeTravel(entrada, 'alojamiento');
}

/** Hoteles, Marriott Bonvoy y Paquetes admiten un minimo de noches. Hoteles por horas no. */
function admiteNochesMinimas(entrada) {
  var marcadas = categoriasDe(entrada);
  var conNoches = ['Hoteles', 'Marriott Bonvoy', 'Paquetes'];
  for (var i = 0; i < marcadas.length; i++) {
    if (conNoches.indexOf(marcadas[i]) !== -1) return true;
  }
  return false;
}

function hayAutosDeTravel(entrada) {
  return categoriasDe(entrada).indexOf('Autos') !== -1;

'use strict';

/**
 * Fechas, horas y listas, en el idioma del pais.
 *
 * Las fechas se manejan como texto ISO (AAAA-MM-DD) y nunca como objetos Date:
 * asi no dependen de la zona horaria del servidor ni del navegador, que es la
 * causa clasica de que un documento salga con un dia de diferencia.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var textosDelIdioma = require('./idiomas.js').textosDelIdioma;
  var conElIdiomaDe = require('./idiomas.js').conElIdiomaDe;
}

/* Se conserva por compatibilidad: los meses de verdad salen del idioma activo. */
var MESES = [
  'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
  'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
];

/** Descompone una fecha ISO. Devuelve null si no tiene forma valida. */
function partesDeFecha(iso) {
  var encontrado = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
  if (!encontrado) return null;
  var anio = Number(encontrado[1]);
  var mes = Number(encontrado[2]);
  var dia = Number(encontrado[3]);
  if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
  // Rechaza 31 de abril o 30 de febrero.
  var diasPorMes = [31, esBisiesto(anio) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  if (dia > diasPorMes[mes - 1]) return null;
  return { anio: anio, mes: mes, dia: dia };
}

function esBisiesto(anio) {
  return (anio % 4 === 0 && anio % 100 !== 0) || anio % 400 === 0;
}

/** "2026-09-17" -> "17 de septiembre de 2026", o "17 de setembro de 2026". */
function formatearFecha(iso) {
  var p = partesDeFecha(iso);
  if (!p) return '';
  return p.dia + ' de ' + textosDelIdioma().meses[p.mes - 1] + ' de ' + p.anio;
}

/**
 * La fecha y la hora como las escribe el pais de la campana, fuera del documento.
 *
 * El idioma se enciende solo mientras se calcula el documento. Fuera de ahi
 * (las respuestas plegadas y el resumen) todo salia en espanol, y un KAM de
 * Brasil veia "1 de octubre de 2026" y "12:00 a. m." arriba de un documento que
 * decia "1 de outubro de 2026 às 00:00".
 */
function formatearFechaDelPais(iso, pais) {
  return conElIdiomaDe(pais, function () { return formatearFecha(iso); });
}

function formatearHoraDelPais(texto, pais) {
  return conElIdiomaDe(pais, function () { return formatearHora(texto); });
}

/** Descompone una hora HH:MM. Devuelve null si no es valida. */
function partesDeHora(texto) {
  var encontrado = /^(\d{1,2}):(\d{2})$/.exec(String(texto || '').trim());
  if (!encontrado) return null;
  var hora = Number(encontrado[1]);
  var minuto = Number(encontrado[2]);
  if (hora > 23 || minuto > 59) return null;
  return { hora: hora, minuto: minuto };
}

/**
 * La hora como la escribe cada pais.
 *
 * En espanol, reloj de doce horas: "09:00" -> "9:00 a. m."; "23:59" -> "11:59 p. m.".
 * En portugues, reloj de veinticuatro con cero inicial: "00:01" -> "00:01";
 * "23:59" -> "23:59". Asi va en los T&C aprobados de Brasil.
 */
function formatearHora(texto) {
  var p = partesDeHora(texto);
  if (!p) return '';
  var idioma = textosDelIdioma();
  var minutos = p.minuto < 10 ? '0' + p.minuto : String(p.minuto);

  if (idioma.reloj === 24) {
    var horas = p.hora < 10 ? '0' + p.hora : String(p.hora);
    return horas + idioma.separadorDeHora + minutos;
  }

  var sufijo = p.hora < 12 ? idioma.sufijoAntesDelMediodia : idioma.sufijoDespuesDelMediodia;
  var hora12 = p.hora % 12 || 12;
  return hora12 + ':' + minutos + ' ' + sufijo;
}

/** Comparable para ordenar y comparar fechas ISO sin usar Date. */
function comoNumeroFecha(iso) {
  var p = partesDeFecha(iso);
  if (!p) return null;
  return p.anio * 10000 + p.mes * 100 + p.dia;
}

/** Comparable para fecha + hora juntas. */
function comoNumeroFechaHora(iso, hora) {
  var f = comoNumeroFecha(iso);
  var h = partesDeHora(hora);
  if (f === null || !h) return null;
  return f * 10000 + h.hora * 100 + h.minuto;
}

/** "a", "a y b", "a, b y c". En portugues la conjuncion es "e". */
function listaY(elementos) {
  var limpios = [];
  for (var i = 0; i < elementos.length; i++) {
    var elemento = String(elementos[i]).trim();
    if (elemento) limpios.push(elemento);
  }
  if (limpios.length === 0) return '';
  if (limpios.length === 1) return limpios[0];
  return limpios.slice(0, -1).join(', ') + ' ' + textosDelIdioma().conjuncionDeLista + ' ' + limpios[limpios.length - 1];
}

/** Separa un texto con comas en una lista limpia. */
function separarPorComas(texto) {
  var partes = String(texto || '').split(',');
  var limpias = [];
  for (var i = 0; i < partes.length; i++) {
    var parte = partes[i].trim();
    if (parte) limpias.push(parte);
  }
  return limpias;
}

if (typeof module !== 'undefined') {
  module.exports = {
    MESES: MESES,
    partesDeFecha: partesDeFecha,
    partesDeHora: partesDeHora,
    formatearFecha: formatearFecha,
    formatearHora: formatearHora,
    formatearFechaDelPais: formatearFechaDelPais,
    formatearHoraDelPais: formatearHoraDelPais,
    comoNumeroFecha: comoNumeroFecha,
    comoNumeroFechaHora: comoNumeroFechaHora,
    listaY: listaY,
    separarPorComas: separarPorComas,
  };
}

'use strict';

/**
 * Punto de entrada del motor: valida y, solo si todo esta bien, renderiza.
 *
 * Es lo unico que necesita llamar el servidor (Apps Script) o la vista previa
 * del navegador. Si algo falta, devuelve la lista de errores y ningun texto:
 * el documento no se crea a medias.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloEsquemas = require('./esquemas.js');
  var esquemaDe = moduloEsquemas.esquemaDe;

  var moduloValidaciones = require('./validaciones.js');
  var validarSolicitud = moduloValidaciones.validarSolicitud;

  var moduloMotor = require('./motor.js');
  var renderizar = moduloMotor.renderizar;

  var calcularDerivados = require('./derivados.js').calcularDerivados;
  var moduloLeyendas = require('./leyendas.js');
  var cargarCatalogo = moduloLeyendas.cargarCatalogo;
  var leyendasDeLaPieza = moduloLeyendas.leyendasDeLaPieza;
  var moduloDerivadosLeyendas = require('./derivados_leyendas.js');
  var calcularDerivadosDeLeyendas = moduloDerivadosLeyendas.calcularDerivadosDeLeyendas;
  var faltantesParaLaLeyenda = moduloDerivadosLeyendas.faltantesParaLaLeyenda;
  var esDeTurbo = moduloDerivadosLeyendas.esDeTurbo;
  var reglasDelArte = moduloDerivadosLeyendas.reglasDelArte;
  var PENDIENTES_POR_MARCADOR = moduloDerivadosLeyendas.PENDIENTES_POR_MARCADOR;
  var conElIdiomaDe = require('./idiomas.js').conElIdiomaDe;
  var urlDelTcDeLaCampana = moduloDerivadosLeyendas.urlDelTcDeLaCampana;
  var tieneValor = require('./texto.js').tieneValor;
}

/**
 * entrada   hechos del formulario
 * pais      fila de data/paises.json
 * modelos   { modelos, bloques } (en Apps Script, la constante MODELOS)
 * contexto  { fechaReferencia, usuarioEnEquipo }
 *
 * Devuelve { valido, errores: [{campo, mensaje}], texto }.
 */
function generarTexto(entrada, pais, modelos, contexto) {
  var revision = validarSolicitud(entrada, pais, contexto);
  if (!revision.valido) {
    return { valido: false, errores: revision.errores, texto: '' };
  }

  var esquema = esquemaDe(entrada.tipo);
  var render = renderizar(esquema.modelo, entrada, pais, modelos);

  if (render.errores.length > 0) {
    var errores = [];
    for (var i = 0; i < render.errores.length; i++) {
      errores.push({ campo: 'documento', mensaje: render.errores[i] });
    }
    return { valido: false, errores: errores, texto: '' };
  }

  return { valido: true, errores: [], texto: render.texto };
}

/**
 * Las leyendas de las piezas publicitarias de esta campana, una por formato.
 *
 * Se entregan junto con el documento, en la pantalla final: el comercial copia
 * la que necesite segun el arte. No se le pregunta en que pieza va (seccion
 * 7B.4 de la respuesta del encargo 03).
 *
 * entrada    los mismos hechos con que se genero el documento
 * pais       fila de data/paises.json
 * textos     { id: texto } de modelos/leyendas/ (en Apps Script, LEYENDAS)
 * opciones   { nombreCampana, enlacePublicado }
 *
 * Devuelve { hay, leyendas, complementos, faltantes, errores }. "hay" es false
 * cuando este pais todavia no tiene leyenda de campana aprobada, que hoy es todo
 * pais distinto de Colombia.
 */
function generarLeyendasDeLaCampana(entrada, pais, textos, opciones) {
  var catalogo = cargarCatalogo(textos || {});
  var config = opciones || {};

  var faltantes = faltantesParaLaLeyenda(entrada, pais);
  if (faltantes.length > 0) {
      return {
      hay: false, leyendas: [], complementos: [], faltantes: faltantes, pendientes: [], errores: [],
      reglasDelArte: [],
      enlacePrevisto: '', enlaceUsado: '', enlaceConfirmado: false, enlaceCambio: false,
    };
  }

  // Con el idioma del pais, igual que el documento: los numeros y las fechas de
  // la leyenda se escriben como los del T&C o se contradicen entre si.
  var armadas = conElIdiomaDe(pais, function () {
    var valores = calcularDerivadosDeLeyendas(
      entrada, pais, calcularDerivados(entrada, pais),
      { nombreCampana: config.nombreCampana, enlacePublicado: config.enlacePublicado }
    );
    return leyendasDeLaPieza(catalogo, pais.codigo, entrada.tipo, valores, {
      categoria: entrada.categoriaProducto,
      esDeTurbo: esDeTurbo(entrada),
    });
  });

  // Un marcador que espera una decision no es un defecto. La leyenda de push
  // necesita el enlace corto, que todavia no existe: si eso contara como error,
  // las otras cuatro leyendas de la campana se caerian con ella.
  var entregadas = [];
  var pendientes = [];
  var errores = armadas.errores.slice();

  for (var i = 0; i < armadas.leyendas.length; i++) {
    var armada = armadas.leyendas[i];
    var razones = [];
    var propios = [];

    for (var v = 0; v < (armada.vacios || []).length; v++) {
      var marcador = armada.vacios[v];
      if (PENDIENTES_POR_MARCADOR[marcador]) razones.push(PENDIENTES_POR_MARCADOR[marcador]);
      else propios.push(marcador);
    }

    if (razones.length > 0 && propios.length === 0) {
      pendientes.push({ formato: armada.formato, nombre: armada.nombre, razones: razones });
      continue;
    }
    for (var e = 0; e < armada.errores.length; e++) {
      errores.push(armada.id + ': ' + armada.errores[e]);
    }
    entregadas.push(armada);
  }

  var previsto = urlDelTcDeLaCampana(entrada, pais, config.nombreCampana, '');
  return {
    hay: entregadas.length > 0,
    leyendas: entregadas,
    complementos: armadas.complementos,
    faltantes: [],
    pendientes: pendientes,
    errores: errores,
    // Lo que la pieza tiene que llevar y la leyenda no puede decir: un icono es
    // una imagen y un titular lo escribe el disenador.
    reglasDelArte: reglasDelArte(entrada, pais),
    // El enlace que lleva la leyenda, y si ya esta confirmado contra el
    // publicado. Es el camino 4 de la seccion 6 de la respuesta: la leyenda
    // sale completa el mismo dia, marcada "enlace por confirmar", y cuando el
    // comercial pega el publicado se compara y se rehace si es distinto.
    enlacePrevisto: previsto,
    enlaceUsado: tieneValor(config.enlacePublicado) ? String(config.enlacePublicado).trim() : previsto,
    enlaceConfirmado: !!tieneValor(config.enlacePublicado),
    enlaceCambio: !!tieneValor(config.enlacePublicado) &&
      String(config.enlacePublicado).trim() !== previsto,
  };
}

if (typeof module !== 'undefined') {
  module.exports = {
    generarTexto: generarTexto,
    generarLeyendasDeLaCampana: generarLeyendasDeLaCampana,
  };
}

'use strict';

/**
 * Validacion y formato del identificador tributario del organizador, por pais.
 *
 * Los algoritmos de digito de verificacion estan en la seccion 6 de
 * docs/ESPECIFICACION_V3.md y se verificaron contra los identificadores reales
 * de las sociedades Rappi de cada pais.
 *
 * Cada validador devuelve { valido, mensaje, formateado }.
 */

function soloDigitos(texto) {
  return String(texto || '').replace(/\D/g, '');
}

function sumaPonderada(digitos, pesos) {
  var suma = 0;
  for (var i = 0; i < pesos.length; i++) {
    suma += Number(digitos.charAt(i)) * pesos[i];
  }
  return suma;
}

/** Agrupa de a tres con el separador dado: 900111222 -> 900.111.222 */
function agruparMiles(digitos, separador) {
  return digitos.replace(/\B(?=(\d{3})+(?!\d))/g, separador);
}

function resultado(valido, mensaje, formateado) {
  return { valido: valido, mensaje: mensaje || '', formateado: formateado || '' };
}

// --- Colombia: NIT ---------------------------------------------------------

var PESOS_NIT = [3, 7, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 67, 71];

function digitoNit(cuerpo) {
  var suma = 0;
  // Los pesos se aplican desde la derecha.
  for (var i = 0; i < cuerpo.length; i++) {
    var digito = Number(cuerpo.charAt(cuerpo.length - 1 - i));
    suma += digito * PESOS_NIT[i];
  }
  var r = suma % 11;
  return r === 0 || r === 1 ? r : 11 - r;
}

function validarNit(valor) {
  var limpio = String(valor || '').trim().replace(/[.\s]/g, '');
  var partido = /^(\d{9})-?(\d)$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'El NIT tiene 9 dígitos más el de verificación, por ejemplo 900.111.222-1.');
  }
  var cuerpo = partido[1];
  var dv = Number(partido[2]);
  /*
   * Si el digito no cuadra, se dice cual es el que cuadra.
   *
   * El mensaje decia solo "revisa el numero", y la herramienta sabe la
   * respuesta: el digito de verificacion sale de los nueve primeros con una
   * formula. Juan escribio 900.898.545-1, que es 900.898.545-0, y no tenia como
   * saberlo sin ir a buscar el RUT. Decirlo no inventa nada: es aritmetica, y
   * el comercial sigue teniendo que confirmar que el NIT es el correcto.
   */
  var correcto = digitoNit(cuerpo);
  if (correcto !== dv) {
    return resultado(false, 'El dígito de verificación no cuadra con ese NIT. Para ' +
      agruparMiles(cuerpo, '.') + ' el dígito es ' + correcto + '. Revisa el número completo.');
  }
  return resultado(true, '', 'NIT ' + agruparMiles(cuerpo, '.') + '-' + dv);
}

// --- Mexico: RFC -----------------------------------------------------------

var ALFABETO_RFC = '0123456789ABCDEFGHIJKLMN&OPQRSTUVWXYZ';

function valorCaracterRfc(caracter) {
  if (caracter === ' ') return 37;
  if (caracter === 'Ñ') return 38;
  // La posicion en el alfabeto ya es el valor: 0 a 9 valen 0 a 9,
  // A a N valen 10 a 23, & vale 24 y O a Z valen 25 a 36.
  return ALFABETO_RFC.indexOf(caracter);
}

function digitoRfc(doce) {
  var suma = 0;
  for (var i = 0; i < 12; i++) {
    var valor = valorCaracterRfc(doce.charAt(i));
    if (valor === -1) return null;
    suma += valor * (13 - i);
  }
  var r = suma % 11;
  if (r === 0) return '0';
  var dv = 11 - r;
  if (dv === 10) return 'A';
  return String(dv);
}

function validarRfc(valor) {
  var limpio = String(valor || '').trim().toUpperCase().replace(/[-\s]/g, '');

  var esMoral = /^[A-ZÑ&]{3}\d{6}[A-Z0-9]{3}$/.test(limpio);
  var esFisica = /^[A-ZÑ&]{4}\d{6}[A-Z0-9]{3}$/.test(limpio);

  if (!esMoral && !esFisica) {
    return resultado(false, 'El RFC debe tener 12 caracteres (persona moral) o 13 (persona física), por ejemplo PRU200101AB5.');
  }

  // A la persona moral se le antepone un espacio para completar 13 posiciones.
  var completo = esMoral ? ' ' + limpio : limpio;
  var esperado = digitoRfc(completo.slice(0, 12));

  if (esperado === null || esperado !== completo.charAt(12)) {
    return resultado(false, 'El dígito verificador del RFC no corresponde. Revisa el número.');
  }
  return resultado(true, '', 'RFC ' + limpio);
}

// --- Modulo 11 con pesos fijos (Peru, Argentina, Uruguay) ------------------

function validarModulo11(valor, opciones) {
  var digitos = soloDigitos(valor);
  if (digitos.length !== opciones.largo) {
    return resultado(false, opciones.mensajeFormato);
  }
  var cuerpo = digitos.slice(0, opciones.largo - 1);
  var dv = Number(digitos.charAt(opciones.largo - 1));

  var r = sumaPonderada(cuerpo, opciones.pesos) % 11;
  var esperado = 11 - r;
  if (esperado === 11) esperado = opciones.once;
  if (esperado === 10) {
    if (opciones.diez === null) {
      return resultado(false, opciones.mensajeDigito);
    }
    esperado = opciones.diez;
  }

  if (esperado !== dv) {
    return resultado(false, opciones.mensajeDigito);
  }
  return resultado(true, '', opciones.formatear(digitos));
}

function validarRucPe(valor) {
  return validarModulo11(valor, {
    largo: 11,
    pesos: [5, 4, 3, 2, 7, 6, 5, 4, 3, 2],
    once: 1,
    diez: 0,
    mensajeFormato: 'El RUC debe tener 11 dígitos.',
    mensajeDigito: 'El dígito verificador del RUC no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'RUC ' + digitos;
    },
  });
}

function validarCuit(valor) {
  return validarModulo11(valor, {
    largo: 11,
    pesos: [5, 4, 3, 2, 7, 6, 5, 4, 3, 2],
    once: 0,
    diez: null,
    mensajeFormato: 'El CUIT debe tener 11 dígitos, por ejemplo 30-71580389-1.',
    mensajeDigito: 'El dígito verificador del CUIT no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'CUIT ' + digitos.slice(0, 2) + '-' + digitos.slice(2, 10) + '-' + digitos.slice(10);
    },
  });
}

function validarRutUy(valor) {
  return validarModulo11(valor, {
    largo: 12,
    pesos: [4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2],
    once: 0,
    diez: null,
    mensajeFormato: 'El RUT debe tener 12 dígitos.',
    mensajeDigito: 'El dígito verificador del RUT no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'RUT ' + digitos;
    },
  });
}

// --- Chile: RUT (pesos ciclicos 2 a 7) -------------------------------------

function validarRutCl(valor) {
  var limpio = String(valor || '').trim().toUpperCase().replace(/[.\s]/g, '');
  var partido = /^(\d{7,8})-?([\dK])$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'El RUT debe tener el cuerpo y el dígito verificador, por ejemplo 76.837.223-3.');
  }
  var cuerpo = partido[1];
  var dv = partido[2];

  var suma = 0;
  var peso = 2;
  for (var i = cuerpo.length - 1; i >= 0; i--) {
    suma += Number(cuerpo.charAt(i)) * peso;
    peso = peso === 7 ? 2 : peso + 1;
  }
  var esperado = 11 - (suma % 11);
  var dvEsperado = esperado === 11 ? '0' : esperado === 10 ? 'K' : String(esperado);

  if (dvEsperado !== dv) {
    return resultado(false, 'El dígito verificador del RUT no corresponde. Revisa el número.');
  }
  return resultado(true, '', 'RUT ' + agruparMiles(cuerpo, '.') + '-' + dv);
}

// --- Ecuador: RUC ----------------------------------------------------------

function validarRucEc(valor) {
  var digitos = soloDigitos(valor);
  if (digitos.length !== 13) {
    return resultado(false, 'El RUC debe tener 13 dígitos y terminar en 001.');
  }
  if (digitos.slice(10) !== '001') {
    return resultado(false, 'El RUC debe terminar en 001.');
  }

  // Solo la sociedad privada (tercer dígito 9) tiene dígito verificable.
  if (digitos.charAt(2) === '9') {
    var r = sumaPonderada(digitos.slice(0, 9), [4, 3, 2, 7, 6, 5, 4, 3, 2]) % 11;
    var esperado = r === 0 ? 0 : 11 - r;
    if (esperado !== Number(digitos.charAt(9))) {
      return resultado(false, 'El dígito verificador del RUC no corresponde. Revisa el número.');
    }
  }
  return resultado(true, '', 'RUC ' + digitos);
}

// --- Costa Rica: cedula juridica (sin digito verificador) ------------------

function validarCedulaCr(valor) {
  var limpio = String(valor || '').trim().replace(/\s/g, '');
  var partido = /^(\d)-?(\d{3})-?(\d{6})$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'La cédula jurídica debe tener el formato 3-XXX-XXXXXX.');
  }
  return resultado(true, '', 'Cédula jurídica ' + partido[1] + '-' + partido[2] + '-' + partido[3]);
}

// --- Entrada unica ---------------------------------------------------------

var VALIDADORES = {
  CO: validarNit,
  MX: validarRfc,
  PE: validarRucPe,
  AR: validarCuit,
  CL: validarRutCl,
  EC: validarRucEc,
  UY: validarRutUy,
  CR: validarCedulaCr,
};

/**
 * Valida el identificador para un pais y devuelve el texto ya formateado
 * como va en el documento: { valido, mensaje, formateado }.
 */
function validarIdentificacion(codigoPais, valor) {
  var validador = VALIDADORES[codigoPais];
  if (!validador) {
    var crudo = String(valor || '').trim();
    if (!crudo) return resultado(false, 'Falta el identificador del organizador.');
    return resultado(true, '', crudo);
  }
  if (!String(valor || '').trim()) {
    return resultado(false, 'Falta el identificador del organizador.');
  }
  return validador(valor);
}

// --- El codigo de barras de un producto ------------------------------------

/**
 * EAN: 8, 12, 13 o 14 numeros, con digito de control correcto.
 *
 * Vive aqui, con los demas numeros que llevan digito de verificacion, aunque no
 * sea un identificador tributario: es la misma clase de comprobacion y el mismo
 * defecto que evita, que alguien escriba un numero parecido y nadie se entere.
 *
 * El algoritmo es el mismo de GS1 para las cuatro longitudes: se suman los
 * digitos alternando pesos 3 y 1 desde la derecha, sin contar el ultimo, y el
 * de control es lo que falta para la decena.
 */
var LARGOS_DE_EAN = [8, 12, 13, 14];

function digitoDeEan(cuerpo) {
  var suma = 0;
  for (var i = 0; i < cuerpo.length; i++) {
    // Desde la derecha: el primero pesa 3, el siguiente 1, y asi.
    var peso = (cuerpo.length - 1 - i) % 2 === 0 ? 3 : 1;
    suma += Number(cuerpo.charAt(i)) * peso;
  }
  return (10 - (suma % 10)) % 10;
}

function validarEan(valor) {
  var digitos = soloDigitos(valor);
  if (!String(valor || '').trim()) return resultado(false, 'Falta el EAN de este producto.');
  if (LARGOS_DE_EAN.indexOf(digitos.length) === -1) {
    return resultado(false, 'El EAN tiene 8, 12, 13 o 14 números. Revisa que esté completo.');
  }

  var cuerpo = digitos.slice(0, digitos.length - 1);
  var control = Number(digitos.charAt(digitos.length - 1));
  if (digitoDeEan(cuerpo) !== control) {
    return resultado(false, 'Ese EAN no existe: el último número no cuadra. Cópialo otra vez del empaque o del catálogo.');
  }
  return resultado(true, '', digitos);
}

if (typeof module !== 'undefined') {
  module.exports = {
    validarEan: validarEan,
    validarIdentificacion: validarIdentificacion,
    validarNit: validarNit,
    validarRfc: validarRfc,
    validarRucPe: validarRucPe,
    validarCuit: validarCuit,
    validarRutCl: validarRutCl,
    validarRucEc: validarRucEc,
    validarRutUy: validarRutUy,
    validarCedulaCr: validarCedulaCr,
  };
}

'use strict';

/**
 * El idioma del documento.
 *
 * Cada pais trae su idioma en la columna `idioma` del Sheet (es o pt). De ahi
 * salen las piezas de forma del documento: los meses, la hora, los conectores
 * de una lista y los numeros escritos en letras.
 *
 * Lo que NO sale de aqui es el texto legal. Las clausulas viven en `modelos/` y
 * las frases fijas en `derivados.js`, y las traduce Legal, nunca este archivo.
 * Aqui solo esta la maquinaria: "17 de setembro de 2026" y "duzentos e
 * cinquenta (250)".
 *
 * Como se usa: `calcularDerivados` fija el idioma del pais al empezar el
 * documento y lo devuelve a espanol al terminar. Las funciones de fechas.js y
 * numeros.js preguntan por el idioma activo, en vez de recibirlo en cada una de
 * sus cincuenta y cuatro llamadas. Si nadie lo fija, el idioma es espanol, que
 * es el 99,7% de las solicitudes reales.
 */

var IDIOMA_POR_DEFECTO = 'es';

var IDIOMAS = {
  es: {
    codigo: 'es',
    nombre: 'español',
    meses: [
      'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
    ],
    // "17 de septiembre de 2026"
    formatoFecha: 'dia de mes de anio',
    // Reloj de doce horas con a. m. y p. m., como en los modelos aprobados.
    reloj: 12,
    sufijoAntesDelMediodia: 'a. m.',
    sufijoDespuesDelMediodia: 'p. m.',
    conjuncionDeLista: 'y',
    // El nombre del saldo de la Billetera, tal como va impreso.
    creditos: 'Créditos',
    porCiento: 'por ciento',
    // "cincuenta mil pesos M/Cte. ($50.000)", "un (1) pedido", "diez por ciento
    // (10%)": las letras primero y la cifra entre parentesis.
    ordenDeLaCifra: 'letras_primero',
    mesesCortos: ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'],
    // "doce millones (12.000.000) de Créditos"
    deAntesDelSustantivo: 'de',
    terminacionDeMillon: /(millón|millones)$/,
  },

  pt: {
    codigo: 'pt',
    nombre: 'portugués',
    meses: [
      'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
      'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro',
    ],
    // "17 de setembro de 2026", igual que en espanol.
    formatoFecha: 'dia de mes de anio',
    // Reloj de veinticuatro horas con dos puntos y cero inicial: 00:01, 23:59.
    // Asi va en los cuatro T&C aprobados que mando Legal Brasil, que mandan
    // sobre cualquier convencion tipografica.
    reloj: 24,
    separadorDeHora: ':',
    conjuncionDeLista: 'e',
    creditos: 'Créditos',
    porCiento: 'por cento',
    // "R$300,00 (trezentos reais)", "1 (um) pedido", "10% (dez por cento)": la
    // cifra primero y las letras entre parentesis. Asi lo escriben los cuatro
    // T&C aprobados de Brasil. Los montos ya iban asi desde el principio; los
    // pedidos y los porcentajes se alinearon el 20 de septiembre de 2026, al
    // cerrar Juan el punto B3 contra los cuatro documentos.
    ordenDeLaCifra: 'cifra_primero',
    decimalesDelMonto: ',00',
    mesesCortos: ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'],
    deAntesDelSustantivo: 'de',
    terminacionDeMillon: /(milhão|milhões)$/,
  },
};

/* El idioma que esta generando el documento en este momento. */
var IDIOMA_ACTIVO = IDIOMA_POR_DEFECTO;

function hayIdioma(codigo) {
  return Object.prototype.hasOwnProperty.call(IDIOMAS, String(codigo || '').trim().toLowerCase());
}

/** Fija el idioma y devuelve el que estaba, para poder restaurarlo. */
function fijarIdioma(codigo) {
  var anterior = IDIOMA_ACTIVO;
  var pedido = String(codigo || '').trim().toLowerCase();
  IDIOMA_ACTIVO = hayIdioma(pedido) ? pedido : IDIOMA_POR_DEFECTO;
  return anterior;
}

function idiomaActivo() {
  return IDIOMA_ACTIVO;
}

/** Las piezas del idioma que esta activo. */
function textosDelIdioma() {
  return IDIOMAS[IDIOMA_ACTIVO] || IDIOMAS[IDIOMA_POR_DEFECTO];
}

/**
 * Corre una funcion con el idioma de un pais y devuelve el idioma a como estaba,
 * pase lo que pase.
 *
 * El try/finally no es adorno: si generar un documento en portugues lanza un
 * error a mitad de camino, el siguiente documento saldria con los meses en
 * portugues y nadie entenderia por que.
 */
function conElIdiomaDe(pais, funcion) {
  var anterior = fijarIdioma(pais && pais.idioma ? pais.idioma : IDIOMA_POR_DEFECTO);
  try {
    return funcion();
  } finally {
    IDIOMA_ACTIVO = anterior;
  }
}

if (typeof module !== 'undefined') {
  module.exports = {
    IDIOMAS: IDIOMAS,
    IDIOMA_POR_DEFECTO: IDIOMA_POR_DEFECTO,
    hayIdioma: hayIdioma,
    fijarIdioma: fijarIdioma,
    idiomaActivo: idiomaActivo,
    textosDelIdioma: textosDelIdioma,
    conElIdiomaDe: conElIdiomaDe,
  };
}

'use strict';

/**
 * Leyendas de piezas publicitarias: el texto legal que va dentro del arte.
 *
 * El T&C completo vive en una pagina de Squarespace. La pieza que el usuario ve
 * en la app lleva aparte un texto corto que tiene que decir lo mismo y remitir
 * al T&C. Ese texto es el que arma este archivo.
 *
 * Igual que los modelos, el texto legal es de Legal y vive en modelos/leyendas/.
 * Aqui no se escribe ni se "mejora" una sola frase: esto solo elige que leyenda
 * va, la llena con los mismos datos que llenaron el documento, y avisa si no
 * cabe en el formato.
 *
 * Tres cosas distintas al motor de documentos:
 *
 *   1. Hay un largo maximo. Una letra pequena que no cabe en el arte no se
 *      publica, asi que la leyenda se mide y, si se pasa, se recorta por un
 *      orden que Legal dejo marcado dentro del texto con [[R1]] … [[/R]].
 *      Lo que no esta marcado nunca sale.
 *   2. Hay complementos. Una pieza de licores o de medicamentos suma la leyenda
 *      de su categoria dentro de {{TEXTO_COMPLEMENTOS}}.
 *   3. Se entregan todos los formatos de una vez. No se le pregunta al comercial
 *      en que pieza va: se le dan las de apoyo, letra pequena, banner y push, y
 *      el copia la que necesita.
 *
 * Fuente del catalogo: docs/encargos/respuestas/03-leyendas.md, seccion 9.2.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTextoLeyendas = require('./texto.js');
  var normalizarTexto = moduloTextoLeyendas.normalizarTexto;
  // comoLista es de paises.js. En Apps Script ya es global, y declararla otra
  // vez aqui la pisaria sin avisar: los archivos de src/core/ comparten ambito.
  var comoLista = require('./paises.js').comoLista;
}

/** Las llaves de %% que se leen como lista separada por comas. */
var LLAVES_DE_LISTA = ['pais', 'tipo_campana', 'tipo_pieza', 'origen', 'minimo_irreductible'];

/**
 * Los formatos de pieza que la herramienta entrega, en el orden en que se
 * muestran, con el largo que admite cada uno (seccion 7C de la respuesta).
 *
 * El largo es del formato y no de la leyenda. Una misma leyenda sirve para la
 * letra pequena y para el banner corto (Carrera y los dos de Travel), y esos dos
 * formatos no admiten lo mismo: 620 contra 300. Con un solo numero por leyenda,
 * un banner de Carrera se habria dado por bueno con 620 caracteres.
 */
var TIPOS_DE_PIEZA = [
  { id: 'texto_apoyo', nombre: 'Texto de apoyo', largo_max: 350 },
  { id: 'letra_pequena', nombre: 'Letra pequeña', largo_max: 620 },
  { id: 'banner_corto', nombre: 'Banner corto', largo_max: 300 },
  { id: 'exterior', nombre: 'Valla, exterior e impresos', largo_max: 300 },
  { id: 'push_sms', nombre: 'Push y SMS', largo_max: 70 },

/**
 * Como llega cada complemento a la pieza.
 *
 * "pregunta" es la unica que le cuesta algo al comercial: la categoria del
 * producto. "condicion_turbo" sale de algo que ya se pregunta, asi que no se
 * vuelve a preguntar. "ninguna_parte_todavia" son leyendas reales de un playbook
 * que estan en el catalogo pero que la herramienta no alcanza hoy: apuestas y
 * Mundial se escalan a Legal, y awareness y promociones son tipos de campana que
 * v3 no genera.

/*
 * La categoria que no deja seguir, solo en Colombia.
 *
 * Desde el 20 de septiembre de 2026 no se hacen campanas de cashback, descuento
 * ni concursos sobre medicamentos, productos fitoterapeuticos, cigarrillos,
 * tabaco calentado, vapeadores ni otros productos con nicotina. Fundamento: para
 * el tabaco y la nicotina, la Ley 1335 de 2009 y la Ley 2354 de 2024; para
 * medicamentos y fitoterapeuticos, una regla de Legal CO mas estricta que el
 * Playbook Farmacias.
 *
 * Las siete categorias que se ofrecian antes salieron del catalogo (su
 * `se_elige_en` dice `no_se_ofrece`) y en su lugar va esta, que existe para
 * decirle al comercial que esa campana no se puede hacer, en vez de dejarlo

 *

 */
var CATEGORIA_BLOQUEADA = {
  valor: 'medicamentos_y_nicotina',

var PAISES_CON_CATEGORIA_BLOQUEADA = ['CO'];

function categoriaQueBloquea(codigoPais) {
  return PAISES_CON_CATEGORIA_BLOQUEADA.indexOf(String(codigoPais || '').toUpperCase()) !== -1

}

/** true si esta respuesta impide hacer la campana en este pais. */
function categoriaProhibida(codigoPais, categoria) {
  var bloqueada = categoriaQueBloquea(codigoPais);
  return !!bloqueada && String(categoria || '') === bloqueada;
}

/*
 * El registro sanitario y la notificacion ante el INVIMA ya no se preguntan.
 *
 * Los pedia Legal CO para las piezas de medicamentos y de fitoterapeuticos, que
 * eran las cuatro categorias que los usaban. Las cuatro salieron del catalogo el
 * 20 de septiembre de 2026, con la decision de Juan de no hacer campanas sobre
 * esos productos, asi que no queda ninguna categoria que los pida y las dos
 * preguntas se fueron del formulario con ellas.
 *
 * Los marcadores REGISTRO_SANITARIO y NOTIFICACION_INVIMA siguen calculandose
 * (vacios) porque las cuatro leyendas se quedaron en modelos/leyendas/ con su
 * texto tal cual vino de Legal. El dia que se reabra alguna, las dos preguntas
 * vuelven: esta escrito en docs/PENDIENTES_LEGAL.md.
 */

/** Lo que nunca puede quedar dentro de una leyenda entregada. */
