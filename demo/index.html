// --- src/client/js/10-util.js ---
(function () {
'use strict';

/**
 * Utilidades del navegador. Todo lo que no es logica de negocio.
 *
 * Regla de seguridad: cualquier dato del usuario entra al DOM como TEXTO, con
 * textContent o createTextNode. En este archivo no hay un solo innerHTML con
 * datos, y en el resto de la interfaz tampoco.
 */

var RM = window.RM || {};
window.RM = RM;

/** Crea un elemento. Los hijos de texto entran como texto, nunca como HTML. */
function crear(etiqueta, atributos, hijos) {
  var elemento = document.createElement(etiqueta);
  var propiedades = atributos || {};

  for (var llave in propiedades) {
    if (!Object.prototype.hasOwnProperty.call(propiedades, llave)) continue;
    var valor = propiedades[llave];
    if (valor === null || valor === undefined || valor === false) continue;

    if (llave === 'clase') elemento.className = valor;
    else if (llave === 'texto') elemento.textContent = valor;
    else if (llave === 'html') throw new Error('No se inserta HTML: usa texto.');
    else if (llave.indexOf('on') === 0 && typeof valor === 'function') {
      elemento.addEventListener(llave.slice(2), valor);
    } else if (valor === true) elemento.setAttribute(llave, '');
    else elemento.setAttribute(llave, valor);
  }

  var lista = hijos || [];
  for (var i = 0; i < lista.length; i++) {
    var hijo = lista[i];
    if (hijo === null || hijo === undefined || hijo === false) continue;
    elemento.appendChild(typeof hijo === 'string' ? document.createTextNode(hijo) : hijo);
  }
  return elemento;
}

/**
 * Un dato para copiar: el valor a la vista y un boton que lo copia.
 *
 * Se usa para el titulo y la direccion de la campana, que el comercial tiene
 * que pegar tal cual en Squarespace. Copiar a mano es donde se cuelan los
 * errores de dedo.
 */
function paraCopiar(etiqueta, valor, ayuda) {
  var caja = crear('div', { clase: 'copiable' });
  var texto = crear('code', { clase: 'copiable-valor', texto: valor });

  var boton = crear('button', { clase: 'boton boton-secundario boton-chico', type: 'button', texto: 'Copiar' });
  boton.addEventListener('click', function () {
    function listo() {
      boton.textContent = 'Copiado';
      anunciar(etiqueta + ' copiado.');
      setTimeout(function () { boton.textContent = 'Copiar'; }, 1600);
    }
    // El portapapeles moderno no existe en todos los navegadores ni en todos
    // los contextos, asi que hay una segunda via con una seleccion.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(valor).then(listo, function () { seleccionar(texto); });
      return;
    }
    seleccionar(texto);
  });

  caja.appendChild(crear('div', { clase: 'copiable-encabezado' }, [
    crear('span', { clase: 'copiable-etiqueta', texto: etiqueta }),
    boton,
  ]));
  caja.appendChild(texto);
  if (ayuda) caja.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: ayuda }));
  return caja;
}

/** Deja el texto seleccionado para que se pueda copiar con el teclado. */
function seleccionar(elemento) {
  var rango = document.createRange();
  rango.selectNodeContents(elemento);
  var seleccion = window.getSelection();
  seleccion.removeAllRanges();
  seleccion.addRange(rango);
}

function vaciar(elemento) {
  while (elemento.firstChild) elemento.removeChild(elemento.firstChild);
  return elemento;
}

function porId(id) {
  return document.getElementById(id);
}

/** Iconos: SVG de un solo trazo, nunca emojis. */
var TRAZOS = {
  visto: 'M4 10.5 L8 14.5 L16 5.5',
  abrir: 'M11 3h6v6M17 3l-8 8M14 12v5H3V6h5',
  buscar: 'M9 3a6 6 0 1 0 0 12A6 6 0 0 0 9 3zM13.5 13.5 17 17',
  volver: 'M9 4 4 10l5 6M4 10h12',
  documento: 'M5 2h7l3 3v13H5zM12 2v3h3',
  alerta: 'M10 3 18 17H2zM10 8v4M10 14.5v.5',
  descargar: 'M10 3v10M6 10l4 4 4-4M3 17h14',
};

function icono(nombre, tamano) {
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 20 20');
  svg.setAttribute('width', tamano || 18);
  svg.setAttribute('height', tamano || 18);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.8');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');

  var trazo = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  trazo.setAttribute('d', TRAZOS[nombre] || TRAZOS.documento);
  svg.appendChild(trazo);

}

/** La corona de RappiMind, que a Anna le gustó. */
function corona() {
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 14');
  svg.setAttribute('class', 'corona');

  svg.setAttribute('focusable', 'false');

  var trazo = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  trazo.setAttribute('d', 'M2 12.5 L2 4 L6.5 7.5 L12 1.5 L17.5 7.5 L22 4 L22 12.5 Z');
  trazo.setAttribute('fill', 'currentColor');
  trazo.setAttribute('stroke', 'currentColor');
  trazo.setAttribute('stroke-width', '1.6');
  trazo.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(trazo);
  return svg;
}

/** Número con el separador de miles del país, mientras se escribe. */
function conSeparadorDeMiles(valor, separador) {
  var digitos = String(valor === null || valor === undefined ? '' : valor).replace(/\D/g, '');
  if (!digitos) return '';
  return digitos.replace(/\B(?=(\d{3})+(?!\d))/g, separador || '.');
}

function soloDigitos(texto) {
  return String(texto || '').replace(/\D/g, '');
}

/** Fecha de hoy en AAAA-MM-DD, según el reloj del navegador. */
function hoyEnElNavegador() {
  var ahora = new Date();
  var mes = String(ahora.getMonth() + 1);
  var dia = String(ahora.getDate());
  return ahora.getFullYear() + '-' + (mes.length < 2 ? '0' + mes : mes) + '-' + (dia.length < 2 ? '0' + dia : dia);
}

/**
 * La hora de ahora en HH:MM, para saber si una campana ya arranco.
 *
 * Es la hora del navegador, no la del servidor: solo decide si se ofrece el
 * boton de ampliar. Quien manda es el servidor, que revisa otra vez con su
 * propia hora antes de tocar nada.
 */
function horaEnElNavegador() {
  var ahora = new Date();
  var hora = String(ahora.getHours());
  var minuto = String(ahora.getMinutes());
  return (hora.length < 2 ? '0' + hora : hora) + ':' + (minuto.length < 2 ? '0' + minuto : minuto);
}

/** Días entre dos fechas ISO. Positivo si la segunda es posterior. */
function diasEntre(desdeIso, hastaIso) {
  var a = new Date(desdeIso + 'T00:00:00');
  var b = new Date(hastaIso + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

/** Espera a que el usuario deje de escribir. */
function conRetraso(fn, ms) {
  var temporizador = null;
  return function () {
    var argumentos = arguments;
    var contexto = this;
    if (temporizador) clearTimeout(temporizador);
    temporizador = setTimeout(function () { fn.apply(contexto, argumentos); }, ms || 220);
  };
}

function anunciar(mensaje) {
  var region = porId('anuncios');
  if (region) region.textContent = mensaje;
}

/**
 * La primera letra en mayuscula, sin tocar el resto.
 *
 * Las categorias del catalogo estan escritas como se leen dentro de una frase
 * ("licores y cervezas"), y en una opcion de la pantalla arrancan la linea.
 */
function conMayusculaInicial(texto) {
  var cadena = String(texto || '');
  if (!cadena) return '';
  return cadena.charAt(0).toUpperCase() + cadena.slice(1);
}

RM.util = {
  conMayusculaInicial: conMayusculaInicial,
  paraCopiar: paraCopiar,
  seleccionar: seleccionar,
  crear: crear,
  vaciar: vaciar,
  porId: porId,
  icono: icono,
  corona: corona,
  conSeparadorDeMiles: conSeparadorDeMiles,
  soloDigitos: soloDigitos,
  hoyEnElNavegador: hoyEnElNavegador,
  horaEnElNavegador: horaEnElNavegador,
  diasEntre: diasEntre,
  conRetraso: conRetraso,
  anunciar: anunciar,
};

(function () {
'use strict';

/**
 * El estado de la aplicacion y el borrador guardado en el navegador.
 *
 * El borrador evita que se pierda lo escrito si se cierra la pestana. Puede
 * fallar (modo privado, almacenamiento lleno, permisos), asi que cada lectura y
 * cada escritura estan protegidas y la aplicacion funciona igual sin el.
 */

var RM = window.RM;

var LLAVE_BORRADOR = 'rappimind-v3-borrador';
var VERSION_BORRADOR = 3;

var estado = {
  pantalla: 'inicio',
  configuracion: null,
  entrada: {},
  pasoActual: 0,
  campoAbierto: null,
  filtroRespondido: false,
  filtroDeTravelRespondido: false,
  motivoDeLegal: null,
  // De donde salio hacia la pantalla de Legal, para poder volver a esa misma
  // pregunta con "Cambiar mi respuesta". Sin esto, el unico camino de vuelta
  // era el inicio, y perder todo lo respondido por una respuesta mal marcada.
  volverDeLegal: null,
  // Cuál de los T&C que Legal ya publicó está mirando. Null = la lista entera.
  tycGenericoElegido: null,
  // El filtro de seis preguntas que va antes de la lista de T&C generales, y
  // cuál de ellos resaltar cuando el filtro ya dijo cuál sirve.
  filtroDeGenerales: {},
  resaltarGenericos: null,
  // Por qué volvió a la lista de tipos desde el filtro de los generales.
  motivoDeLosTipos: null,
  errores: {},
  // Qué preguntas respondió de verdad el comercial. Un valor por defecto NO
  // cuenta como respuesta: la pregunta se muestra igual, con la opción ya
  // marcada, para que nadie se salte una decisión sin verla.
  respondidas: {},
  ultimoTextoVistaPrevia: '',
  resultado: null,
  historial: [],
  borradorDisponible: false,
};

function entrada() {
  return estado.entrada;
}

function fijar(campo, valor) {
  estado.entrada[campo] = valor;
  guardarBorrador();
}

function fijarVarios(cambios) {
  for (var llave in cambios) {
    if (Object.prototype.hasOwnProperty.call(cambios, llave)) estado.entrada[llave] = cambios[llave];
  }
  guardarBorrador();
}

/**
 * Deja el formulario como nuevo.
 *
 * OJO: esto NO guarda el borrador. Si lo guardara, arrancar la aplicación
 * pisaría el borrador de la sesión anterior antes de que la pantalla de inicio
 * alcanzara a leerlo, y la función de no perder lo escrito no serviría de nada.
 * El borrador se guarda cuando el comercial responde algo, que es cuando hay
 * algo que perder.
 */
function reiniciarFormulario(base, yaRespondidas) {
  estado.entrada = base || {};
  estado.respondidas = yaRespondidas || {};
  estado.pasoActual = 0;
  estado.campoAbierto = null;
  estado.errores = {};
  estado.filtroRespondido = false;
  estado.filtroDeTravelRespondido = false;
  estado.motivoDeLegal = null;
  estado.volverDeLegal = null;
  estado.tycGenericoElegido = null;
  estado.filtroDeGenerales = {};
  estado.resaltarGenericos = null;
  estado.motivoDeLosTipos = null;
  estado.resultado = null;
  estado.ultimoTextoVistaPrevia = '';
}

// --- Borrador ---------------------------------------------------------------

function almacenamientoDisponible() {
  try {
    var prueba = '__rm__';
    window.localStorage.setItem(prueba, '1');
    window.localStorage.removeItem(prueba);
    return true;
  } catch (error) {
    return false;
  }
}

function guardarBorrador() {
  if (!almacenamientoDisponible()) return false;
  try {
    window.localStorage.setItem(LLAVE_BORRADOR, JSON.stringify({
      version: VERSION_BORRADOR,
      guardado: new Date().toISOString(),
      entrada: estado.entrada,
      respondidas: estado.respondidas,
      pasoActual: estado.pasoActual,
    }));
    return true;
  } catch (error) {
    // Almacenamiento lleno o bloqueado. No se avisa en cada tecla: se sigue.
    return false;
  }
}

function leerBorrador() {
  if (!almacenamientoDisponible()) return null;
  try {
    var crudo = window.localStorage.getItem(LLAVE_BORRADOR);
    if (!crudo) return null;

    var guardado = JSON.parse(crudo);
    if (!guardado || guardado.version !== VERSION_BORRADOR) {
      borrarBorrador();
      return null;
    }
    if (!guardado.entrada || !guardado.entrada.tipo) return null;
    return guardado;
  } catch (error) {
    borrarBorrador();
    return null;
  }
}

function borrarBorrador() {
  try {
    window.localStorage.removeItem(LLAVE_BORRADOR);
  } catch (error) {
    // Nada que hacer.
  }
}

/* --- El idioma de la interfaz ---------------------------------------------
 *
 * No es el idioma del documento. El documento sale en el idioma del pais y eso
 * no se elige, porque dejarlo elegir seria dejar publicar un T&C brasileno en
 * espanol. Esto es otra cosa: en que idioma lee el formulario quien lo llena.
 *
 * Es una preferencia de esa persona, asi que vive en su navegador. Si el
 * navegador no deja guardar, se pierde al recargar y no pasa nada mas.
 */
var LLAVE_IDIOMA = 'rappimind.idioma';

function idiomaInterfaz() {
  if (estado.idiomaInterfaz) return estado.idiomaInterfaz;
  try {
    var guardado = window.localStorage.getItem(LLAVE_IDIOMA);
    if (guardado === 'pt' || guardado === 'es') { estado.idiomaInterfaz = guardado; return guardado; }
  } catch (error) { /* sin almacenamiento, se queda en espanol */ }
  estado.idiomaInterfaz = 'es';
  return 'es';
}

function fijarIdiomaInterfaz(codigo) {
  estado.idiomaInterfaz = codigo === 'pt' ? 'pt' : 'es';
  try {
    window.localStorage.setItem(LLAVE_IDIOMA, estado.idiomaInterfaz);
  } catch (error) { /* sin almacenamiento, dura lo que dure la pestana */ }
  return estado.idiomaInterfaz;
}

/** Traduce un texto de la interfaz al idioma elegido. */
function T(texto) {
  return traducirInterfaz(texto, idiomaInterfaz());
}

/**
 * El nombre de un pais como se lee en la pantalla.
 *
 * Aparte de T() porque no sale del diccionario de la interfaz: el nombre viene
 * de la fila del pais y en el documento se imprime siempre en espanol. Lo que
 * cambia es solo lo que se ve. Punto F2.
 */
function nombreDePais(nombre) {
  return nombreDePaisEnIdioma(nombre, idiomaInterfaz());
}

/**
 * La pregunta de un campo, en la variante del tipo de campana elegido.
 *
 * Existe porque el mecanismo de variantes estaba construido y probado en Node,
 * pero la interfaz llamaba a preguntaDe() sin el tipo, asi que nunca se veia:
 * en el cashback por ETA, que es de una sola ciudad, la pantalla seguia
 * preguntando "En que ciudades?" en plural.
 *
 * Toda pantalla que muestre el texto de una pregunta pasa por aqui.
 */
function pregunta(campoId) {
  // El tipo va dos veces a proposito: la variante en espanol y la variante en
  // el otro idioma se eligen por separado. Sin el segundo, la interfaz en
  // portugues preguntaba "em reais" para un tope en pesos.
  return preguntaEnIdioma(preguntaDe(campoId, entrada().tipo), campoId, idiomaInterfaz(), entrada().tipo);
}

RM.estado = {
  estado: estado,
  pregunta: pregunta,
  T: T,
  nombreDePais: nombreDePais,
  idiomaInterfaz: idiomaInterfaz,
  fijarIdiomaInterfaz: fijarIdiomaInterfaz,
  entrada: entrada,
  fijar: fijar,
  fijarVarios: fijarVarios,
  reiniciarFormulario: reiniciarFormulario,
  guardarBorrador: guardarBorrador,
  leerBorrador: leerBorrador,
  borrarBorrador: borrarBorrador,
  almacenamientoDisponible: almacenamientoDisponible,
};

})();

(function () {
'use strict';

/**
 * Puente con el servidor.
 *
 * En Apps Script llama con google.script.run. En la demostracion estatica llama
 * al servidor simulado, que usa el mismo motor dentro del navegador. El resto de
 * la interfaz no sabe cual de los dos esta corriendo.
 */

var RM = window.RM;

function hayAppsScript() {
  return typeof google !== 'undefined' && google.script && google.script.run;
}

function hayServidorSimulado() {
  return !!RM.servidorSimulado;
}

/**
 * Convierte el fallo crudo de Apps Script en uno que se pueda leer.
 *
 * Es la frontera del transporte, y por eso se traduce aqui una sola vez: las

 * mirar cuando algo raro pasa en produccion.

  var falla = new Error(mensajeDeFalla(crudo));
  falla.detalle = textoDelFallo(crudo);
  falla.clase = claseDeFalla(crudo);
  return falla;
}

/** Llama a una funcion del servidor. Siempre devuelve una promesa. */
function llamar(nombre) {
  var argumentos = Array.prototype.slice.call(arguments, 1);

  if (hayAppsScript()) {
    return new Promise(function (resolver, rechazar) {
      var corredor = google.script.run
        .withSuccessHandler(resolver)
        .withFailureHandler(function (error) { rechazar(comoFalla(error)); });
      corredor[nombre].apply(corredor, argumentos);
    });
  }

  if (hayServidorSimulado()) {
    return new Promise(function (resolver, rechazar) {
      // Un retardo corto para que se vea el estado de carga, como en la vida real.
      setTimeout(function () {
        try {
          resolver(RM.servidorSimulado[nombre].apply(null, argumentos));
        } catch (error) {
          rechazar(comoFalla(error));
        }
      }, 120);
    });
  }

  return Promise.reject(comoFalla('No hay servidor disponible.'));
}

  llamar: llamar,
  hayAppsScript: hayAppsScript,
  hayServidorSimulado: hayServidorSimulado,
};

(function () {
'use strict';

/**
 * La hoja: el T&C que se va llenando mientras el comercial responde.
 *
 * Es el elemento protagonista de la interfaz. Usa el mismo motor de src/core
 * que genera el documento de verdad, asi que lo que se ve aqui es literalmente
 * lo que va a salir.
 *
 * Todo dato del usuario entra como texto, nunca como HTML.
 */

var RM = window.RM;
var crear = RM.util.crear;
var vaciar = RM.util.vaciar;

/** Convierte una linea con marcas ** en nodos, respetando las negritas. */
function nodosConNegritas(texto, destino) {
  var partes = String(texto).split('**');
  for (var i = 0; i < partes.length; i++) {
    if (!partes[i]) continue;
    if (i % 2 === 1 && i < partes.length - (partes.length % 2 === 0 ? 1 : 0)) {
      destino.appendChild(crear('strong', { texto: partes[i] }));
    } else {
      destino.appendChild(document.createTextNode(partes[i]));
    }
  }
}

/** El tipo de bloque de una linea del texto renderizado. */
function claseDeLinea(linea) {
  if (linea.indexOf('## ') === 0) return { clase: 'doc-subtitulo', desde: 3 };
  if (linea.indexOf('# ') === 0) return { clase: 'doc-titulo', desde: 2 };
  if (linea.indexOf('• ') === 0) return { clase: 'doc-vineta', desde: 2 };
  if (/^\*\*\d+\.\s/.test(linea)) return { clase: 'doc-clausula', desde: 0 };
  return { clase: 'doc-parrafo', desde: 0 };
}

/**
 * Dibuja el documento.
 *
 * texto: salida de renderizarVistaPrevia (puede traer huecos marcados)
 * anterior: el texto de la vez pasada, para saber que cambio y resaltarlo
 */
function dibujar(contenedor, texto, anterior) {
  vaciar(contenedor);

  if (!texto) {
    contenedor.appendChild(crear('p', {
      clase: 'hoja-vacia',
      texto: RM.estado.T('Tu documento aparece aquí y se va llenando mientras respondes.'),
    }));
    return null;
  }

  var lineas = texto.split('\n');
  var lineasAnteriores = (anterior || '').split('\n');
  var primeraCambiada = null;

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    var forma = claseDeLinea(linea);
    var contenido = linea.slice(forma.desde);
    var parrafo = crear('p', { clase: forma.clase });

    // Cambió esta línea respecto al render anterior. Solo se marca si antes
    // había algo: la primera vez no se resalta el documento entero.
    var cambio = anterior && lineasAnteriores[i] !== linea;

    var tramos = tramosDeVistaPrevia(contenido);
    for (var t = 0; t < tramos.length; t++) {
      var tramo = tramos[t];

      if (tramo.tipo === 'hueco') {
        parrafo.appendChild(crear('span', {
          clase: 'falta',
          texto: 'falta ' + nombreDelHueco(tramo.valor),
          'data-hueco': tramo.valor,
        }));
        continue;
      }

      if (cambio) {
        var resaltado = crear('mark');
        nodosConNegritas(tramo.valor, resaltado);
        parrafo.appendChild(resaltado);
      } else {
        nodosConNegritas(tramo.valor, parrafo);
      }
    }

    if (cambio && primeraCambiada === null) {
      parrafo.setAttribute('data-cambio', '1');
      primeraCambiada = parrafo;
    }
    contenedor.appendChild(parrafo);
  }

  return primeraCambiada;
}

/** Lleva la hoja hasta la frase que acaba de cambiar. */
function desplazarHasta(contenedor, parrafo) {
  if (!parrafo) return;
  var arriba = parrafo.offsetTop - contenedor.offsetTop - 60;
  if (typeof contenedor.scrollTo === 'function') {
    contenedor.scrollTo({ top: Math.max(0, arriba), behavior: 'smooth' });
  } else {
    contenedor.scrollTop = Math.max(0, arriba);
  }
}

RM.documento = {
  dibujar: dibujar,
  desplazarHasta: desplazarHasta,
  claseDeLinea: claseDeLinea,
};

 *
 * Para cada pregunta que todavia no ha respondido y que tiene opciones, se mira
 * cuantas preguntas nuevas de este mismo paso abre cada respuesta posible y se
 * suma la MENOR. Con la vigencia las dos respuestas abren una, asi que suma una
 * pase lo que pase; con una pregunta donde solo una respuesta abre otra, suma
 * cero y el contador se queda corto, que es preferible a prometer de menos.
 */
function faltanEnElPaso(campos, indiceAbierto, pasoId) {
  var entrada = estado.entrada();
  var faltan = campos.length - indiceAbierto - 1;
  var yaContados = {};
  for (var c = 0; c < campos.length; c++) yaContados[campos[c].id] = true;

  for (var i = indiceAbierto; i < campos.length; i++) {
    var campo = campos[i];
    var pregunta = estado.pregunta(campo.id);
    var opciones = (pregunta && pregunta.opciones) || campo.opciones;
    if (!opciones || opciones.length === 0) continue;
    if (i !== indiceAbierto && tieneRespuesta(campo.id)) continue;

    var minimo = null;
    for (var o = 0; o < opciones.length; o++) {
      var abre = cuantasAbre(entrada, campo.id, opciones[o].valor, pasoId, yaContados);
      minimo = minimo === null ? abre : Math.min(minimo, abre);
    }
    if (minimo) faltan += minimo;
  }
  return faltan;
}

/** Las preguntas nuevas de este paso que aparecerian con esa respuesta. */
function cuantasAbre(entrada, campoId, valor, pasoId, yaContados) {
  var supuesto = {};
  for (var llave in entrada) {
    if (Object.prototype.hasOwnProperty.call(entrada, llave)) supuesto[llave] = entrada[llave];
  }
  supuesto[campoId] = valor;

  var visibles = camposVisibles(supuesto.tipo, supuesto);
  var nuevas = 0;
  for (var i = 0; i < visibles.length; i++) {
    if (visibles[i].paso !== pasoId) continue;
    if (yaContados[visibles[i].id]) continue;
    var pregunta = preguntaDe(visibles[i].id);
    if (pregunta && pregunta.pregunta) nuevas += 1;
  }
  return nuevas;
}

function tieneRespuesta(campoId) {
  // Un valor por defecto no basta: la pregunta se muestra igual, preseleccionada.
  if (!E.respondidas[campoId]) return false;

  var valor = estado.entrada()[campoId];
  if (campoId === 'maxPedidos') return opcionDeVeces() !== null && (opcionDeVeces() !== 'varias' || valor > 1);
  if (valor === null || valor === undefined || valor === '') return false;
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor.length > 0;
  if (valor === false) return false;
  return true;
}

/** "¿Cuántas veces puede ganar?" reúne maxPedidos y sinLimite en una pregunta. */
function opcionDeVeces() {
  var entrada = estado.entrada();
  if (entrada.sinLimite) return 'sin_limite';
  if (entrada.maxPedidos === 1) return 'una';
  if (entrada.maxPedidos > 1) return 'varias';
  if (entrada.__veces) return entrada.__veces;
  return null;
}

function fijarVeces(valor) {
  E.respondidas.maxPedidos = true;
  if (valor === 'una') estado.fijarVarios({ __veces: 'una', maxPedidos: 1, sinLimite: false });
  else if (valor === 'sin_limite') estado.fijarVarios({ __veces: 'sin_limite', maxPedidos: null, sinLimite: true });
  else estado.fijarVarios({ __veces: 'varias', maxPedidos: null, sinLimite: false });
}

/** Errores de la solicitud, indexados por campo. */
function erroresPorCampo() {
  var pais = paisElegido();
  if (!pais || !estado.entrada().tipo) return {};

  var revision = validarSolicitud(estado.entrada(), pais, {
    fechaReferencia: E.configuracion.hoy || RM.util.hoyEnElNavegador(),
    usuarioEnEquipo: puedeVerPiloto(E.configuracion.rol),
    // Los mensajes salen en el idioma de la interfaz; el documento no cambia.
    idioma: estado.idiomaInterfaz(),
  });

  var porCampo = {};
  for (var i = 0; i < revision.errores.length; i++) {
    var error = revision.errores[i];
    if (!porCampo[error.campo]) porCampo[error.campo] = error.mensaje;
  }
  return porCampo;
}

function paisElegido() {
  return paisPorCodigo(E.configuracion.paises, estado.entrada().pais);
}

function modeloDelTipo() {
  var esquema = esquemaDe(estado.entrada().tipo);
  return esquema ? esquema.modelo : null;
}

// --- Vista previa ------------------------------------------------------------

function refrescarDocumento() {
  var contenedores = document.querySelectorAll('[data-hoja]');
  if (contenedores.length === 0) return;

  var pais = paisElegido();
  var modelo = modeloDelTipo();

  // Todavía sin tipo de campaña: la hoja explica qué va a pasar ahí.
  if (!pais || !modelo) {
    for (var v = 0; v < contenedores.length; v++) RM.documento.dibujar(contenedores[v], '', '');
    var sinTipo = RM.util.porId('cuenta-huecos');
    if (sinTipo) sinTipo.textContent = estado.T('Sin empezar');
    E.ultimoTextoVistaPrevia = '';
    return;
  }

  var resultado = renderizarVistaPrevia(modelo, estado.entrada(), pais, MODELOS);

  for (var i = 0; i < contenedores.length; i++) {
    var cambiada = RM.documento.dibujar(contenedores[i], resultado.texto, E.ultimoTextoVistaPrevia);
    RM.documento.desplazarHasta(contenedores[i], cambiada);
  }

  var cuenta = RM.util.porId('cuenta-huecos');
  if (cuenta) {
    cuenta.textContent = resultado.huecos.length === 0
      ? estado.T('Completo')
      : (resultado.huecos.length === 1
        ? estado.T('Falta 1 dato')
        : estado.T('Faltan {n} datos').replace('{n}', resultado.huecos.length));
  }
  E.ultimoTextoVistaPrevia = resultado.texto;
}

      // El filtro de los T&C generales guarda sus respuestas: volver es volver

      if (desde === 'filtroGenerales') { RM.app.ir('filtroGenerales'); return; }
      // "Mi campaña no es ninguna de estas": se vuelve a la lista de tipos,

(function () {

 * El formulario por pasos, con el T&C en vivo al lado.

 */

/** Valor de un campo en palabras, para el resumen y las respuestas cerradas. */
function comoTexto(campo) {
  var entrada = estado.entrada();
  var valor = entrada[campo.id];
  var pregunta = estado.pregunta(campo.id);

  if (campo.id === 'maxPedidos') {
    var opcion = flujo.opcionDeVeces();
    if (opcion === 'sin_limite') return estado.T('Sin límite');
    if (opcion === 'una') return estado.T('Una sola vez');
    if (opcion === 'varias') return valor ? estado.T('{n} veces').replace('{n}', valor) : estado.T('Varias veces');
    return '';
  }
  if (valor === null || valor === undefined || valor === '') return '';
  if (campo.tipo === 'casilla') return valor ? estado.T('Confirmado') : '';

  // País y tipo traen sus nombres del servidor, no del esquema.
  if (campo.id === 'pais') {
    var pais = paisPorCodigo(E.configuracion.paises, valor);
    return pais ? estado.nombreDePais(pais.nombre) : String(valor);
  }
  if (campo.id === 'tipo') {
    for (var t = 0; t < E.configuracion.tipos.length; t++) {
      if (E.configuracion.tipos[t].id === valor) return E.configuracion.tipos[t].nombre;
    }
    return String(valor);
  }

  if (Object.prototype.toString.call(valor) === '[object Array]') {
    if (campo.id === 'tiendas') return valor.length + (valor.length === 1 ? ' tienda' : ' tiendas');
    if (campo.id === 'tiendasEta') {
      return valor.map(function (t) { return t.nombre; }).filter(Boolean).join(', ');
    }
    var etiquetas = valor.map(function (v) {
      var encontrada = (pregunta.opciones || campo.opciones || []).filter(function (o) { return o.valor === v; })[0];
      return encontrada ? encontrada.etiqueta : v;
    });
    return etiquetas.join(', ');
  }

  // Las opciones que salen de los datos no estan en el esquema ni en la
  // pregunta. Sin esto, la categoria respondida se leia arriba como
  // "medicamento", que es el nombre interno y no lo que dice la opcion.
  var opciones = opcionesDeLosDatos(campo) || pregunta.opciones || campo.opciones;
  if (opciones) {
    var elegida = opciones.filter(function (o) { return o.valor === valor; })[0];
    if (elegida) return elegida.etiqueta;
  }

  // En el idioma del pais, como en el documento: una campana de Brasil decia
  // "1 de octubre de 2026" arriba y "1 de outubro de 2026" en el T&C de al lado.
  if (campo.tipo === 'fecha') return formatearFechaDelPais(valor, flujo.paisElegido());
  if (campo.tipo === 'hora') return formatearHoraDelPais(valor, flujo.paisElegido());

  if (campo.tipo === 'identificacion') {

      var revision = validarIdentificacion(paisId.codigo, valor);
      if (revision.valido) return revision.formateado;
    }
    return String(valor);
  }
  if (campo.id === 'porcentaje') return valor + '%';
  if (pregunta.moneda) {
    var paisMoneda = flujo.paisElegido();
    return (paisMoneda ? paisMoneda.moneda_simbolo : '$') + formatearMiles(valor, paisMoneda ? paisMoneda.separador_miles : '.');
  }
  return String(valor);
}

/** Opciones que hay que deshabilitar, con la razón visible. */
function opcionesDeshabilitadas(campo) {
  /*
   * "En ciertas secciones de Rappi" solo se puede elegir donde sabemos como se
   * llaman esas secciones en la app, porque el documento las imprime entre
   * comillas.
   *
   * Sin esto, un comercial de Mexico elegia la opcion y se quedaba delante de
   * una pregunta sin una sola casilla que marcar, y con una validacion que le
   * pedia marcar al menos una: imposible de cumplir y sin salida mas que
   * adivinar que habia que cambiar la respuesta anterior.
   *
   * Desde el 20 de septiembre de 2026 la lista es comun a todos los paises, asi
   * que hoy no queda ninguno bloqueado. El bloqueo se queda escrito porque un
   * pais puede tener lista propia vacia, y entonces vuelve a hacer falta.
   *
   * Deshabilitada con su razon, y no escondida: si desapareciera, el comercial
   * creeria que la herramienta no sabe hacerlo y volveria a escribirle a Legal.
   */
  if (campo.id === 'redencion') {
    var pais = flujo.paisElegido();
    if (!pais) return null;
    var nombres = seccionesDePais(pais.codigo, E.configuracion.secciones);
    if (nombres.length > 0) return null;
    var sinSecciones = {};
    sinSecciones.secciones = estado.pregunta('redencion').razonSinSecciones
      .replace('{pais}', estado.nombreDePais(pais.nombre));
    return sinSecciones;
  }

  if (campo.id !== 'desempate') return null;
  var criterio = estado.entrada().criterioGanador;
  if (!criterio) return null;
  var razon = {};
  razon[criterio] = estado.pregunta('desempate').razonDeshabilitado;
  return razon;
}

/**
 * Las opciones de un campo que no las trae escritas, sino que salen de los datos.
 *
 * Son las secciones de la app, que vienen del Sheet; las categorias de Rappi
 * Travel, que vienen del catalogo; y la categoria del producto, que sale del
 * catalogo de leyendas. Todas cambian segun el pais, y por eso no pueden estar
 * escritas en el esquema.
 */
function opcionesDeLosDatos(campo) {
  var pais = flujo.paisElegido();

  if (campo.id === 'secciones') {
    var nombres = pais ? seccionesDePais(pais.codigo, E.configuracion.secciones) : [];
    return nombres.map(function (nombre) { return { valor: nombre, etiqueta: nombre, nota: 'Sección de la app.' }; });
  }

  if (campo.id === 'categorias') {
    // Los nombres salen del catalogo y van entre comillas en el documento, asi
    // que se muestran tal cual: no se les cambia mayuscula ni se traducen.
    var catalogo = E.configuracion.categoriasTravel || {};
    var delPaisTravel = (pais && catalogo[pais.codigo]) || [];
    return delPaisTravel.map(function (nombre) {
      return { valor: nombre, etiqueta: nombre, nota: '' };
    });
  }

  // Las secciones donde los Creditos no aplican. El SOAT es colombiano, asi que
  // fuera de Colombia ni se ofrece ni se imprime: ofrecerlo seria dejar marcar
  // una exclusion que el documento no va a decir.
  if (campo.id === 'exclusionesRedencion') {
    return seccionesExcluiblesDe(pais ? pais.codigo : '').map(function (seccion) {
      return { valor: seccion.valor, etiqueta: seccion.nombre, nota: seccion.nota };
    });
  }

  if (campo.id === 'acuerdoDatos') {
    // La nota de "Sí, ya está firmado" nombra la tabla de acuerdos marco, que
    // existe solo en Colombia. En los demás países esa frase no querría decir
    // nada, así que la opción va sin nota.
    var pregunta = estado.pregunta('acuerdoDatos');
    return pregunta.opciones.map(function (opcion) {
      if (opcion.valor !== 'firmado') return opcion;
      var esColombia = pais && pais.codigo === 'CO';
      return {
        valor: opcion.valor,
        etiqueta: opcion.etiqueta,
        nota: esColombia ? pregunta.notaFirmadoCO : opcion.nota,
      };
    });
  }

  if (campo.id === 'categoriaProducto') {
    // "Ninguna" va primero y viene marcada: es la respuesta de casi todas las
    // campanas, y la pregunta se muestra igual para que alguien la confirme.
    var opciones = [{
      valor: 'ninguna',
      etiqueta: estado.T('Ninguna de estas'),
      nota: estado.T('El producto no necesita advertencia por ley.'),
    }];
    var delPais = pais ? categoriasDeProducto(pais.codigo) : [];
    for (var i = 0; i < delPais.length; i++) {
      opciones.push({
        valor: delPais[i].valor,
        etiqueta: RM.util.conMayusculaInicial(delPais[i].etiqueta),
        nota: delPais[i].adelanto,
      });
    }
    return opciones;
  }

  return null;
}

/**
 * El aviso de que este pais esta en pruebas y con que datos.
 *
 * Un pais en piloto tiene valores legales que puso la herramienta por analogia
 * con Colombia, no aprobados por nadie. Quien esta probando tiene que saberlo
 * antes de leer el documento y darlo por bueno.
 */
function avisoDePaisEnPruebas() {
  var pais = flujo.paisElegido();
  if (!paisEnPruebas(pais)) return null;

  // Compacto, porque acompana las quince preguntas del formulario. El detalle
  // de que hay que revisar va en el resumen, que es donde se decide publicar.
  return crear('div', { clase: 'aviso' }, [
    crear('p', {
      texto: estado.nombreDePais(pais.nombre) + estado.T(' está en pruebas: genera y revisa, pero todavía no publiques. Los datos legales de este país los propuso la herramienta y no los ha confirmado nadie.'),
    }),
  ]);
}

/**
 * El panel de como se firma el acuerdo de transferencia de datos.
 *
 * Sale al responder "No, o no se" a la pregunta del acuerdo. No es un regano:
 * el T&C se genera igual, porque los datos del ganador salen despues del
 * concurso. Lo que hace es decirle al comercial que tiene que arrancar ese
 * tramite ya, para que no le llegue el dia de la entrega sin poder entregar.
 *
 * Colombia tiene su propio circuito, con la tabla de acuerdos marco y la Orden
 * de Transferencia por campana. Los demas paises tienen el modelo de su Legal, y
 * dos no tienen ninguno. Ver decision 36 (i) de la respuesta del encargo 01.
 */
function panelDeAcuerdoDeDatos() {
  if (estado.entrada().acuerdoDatos !== 'no_o_no_se') return null;

  var pais = flujo.paisElegido();
  var panel = estado.pregunta('acuerdoDatos').panel;
  if (!panel) return null;

  var caja = crear('div', { clase: 'aviso' });

  if (pais && pais.codigo === 'CO') {
    caja.appendChild(crear('h3', { texto: panel.tituloCO }));
    caja.appendChild(crear('p', { texto: panel.primeroCO }));
    var lista = crear('ol');
    for (var i = 0; i < panel.pasosCO.length; i++) {
      lista.appendChild(crear('li', { texto: panel.pasosCO[i] }));
    }
    caja.appendChild(lista);
  } else {
    var nombre = pais ? estado.nombreDePais(pais.nombre) : '';
    caja.appendChild(crear('p', {
      texto: (pais && pais.url_acuerdo_datos ? panel.conModelo : panel.sinModelo).replace('{país}', nombre),
    }));
  }

  // El botón va en los dos caminos.
  //
  // Estaba solo en el de los demás países, porque el de Colombia devolvía antes
  // de llegar aquí. Resultado: el único país donde la herramienta se usa hoy era
  // justo el único que no veía el enlace del modelo de acuerdo, que es la razón
  // por la que el panel existe. Lo vio Juan, no las pruebas.
  var boton = botonDelModeloDeAcuerdo(pais);
  if (boton) caja.appendChild(boton);
  return caja;
}

/**
 * El boton que abre el modelo de acuerdo del pais, si ese pais tiene uno.
 *
 * Debajo va la linea de que hacer si no se puede abrir. En el hilo, dos
 * personas se toparon con la pantalla de "pide permiso" de Google: el comercial
 * hizo lo que la herramienta le dijo y encontro una puerta cerrada, sin nadie
 * que le dijera como abrirla. Juan lo decidio el 20 de septiembre (punto A5):
 * el boton se queda, y debajo va como conseguir el acceso.
 *
 * Vive aqui y se comparte por RM.pasos porque la pantalla del resumen muestra
 * el mismo boton: dos copias del texto se desincronizan.
 */
function botonDelModeloDeAcuerdo(pais) {
  if (!pais || !pais.url_acuerdo_datos) return null;
  return crear('div', {}, [
    crear('div', { clase: 'fila-botones' }, [
      crear('a', {
        clase: 'boton boton-secundario', href: pais.url_acuerdo_datos,
        target: '_blank', rel: 'noopener',
      }, [
        document.createTextNode(estado.T('Abrir el modelo de acuerdo')), RM.util.icono('abrir', 16),
      ]),
    ]),
    crear('p', {
      clase: 'nota',
      texto: estado.T('Si no puedes abrirlo, pide el acceso desde la misma pantalla de Google y avísanos en #tyc-rappi.'),
    }),
  ]);
}

/** Aviso contextual de un campo, si aplica. */
function avisoDe(campo) {
  // El panel del acuerdo cuelga de la misma pregunta, debajo de las opciones.
  if (campo.id === 'acuerdoDatos') return panelDeAcuerdoDeDatos();
  if (campo.id !== 'fechaInicio') return null;
  var inicio = estado.entrada().fechaInicio;
  if (!inicio) return null;
  var hoy = E.configuracion.hoy || RM.util.hoyEnElNavegador();
  var dias = RM.util.diasEntre(hoy, inicio);
  if (dias < 0 || dias > 1) return null;
  return estado.pregunta('fechaInicio').aviso;
}

/** La calculadora de ejemplo del Cashback. */
/**
 * Un pedido por encima del valor donde el tope empieza a frenar.
 *
 * El umbral es tope / porcentaje: a partir de ahi todos los pedidos reciben el
 * tope y nada mas. Se toma vez y media ese umbral, nunca menos del triple del
 * pedido de ejemplo, y se redondea a la decena de mil de arriba para que se lea
 * como un pedido de verdad. Con 20% y tope de 20.000 da 300.000, que es el
 * ejemplo que escribio el encargo.
 *
 * Devuelve 0 cuando no hay tope o los numeros no dan: sin tope no hay nada que
 * mostrar.
 */
function pedidoDondeSeNotaElTope(ejemplo, porcentaje, tope) {
  var porciento = Number(porcentaje);
  var techo = Number(tope);
  if (!isFinite(porciento) || porciento <= 0) return 0;
  if (!isFinite(techo) || techo <= 0) return 0;

  var umbral = (techo * 100) / porciento;
  var candidato = Math.max(ejemplo * 3, umbral * 1.5);
  if (!isFinite(candidato)) return 0;
  return Math.ceil(candidato / 10000) * 10000;
}

function calculadora() {
  var entrada = estado.entrada();
  if (entrada.tipo !== 'cashback' && entrada.tipo !== 'cashback_day') return null;
  if (!entrada.porcentaje) return null;

  var pais = flujo.paisElegido();
  if (!pais) return null;

  var simbolo = pais.moneda_simbolo;
  var separador = pais.separador_miles;
  var ejemplo = 100000;
  var bruto = Math.round(ejemplo * Number(entrada.porcentaje) / 100);
  var recibe = entrada.tope ? Math.min(bruto, Number(entrada.tope)) : bruto;

  var lineas = [
    crear('p', {
      texto: 'Con estos datos, un pedido de ' + simbolo + formatearMiles(ejemplo, separador) +
        ' recibe ' + simbolo + formatearMiles(recibe, separador) + ' en Créditos.',
    }),
  ];
  if (entrada.tope && bruto > Number(entrada.tope)) {
    lineas.push(crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'El tope lo frena: sin tope habrían sido ' + simbolo + formatearMiles(bruto, separador) + '.',
    }));
  }

  /*
   * Y un pedido grande, donde el tope si se nota.
   *
   * Con 20% y tope de 20.000, el pedido de ejemplo daba justo 20.000 y la
   * calculadora no mostraba que hacia el tope. Esta segunda linea usa un pedido
   * por encima del valor donde el tope empieza a frenar, asi que siempre se ve.
   * Punto F8, 20 de septiembre de 2026.
   */
  var grande = pedidoDondeSeNotaElTope(ejemplo, entrada.porcentaje, entrada.tope);
  if (grande) {
    lineas.push(crear('p', {
      texto: 'Y uno de ' + simbolo + formatearMiles(grande, separador) +
        ' también recibe ' + simbolo + formatearMiles(Number(entrada.tope), separador) + ', por el tope.',
    }));
  }
  if (entrada.tope && entrada.presupuesto && Number(entrada.tope) > Number(entrada.presupuesto)) {
    lineas.push(crear('p', {
      clase: 'mensaje-error',
      texto: 'Ojo: el tope por pedido es mayor que el presupuesto total. El primer pedido se llevaría toda la campaña.',
    }));
  }
  return crear('div', { clase: 'aviso' }, lineas);
}

/**
 * Barra de progreso.
 *
 * En escritorio va el nombre de cada paso. En celular no caben siete nombres
 * sin encaramarse uno sobre otro, así que se muestra "Paso 2 de 7" con el
 * nombre del actual y una línea que avanza. La hoja de estilos decide cuál de
 * los dos se ve.
 */
function barraDeProgreso(pasos) {
  var compacta = crear('p', { clase: 'progreso-compacto' }, [
    crear('span', { clase: 'progreso-cuenta', texto: estado.T('Paso {n} de {m}').replace('{n}', E.pasoActual + 1).replace('{m}', pasos.length) }),
    document.createTextNode(' \u00B7 '),
    crear('strong', { texto: estado.T(pasos[E.pasoActual].nombre) }),
    crear('span', {
      clase: 'progreso-linea',
      role: 'progressbar',
      'aria-valuenow': String(E.pasoActual + 1),
      'aria-valuemin': '1',
      'aria-valuemax': String(pasos.length),
      style: '--avance: ' + Math.round(((E.pasoActual + 1) / pasos.length) * 100) + '%',
    }),
  ]);

  var lista = crear('ol', { clase: 'progreso' });
  for (var i = 0; i < pasos.length; i++) {
    (function (paso, indice) {
      var clase = indice < E.pasoActual ? 'hecho' : (indice === E.pasoActual ? 'actual' : '');
      lista.appendChild(crear('li', { clase: clase }, [
        crear('button', {
          type: 'button', texto: estado.T(paso.nombre),
          disabled: indice > E.pasoActual,
          'aria-current': indice === E.pasoActual ? 'step' : null,
          onclick: function () { E.pasoActual = indice; E.campoAbierto = null; RM.app.dibujar(); },
        }),
      ]));
    })(pasos[i], i);
  }
  return crear('div', {}, [compacta, lista]);
}

/** La columna del documento. */
function columnaDocumento() {
  return crear('div', { clase: 'columna-documento' }, [
    crear('div', { clase: 'documento-encabezado' }, [
      crear('h2', { texto: estado.T('Tu T&C') }),
      crear('span', { clase: 'cuenta', id: 'cuenta-huecos' }),
    ]),
    crear('div', { clase: 'hoja', 'data-hoja': '1', tabindex: '0', role: 'region', 'aria-label': estado.T('Vista previa del documento') }),
  ]);
}

/**
 * Las tres preguntas con que arranca todo, antes de saber el tipo de campana.
 *
 * Vive en una sola funcion a proposito. Estuvo escrita dos veces, con y sin la
 * pregunta del negocio, y las dos listas se usaban para lo mismo: dibujar la
 * pantalla y decidir a donde ir al pulsar Siguiente. Con listas distintas el
 * indice de la pregunta abierta apuntaba a otra pregunta y el asistente se
 * saltaba la del negocio.
 */
function camposDeArranque() {
  var campos = [{ id: 'pais', tipo: 'lista', paso: 'campana', etiqueta: 'País' }];

  /*
   * El negocio solo se pregunta donde hay algo que elegir.
   *
   * En un pais sin tipos de Travel, elegir Rappi Travel lleva siempre a Legal:
   * es un camino que arranca y muere una pregunta despues. Donde no existe, la
   * pregunta no se hace y el negocio queda respondido en Rappi. Juan lo cerro
   * el 20 de septiembre de 2026 (punto F8).
   *
   * Lo pone respondido quien decide no preguntarlo, en alResponder del pais:
   * aqui solo se decide si se dibuja.
   */
  if (hayTravelEnElPais()) {
    campos.push({ id: 'negocio', tipo: 'lista', paso: 'campana', etiqueta: 'Negocio', opciones: preguntaDe('negocio').opciones });
  }

  campos.push({ id: 'tipo', tipo: 'tarjetas', paso: 'campana', etiqueta: 'Tipo' });
  return campos;
}

function pantallaPasos(raiz) {
  var entrada = estado.entrada();
  var pasos = flujo.pasosDelTipo(entrada);

  // Sin tipo elegido todavía: se pregunta país y tipo primero.
  if (pasos.length === 0) {
    pasos = [pasoDe('campana')];
  }
  if (E.pasoActual >= pasos.length) E.pasoActual = pasos.length - 1;

  var pasoActual = pasos[E.pasoActual];
  var campos = flujo.camposDelPaso(entrada, pasoActual.id);
  if (campos.length === 0 && !entrada.tipo) campos = camposDeArranque();

  var errores = flujo.erroresPorCampo();

  // Cuál pregunta está abierta: la que se pidió editar, o la primera sin responder.
  var indiceAbierto = 0;
  if (E.campoAbierto) {
    for (var i = 0; i < campos.length; i++) if (campos[i].id === E.campoAbierto) indiceAbierto = i;
  } else {
    indiceAbierto = campos.length - 1;
    for (var j = 0; j < campos.length; j++) {
      if (!flujo.tieneRespuesta(campos[j].id)) { indiceAbierto = j; break; }
    }
  }

  var columna = crear('div', { clase: 'columna-preguntas' });
  columna.appendChild(barraDeProgreso(pasos));
  columna.appendChild(crear('h1', { texto: estado.T(pasoActual.titulo || pasoActual.nombre) }));

  // El aviso del pais en pruebas acompana todo el formulario: al elegir el pais
  // el asistente avanza solo, asi que colgarlo de esa pregunta era no mostrarlo.
  var enPruebas = avisoDePaisEnPruebas();
  if (enPruebas) columna.appendChild(enPruebas);

  // Respondidas, en una línea.
  var respondidas = crear('div', { clase: 'ficha' });
  var cuantasRespondidas = 0;
  for (var r = 0; r < indiceAbierto; r++) {
    (function (campo) {
      if (!flujo.tieneRespuesta(campo.id)) return;
      cuantasRespondidas += 1;
      respondidas.appendChild(RM.campos.dibujarRespondida(campo, comoTexto(campo), function () {
        E.campoAbierto = campo.id;
        RM.app.dibujar();
      }));
    })(campos[r]);
  }
  if (cuantasRespondidas > 0) columna.appendChild(respondidas);

  // La pregunta abierta.
  var campoAbierto = campos[indiceAbierto];
  if (campoAbierto) {
    var opcionesEspeciales = opcionesDeLosDatos(campoAbierto);
    var bloque = RM.campos.dibujarPregunta(campoAbierto, {
      pais: flujo.paisElegido(),
      error: E.errores[campoAbierto.id] ? errores[campoAbierto.id] : null,
      confirmacion: confirmacionDe(campoAbierto),
      deshabilitadas: opcionesDeshabilitadas(campoAbierto),
      opciones: opcionesEspeciales,
      aviso: avisoDe(campoAbierto),
      alCambiar: function (campoId, valor) { return alResponder(campoId, valor, campos, indiceAbierto); },
      alAvanzar: function () { avanzar(campos, indiceAbierto, pasos); },
    });

    if (bloque) {
      // País y tipo se dibujan a mano porque sus opciones salen del servidor.
      if (campoAbierto.id === 'pais' || campoAbierto.id === 'tipo') {
        bloque = preguntaDeCatalogo(campoAbierto, campos, indiceAbierto, pasos);
      }
      if (campoAbierto.id === 'maxPedidos') {
        bloque = preguntaDeVeces(campos, indiceAbierto, pasos, errores);
      }
      if (campoAbierto.id === 'tiendas') {
        bloque = RM.tiendas.dibujar(function () { RM.app.dibujar(); });
      }
      if (campoAbierto.id === 'productosDetalle') {
        bloque = RM.productos.dibujar(function () { RM.app.dibujar(); });
      }
      if (campoAbierto.id === 'beneficiosPorProducto') {
        bloque = RM.beneficios.dibujar(function () { RM.app.dibujar(); });
      }
      if (campoAbierto.id === 'tiendasEta') {
        bloque = RM.tiendasEta.dibujar(function () { RM.app.dibujar(); });
      }
      columna.appendChild(bloque);
    }

    var extra = campoAbierto.id === 'tope' || campoAbierto.id === 'presupuesto' || campoAbierto.id === 'porcentaje'
      ? calculadora() : null;
    if (extra) columna.appendChild(extra);


  }

  // Cuántas faltan en este paso, contando las que van a aparecer según lo que
  // responda: decía "Queda 1 pregunta" y después salían dos.
  var faltan = flujo.faltanEnElPaso(campos, indiceAbierto, pasos[E.pasoActual].id);
  if (faltan > 0) {
    columna.appendChild(crear('p', {
      clase: 'pregunta-ayuda',
      texto: faltan === 1
        ? estado.T('Queda 1 pregunta en este paso.')
        : estado.T('Quedan {n} preguntas en este paso.').replace('{n}', faltan),
    }));
  }

  columna.appendChild(crear('div', { clase: 'fila-botones' }, [
    E.pasoActual > 0 || indiceAbierto > 0
      ? crear('button', {
          clase: 'boton boton-secundario', type: 'button', texto: estado.T('Atrás'),
          onclick: function () { retroceder(campos, indiceAbierto, pasos); },
        })
      : null,
    crear('button', {
      clase: 'boton', type: 'button',
      texto: entrada.tipo && indiceAbierto === campos.length - 1 && E.pasoActual === pasos.length - 1
        ? estado.T('Revisar y generar') : estado.T('Siguiente'),
      onclick: function () { avanzar(campos, indiceAbierto, pasos); },
    }),
  ]));

  var contenido = crear('div', { clase: 'pagina' }, [
    crear('div', { clase: 'dos-columnas' }, [columna, columnaDocumento()]),
  ]);
  raiz.appendChild(contenido);
  RM.app.agregarHojaDeCelular(raiz);
  flujo.refrescarDocumento();
}

  if (campo.id === 'tipo') {

/**
 * Guarda una respuesta.
 *
 * Devuelve true cuando la respuesta ya cambio de pantalla. Quien llama tiene
 * que respetarlo y no avanzar encima: avanzar despues de navegar mandaba al
 * resumen con el formulario vacio.
 */
/**
 * Que hacer despues de elegir el pais, el negocio o el tipo.
 *
 * Si el paso todavia tiene preguntas sin responder, se abre la siguiente. Si no
 * queda ninguna, se pasa al paso siguiente: en Rappi Travel el paso de la
 * campana se acaba con el tipo, y quedarse quieto dejaba al comercial mirando
 * la pregunta que acababa de contestar.
 */
/** true si el pais elegido ofrece algun tipo de Rappi Travel. */
function hayTravelEnElPais() {
  var pais = flujo.paisElegido();
  if (!pais) return false;
  var disponibles = tiposDelPais(pais, E.configuracion.tipos);
  for (var i = 0; i < disponibles.length; i++) {
    if (disponibles[i].esDeTravel) return true;
  }
  return false;
}

/**
 * Por que este pais no puede hacer Travel hoy, o cadena vacia si si puede.
 *
 * Son dos cosas distintas y el comercial merece saber cual: que el pais no
 * tenga habilitados los tipos de Travel, o que los tenga pero le falte un dato
 * legal (el RNT, la razon social de la agencia). Lo segundo se arregla llenando
 * el Sheet, asi que el mensaje lo dice con nombre propio en vez de mandarlo a
 * redactar el documento a mano.
 */
function razonParaNoHacerTravel() {
  var pais = flujo.paisElegido();
  if (!hayTravelEnElPais()) {
    return 'Rappi Travel todavía no está habilitado en ' + ((pais || {}).nombre || 'tu país') +
      '. Las campañas de viajes de ese país las redacta Legal a mano.';
  }
  var revision = travelDisponible(pais, E.configuracion.hoy || RM.util.hoyEnElNavegador());
  return revision.disponible ? '' : revision.motivo;
}

function seguirDespuesDeUnaTarjeta() {
  var ahora = situacionActual();
  for (var i = 0; i < ahora.campos.length; i++) {
    if (!flujo.tieneRespuesta(ahora.campos[i].id)) {
      RM.app.dibujar();
      return;
    }
  }
  if (ahora.campos.length > 0 && E.pasoActual < ahora.pasos.length - 1) E.pasoActual += 1;
  RM.app.dibujar();
}

/**
 * Los valores por defecto que trae el tipo de campana recien elegido.
 *
 * Casi todos los por defecto son iguales en todos los tipos y se fijan al
 * arrancar el formulario (valoresIniciales, en 70-app.js), cuando todavia no
 * hay tipo. Brasil es la excepcion: los cuatro T&C aprobados arrancan a las
 * 00:01 y no a medianoche, asi que `horaInicio` trae un por defecto propio en
 * su variante `promocao_br`. Sin esta funcion la variante existiria y nadie la
 * veria, que es justo el defecto que ya paso una vez con el texto de las
 * preguntas.
 *
 * Solo toca dos cosas: lo que el tipo cambia respecto del por defecto general,
 * y solo si el comercial no lo ha respondido todavia. Preseleccionar no es
 * responder, pero pisarle una respuesta suya si seria un error.
 */
function aplicarValoresDelTipo(tipo) {
  if (!tipo) return;
  var visibles = camposVisibles(tipo, estado.entrada());
  for (var i = 0; i < visibles.length; i++) {
    var campoId = visibles[i].id;
    if (E.respondidas[campoId]) continue;

    var delTipo = estado.pregunta(campoId);
    if (!delTipo || delTipo.porDefecto === undefined) continue;

    var generica = PREGUNTAS[campoId];
    if (generica && delTipo.porDefecto === generica.porDefecto) continue;

    estado.fijar(campoId, delTipo.porDefecto);
  }
}

function alResponder(campoId, valor, campos, indice) {
  estado.fijar(campoId, valor);
  E.errores[campoId] = true;
  E.respondidas[campoId] = true;

  if (campoId === 'tipo') {
    aplicarValoresDelTipo(valor);
    // La razón por la que el filtro de los generales lo devolvió aquí ya hizo
    // su trabajo: dejarla pegada la repetiría en cada vuelta a esta pregunta.
    E.motivoDeLosTipos = null;
  }

  // Al elegir el día de inicio se propone el mismo día de fin: tres de cada
  // cuatro campañas de cashback duran un solo día. Y si el tipo no pregunta la
  // fecha de fin (el ETA es de un solo día), el fin ES el inicio y se mantiene
  // igual siempre: antes se fijaba una sola vez, y al cambiar el día de inicio
  // quedaba una fecha de fin vieja que ninguna pregunta dejaba corregir.
  if (campoId === 'fechaInicio') {
    var preguntaElFin = tieneCampo(esquemaDe(estado.entrada().tipo), 'fechaFin');
    if (!estado.entrada().fechaFin || !preguntaElFin) estado.fijar('fechaFin', valor);
  }
  if (campoId === 'pais') {
    estado.fijar('tipo', null);
    // En un país sin tipos de Travel el negocio no se pregunta, así que queda
    // respondido en Rappi: sin esto, la pregunta desaparece y el formulario se
    // queda esperando una respuesta que nadie le puede dar.
    if (!hayTravelEnElPais()) {
      estado.fijar('negocio', 'rappi');
      E.respondidas.negocio = true;
    }
  }

  // Cambiar de negocio invalida el tipo elegido: los tipos de Rappi no son los
  // de Rappi Travel.
  if (campoId === 'negocio') {
    estado.fijar('tipo', null);
    E.respondidas.tipo = false;

    // Rappi Travel solo existe donde el pais lo tiene habilitado. En los demas
    // sigue siendo un caso de Legal, y hay que decirlo aqui: mandarlo al
    // formulario de Travel seria ofrecerle algo que no se le puede dar.
    if (valor === 'travel') {
      var porQueNo = razonParaNoHacerTravel();
      if (porQueNo) {
        E.motivoDeLegal = porQueNo;
        E.volverDeLegal = 'negocio';
        RM.app.ir('legal');
        return true;
      }
    }

    // Rappi Travel tiene su propio filtro de diez preguntas. Va aqui, apenas
    // se sabe que la campana es de viajes, para no hacerle llenar media
    // campana a alguien que va a terminar en Legal.
    if (valor === 'travel' && !E.filtroDeTravelRespondido) {
      flujo.refrescarDocumento();
      RM.app.ir('filtroTravel');
      return true;
    }

    E.campoAbierto = 'tipo';
    flujo.refrescarDocumento();
    RM.app.dibujar();
    return true;
  }
  // La categoria que no deja seguir: se queda en la pregunta con su razon, en
  // vez de avanzar al resumen y dejar que alguien pulse Generar.
  if (campoId === 'categoriaProducto') {
    var pais = flujo.paisElegido();
    if (pais && categoriaProhibida(pais.codigo, valor)) {
      flujo.refrescarDocumento();
      RM.app.dibujar();
      return true;
    }
  }
  if (campoId === 'criterioGanador' && estado.entrada().desempate === valor) estado.fijar('desempate', null);

  flujo.refrescarDocumento();
  actualizarValidacionEnVivo(campoId);
  return false;
}

/** Refresca solo el mensaje de error del campo abierto, sin redibujar todo. */
function actualizarValidacionEnVivo(campoId) {
  var bloque = document.querySelector('[data-campo="' + campoId + '"]');
  if (!bloque) return;

  var errores = flujo.erroresPorCampo();
  var viejo = bloque.querySelector('.mensaje-error, .mensaje-ok');
  if (viejo) viejo.parentNode.removeChild(viejo);

  var control = bloque.querySelector('input, select, .opciones');
  var mensaje = null;

  if (errores[campoId]) {
    bloque.classList.add('campo-error');
    mensaje = crear('p', { clase: 'mensaje-error', role: 'alert' }, [
      RM.util.icono('alerta', 16), document.createTextNode(errores[campoId]),
    ]);
  } else {
    bloque.classList.remove('campo-error');
    var confirmacion = confirmacionDe({ id: campoId });
    if (confirmacion) {
      mensaje = crear('p', { clase: 'mensaje-ok' }, [
        RM.util.icono('visto', 16), document.createTextNode(confirmacion),
      ]);
    }
  }
  if (mensaje && control) control.parentNode.insertBefore(mensaje, control.nextSibling);

  var frase = RM.campos.asiQueda(campoId, flujo.paisElegido());
  var vieja = bloque.querySelector('.asi-queda');
  if (vieja) vieja.parentNode.removeChild(vieja);
  if (frase) {
    var detalle = bloque.querySelector('.por-que');
    bloque.insertBefore(frase, detalle);
  }
}

/**
 * Recalcula los pasos y las preguntas del momento.
 *
 * Hay que recalcular siempre: elegir el país o el tipo cambia qué pasos existen
 * y qué preguntas se ven, así que las listas que se armaron para dibujar la
 * pantalla anterior ya no sirven para decidir a dónde ir.
 */
function situacionActual() {
  var entrada = estado.entrada();
  var pasos = flujo.pasosDelTipo(entrada);
  if (pasos.length === 0) pasos = [pasoDe('campana')];
  if (E.pasoActual >= pasos.length) E.pasoActual = pasos.length - 1;

  var campos = flujo.camposDelPaso(entrada, pasos[E.pasoActual].id);
  if (campos.length === 0 && !entrada.tipo) campos = camposDeArranque();
  return { pasos: pasos, campos: campos };
}

function avanzar(camposViejos, indiceViejo, pasosViejos) {
  var ahora = situacionActual();
  var campos = ahora.campos;
  var pasos = ahora.pasos;

  // El índice se vuelve a buscar por identificador: la lista pudo cambiar.
  var indice = indiceViejo;
  if (camposViejos && camposViejos[indiceViejo]) {
    var buscado = camposViejos[indiceViejo].id;
    for (var b = 0; b < campos.length; b++) if (campos[b].id === buscado) indice = b;
  }
  if (indice >= campos.length) indice = campos.length - 1;

  var errores = flujo.erroresPorCampo();
  var campo = campos[indice];

  if (campo && errores[campo.id]) {
    E.errores[campo.id] = true;
    E.campoAbierto = campo.id;
    RM.app.dibujar();
    RM.util.anunciar(errores[campo.id]);
    return;
  }

  if (campo) E.respondidas[campo.id] = true;

  E.campoAbierto = null;
  if (indice < campos.length - 1) {
    E.campoAbierto = campos[indice + 1].id;
    RM.app.dibujar();
    return;
  }
  if (E.pasoActual < pasos.length - 1) {
    E.pasoActual += 1;
    RM.app.dibujar();
    return;
  }
  RM.app.ir('resumen');
}

function retroceder(camposViejos, indiceViejo, pasosViejos) {
  var ahora = situacionActual();
  var campos = ahora.campos;
  var pasos = ahora.pasos;
  var indice = Math.min(indiceViejo, campos.length - 1);

  E.campoAbierto = null;
  if (indice > 0) {
    E.campoAbierto = campos[indice - 1].id;
    RM.app.dibujar();
    return;
  }
  if (E.pasoActual > 0) {
    E.pasoActual -= 1;
    RM.app.dibujar();
    return;
  }
  RM.app.ir('filtro');
}

RM.pasos = {
  pantallaPasos: pantallaPasos,
  botonDelModeloDeAcuerdo: botonDelModeloDeAcuerdo,
  avanzar: avanzar,
  comoTexto: comoTexto,
  columnaDocumento: columnaDocumento,
  calculadora: calculadora,
  avisoDePaisEnPruebas: avisoDePaisEnPruebas,
};

(function () {

/**
 * Los T&C que Legal ya publico.
 *
 * Hay campanas para las que NO hay que generar nada: descuentos, cupones,
 * envio gratis y tarifa de servicio gratis ya tienen T&C publicados por Legal,
 * con su enlace fijo. Son casi la mitad de la demanda real y hasta hoy la
 * herramienta no los cubria: el comercial llegaba, no encontraba su tipo de
 * campana y terminaba escribiendole a Legal para pedir algo que ya existia.
 *
 * Por eso esta pantalla se lee como una buena noticia y no como una negativa:
 * no le estamos quitando nada, le estamos ahorrando el documento entero. Lo
 * unico que se lleva de aqui es el enlace, y tiene que quedar clarisimo que ese
 * enlace es el que va en la pieza.
 *
 * Los datos salen de data/tyc_genericos.json y la logica de src/core/
 * tyc_genericos.js. Aqui no se redacta ni se corrige ningun texto de Legal.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;

/** El pais de la campana, o Colombia si todavia no se eligio ninguno. */
function codigoDelPais() {
  var pais = RM.flujo.paisElegido();
  return pais ? pais.codigo : '';
}

function hoy() {
  return (E.configuracion && E.configuracion.hoy) || RM.util.hoyEnElNavegador();
}

/**
 * La tarjeta que lleva aqui desde la lista de tipos de campana.
 *
 * Va junto a los tipos, porque ahi es donde el comercial busca su campana, pero
 * separada de ellos: los demas generan un documento y este no. Devuelve null
 * cuando no hay nada que ofrecer, que es lo unico peor que no ofrecerlo.
 */
function tarjetaDeAtajo() {
  var codigo = codigoDelPais();
  if (!hayTycGenericos(codigo)) return null;
  // Rappi Travel tiene su propia lista y sus propios T&C: mezclarlos aqui
  // seria ofrecerle al comercial un enlace que no cubre su campana.
  if ((estado.entrada().negocio || 'rappi') === 'travel') return null;

  var caja = crear('div', { clase: 'atajo-tyc' }, [
    crear('p', { clase: 'pregunta-ayuda', texto: '¿Es un descuento, un cupón o envío gratis?' }),
  ]);

  // La buena noticia solo se da si hay algo que dar. Catorce de los quince
  // vencen el 31 de diciembre de 2026: si nadie actualiza la lista, la tarjeta
  // no puede seguir prometiendo un enlace que ya no rige.
  var quedan = hayTycGenericosUsables(codigo, hoy());
  var grupo = crear('div', { clase: 'opciones' });
  grupo.appendChild(crear('button', {
    clase: 'opcion', type: 'button',
    onclick: function () {
      E.tycGenericoElegido = null;
      // Al filtro, no directo a la lista: antes de dar un enlace hay que saber
      // si la campana de verdad cabe en ese documento (punto D6).
      E.filtroDeGenerales = {};
      E.resaltarGenericos = null;
      RM.app.ir('filtroGenerales');
    },
  }, [
    // El titulo nombraba cuatro cosas y la lista trae catorce: se quedaban
    // afuera las de Rappi Pro, las de Turbo y los codigos para eventos. Un
    // comercial con una de esas no se reconocia en la tarjeta y generaba un
    // documento que no hacia falta. Juan pidio el 21 de septiembre de 2026 que
    // el copy dijera que son esas y mas.
    crear('span', { clase: 'opcion-titulo', texto: 'Descuentos, cupones, envío gratis, Rappi Pro y más' }),
    crear('span', {
      clase: 'opcion-nota',
      texto: quedan
        ? 'Buena noticia: para estas campañas Legal ya publicó los T&C. Entra y mira la lista completa antes de seguir, porque son más de las que caben en este título. No generas ningún documento: te damos el enlace listo para la pieza.'
        : 'Legal tenía T&C publicados para estas campañas, pero ya vencieron y todavía no hay versión nueva. Entra para ver cuáles eran y escríbele a Legal antes de sacar la pieza.',
    }),
  ]));

  caja.appendChild(grupo);
  return caja;
}

// --- El filtro de seis preguntas --------------------------------------------

/**
 * Antes de dar el enlace de un T&C general, seis preguntas de si o no.
 *
 * Nadie revisaba si la campana del comercial de verdad cabia en el documento
 * general que iba a usar, y una condicion que el general no dice no se le puede
 * exigir al usuario. Los textos son los de la decision 49 del encargo 01, y
 * Juan lo cerro el 20 de septiembre de 2026 (punto D6).
 *
 * Cada "si" cambia el camino, y las salidas son tres: volver a los tipos,
 * porque la herramienta sabe hacer ese documento; ir a Legal, con la razon
 * escrita; o mostrar la lista, cuando hay un general que si sirve.
 */
function pantallaFiltro(raiz) {
  if (!E.filtroDeGenerales) E.filtroDeGenerales = {};
  var respuestas = E.filtroDeGenerales;

  var contenido = crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('h1', { texto: '¿Sirve un T&C general para tu campaña?' }),
    crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'Seis preguntas de sí o no. Si todas son no, te damos el enlace que va en la pieza.',
    }),
  ]);

  var lista = crear('div', { clase: 'preguntas-filtro' });
  for (var i = 0; i < FILTRO_DE_GENERALES.length; i++) {
    lista.appendChild(bloqueDePregunta(FILTRO_DE_GENERALES[i], respuestas));
  }
  contenido.appendChild(lista);

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [botonVolverALosTipos()]));
  raiz.appendChild(contenido);
}

/** Una pregunta del filtro, con su salida y con la razon cuando la tiene. */
function bloqueDePregunta(pregunta, respuestas) {
  var bloque = crear('div', { clase: 'pregunta' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.texto }),
  ]);

  var grupo = crear('div', { clase: 'opciones', role: 'radiogroup', 'aria-label': pregunta.texto });
  [['No', false], ['Sí', true]].forEach(function (par) {
    grupo.appendChild(crear('button', {
      clase: 'opcion' + (respuestas[pregunta.id] === par[1] ? ' elegida' : ''),
      type: 'button', role: 'radio', texto: par[0],
      'aria-checked': String(respuestas[pregunta.id] === par[1]),
      onclick: function () {
        respuestas[pregunta.id] = par[1];
        // Un "no" puede dejar respondidas las seis: hay que revisar entonces.
        if (par[1] === false) { revisarElFiltro(respuestas); return; }
        if (pregunta.salida === 'opciones') { RM.app.dibujar(); return; }
        salirDelFiltro(pregunta);
      },
    }));
  });
  bloque.appendChild(grupo);

  // La sexta no es de si o no: un "si" abre tres opciones, y cada una lleva a
  // un sitio distinto.
  if (pregunta.salida === 'opciones' && respuestas[pregunta.id] === true) {
    bloque.appendChild(subpreguntaDeUsuarios(pregunta, respuestas));
  }

  // Un "si" que lleva a un general concreto se queda a la vista con su razon,
  // en vez de mover la pantalla sin explicar por que.
  if (pregunta.salida === 'depende' && respuestas[pregunta.id] === true) {
    bloque.appendChild(crear('div', { clase: 'aviso' }, [
      crear('p', { texto: pregunta.razon }),
      crear('div', { clase: 'fila-botones' }, [
        crear('button', {
          clase: 'boton', type: 'button', texto: 'Es un código para un evento externo',
          onclick: function () {
            E.resaltarGenericos = 'evento_externo';
            RM.app.ir('tycGenericos');
          },
        }),
        crear('button', {
          clase: 'boton boton-secundario', type: 'button', texto: 'No es eso',
          onclick: function () { aLegal(pregunta.razon); },
        }),
      ]),
    ]));
  }

  return bloque;
}

/** Las tres opciones de "¿Aplica solo a ciertos usuarios?". */
function subpreguntaDeUsuarios(pregunta, respuestas) {
  var caja = crear('div', { clase: 'aviso' }, [
    crear('p', { texto: '¿A cuáles?' }),
  ]);
  var grupo = crear('div', { clase: 'opciones', role: 'radiogroup', 'aria-label': '¿A cuáles usuarios?' });

  for (var i = 0; i < pregunta.opciones.length; i++) {
    (function (opcion) {
      grupo.appendChild(crear('button', {
        clase: 'opcion', type: 'button', role: 'radio', 'aria-checked': 'false',
        onclick: function () {
          if (opcion.salida === 'legal') { aLegal(opcion.razon); return; }
          E.resaltarGenericos = opcion.valor;
          RM.app.ir('tycGenericos');
        },
      }, [
        crear('span', { clase: 'opcion-titulo', texto: opcion.etiqueta }),
        crear('span', { clase: 'opcion-nota', texto: opcion.nota }),
      ]));
    })(pregunta.opciones[i]);
  }

  caja.appendChild(grupo);
  return caja;
}

/** Lo que pasa con un "si" en las cinco primeras. */
function salirDelFiltro(pregunta) {
  if (pregunta.salida === 'tipos') {
    E.motivoDeLosTipos = pregunta.razon;
    E.campoAbierto = 'tipo';
    RM.app.ir('pasos');
    return;
  }
  if (pregunta.salida === 'legal') { aLegal(pregunta.razon); return; }
  // "depende" se queda en la pantalla con sus dos salidas.
  RM.app.dibujar();
}

function aLegal(razon) {
  E.motivoDeLegal = razon;
  E.volverDeLegal = 'filtroGenerales';
  RM.app.ir('legal');
}

/** Con las seis en no, la lista completa. */
function revisarElFiltro(respuestas) {
  var todas = FILTRO_DE_GENERALES.every(function (pregunta) {
    return respuestas[pregunta.id] === false;
  });
  if (!todas) { RM.app.dibujar(); return; }
  E.resaltarGenericos = null;
  RM.app.ir('tycGenericos');
}

// --- La pantalla -------------------------------------------------------------

function pantalla(raiz) {
  var codigo = codigoDelPais();
