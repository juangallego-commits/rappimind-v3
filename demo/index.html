            }
            RM.app.ir('admin');
          });
        },
      }),
    ]),
    mensaje,
    seccionCargaMasiva(datos),
  ]);
}

/**
 * Agregar mucha gente de una sola vez, pegando sus correos.
 *
 * Nacio para abrir la herramienta a los equipos legales de los demas paises: un
 * pais en piloto solo lo ve quien tenga rol legal, pruebas o admin, y agregar a
 * treinta personas de una en una no lo hace nadie a las once de la noche.
 */
function seccionCargaMasiva(datos) {
  var correos = crear('textarea', {
    rows: '4',
    placeholder: 'ana@rappi.com, bruno@rappi.com\ncarla@rappi.com',
    'aria-label': 'Correos, separados por comas o por líneas',
  });

  var rol = crear('select', { 'aria-label': 'Rol para todos' });
  for (var r = 0; r < datos.roles.length; r++) {
    rol.appendChild(crear('option', {
      value: datos.roles[r], texto: datos.roles[r],
      // Legal es el que abre los países en piloto, que es para lo que existe esto.
      selected: datos.roles[r] === 'legal',
    }));
  }

  var pais = crear('input', { type: 'text', placeholder: 'CO', 'aria-label': 'País de todos, opcional' });
  var resultado = crear('div', {});
  var boton = crear('button', { clase: 'boton', type: 'button', texto: 'Agregar a todos' });

  boton.addEventListener('click', function () {
    boton.disabled = true;
    boton.textContent = 'Agregando...';
    RM.util.vaciar(resultado);

    RM.servidor.llamar('adminAgregarMiembros', correos.value, rol.value, pais.value).then(function (respuesta) {
      boton.disabled = false;
      boton.textContent = 'Agregar a todos';

      if (!respuesta.valido) {
        resultado.appendChild(crear('p', { clase: 'mensaje-error', texto: respuesta.errores[0].mensaje }));
        return;
      }

      var lineas = [];
      if (respuesta.agregados.length > 0) {
        lineas.push(respuesta.agregados.length + (respuesta.agregados.length === 1 ? ' persona agregada' : ' personas agregadas') + ' como ' + rol.value + '.');
      }
      if (respuesta.yaEstaban.length > 0) {
        lineas.push(respuesta.yaEstaban.length + (respuesta.yaEstaban.length === 1 ? ' ya estaba' : ' ya estaban') + ' en el equipo, no se tocó su rol: ' + respuesta.yaEstaban.join(', '));
      }
      if (respuesta.rechazados.length > 0) {
        lineas.push('Sin agregar, porque no son correos de Rappi: ' + respuesta.rechazados.join(', '));
      }
      if (lineas.length === 0) lineas.push('No había nada que agregar.');

      for (var i = 0; i < lineas.length; i++) {
        resultado.appendChild(crear('p', {
          clase: i === 0 && respuesta.agregados.length > 0 ? 'mensaje-ok' : 'pregunta-ayuda',
          texto: lineas[i],
        }));
      }
      correos.value = '';
      RM.util.anunciar(lineas[0]);
    }).catch(function (error) {
      boton.disabled = false;
      boton.textContent = 'Agregar a todos';
      resultado.appendChild(crear('p', { clase: 'mensaje-error', texto: 'No pudimos agregarlos: ' + error.message }));
    });
  });

  return crear('div', {}, [
    crear('h3', { texto: 'Agregar muchos de una vez' }),
    crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'Pega los correos separados por comas o uno por línea. Quien ya esté en el equipo se deja como está, así que esto nunca le baja el rol a nadie. Con rol legal, la persona ve los países en piloto.',
    }),
    correos,
    crear('div', { clase: 'fila-botones' }, [rol, pais, boton]),
    resultado,
  ]);
}

function seccionSolicitudes() {
  var buscador = crear('input', { type: 'search', placeholder: 'Busca por campaña, tienda o país', 'aria-label': 'Buscar solicitudes' });
  var destino = crear('div', {});

  function cargar() {
    RM.servidor.llamar('adminSolicitudes', buscador.value || '').then(function (filas) {
      RM.util.vaciar(destino);
      destino.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: filas.length + (filas.length === 1 ? ' solicitud' : ' solicitudes') }));

      var tabla = crear('table', { clase: 'tabla' }, [
        crear('thead', {}, [crear('tr', {}, [
          crear('th', { texto: 'Id' }), crear('th', { texto: estado.T('Campaña') }), crear('th', { texto: 'Quién' }),
          crear('th', { texto: 'País' }), crear('th', { texto: 'Tipo' }), crear('th', { texto: 'Estado' }),
        ])]),
      ]);
      var cuerpo = crear('tbody');
      for (var i = 0; i < filas.length; i++) {
        var fila = filas[i];
        cuerpo.appendChild(crear('tr', {}, [
          crear('td', { texto: fila.id }),
          crear('td', { texto: fila.nombre_campana || '' }),
          crear('td', { texto: fila.email || '' }),
          crear('td', { texto: fila.pais || '' }),
          crear('td', { texto: fila.tipo || '' }),
          crear('td', { texto: fila.estado || '' }),
        ]));
      }
      tabla.appendChild(cuerpo);
      destino.appendChild(crear('div', { clase: 'envoltorio-tabla' }, [tabla]));
    });
  }

  buscador.addEventListener('input', RM.util.conRetraso(cargar, 250));
  cargar();

  return crear('section', {}, [
    crear('h2', { texto: 'Solicitudes' }),
    crear('div', { clase: 'fila-botones' }, [
      buscador,
      crear('button', {
        clase: 'boton boton-secundario', type: 'button', texto: 'Exportar a CSV',
        onclick: function () {
          RM.servidor.llamar('adminSolicitudesCsv', buscador.value || '').then(function (csv) {
            var enlace = document.createElement('a');
            enlace.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + csv);
            enlace.download = 'solicitudes-rappimind.csv';
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
          });
        },
      }),
    ]),
    destino,
  ]);
}

(function () {

/**

var vaciar = RM.util.vaciar;
var estado = RM.estado;
var E = estado.estado;

var PANTALLAS = {
  inicio: function (raiz) { RM.flujo.pantallaInicio(raiz); },
  filtro: function (raiz) { RM.flujo.pantallaFiltro(raiz); },
  filtroTravel: function (raiz) { RM.flujo.pantallaFiltroTravel(raiz); },
  legal: function (raiz) { RM.flujo.pantallaLegal(raiz); },
  pasos: function (raiz) { RM.pasos.pantallaPasos(raiz); },
  filtroGenerales: function (raiz) { RM.tycGenericos.pantallaFiltro(raiz); },
  tycGenericos: function (raiz) { RM.tycGenericos.pantalla(raiz); },
  resumen: function (raiz) { RM.resumen.pantallaResumen(raiz); },
  listo: function (raiz) { RM.resumen.pantallaListo(raiz); },
  historial: function (raiz) { RM.pantallas.pantallaHistorial(raiz); },
  ayuda: function (raiz) { RM.pantallas.pantallaAyuda(raiz); },
  admin: function (raiz) { RM.pantallas.pantallaAdmin(raiz); },
};

var NAVEGACION = [
  { id: 'inicio', nombre: 'Generar' },
  { id: 'historial', nombre: 'Mis campañas' },
  { id: 'ayuda', nombre: 'Ayuda' },
];

function barraSuperior() {
  var nav = crear('nav', { 'aria-label': estado.T('Secciones') });
  for (var i = 0; i < NAVEGACION.length; i++) {
    (function (seccion) {
      nav.appendChild(crear('button', {
        clase: 'enlace-nav', type: 'button', texto: estado.T(seccion.nombre),
        'aria-current': E.pantalla === seccion.id ? 'page' : null,
        onclick: function () { ir(seccion.id); },
      }));
    })(NAVEGACION[i]);
  }

  if (E.configuracion && E.configuracion.rol === 'admin') {
    nav.appendChild(crear('button', {
      clase: 'enlace-nav', type: 'button', texto: estado.T('Administración'),
      'aria-current': E.pantalla === 'admin' ? 'page' : null,
      onclick: function () { ir('admin'); },
    }));
  }

  return crear('header', { clase: 'barra-superior' }, [
    crear('span', { clase: 'marca' }, [
      RM.util.corona(),
      document.createTextNode('RappiMind '),
      crear('em', { texto: 'v3' }),
    ]),
    nav,
  ]);
}

/** El botón fijo y la hoja deslizable del celular. */
function agregarHojaDeCelular(raiz) {
  var cortina = crear('div', { clase: 'cortina' });
  var hoja = crear('div', {
    clase: 'hoja-deslizable', role: 'dialog', 'aria-modal': 'true', 'aria-label': estado.T('Vista previa del documento'),
  }, [
    crear('div', { clase: 'asa' }),
    crear('div', { clase: 'hoja', 'data-hoja': '1' }),
    crear('div', { clase: 'fila-botones', style: 'padding: 0 16px 16px' }, [
      crear('button', { clase: 'boton boton-secundario', type: 'button', texto: estado.T('Cerrar'), onclick: cerrar }),
    ]),
  ]);

  var boton = crear('button', {
    clase: 'boton-flotante', type: 'button',
    onclick: abrir,
  }, [RM.util.icono('documento', 18), document.createTextNode(estado.T('Ver cómo va mi T&C'))]);

  function abrir() {
    cortina.classList.add('abierta');
    hoja.classList.add('abierta');
    RM.flujo.refrescarDocumento();
    hoja.querySelector('button').focus();
  }
  function cerrar() {
    cortina.classList.remove('abierta');
    hoja.classList.remove('abierta');
    boton.focus();
  }

  cortina.addEventListener('click', cerrar);
  document.addEventListener('keydown', function (evento) {
    if (evento.key === 'Escape' && hoja.classList.contains('abierta')) cerrar();
  });

  raiz.appendChild(boton);
  raiz.appendChild(cortina);
  raiz.appendChild(hoja);
}

/**
 * El selector de idioma de la interfaz, fijo abajo a la derecha.
 *
 * Cambia en que idioma se lee el formulario, no en que idioma sale el documento.
 * El documento va siempre en el idioma del pais, y eso no se elige.
 */
function selectorDeIdioma() {
  var caja = crear('div', {
    clase: 'selector-idioma', role: 'group',
    'aria-label': estado.T('Idioma de la interfaz'),
  });

  for (var i = 0; i < IDIOMAS_DE_INTERFAZ.length; i++) {
    (function (idioma) {
      var elegido = estado.idiomaInterfaz() === idioma.codigo;
      caja.appendChild(crear('button', {
        type: 'button', texto: idioma.bandera,
        title: idioma.nombre,
        'aria-label': idioma.nombre,
        'aria-pressed': String(elegido),
        onclick: function () {
          if (estado.idiomaInterfaz() === idioma.codigo) return;
          estado.fijarIdiomaInterfaz(idioma.codigo);
          dibujar();
          RM.util.anunciar(idioma.nombre);
        },
      }));
    })(IDIOMAS_DE_INTERFAZ[i]);
  }
  return caja;
}

function mostrarError(mensaje) {
  var caja = RM.util.porId('error-global');
  if (!caja) return;
  vaciar(caja);
  caja.appendChild(crear('div', { clase: 'aviso aviso-serio' }, [
    crear('p', { texto: mensaje }),
  ]));
  caja.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  RM.util.anunciar(mensaje);
}

/*
 * Redibujar es reentrante, y por eso lleva cerrojo.
 *
 * Quitar de la pantalla el campo que tiene el foco dispara su evento blur en
 * ese mismo instante. Varias pantallas redibujan al salir de un campo (la lista
 * de productos de la Carrera, la de tiendas de Turbo), así que el blur llamaba
 * a dibujar() en mitad del dibujar() que lo había provocado: el de adentro
 * vaciaba la raíz y el de afuera reventaba con "Failed to execute removeChild:
 * the node to be removed is no longer a child of this node".
 *
 * El síntoma que veía el comercial: agregar una segunda tienda sin haber
 * hecho clic fuera del primer nombre dejaba la pantalla a medio pintar.
 *
 * Con el cerrojo, la llamada de adentro no pinta: anota que hay que volver a
 * pintar, y la de afuera lo hace una sola vez al terminar.
 */
var dibujando = false;
var dibujoPendiente = false;

function dibujar() {
  if (dibujando) {
    dibujoPendiente = true;
    return;
  }
  dibujando = true;
  try {
    pintarTodo();
  } finally {
    dibujando = false;
  }
  if (dibujoPendiente) {
    dibujoPendiente = false;
    dibujar();
  }
}

function pintarTodo() {
  var raiz = RM.util.porId('app');
  vaciar(raiz);
  RM.campos.ocultarGlosario();
  // El lang del documento sigue al idioma de la interfaz: sin esto, un lector
  // de pantalla leia el portugues con las reglas del espanol.
  document.documentElement.lang = estado.idiomaInterfaz();

  raiz.appendChild(barraSuperior());

  if (E.configuracion && E.configuracion.demostracion) {
    raiz.appendChild(crear('div', { clase: 'pagina', style: 'padding-bottom:0' }, [
      crear('div', { clase: 'aviso' }, [
        crear('h3', { texto: estado.T('Modo demostración') }),
        crear('p', { texto: estado.T('No se crea ningún documento, no se manda ningún correo y nada queda guardado. Al final verás el texto que habría salido.') }),
      ]),
    ]));
  }

  raiz.appendChild(crear('div', { id: 'error-global' }));

  var pintar = PANTALLAS[E.pantalla] || PANTALLAS.inicio;
  pintar(raiz);

  raiz.appendChild(selectorDeIdioma());
}

function ir(pantalla) {
  E.pantalla = pantalla;
  var caja = RM.util.porId('error-global');
  if (caja) vaciar(caja);
  dibujar();
  window.scrollTo(0, 0);
  entregarLaPantalla();
}

/**
 * Al cambiar de pantalla, entrega el foco y di en voz alta dónde quedamos.
 *
 * La aplicación redibuja el <main> entero en cada cambio. Para quien ve, eso es
 * evidente. Para quien no, no pasaba nada: el lector de pantalla se quedaba
 * callado y el foco volvía al <body>, así que el siguiente tabulador arrancaba
 * otra vez desde la barra de arriba. Comprobado en el navegador: después de
 * pulsar "Empezar", la región de anuncios seguía vacía y document.activeElement
 * era BODY.
 *
 * El título de la pantalla nueva recibe el foco con tabindex -1, que quiere
 * decir enfocable por código pero no con el tabulador, y se anuncia.
 *
 * Esto va en ir() y NO en dibujar(), que corre con cada respuesta dentro de la
 * misma pantalla: ahí mover el foco se lo quitaría al campo que la persona está
 * llenando justo en ese momento.
 */
function entregarLaPantalla() {
  var titulo = document.querySelector('#app h1');
  if (!titulo) return;
  titulo.setAttribute('tabindex', '-1');
  try {
    titulo.focus({ preventScroll: true });
  } catch (error) {
    titulo.focus();
  }
  RM.util.anunciar(titulo.textContent.trim());
}

/**
 * Los valores con que arranca un formulario nuevo: los por defecto de cada
 * pregunta, más el país. Preseleccionar no es responder: la pregunta se muestra
 * igual, con la opción ya marcada.
 */
function valoresIniciales() {
  var iniciales = {};
  for (var campoId in PREGUNTAS) {
    if (!Object.prototype.hasOwnProperty.call(PREGUNTAS, campoId)) continue;
    if (PREGUNTAS[campoId].porDefecto !== undefined) iniciales[campoId] = PREGUNTAS[campoId].porDefecto;
  }
  // Colombia es el 99,7% de las solicitudes reales: viene preseleccionada.
  if (E.configuracion && E.configuracion.paises.length > 0) iniciales.pais = E.configuracion.paises[0].codigo;
  return iniciales;
}

function arrancar() {
  var raiz = RM.util.porId('app');
  vaciar(raiz);
  raiz.appendChild(crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('p', { clase: 'pregunta-ayuda', texto: estado.T('Cargando RappiMind...') }),
  ]));

  RM.servidor.llamar('estadoInicial').then(function (configuracion) {
    E.configuracion = configuracion;
    estado.reiniciarFormulario(valoresIniciales(), {});
    ir('inicio');
  }).catch(function (error) {
    vaciar(raiz);
    raiz.appendChild(crear('div', { clase: 'pagina pagina-angosta' }, [
      crear('div', { clase: 'aviso aviso-serio' }, [
        crear('h3', { texto: estado.T('No pudimos abrir RappiMind') }),
        crear('p', { texto: error.message }),
        crear('p', { clase: 'pregunta-ayuda', texto: estado.T('Si sigue pasando, avísale a Juan.') }),
      ]),
    ]));
  });
}

RM.app = {
  dibujar: dibujar,
  valoresIniciales: valoresIniciales,
  ir: ir,
  arrancar: arrancar,
  mostrarError: mostrarError,
  agregarHojaDeCelular: agregarHojaDeCelular,
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', arrancar);
} else {
  arrancar();
}

})();

</script>
  </body>
</html>
