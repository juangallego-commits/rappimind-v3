/*
 * Los T&C generales que el filtro ya senalo, por su respuesta.
 *
 * No se esconden los demas: esconderlos dejaria al comercial creyendo que la
 * herramienta no los tiene. Se ponen primero, con una linea que dice por que.
 */
var GENERALES_QUE_SIRVEN = {
  evento_externo: {
    ids: ['codigo_descuento_eventos_externos'],
    porQue: 'Por tu respuesta, el que sirve es este. Los demás no cubren un cupón que se usa por fuera de Rappi.',
  },
  pro: {
    ids: [
      'descuento_productos_seleccionados_pro', 'descuento_toda_la_tienda_pro',
      'descuento_en_valor_pro', 'descuento_membresia_pro', 'cupones_membresia_pro_black',
    ],
    porQue: 'Por tu respuesta, los que sirven son los de Rappi Pro y Pro Black.',
  },
  nuevos_turbo: {
    ids: ['descuento_usuarios_nuevos_turbo'],
    porQue: 'Por tu respuesta, el que sirve es el de Usuarios Nuevos en Turbo.',
  },
};

/** Paso 1: los T&C publicados, con su descripcion y su vigencia. */
function listado(lista, codigo) {
  var quedan = hayTycGenericosUsables(codigo, hoy());
  var contenido = crear('div', { clase: 'pagina pagina-angosta' }, quedan
    ? [
      crear('h1', { texto: 'Para esta campaña no necesitas crear T&C' }),
      crear('p', {
        texto: 'Legal ya dispuso los términos y condiciones de estas campañas y ya están publicados. ' +
          'No tienes que generar ningún documento ni esperar a que alguien lo revise: elige el que ' +
          'corresponde a tu campaña y te damos el enlace que va en la pieza.',
      }),
    ]
    : [
      crear('h1', { texto: 'Los T&C generales vencieron' }),
      crear('p', {
        texto: 'Legal tenía publicados los términos y condiciones de estas campañas, pero ya vencieron y ' +
          'todavía no hay versión nueva. No uses ninguno de estos enlaces: escríbele a Legal para que publique la versión nueva.',
      }),
      E.configuracion.urlFormularioLegal
        ? crear('div', { clase: 'fila-botones' }, [
          crear('a', { clase: 'boton', href: E.configuracion.urlFormularioLegal, target: '_blank', rel: 'noopener' }, [
            document.createTextNode(estado.T('Ir al formulario de Legal')), RM.util.icono('abrir', 16),
          ]),
        ])
        : null,
    ]);

  var senalados = GENERALES_QUE_SIRVEN[E.resaltarGenericos];
  if (senalados) {
    contenido.appendChild(crear('div', { clase: 'aviso' }, [
      crear('p', { texto: senalados.porQue }),
    ]));
  }

  var grupo = crear('div', { clase: 'opciones' });
  var ordenada = senalados ? ordenarPorLosQueSirven(lista, senalados.ids) : lista;
  for (var i = 0; i < ordenada.length; i++) {
    grupo.appendChild(tarjetaDeUno(ordenada[i]));
  }
  contenido.appendChild(grupo);

  contenido.appendChild(crear('p', {
    clase: 'pregunta-ayuda',
    texto: 'Si tu campaña es un cashback, una carrera de compras o un concurso, no es ninguno de estos: vuelve a los tipos y la herramienta te arma el documento.',
  }));
  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [botonVolverALosTipos()]));
  return contenido;
}

/** Los senalados primero, los demas detras y en su mismo orden. */
function ordenarPorLosQueSirven(lista, ids) {
  var primero = [];
  var despues = [];
  for (var i = 0; i < lista.length; i++) {
    if (ids.indexOf(lista[i].id) !== -1) primero.push(lista[i]);
    else despues.push(lista[i]);
  }
  return primero.concat(despues);
}

/** La descripcion, salvo cuando el Excel repite el nombre: no se muestra dos veces. */
function descripcionSinRepetir(tyc) {
  var descripcion = descripcionDeTycGenerico(tyc);
  return descripcion === tyc.nombre ? null : descripcion;
}

function tarjetaDeUno(tyc) {
  var revision = estadoDeTycGenerico(tyc, hoy());

  var partes = [crear('span', { clase: 'opcion-titulo', texto: tyc.nombre })];
  if (tyc.beneficio) partes.push(crear('span', { clase: 'opcion-nota', texto: tyc.beneficio }));
  var descripcion = descripcionSinRepetir(tyc);
  if (descripcion) partes.push(crear('span', { clase: 'opcion-nota', texto: descripcion }));
  // Lo que Legal dejo sin resolver se dice ya en la lista, no solo al abrirlo:
  // el mismo T&C aparece dos veces con enlaces distintos, y quien lo ve por
  // primera vez ahi es donde se confunde.
  if (tyc.advertencia) partes.push(crear('span', { clase: 'opcion-nota', texto: tyc.advertencia }));
  partes.push(crear('span', {
    clase: 'opcion-nota' + (revision.usable ? '' : ' opcion-nota-vencido'),
    texto: revision.mensaje ? revision.mensaje : revision.vigencia,
  }));

  // Un T&C vencido o que todavia no arranca se queda a la vista con su razon,
  // no desaparece: si desapareciera, el comercial creeria que la herramienta no
  // lo tiene y volveria a escribirle a Legal. Y no va con disabled: un boton
  // deshabilitado no recibe foco, y quien navega con teclado o con lector de
  // pantalla pasaria de largo sin enterarse de que existe ni de que vencio.
  return crear('button', {
    clase: 'opcion' + (revision.usable ? '' : ' opcion-vencida'), type: 'button',
    'aria-disabled': revision.usable ? null : 'true',
    onclick: function () {
      if (!revision.usable) return;
      E.tycGenericoElegido = tyc.id;
      RM.app.dibujar();
      window.scrollTo(0, 0);
    },
  }, partes);
}

/** Paso 2: el enlace, que es lo unico que el comercial se lleva de aqui. */
function detalle(tyc) {
  var revision = estadoDeTycGenerico(tyc, hoy());

  var contenido = crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('h1', { texto: tyc.nombre }),
  ]);

  if (!revision.usable) {
    contenido.appendChild(crear('div', { clase: 'aviso aviso-serio' }, [
      crear('p', { texto: revision.mensaje }),
    ]));
    contenido.appendChild(crear('div', { clase: 'fila-botones' }, [botonVolverALaLista(), botonVolverALosTipos()]));
    return contenido;
  }

  // Lo que Legal dejo sin resolver en su lista se dice ANTES del enlace, no
  // despues: estaba al final, debajo de una caja que ordenaba "copia el enlace
  // y ponlo en la pieza, tal cual", y en una pantalla normal no se veia sin
  // hacer scroll. El comercial copiaba y se iba sin leer "confirma con Legal
  // cuál va". Aqui no se arregla nada del Excel: corregirlo por cuenta propia
  // seria publicar una pieza con un respaldo que nadie aprobo.
  var pendientes = [];
  if (tyc.advertencia) pendientes.push(tyc.advertencia);
  if (!String(tyc.paraQue || '').trim()) pendientes.push(descripcionDeTycGenerico(tyc));
  if (revision.mensaje) pendientes.push(revision.mensaje);

  if (pendientes.length > 0) {
    var avisoPendiente = crear('div', { clase: 'aviso aviso-serio', 'data-pendiente': '1' }, [
      crear('h3', { texto: 'Antes de usar este enlace, confirma con Legal' }),
    ]);
    for (var p = 0; p < pendientes.length; p++) avisoPendiente.appendChild(crear('p', { texto: pendientes[p] }));
    contenido.appendChild(avisoPendiente);
  }

  contenido.appendChild(crear('div', { clase: 'aviso' }, pendientes.length > 0
    ? [
      crear('h3', { texto: 'Este es el enlace que Legal tiene publicado' }),
      crear('p', { texto: 'No generas ningún documento. Cuando Legal te confirme lo de arriba, este es el enlace que va en la pieza.' }),
    ]
    : [
      crear('h3', { texto: 'Listo, no tienes que generar nada' }),
      crear('p', { texto: 'Legal ya publicó estos T&C. Copia el enlace de abajo y ponlo en la pieza: ese es el enlace que va, tal cual.' }),
    ]));

  contenido.appendChild(RM.util.paraCopiar(
    'Enlace para la pieza',
    tyc.enlace,
    'Pégalo tal cual, sin acortarlo y sin cambiarle nada.'
  ));

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('a', { clase: 'boton boton-secundario', href: tyc.enlace, target: '_blank', rel: 'noopener' }, [
      document.createTextNode('Abrir los T&C'), RM.util.icono('abrir', 16),
    ]),
  ]));

  contenido.appendChild(crear('div', { clase: 'aviso' }, [
    crear('h3', { texto: 'Lo que tu pieza tiene que decir' }),
    crear('p', { texto: LO_QUE_LA_PIEZA_DEBE_DECIR }),
  ]));

  var loDeLaPieza = loQueLaPiezaTieneQueDecir(tyc);
  if (loDeLaPieza) contenido.appendChild(loDeLaPieza);

  var ficha = crear('div', { clase: 'ficha' });
  var descripcion = descripcionSinRepetir(tyc);
  if (descripcion) ficha.appendChild(seccionDeFicha('Para qué sirve', descripcion));
  if (tyc.beneficio) ficha.appendChild(seccionDeFicha('Qué beneficio cubre', tyc.beneficio));
  ficha.appendChild(seccionDeFicha('Vigencia', revision.vigencia));
  contenido.appendChild(ficha);

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [botonVolverALaLista(), botonVolverALosTipos()]));
  return contenido;
}

/**
 * Lo que la pieza tiene que decir cuando el T&C es uno general.
 *
 * Aqui no se genera documento, asi que la herramienta no sabe los numeros de la
 * campana: dice la forma de las dos frases y el comercial pone los suyos. Juan
 * lo cerro el 20 de septiembre de 2026 (punto C5, pregunta 17).
 *
 * Solo en los descuentos, que son los T&C generales que llevan esos limites.
 */
function loQueLaPiezaTieneQueDecir(tyc) {
  if (!esDeDescuento(tyc)) return null;

  return crear('div', { clase: 'aviso' }, [
    crear('p', { texto: 'Y si tu campaña tiene esos límites, van con los números de tu campaña:' }),
    crear('ul', {}, [
      crear('li', { texto: '“Máximo 1 unidad por usuario.”, o “Máximo 6 unidades por usuario.” si son varias.' }),
      crear('li', { texto: '“10.000 unidades disponibles.”, o “1 unidad disponible.” si es una sola.' }),
    ]),
  ]);
}

/** Si este T&C general es de descuento. Lo dice su nombre o su beneficio. */
function esDeDescuento(tyc) {
  var texto = (String(tyc.nombre || '') + ' ' + String(tyc.beneficio || '')).toLowerCase();
  return texto.indexOf('descuento') !== -1 || texto.indexOf('cupón') !== -1 || texto.indexOf('cupon') !== -1;
}

function seccionDeFicha(titulo, texto) {
  return crear('div', { clase: 'ficha-seccion' }, [
    crear('h3', { texto: titulo }),
    crear('p', { clase: 'pregunta-ayuda', texto: texto }),
  ]);
}

function botonVolverALaLista() {
  return crear('button', {
    clase: 'boton boton-secundario', type: 'button', texto: 'Ver los otros T&C publicados',
    onclick: function () {
      E.tycGenericoElegido = null;
      RM.app.dibujar();
      window.scrollTo(0, 0);
    },
  });
}

/** La salida de aqui. Sin ella, quien entro por equivocacion queda encerrado. */
function botonVolverALosTipos() {
  return crear('button', {
    clase: 'boton boton-secundario', type: 'button', texto: 'Volver a los tipos de campaña',
    onclick: function () {
      E.tycGenericoElegido = null;
      E.campoAbierto = 'tipo';
      RM.app.ir('pasos');
    },
  });
}

RM.tycGenericos = {
  pantalla: pantalla,
  pantallaFiltro: pantallaFiltro,
  tarjetaDeAtajo: tarjetaDeAtajo,
};

(function () {
'use strict';

/**
 * La lista de tiendas del Cashback Day.
 *
 * Es el unico componente repetible. Cada tienda entra con su marca, su razon
 * social, su NIT, su cobertura y su presupuesto, porque cada una organiza su
 * propio beneficio y responde por el.
 *
 * Tambien acepta pegar filas desde Excel: 78 de las solicitudes reales meten
 * tres o mas tiendas dentro de un campo de texto, asi que pegar es como
 * trabajan de verdad.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;

var COLUMNAS = ['marca', 'razonSocial', 'id', 'ciudades', 'presupuesto'];

function tiendas() {
  if (!estado.entrada().tiendas) estado.fijar('tiendas', []);
  return estado.entrada().tiendas;
}

function tiendaVacia() {
  // tiendaTurbo arranca sin respuesta a proposito: cada marca tiene la suya y
  // no hay una mayoritaria que se pueda premarcar.
  return { marca: '', razonSocial: '', id: '', ciudades: '', nacional: false, presupuesto: null, tiendaTurbo: '' };
}

/** Revisa una fila y devuelve los problemas, campo por campo. */
function revisarTienda(tienda, indice, todas) {
  var pais = RM.flujo.paisElegido();
  var problemas = {};
  var textos = preguntaDe('tiendas').camposPorTienda;

  if (!tienda.marca) problemas.marca = 'Falta ' + textos.marca.pregunta.toLowerCase() + '.';
  if (!tienda.razonSocial) problemas.razonSocial = 'Falta la razón social.';
  if (!tienda.presupuesto) problemas.presupuesto = 'Falta el presupuesto de esta tienda.';
  if (!tienda.nacional && !tienda.ciudades) problemas.ciudades = 'Escribe las ciudades o marca cobertura nacional.';
  if (!tienda.tiendaTurbo) problemas.tiendaTurbo = 'Dinos en cuál de sus tiendas se gana el cashback.';

  if (!tienda.id) {
    problemas.id = 'Falta el NIT de esta tienda.';
  } else if (pais) {
    var revision = validarIdentificacion(pais.codigo, tienda.id);
    if (!revision.valido) {
      problemas.id = revision.mensaje;
    } else {
      for (var i = 0; i < todas.length; i++) {
        if (i === indice || !todas[i].id) continue;
        var otra = validarIdentificacion(pais.codigo, todas[i].id);
        if (otra.valido && otra.formateado === revision.formateado) {
          problemas.id = preguntaDe('tiendas').errores.repetida;
          break;
        }

}

function filaDeTienda(tienda, indice, alCambiar) {
  var textos = preguntaDe('tiendas').camposPorTienda;
  var pais = RM.flujo.paisElegido();

  var fila = crear('div', { clase: 'ficha-seccion', 'data-tienda': String(indice) }, [

  fila.appendChild(crear('label', { clase: 'casilla' }, [
    nacional, crear('span', { texto: textos.nacional.pregunta }),
  ]));

  fila.appendChild(campoTexto('ciudades', false));
  fila.appendChild(campoTexto('presupuesto', true));

/**

function campoDeTiendaTurbo(tienda, indice, textos, problemas, alCambiar) {

/** Pegar desde Excel: una fila por tienda, columnas separadas por tabulación. */
function bloqueDePegar(alCambiar) {
  var area = crear('textarea', {
    rows: '4',
    placeholder: 'Beer Station\tCervecerías del Sur S.A.S.\t900.777.888-2\tBogotá, Medellín\t5000000',
    'aria-label': 'Pega aquí las filas copiadas de Excel',
  });

  var resultado = crear('div', {});

  function procesar() {
    var lineas = area.value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (lineas.length === 0) return;

    var nuevas = [];
    var rechazadas = [];

    for (var i = 0; i < lineas.length; i++) {
      var celdas = lineas[i].split(/\t|;/).map(function (c) { return c.trim(); });
      if (celdas.length === 1) celdas = lineas[i].split(/\s{2,}/).map(function (c) { return c.trim(); });
      if (celdas.length < 3) { rechazadas.push('Fila ' + (i + 1) + ': necesita al menos marca, razón social y NIT.'); continue; }

      var tienda = tiendaVacia();
      tienda.marca = celdas[0] || '';
      tienda.razonSocial = celdas[1] || '';
      tienda.id = celdas[2] || '';
      var cobertura = celdas[3] || '';
      if (/^nacional$/i.test(cobertura)) tienda.nacional = true;
      else tienda.ciudades = cobertura;
      tienda.presupuesto = celdas[4] ? Number(RM.util.soloDigitos(celdas[4])) : null;

    var lista = tiendas().slice().filter(function (t) { return t.marca || t.razonSocial || t.id; });

    }));
    for (var r = 0; r < rechazadas.length; r++) {

  return crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: 'Pegar varias tiendas desde Excel' }),
    crear('div', {}, [
      crear('p', {
        clase: 'pregunta-ayuda',
        texto: 'Copia las filas de tu hoja de cálculo con las columnas en este orden: marca, razón social, NIT, ciudades (o la palabra Nacional) y presupuesto.',
      }),
      area,
      crear('div', { clase: 'fila-botones' }, [

      ]),

}

function dibujar(alCambiar) {

  var bloque = crear('div', { clase: 'pregunta', 'data-campo': 'tiendas' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.pregunta }),

  bloque.appendChild(bloqueDePegar(alCambiar));

}

(function () {
'use strict';

/**
 * La lista de productos participantes de la Carrera de Compras.
 *
 * Era un campo de texto libre ("Productos separados por comas") y es uno de los
 * pocos que quedaban. Dos productos que se llaman parecido dejaban el documento
 * sin decir cual suma al concurso: el EAN lo decide sin discusion. Juan lo
 * cerro el 20 de septiembre de 2026 (punto D4).
 *
 * Mismo patron que la lista de tiendas del Multitienda, con dos diferencias:
 * cada fila tiene dos campos en vez de seis, y el EAN se revisa entero, con su
 * digito de control, para que un numero mal copiado del empaque no salga
 * impreso.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;

function productos() {
  if (!estado.entrada().productosDetalle) estado.fijar('productosDetalle', []);
  return estado.entrada().productosDetalle;
}

function productoVacio() {
  return { nombre: '', ean: '' };
}

/** Revisa una fila y devuelve los problemas, campo por campo. */
function revisarProducto(producto, indice, todos) {
  var problemas = {};
  var textos = estado.pregunta('productosDetalle');

  if (!producto.nombre) problemas.nombre = 'Falta el nombre de este producto.';

  if (!producto.ean) {
    problemas.ean = 'Falta el EAN de este producto.';
    return problemas;
  }

  var revision = validarEan(producto.ean);
  if (!revision.valido) {
    problemas.ean = revision.mensaje;
    return problemas;
  }

  // El mismo EAN dos veces es el mismo producto contado dos veces.
  for (var i = 0; i < todos.length; i++) {
    if (i === indice || !todos[i].ean) continue;
    var otro = validarEan(todos[i].ean);
    if (otro.valido && otro.formateado === revision.formateado) {
      problemas.ean = textos.errores.repetido;
      break;
    }
  }
  return problemas;
}

function filaDeProducto(producto, indice, alCambiar) {
  var textos = estado.pregunta('productosDetalle').camposPorProducto;
  var problemas = revisarProducto(producto, indice, productos());

  var fila = crear('div', { clase: 'ficha-seccion', 'data-producto': String(indice) }, [
    crear('div', { clase: 'ficha-encabezado' }, [
      crear('h3', { texto: 'Producto ' + (indice + 1) + (producto.nombre ? ': ' + producto.nombre : '') }),
      crear('button', {
        clase: 'boton-texto', type: 'button', texto: estado.T('Quitar'),
        onclick: function () {
          var lista = productos().slice();
          lista.splice(indice, 1);
          estado.fijar('productosDetalle', lista);
          alCambiar();
        },
      }),
    ]),
  ]);

  function campoTexto(llave) {
    var control = crear('input', {
      type: 'text',
      value: producto[llave] || '',
      placeholder: textos[llave].ejemplo || '',
      'aria-label': textos[llave].pregunta + ' del producto ' + (indice + 1),
    });
    control.addEventListener('input', function () {
      var lista = productos().slice();
      lista[indice][llave] = control.value;
      estado.fijar('productosDetalle', lista);
      RM.flujo.refrescarDocumento();
    });
    control.addEventListener('blur', alCambiar);

    return crear('label', { clase: 'campo' }, [
      crear('p', { clase: 'pregunta-ayuda', texto: textos[llave].pregunta + '. ' + textos[llave].ayuda }),
      crear('div', { clase: 'campo-caja' }, [control]),
      problemas[llave] ? crear('p', { clase: 'mensaje-error', texto: problemas[llave] }) : null,
    ]);
  }

  fila.appendChild(campoTexto('nombre'));
  fila.appendChild(campoTexto('ean'));
  return fila;
}

/** Pegar desde Excel: una fila por producto, nombre y EAN. */
function bloqueDePegar(alCambiar) {
  var area = crear('textarea', {
    rows: '4',
    placeholder: 'Galletas Lunaria clásicas\t7702001008285',
    'aria-label': 'Pegar productos desde una hoja de cálculo',
  });
  var resultado = crear('div', {});

  function procesar() {
    var lineas = area.value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (lineas.length === 0) return;

    var nuevos = [];
    var rechazadas = [];
    for (var i = 0; i < lineas.length; i++) {
      var celdas = lineas[i].split(/\t|;/).map(function (c) { return c.trim(); });
      if (celdas.length === 1) celdas = lineas[i].split(/\s{2,}/).map(function (c) { return c.trim(); });
      if (celdas.length < 2) { rechazadas.push('Fila ' + (i + 1) + ': necesita el nombre y el EAN.'); continue; }
      var producto = productoVacio();

      texto: nuevos.length + (nuevos.length === 1 ? ' producto agregado.' : ' productos agregados.') +
        ' Revisa que cada uno haya quedado bien.',
    }));
    for (var r = 0; r < rechazadas.length; r++) {
      resultado.appendChild(crear('p', { clase: 'mensaje-error', texto: rechazadas[r] }));
    }
    alCambiar();
  }

  return crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: estado.T('Pegar desde una hoja de cálculo') }),
    crear('p', { clase: 'pregunta-ayuda', texto: 'Una fila por producto: el nombre y el EAN, separados por tabulación.' }),
    area,
    crear('div', { clase: 'fila-botones' }, [
      crear('button', { clase: 'boton boton-secundario', type: 'button', texto: estado.T('Agregar los pegados'), onclick: procesar }),
    ]),

}

function dibujar(alCambiar) {
  var pregunta = estado.pregunta('productosDetalle');
  var lista = productos();

  var bloque = crear('div', { clase: 'pregunta' }, [

  }

    bloque.appendChild(filaDeProducto(lista[i], i, alCambiar));
  }

  bloque.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Agregar producto'),

        alCambiar();
      },
    }),

  bloque.appendChild(bloqueDePegar(alCambiar));

  bloque.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: estado.T('¿Por qué te preguntamos esto?') }),
    crear('p', { texto: pregunta.porQue }),
  ]));
  return bloque;
}

RM.productos = {
  dibujar: dibujar,
};

(function () {
'use strict';

/**
 * El resumen antes de generar, y la pantalla final.
 *
 * El boton "Generar T&C" esta deshabilitado, y se ve deshabilitado, hasta que
 * no falte nada. Debajo, la lista "Te falta" dice exactamente que.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;
var flujo = RM.flujo;

// Los pasos de Squarespace viven en src/core/ayuda.js, para que la pantalla
// final y la de Ayuda digan exactamente lo mismo.

function seccionesDelResumen() {
  var entrada = estado.entrada();
  var pasos = flujo.pasosDelTipo(entrada);
  var secciones = [];

  for (var i = 0; i < pasos.length; i++) {
    var campos = flujo.camposDelPaso(entrada, pasos[i].id);
    var filas = [];
    for (var c = 0; c < campos.length; c++) {
      var campo = campos[c];
      if (campo.id === 'declaracion') continue;
      var pregunta = estado.pregunta(campo.id);
      filas.push({ campo: campo, etiqueta: pregunta.pregunta, valor: RM.pasos.comoTexto(campo) });
    }
    if (filas.length > 0) secciones.push({ paso: pasos[i], indice: i, filas: filas });
  }
  return secciones;
}

/** Lo que falta, en palabras del comercial. */
function loQueFalta() {
  var pais = flujo.paisElegido();
  if (!pais) return [estado.T('Elige el país de la campaña.')];

  var revision = validarSolicitud(estado.entrada(), pais, {
    fechaReferencia: E.configuracion.hoy || RM.util.hoyEnElNavegador(),
    usuarioEnEquipo: puedeVerPiloto(E.configuracion.rol),
    idioma: estado.idiomaInterfaz(),
  });
  return revision.errores.map(function (error) { return error.mensaje; });
}

function pantallaResumen(raiz) {
  var faltantes = loQueFalta();
  var completo = faltantes.length === 0;

  var columna = crear('div', { clase: 'columna-preguntas' }, [
    crear('h1', { texto: estado.T('Revisa antes de generar') }),

  ]);

  // El aviso se repite aqui a proposito: entre elegir el pais y llegar al
  // resumen pasan quince preguntas, y este es el momento en que de verdad se
  // decide publicar.
  var pais = flujo.paisElegido();
  if (paisEnPruebas(pais)) {
    // OJO: esta lista no se puede llamar `faltantes`. Se llamo asi, y como var
    // es de toda la funcion, pisaba la lista de arriba: en un pais en pruebas
    // "Te falta:" mostraba los datos legales por confirmar del pais en vez de
    // lo que le faltaba al comercial, que era marcar la casilla.
    var porConfirmar = datosPorConfirmar(pais);
    var aviso = crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: estado.nombreDePais(pais.nombre) + estado.T(' está en pruebas: no publiques este documento todavía') }),

      }),
    ]);
    if (porConfirmar.length > 0) {
      var listaPorConfirmar = crear('ul');
      for (var f = 0; f < porConfirmar.length; f++) listaPorConfirmar.appendChild(crear('li', { texto: porConfirmar[f] }));
      aviso.appendChild(listaPorConfirmar);
    }
    columna.appendChild(aviso);
  }

  var ficha = crear('div', { clase: 'ficha' });
  var secciones = seccionesDelResumen();

  for (var s = 0; s < secciones.length; s++) {
    (function (seccion) {
      var lista = crear('dl');

            clase: 'boton-texto', type: 'button', texto: estado.T('Cambiar'),
            onclick: function () {
              E.pasoActual = seccion.indice;
              E.campoAbierto = seccion.filas[0].campo.id;
              RM.app.ir('pasos');
            },
          }),
        ]),
        lista,
      ]));
    })(secciones[s]);
  }
  columna.appendChild(ficha);

  // Declaración.
  var declaracion = crear('input', { type: 'checkbox', id: 'declaracion', checked: !!estado.entrada().declaracion });
  declaracion.addEventListener('change', function () {
    estado.fijar('declaracion', declaracion.checked);
    RM.app.dibujar();
  });
  columna.appendChild(crear('div', { clase: 'pregunta' }, [
    crear('label', { clase: 'casilla' }, [
      declaracion,
      crear('span', {}, [
        document.createTextNode(estado.pregunta('declaracion').ayuda),
        crear('small', { texto: estado.pregunta('declaracion').porQue }),
      ]),
    ]),
  ]));

  if (!completo) {
    var listaFalta = crear('ul', { clase: 'te-falta' });
    for (var i = 0; i < faltantes.length; i++) listaFalta.appendChild(crear('li', { texto: faltantes[i] }));
    columna.appendChild(crear('div', {}, [
      crear('h3', { texto: estado.T('Te falta:') }),
      listaFalta,
    ]));
  }

  var boton = crear('button', {
    clase: 'boton', type: 'button', texto: estado.T('Generar T&C'),
    disabled: !completo,
    onclick: function () { generar(boton); },
  });

  columna.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Atrás'),
      onclick: function () { RM.app.ir('pasos'); },
    }),
    boton,
  ]));

  raiz.appendChild(crear('div', { clase: 'pagina' }, [
    crear('div', { clase: 'dos-columnas' }, [columna, RM.pasos.columnaDocumento()]),
  ]));
  RM.app.agregarHojaDeCelular(raiz);
  flujo.refrescarDocumento();
}

function generar(boton) {
  boton.disabled = true;
  boton.textContent = estado.T('Generando...');
  RM.util.anunciar(estado.T('Generando el documento.'));

  RM.servidor.llamar('generar', estado.entrada()).then(function (resultado) {
    if (!resultado.valido) {
      boton.disabled = false;
      boton.textContent = estado.T('Generar T&C');
      RM.app.mostrarError(resultado.errores.map(function (e) { return e.mensaje; }).join(' '));
      return;
    }
    E.resultado = resultado;
    estado.borrarBorrador();
    RM.app.ir('listo');
  }).catch(function (error) {
    boton.disabled = false;
    boton.textContent = estado.T('Generar T&C');
    RM.app.mostrarError('No pudimos generar el documento: ' + error.message);
  });
}

/**
 * Quien puede publicar en Squarespace. No es todo el mundo: la cuenta la tienen
 * unas pocas personas por pais. Si el comercial no es una de ellas, el paso de
 * publicar no es suyo y tiene que pedirlo por el canal.
 */
function bloqueDeQuienPublica(codigoDePais, tipo, resultado) {
  var accesos = ACCESOS_SQUARESPACE[codigoDePais];
  var caja = crear('div', { clase: 'aviso' }, [crear('h3', { texto: estado.T('¿Quién puede publicar?') })]);

  var esConcurso = tipo === 'carrera_compras';
  var personas = accesos ? (esConcurso ? accesos.concursos : accesos.cashback) || [] : [];

  if (personas.length > 0) {
    caja.appendChild(crear('p', { texto: 'En tu país tienen usuario de Squarespace:' }));
    var lista = crear('ul');
    for (var i = 0; i < personas.length; i++) {
      lista.appendChild(crear('li', { texto: personas[i].nombre + ' · ' + personas[i].correo }));
    }
    caja.appendChild(lista);
    caja.appendChild(crear('p', {
      texto: 'Si no eres una de estas personas, pásales el documento, el título y la dirección que te dio RappiMind.',
    }));
  } else if (accesos && esConcurso && accesos.notaConcursos) {
    caja.appendChild(crear('p', { texto: accesos.notaConcursos }));
  } else {
    caja.appendChild(crear('p', {
      texto: 'Todavía no tenemos la lista de tu país. Pide la publicación en #tyc-rappi.',
    }));
  }

  caja.appendChild(crear('p', {}, [
    document.createTextNode(CANAL_TC.para + ' '),
    crear('a', { href: CANAL_TC.url, target: '_blank', rel: 'noopener', texto: CANAL_TC.nombre }),
  ]));

  // En la Ayuda no hay resultado del que sacar el mensaje: ahi el bloque es
  // solo la lista de quien puede publicar.
  if (resultado) caja.appendChild(botonDelMensaje(resultado));
  return caja;
}

/**
 * El mensaje para quien si tiene usuario de Squarespace.
 *
 * Para casi todos los comerciales el camino real es pasarselo a otra persona, y
 * hasta el 20 de septiembre de 2026 eso quedaba escrito debajo de diez pasos
 * que no iban a seguir. El mensaje lleva las tres cosas que el que publica
 * necesita, y ni una mas: el documento, el titulo y la direccion.
 */
function mensajeParaQuienPublica(resultado) {
  var entrada = estado.entrada();
  var pais = flujo.paisElegido();
  var lineas = [
    estado.T('Hola: ¿me ayudas a publicar estos T&C en Squarespace?'),
    '',
  ];

  if (resultado.linkDoc) {
    lineas.push(estado.T('Documento: {enlace}').replace('{enlace}', resultado.linkDoc));
  }
  lineas.push(estado.T('Título del evento: {titulo}').replace('{titulo}', resultado.nombreCampana || ''));
  lineas.push(estado.T('Dirección del evento: {direccion}').replace('{direccion}', resultado.direccionSugerida || ''));
  if (entrada.fechaInicio && entrada.fechaFin) {
    lineas.push(estado.T('Fechas del evento: del {inicio} al {fin}')
      .replace('{inicio}', formatearFechaDelPais(entrada.fechaInicio, pais))
      .replace('{fin}', formatearFechaDelPais(entrada.fechaFin, pais)));
  }
  lineas.push('');
  lineas.push(estado.T('El título y la dirección van tal cual, sin cambiarles nada.'));
  return lineas.join('\n');
}

/** El boton que arma ese mensaje y lo deja listo para copiar. */
function botonDelMensaje(resultado) {
  var caja = crear('div', {});
  var boton = crear('button', {
    clase: 'boton boton-secundario', type: 'button',
    texto: estado.T('Armar el mensaje para pasárselo'),
    onclick: function () {
      RM.util.vaciar(caja);
      caja.appendChild(RM.util.paraCopiar(
        estado.T('Mensaje'),
        mensajeParaQuienPublica(resultado),
        estado.T('Pégalo en el chat o en el correo. Ya lleva el documento, el título y la dirección.')
      ));
    },
  });
  caja.appendChild(boton);
  return caja;
}

/**
 * Todo lo que el comercial necesita para publicar: que pegar, donde y quien
 * puede hacerlo. Se usa igual en la demostracion y en produccion.
 *
 * El orden importa y cambio el 20 de septiembre de 2026 (punto F8). Antes
 * arrancaba con los diez pasos de Squarespace y la lista de quien puede
 * publicar quedaba debajo de todos ellos; para casi todos los comerciales el
 * camino real es pasarselo a otra persona, asi que eso va primero y los diez
 * pasos quedan plegados para quien si tiene usuario.
 */
function bloqueDePublicacion(resultado) {
  var contenido = crear('div', {});
  var entrada = estado.entrada();

  contenido.appendChild(bloqueDeQuienPublica(resultado.pais || entrada.pais, entrada.tipo, resultado));

  // Lo que hay que pegar en Squarespace, listo para copiar. El titulo y la
  // direccion salen de las respuestas: escribirlos a mano es como el titulo
  // termino diciendo 99% cuando la clausula decia 50%.
  contenido.appendChild(crear('h2', { texto: estado.T('Lo que vas a pegar en Squarespace') }));

  contenido.appendChild(RM.util.paraCopiar(
    estado.T('Título del evento'),
    resultado.nombreCampana || '',
    estado.T('Va tal cual en el título del evento. No lo cambies: es el mismo nombre que quedó en el documento.')
  ));

  var pais = flujo.paisElegido();
  var rutaDelPais = (pais && pais.nombre ? pais.nombre : '').toLowerCase();
  contenido.appendChild(RM.util.paraCopiar(
    estado.T('Dirección del evento'),
    resultado.direccionSugerida || '',
    'Va en la pestaña Opciones, en "URL del evento". La parte de ' + rutaDelPais + ' la pone Squarespace sola: reemplaza solo lo que va después.'
  ));

  if (entrada.fechaInicio && entrada.fechaFin) {
    contenido.appendChild(crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: estado.T('Las fechas del evento') }),
      crear('p', {
        texto: estado.T('Inicio: {inicio}. Fin: {fin}. Tienen que ser iguales a la vigencia del documento.')
          .replace('{inicio}', formatearFechaDelPais(entrada.fechaInicio, pais))
          .replace('{fin}', formatearFechaDelPais(entrada.fechaFin, pais)),
      }),
    ]));
  }

  var pasos = crear('ol', { clase: 'pasos-publicar' });
  for (var i = 0; i < PASOS_SQUARESPACE.length; i++) {
    pasos.appendChild(crear('li', {}, [
      crear('p', { texto: PASOS_SQUARESPACE[i].hace }),
      crear('p', { clase: 'pregunta-ayuda', texto: 'Deberías ver: ' + PASOS_SQUARESPACE[i].ve }),
    ]));
  }
  contenido.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: estado.T('Si tienes usuario de Squarespace') }),
    pasos,
  ]));

  return contenido;
}

/**
 * Las leyendas de las piezas publicitarias, una por formato.
 *
 * Es lo ultimo que se construyo del encargo 03 y lo unico que el comercial ve
 * de todo aquello. Hasta ahora este texto se lo pedia a Legal por correo; aqui
 * sale con el documento, ya lleno con los mismos datos, para que la pieza y el
 * T&C no se puedan contradecir.
 *
 * No se pregunta en que pieza va: se entregan las cuatro y el comercial copia la
 * que necesite (seccion 7B.4 de la respuesta).
 */
function bloqueDeLeyendas(leyendas) {
  if (!leyendas) return null;

  var caja = crear('div', { clase: 'pagina-seccion' }, [
    crear('h2', { texto: estado.T('El texto legal de tus piezas') }),
  ]);

  // Un pais sin leyenda aprobada, o una campana con algo que Legal no ha
  // definido. Se dice cual es el caso, como en la pantalla de Legal: un aviso
  // sin razon concreta no le sirve a nadie.
  if (!leyendas.hay) {
    var razones = (leyendas.faltantes || []).slice();
    var aviso = crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: estado.T('Para esta campaña todavía no tenemos leyenda') }),
      crear('p', {
        texto: razones.length > 0
          ? estado.T('Nos falta que Legal defina esto, y sin eso la pieza saldría incompleta:')
          : estado.T('Todavía no hay leyenda aprobada para las piezas de este país. Escríbele a Legal de tu país con el enlace de tu T&C.'),
      }),
    ]);
    if (razones.length > 0) {
      var lista = crear('ul');
      for (var r = 0; r < razones.length; r++) lista.appendChild(crear('li', { texto: razones[r] }));
      aviso.appendChild(lista);
      aviso.appendChild(crear('p', { texto: estado.T('Escríbele a Legal con el enlace de tu T&C y te la damos.') }));
    }
    caja.appendChild(aviso);
    return caja;
  }

  // El estado del enlace. Mientras no este confirmado, la leyenda esta completa
  // pero el enlace todavia no existe: publicar la pieza antes que el T&C es el
  // unico riesgo que queda del camino 4.
  if (leyendas.enlaceCambio) {
    caja.appendChild(crear('div', { clase: 'aviso aviso-serio' }, [
      crear('h3', { texto: estado.T('La leyenda cambió. Cambia el arte antes de publicarlo.') }),
      crear('p', { texto: estado.T('El enlace que publicaste no es el que habíamos previsto, así que rehicimos las leyendas con el enlace real.') }),
    ]));
  } else if (leyendas.enlaceConfirmado) {
    caja.appendChild(crear('p', { clase: 'mensaje-ok', texto: estado.T('Enlace confirmado: estas leyendas ya llevan la dirección publicada.') }));
  } else {
    caja.appendChild(crear('p', {
      clase: 'pregunta-ayuda',
      texto: estado.T('Enlace por confirmar. Cuando publiques la página y pegues el enlace aquí abajo, comparamos y te avisamos si la leyenda cambia.'),
    }));
  }

  for (var i = 0; i < leyendas.leyendas.length; i++) {
    (function (leyenda) {
      var ayuda = leyenda.largo + ' de ' + leyenda.largo_max + ' caracteres.';
      // Decir "recortada para que quepa" encima de un aviso de que no cabe es
      // decir dos cosas distintas en la misma pantalla.
      if (leyenda.recortada) {
        ayuda += ' ' + (leyenda.cabe
          ? estado.T('Recortada para que quepa.')
          : estado.T('Recortada hasta el mínimo, y aun así se pasa.'));
      }
      caja.appendChild(RM.util.paraCopiar(estado.T(leyenda.nombre), leyenda.texto, ayuda));

      // La push y el SMS van sin enlace desde el 20 de septiembre de 2026
      // (punto C2): se comía 35 de los 70 caracteres del formato y la leyenda
      // no cabía nunca. Hay que decir por qué no está, o alguien lo pega a mano.
      if (leyenda.formato === 'push_sms') {
        caja.appendChild(crear('p', {
          clase: 'pregunta-ayuda',
          texto: estado.T('El push o el SMS tiene que llevar al usuario a la campaña dentro de la app, donde está el enlace a los T&C.'),
        }));
      }

      if (!leyenda.cabe) {
        // Con los números, no solo con el "no cabe": cuánto se pasa y cuánto de
        // eso se lo están comiendo los enlaces, que suelen ser la mitad.
        var porCuanto = estado.T('Se pasa por {n} caracteres.').replace('{n}', leyenda.sobra);
        if (leyenda.enlaces > 0) {
          porCuanto += ' ' + estado.T('Los enlaces ocupan {n} de los {total}.')
            .replace('{n}', leyenda.caracteresEnEnlaces).replace('{total}', leyenda.largo);
        }
        // Y qué hacer. Juan decidió el 20 de septiembre (punto C1) no subir
        // ningún límite ni marcar nada como recortable: lo que no cabe es justo
        // lo que la ley exige, así que lo que cambia es el formato, no el texto.
        caja.appendChild(crear('div', { clase: 'aviso aviso-serio' }, [
          crear('p', { texto: porCuanto }),
          crear('p', {
            texto: estado.T('Esta leyenda no cabe en este formato. Usa letra pequeña o un formato más grande; en exterior, agrega el código QR al mismo enlace.'),
          }),
        ]));
      }
    })(leyendas.leyendas[i]);
  }

  /*
   * Lo que la pieza tiene que llevar y la leyenda no puede decir.
   *
   * El ícono +18 es una imagen y el titular lo escribe el diseñador: la
   * herramienta no los puede imprimir, así que los dice. Juan cerró las tres el
   * 20 de septiembre de 2026 (punto C5, preguntas 7, 18 y 22).
   */
  var reglas = leyendas.reglasDelArte || [];
  if (reglas.length > 0) {
    var cajaDeReglas = crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: estado.T('Además, en el arte') }),
    ]);
    var listaDeReglas = crear('ul');
    for (var g = 0; g < reglas.length; g++) listaDeReglas.appendChild(crear('li', { texto: reglas[g] }));
    cajaDeReglas.appendChild(listaDeReglas);
    caja.appendChild(cajaDeReglas);
  }

  // Los formatos que esperan una decision, con su razon. No son un error: la
  // push necesita el enlace corto, que todavia no existe.
  for (var p = 0; p < (leyendas.pendientes || []).length; p++) {
    (function (pendiente) {
      caja.appendChild(crear('div', { clase: 'aviso' }, [
        crear('h3', { texto: estado.T(pendiente.nombre) + estado.T(': todavía no') }),
        crear('p', { texto: pendiente.razones.join('. ') + '.' }),
      ]));
    })(leyendas.pendientes[p]);
  }

  return caja;
}

/**
 * El recordatorio del acuerdo de transferencia de datos en la pantalla final.
 *
 * La respuesta del encargo 01 pide que el aviso se repita aqui, y tiene razon:
 * entre el formulario y la entrega del premio pasan semanas, y para entonces el
 * comercial ya no se acuerda de que dijo "no se". Sin el acuerdo firmado, el dia
 * de la entrega ni Producto ni Data le pueden dar los datos del ganador.
 */
function avisoDeAcuerdoDeDatos() {
  if (estado.entrada().acuerdoDatos !== 'no_o_no_se') return null;

  var pais = flujo.paisElegido();
  var caja = crear('div', { clase: 'aviso' }, [
    crear('h3', { texto: estado.T('Te falta el acuerdo de transferencia de datos') }),
    crear('p', {
      texto: estado.T('Tu T&C ya está, pero sin ese acuerdo firmado no te van a poder entregar los datos del ganador el día de la entrega. Arranca el trámite ahora, que toma tiempo.'),
    }),
  ]);

  // El boton y su linea los arma RM.pasos, para que el texto viva en un solo
  // sitio: aqui y en la pregunta se ve exactamente lo mismo.
  var boton = RM.pasos.botonDelModeloDeAcuerdo(pais);
  if (boton) caja.appendChild(boton);
  return caja;
}

/**
 * Agrega un bloque solo si existe.
 *
 * appendChild(null) lanza una excepcion, y como esto corre a mitad de pintar la
 * pantalla final, lo que ve el comercial es "No pudimos generar el documento"
 * sobre un documento que si se genero. Paso con el aviso del acuerdo de datos,
 * que solo sale en Carrera: en un cashback devolvia null y tumbaba la pantalla.
 */
function agregarSiHay(destino, bloque) {
  if (bloque) destino.appendChild(bloque);
}

// --- Pantalla final ----------------------------------------------------------

function pantallaListo(raiz) {
  var resultado = E.resultado || {};
  var contenido = crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('h1', { texto: estado.T('Tu T&C está listo') }),
    // En un pais en pruebas el aviso de "no publiques" tiene que estar en la
    // pantalla que explica como publicar, no solo en las de antes.
    RM.pasos.avisoDePaisEnPruebas(),
  ]);

  if (resultado.demostracion) {
    contenido.appendChild(crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: estado.T('Modo demostración') }),
      crear('p', { texto: estado.T('No se creó ningún documento ni se envió ningún correo. Este es el texto que habría salido.') }),
    ]));
    var hoja = crear('div', { clase: 'hoja' });
    RM.documento.dibujar(hoja, resultado.texto, '');
    contenido.appendChild(hoja);
    contenido.appendChild(bloqueDePublicacion(resultado));
    agregarSiHay(contenido, avisoDeAcuerdoDeDatos());
    agregarSiHay(contenido, bloqueDeLeyendas(resultado.leyendas));
    contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
      crear('button', {
        clase: 'boton boton-secundario', type: 'button', texto: estado.T('Hacer otra campaña'),
        onclick: function () { estado.reiniciarFormulario({}); RM.app.ir('inicio'); },
      }),
    ]));
    raiz.appendChild(contenido);
    return;
  }

  contenido.appendChild(crear('p', {
    clase: 'pregunta-ayuda',
    texto: 'Te mandamos el documento por correo. Solicitud ' + (resultado.id || '') + '.',
  }));

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
    resultado.linkDoc
      ? crear('a', { clase: 'boton', href: resultado.linkDoc, target: '_blank', rel: 'noopener' }, [
          document.createTextNode(estado.T('Abrir el documento')), RM.util.icono('abrir', 16),
        ])
      : null,
  ]));

  contenido.appendChild(bloqueDePublicacion(resultado));
  agregarSiHay(contenido, avisoDeAcuerdoDeDatos());

  // Las leyendas van aqui, entre como publicar y el campo del enlace: el
  // comercial las copia en el mismo momento en que se lleva el documento, y
  // justo debajo esta el campo que las confirma.
  var cajaDeLeyendas = bloqueDeLeyendas(resultado.leyendas);
  agregarSiHay(contenido, cajaDeLeyendas);

  // Link publicado.
  contenido.appendChild(crear('h2', { texto: estado.T('Cuando ya esté publicado') }));
  var campo = crear('input', {
    type: 'text', id: 'link-publicado',
    placeholder: 'https://promos.rappi.com/',
    'aria-label': 'Enlace de la página publicada',
  });
  var mensaje = crear('p', { clase: 'pregunta-ayuda', texto: 'Pega el enlace de la página que publicaste.' });

  var guardar = crear('button', {
    clase: 'boton', type: 'button', texto: 'Marcar como publicado',
    onclick: function () {
      var revision = validarLinkPublicado(campo.value);
      if (!revision.valido) {
        mensaje.className = 'mensaje-error';
        mensaje.textContent = revision.mensaje;
        campo.focus();
        return;
      }
      guardar.disabled = true;
      guardar.textContent = 'Guardando...';
      RM.servidor.llamar('marcarPublicado', resultado.id, revision.url).then(function (respuesta) {
        guardar.disabled = false;
        guardar.textContent = 'Marcar como publicado';
        if (!respuesta.valido) {
          mensaje.className = 'mensaje-error';
          mensaje.textContent = respuesta.errores[0].mensaje;
          return;
        }
        mensaje.className = 'mensaje-ok';
        mensaje.textContent = 'Listo: tu campaña quedó marcada como publicada.';
        campo.disabled = true;
        guardar.disabled = true;

        // Paso 3 del camino 4: con el enlace real, las leyendas se rehacen y
        // el bloque se cambia entero. Si el enlace resulto distinto, el aviso
        // rojo aparece ahi mismo, no en un correo que nadie abre.
        if (respuesta.leyendas && cajaDeLeyendas && cajaDeLeyendas.parentNode) {
          var rehecho = bloqueDeLeyendas(respuesta.leyendas);
          if (rehecho) {
            cajaDeLeyendas.parentNode.replaceChild(rehecho, cajaDeLeyendas);
            cajaDeLeyendas = rehecho;
            rehecho.scrollIntoView({ block: 'nearest' });
          }
        }
      }).catch(function (error) {
        guardar.disabled = false;
        guardar.textContent = 'Marcar como publicado';
        mensaje.className = 'mensaje-error';
        mensaje.textContent = 'No pudimos guardarlo: ' + error.message;
      });
    },
  });

  contenido.appendChild(crear('div', { clase: 'pregunta' }, [
    crear('div', { clase: 'campo-caja' }, [campo]),
    mensaje,
    crear('div', { clase: 'fila-botones' }, [guardar]),
  ]));

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Hacer otra campaña'),
      onclick: function () { estado.reiniciarFormulario({}); RM.app.ir('inicio'); },
    }),
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Ver mis campañas'),
      onclick: function () { RM.app.ir('historial'); },
    }),
  ]));

  raiz.appendChild(contenido);
}

RM.resumen = {
  pantallaResumen: pantallaResumen,
  pantallaListo: pantallaListo,
  loQueFalta: loQueFalta,
};

})();

(function () {
'use strict';

/**
 * La lista de beneficios cuando el beneficio cambia segun el producto.
 *
 * Hasta el 21 de septiembre de 2026 esto no existia y el filtro de Rappi Travel
 * mandaba a Legal toda campana cuyo porcentaje cambiara segun el destino o el
 * producto. Dos de las cinco piezas publicadas que trajo Juan eran exactamente
 * ese caso: la del Caribe Mexicano trae veintitres hoteles, cada uno con su
 * porcentaje y con sus propias fechas de venta y de viaje.
 *
 * Mismo patron que la lista de productos del concurso, con una diferencia: dos
 * de los cuatro campos de cada fila son opcionales, porque no todos los
 * productos tienen fechas propias distintas de la vigencia de la campana.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;

var CAMPOS_DE_LA_FILA = ['nombre', 'porcentaje', 'hastaCompra', 'hastaViaje'];
var OPCIONALES = ['hastaCompra', 'hastaViaje'];

function beneficios() {
  if (!estado.entrada().beneficiosPorProducto) estado.fijar('beneficiosPorProducto', []);
  return estado.entrada().beneficiosPorProducto;
}

function beneficioVacio() {
  return { nombre: '', porcentaje: '', hastaCompra: '', hastaViaje: '' };
}

/** Revisa una fila y devuelve los problemas, campo por campo. */
function revisarBeneficio(fila, indice, todos) {
  var problemas = {};
  var textos = estado.pregunta('beneficiosPorProducto');

  if (!String(fila.nombre || '').trim()) problemas.nombre = 'Falta el nombre de este producto.';

  var porcentaje = Number(fila.porcentaje);
  if (!String(fila.porcentaje || '').trim()) {
    problemas.porcentaje = 'Falta el porcentaje de este producto.';
  } else if (!porcentaje || porcentaje < 1 || porcentaje > 100) {
    problemas.porcentaje = textos.errores.rango;
  }

  // El mismo producto dos veces deja el documento prometiendo dos beneficios
  // distintos para lo mismo, y el usuario va a exigir el mas alto.
  var nombre = String(fila.nombre || '').trim().toLowerCase();
  for (var i = 0; i < todos.length; i++) {
    if (i === indice || !nombre) continue;
    if (String(todos[i].nombre || '').trim().toLowerCase() === nombre) {
      problemas.nombre = textos.errores.repetida;
      break;
    }
  }
  return problemas;
}

function filaDeBeneficio(fila, indice, alCambiar) {
  var textos = estado.pregunta('beneficiosPorProducto').camposPorProducto;
  var problemas = revisarBeneficio(fila, indice, beneficios());

  var marco = crear('div', { clase: 'ficha-seccion', 'data-beneficio': String(indice) }, [
    crear('div', { clase: 'ficha-encabezado' }, [
      crear('h3', { texto: 'Producto ' + (indice + 1) + (fila.nombre ? ': ' + fila.nombre : '') }),
      crear('button', {
        clase: 'boton-texto', type: 'button', texto: estado.T('Quitar'),
        onclick: function () {
          var lista = beneficios().slice();
          lista.splice(indice, 1);
          estado.fijar('beneficiosPorProducto', lista);
          alCambiar();
        },
      }),
    ]),
  ]);

  function campo(llave) {
    var esFecha = llave === 'hastaCompra' || llave === 'hastaViaje';
    var control = crear('input', {
      type: esFecha ? 'date' : 'text',
      value: fila[llave] || '',
      placeholder: esFecha ? '' : (textos[llave].ejemplo || ''),
      'aria-label': textos[llave].pregunta + ' del producto ' + (indice + 1),
    });
    if (llave === 'porcentaje') control.setAttribute('inputmode', 'numeric');

    control.addEventListener('input', function () {
      var lista = beneficios().slice();
      // Los numeros se filtran al escribir, como en los demas campos de cifra:
      // una letra dentro del porcentaje sale impresa en el documento.
      lista[indice][llave] = llave === 'porcentaje'
        ? control.value.replace(/[^0-9]/g, '')
        : control.value;
      if (llave === 'porcentaje') control.value = lista[indice][llave];
      estado.fijar('beneficiosPorProducto', lista);
      RM.flujo.refrescarDocumento();
    });
    control.addEventListener('blur', alCambiar);

    var ayuda = textos[llave].pregunta + '. ' + textos[llave].ayuda;
    return crear('label', { clase: 'campo' }, [
      crear('p', { clase: 'pregunta-ayuda', texto: ayuda }),
      crear('div', { clase: 'campo-caja' }, [control]),
      problemas[llave] ? crear('p', { clase: 'mensaje-error', texto: problemas[llave] }) : null,
    ]);
  }

  for (var i = 0; i < CAMPOS_DE_LA_FILA.length; i++) marco.appendChild(campo(CAMPOS_DE_LA_FILA[i]));
  return marco;
}

/** Pegar desde Excel: una fila por producto, con hasta cuatro columnas. */
function bloqueDePegar(alCambiar) {
  var area = crear('textarea', {
    rows: '4',
    placeholder: 'Hard Rock Hotel Los Cabos\t55\t2026-12-18\t2026-12-18',
    'aria-label': 'Pegar los beneficios desde una hoja de cálculo',
  });
  var resultado = crear('div', {});

  function procesar() {
    var lineas = area.value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (lineas.length === 0) return;

    var nuevos = [];
    var rechazadas = [];
    for (var i = 0; i < lineas.length; i++) {
      var celdas = lineas[i].split(/\t|;/).map(function (c) { return c.trim(); });
      if (celdas.length === 1) celdas = lineas[i].split(/\s{2,}/).map(function (c) { return c.trim(); });
      if (celdas.length < 2) { rechazadas.push('Fila ' + (i + 1) + ': necesita el nombre y el porcentaje.'); continue; }
      var fila = beneficioVacio();
      fila.nombre = celdas[0] || '';
      // El porcentaje puede venir pegado como "55%" o como "55 %".
      fila.porcentaje = String(celdas[1] || '').replace(/[^0-9]/g, '');
      fila.hastaCompra = celdas[2] || '';
      fila.hastaViaje = celdas[3] || '';
      nuevos.push(fila);
    }

    var lista = beneficios().slice().filter(function (b) { return b.nombre || b.porcentaje; });
    estado.fijar('beneficiosPorProducto', lista.concat(nuevos));
    area.value = '';

    RM.util.vaciar(resultado);
    resultado.appendChild(crear('p', {
      clase: 'mensaje-ok',
      texto: nuevos.length + (nuevos.length === 1 ? ' producto agregado.' : ' productos agregados.') +
        ' Revisa que cada uno haya quedado bien.',
    }));
    for (var r = 0; r < rechazadas.length; r++) {
      resultado.appendChild(crear('p', { clase: 'mensaje-error', texto: rechazadas[r] }));
    }
    alCambiar();
  }

  return crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: estado.T('Pegar desde una hoja de cálculo') }),
    crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'Una fila por producto, separadas por tabulación: el nombre, el porcentaje y, si las tiene, ' +
        'la última fecha de compra y la última de viaje en formato aaaa-mm-dd.',
    }),
    area,
    crear('div', { clase: 'fila-botones' }, [
      crear('button', { clase: 'boton boton-secundario', type: 'button', texto: estado.T('Agregar los pegados'), onclick: procesar }),
    ]),
    resultado,
  ]);
}

function dibujar(alCambiar) {
  var pregunta = estado.pregunta('beneficiosPorProducto');
  var lista = beneficios();

  var bloque = crear('div', { clase: 'pregunta', 'data-campo': 'beneficiosPorProducto' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.pregunta }),
    crear('p', { clase: 'pregunta-ayuda', texto: pregunta.ayuda }),
  ]);

  if (lista.length === 0) {
    bloque.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: 'Todavía no has agregado ningún producto.' }));
  }
  for (var i = 0; i < lista.length; i++) {
    bloque.appendChild(filaDeBeneficio(lista[i], i, alCambiar));
  }

  bloque.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Agregar producto'),
      onclick: function () {
        estado.fijar('beneficiosPorProducto', beneficios().concat([beneficioVacio()]));
        alCambiar();
      },
    }),
  ]));
  bloque.appendChild(bloqueDePegar(alCambiar));

  bloque.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: estado.T('¿Por qué te preguntamos esto?') }),
    crear('p', { texto: pregunta.porQue }),
  ]));
  return bloque;
}

RM.beneficios = {
  dibujar: dibujar,
  OPCIONALES: OPCIONALES,
};

})();

(function () {
'use strict';

/**
 * La lista de tiendas de Turbo del cashback por ETA.
 *
 * Hasta el 21 de septiembre de 2026 el documento decía "todas las tiendas
 * virtuales bajo la modalidad Turbo Restaurantes de la ciudad". Juan corrigió
 * que Turbo no es una modalidad: son tiendas por zona, con nombre propio, y
 * eligió que el T&C las nombre una por una (punto D1).
 *
 * Mismo patrón que la lista de productos de la Carrera, con una sola diferencia:
 * cada fila tiene un campo, el nombre, así que se dibuja como una línea y no
 * como una ficha.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;

function tiendas() {
  if (!estado.entrada().tiendasEta) estado.fijar('tiendasEta', []);
  return estado.entrada().tiendasEta;
}

/** Revisa una fila y devuelve el problema, si lo hay. */
function problemaDe(tienda, indice, todas) {
  var nombre = String(tienda.nombre || '').trim();
  if (!nombre) return '';

  // La misma tienda dos veces la nombra dos veces en la cláusula.
  for (var i = 0; i < todas.length; i++) {
    if (i === indice) continue;
    if (String(todas[i].nombre || '').trim().toLowerCase() === nombre.toLowerCase()) {
      return estado.pregunta('tiendasEta').errores.repetido;
    }
  }
  return '';
}

function filaDeTienda(tienda, indice, alCambiar) {
  var textos = estado.pregunta('tiendasEta').camposPorTienda;
  var problema = problemaDe(tienda, indice, tiendas());

  var control = crear('input', {
    type: 'text',
    value: tienda.nombre || '',
    placeholder: textos.nombre.ejemplo || '',
    'aria-label': textos.nombre.pregunta + ' ' + (indice + 1),
  });
  control.addEventListener('input', function () {
    var lista = tiendas().slice();
    lista[indice].nombre = control.value;
    estado.fijar('tiendasEta', lista);
    RM.flujo.refrescarDocumento();
  });
  control.addEventListener('blur', alCambiar);

  return crear('div', { clase: 'campo', 'data-tienda-eta': String(indice) }, [
    crear('div', { clase: 'campo-caja' }, [
      control,
      crear('button', {
        clase: 'boton-texto', type: 'button', texto: estado.T('Quitar'),
        onclick: function () {
          var lista = tiendas().slice();
          lista.splice(indice, 1);
          estado.fijar('tiendasEta', lista);
          alCambiar();
        },
      }),
    ]),
    problema ? crear('p', { clase: 'mensaje-error', texto: problema }) : null,
  ]);
}

/** Pegar desde Excel: una tienda por fila. */
function bloqueDePegar(alCambiar) {
  var area = crear('textarea', {
    rows: '4',
    placeholder: 'Turbo Calleja\nTurbo Chico',
    'aria-label': 'Pegar tiendas desde una hoja de cálculo',
  });
  var resultado = crear('div', {});

  function procesar() {
    var lineas = area.value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (lineas.length === 0) return;

    var nuevas = lineas.map(function (linea) { return { nombre: linea }; });
    var lista = tiendas().slice().filter(function (t) { return String(t.nombre || '').trim(); });
    estado.fijar('tiendasEta', lista.concat(nuevas));
    area.value = '';

    RM.util.vaciar(resultado);
    resultado.appendChild(crear('p', {
      clase: 'mensaje-ok',
      texto: nuevas.length + (nuevas.length === 1 ? ' tienda agregada.' : ' tiendas agregadas.') +
        ' Revisa que cada una haya quedado bien.',
    }));
    alCambiar();
  }

  return crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: estado.T('Pegar desde una hoja de cálculo') }),
    crear('p', { clase: 'pregunta-ayuda', texto: 'Una tienda por fila, con el nombre como sale en el botón Turbo.' }),
    area,
    crear('div', { clase: 'fila-botones' }, [
      crear('button', { clase: 'boton boton-secundario', type: 'button', texto: estado.T('Agregar las pegadas'), onclick: procesar }),
    ]),
    resultado,
  ]);
}

function dibujar(alCambiar) {
  var pregunta = estado.pregunta('tiendasEta');
  var lista = tiendas();

  var bloque = crear('div', { clase: 'pregunta' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.pregunta }),
    crear('p', { clase: 'pregunta-ayuda', texto: pregunta.ayuda }),
  ]);

  if (lista.length === 0) {
    bloque.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: 'Todavía no has agregado ninguna tienda.' }));
  }
  for (var i = 0; i < lista.length; i++) {
    bloque.appendChild(filaDeTienda(lista[i], i, alCambiar));
  }

  bloque.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: estado.T('Agregar tienda'),
      onclick: function () {
        estado.fijar('tiendasEta', tiendas().concat([{ nombre: '' }]));
        alCambiar();
      },
    }),
  ]));
  bloque.appendChild(bloqueDePegar(alCambiar));

  bloque.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: estado.T('¿Por qué te preguntamos esto?') }),
    crear('p', { texto: pregunta.porQue }),
  ]));
  return bloque;
}

RM.tiendasEta = {
  dibujar: dibujar,
};

})();

(function () {
'use strict';

/** Historial, Ayuda y Administración. */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;

// --- Historial ---------------------------------------------------------------

function pantallaHistorial(raiz) {
  var contenido = crear('div', { clase: 'pagina' }, [
    crear('h1', { texto: 'Tus campañas' }),
    crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'Abre tus documentos, márcalos como publicados o usa uno como base para una campaña nueva.',
    }),
  ]);

  var buscador = crear('input', {
    clase: 'buscador', type: 'search', placeholder: 'Busca por nombre, tienda o país', 'aria-label': 'Buscar en tu historial',
  });
  buscador.addEventListener('input', RM.util.conRetraso(function () { cargar(buscador.value); }, 250));

  contenido.appendChild(crear('div', { clase: 'pregunta' }, [
    crear('div', { clase: 'campo-caja' }, [buscador]),
  ]));

  var destino = crear('div', {});
  contenido.appendChild(destino);
  raiz.appendChild(contenido);

  function cargar(busqueda) {
    RM.util.vaciar(destino);
    destino.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: estado.T('Cargando...') }));

    RM.servidor.llamar('historial', busqueda || '').then(function (respuesta) {
      RM.util.vaciar(destino);

      // Si el servidor no devuelve una lista, se dice que pasó en vez de
      // reventar con un error que no le sirve a nadie.
      if (!respuesta || typeof respuesta.length !== 'number') {
        destino.appendChild(crear('p', {
          clase: 'mensaje-error',
          texto: 'El servidor no devolvió tu historial. Vuelve a cargar la página y, si sigue igual, avísale a Legal por el canal de ayuda.',
        }));
        return;
      }
      var filas = respuesta;

      if (filas.length === 0) {
        destino.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: busqueda ? 'No encontramos ninguna campaña con eso.' : 'Todavía no has generado ninguna campaña.' }));
        return;
      }

      var tabla = crear('table', { clase: 'tabla' });
      tabla.appendChild(crear('thead', {}, [
        crear('tr', {}, [

          crear('th', { texto: 'País' }),
          crear('th', { texto: 'Fecha' }),
          crear('th', { texto: 'Estado' }),
          crear('th', { texto: '' }),
        ]),
      ]));

      var cuerpo = crear('tbody');
      for (var i = 0; i < filas.length; i++) {
        (function (fila) {
          var publicado = String(fila.estado) === 'publicado';
          cuerpo.appendChild(crear('tr', {}, [
            crear('td', {}, [
              crear('strong', { texto: fila.nombre_campana || '(sin nombre)' }),

            ]),
            crear('td', { texto: fila.pais || '' }),
            crear('td', { texto: String(fila.fecha || '').slice(0, 10) }),
            crear('td', {}, [
              crear('span', { clase: 'estado ' + (publicado ? 'estado-publicado' : 'estado-generado') }, [
                crear('span', { clase: 'punto' }),
                document.createTextNode(publicado ? 'Publicado' : 'Generado'),
              ]),
            ]),
            crear('td', {}, [
              fila.link_doc ? crear('a', { clase: 'boton-texto', href: fila.link_doc, target: '_blank', rel: 'noopener', texto: 'Abrir' }) : null,
              document.createTextNode(' '),
              crear('button', {
                clase: 'boton-texto', type: 'button', texto: 'Usar como base',
                onclick: function () { usarComoBase(fila.id); },
              }),

        })(filas[i]);
      }

    }).catch(function (error) {

    });

  cargar('');
}

/**
 * El boton de ampliar una campana en curso.
 *
 * Solo aparece cuando la campana esta publicada y corriendo. Una campana que ya
 * arranco no cambia sus condiciones: lo unico que se puede es darle mas dias,
 * mas presupuesto, mas ordenes o mas unidades. Ver src/core/ampliacion.js.
 */
function botonDeAmpliar(fila, destino) {
  var entrada = datosDeLaFila(fila);
  if (!entrada) return null;

  var hoy = E.configuracion.hoy || RM.util.hoyEnElNavegador();
  var estado = puedeAmpliar(fila, entrada, hoy, RM.util.horaEnElNavegador());

  return crear('button', {

  });
}

/** Las respuestas guardadas de una fila del historial, o null. */
function datosDeLaFila(fila) {
  try {
    return JSON.parse(fila.datos_json || '{}');
  } catch (error) {
    return null;
  }
}

/** El formulario de ampliacion, debajo de la tabla. */
function abrirAmpliacion(fila, entrada, destino) {
  var viejo = document.getElementById('caja-ampliacion');
  if (viejo) viejo.parentNode.removeChild(viejo);

  var caja = crear('div', { clase: 'ficha', id: 'caja-ampliacion' });
  var seccion = crear('div', { clase: 'ficha-seccion' }, [
    crear('h3', { texto: 'Ampliar ' + (fila.nombre_campana || fila.id) }),
    crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'Esta campaña ya arrancó: solo puedes darle más, nunca menos, porque cambiaría las condiciones de quien ya compró.',
    }),
  ]);

  var controles = {};
  function campoDeAmpliacion(id, etiqueta, tipo, valorActual) {
    var control = crear('input', { type: tipo, id: 'ampliar-' + id, 'aria-label': etiqueta });
    controles[id] = control;
    seccion.appendChild(crear('div', { clase: 'pregunta' }, [
      crear('label', { clase: 'copiable-etiqueta', for: 'ampliar-' + id, texto: etiqueta }),
      crear('div', { clase: 'campo-caja' }, [control]),
      crear('p', { clase: 'pregunta-ayuda', texto: 'Ahora dice: ' + (valorActual === null || valorActual === undefined || valorActual === '' ? 'sin valor' : valorActual) }),
    ]));
  }

  campoDeAmpliacion('fechaFin', 'Nueva fecha de fin', 'date', entrada.fechaFin);
  if (entrada.presupuesto) campoDeAmpliacion('presupuesto', 'Nuevo presupuesto', 'text', entrada.presupuesto);
  if (entrada.maxOrdenes) campoDeAmpliacion('maxOrdenes', 'Nuevo máximo de órdenes', 'text', entrada.maxOrdenes);
  if (entrada.unidades) campoDeAmpliacion('unidades', 'Nuevas unidades con descuento', 'text', entrada.unidades);

  var mensaje = crear('p', { clase: 'pregunta-ayuda', texto: 'Llena solo lo que quieras ampliar y deja el resto vacío.' });
  var guardar = crear('button', { clase: 'boton', type: 'button', texto: 'Ampliar la campaña' });

  guardar.addEventListener('click', function () {
    var cambios = {};
    for (var id in controles) {
      if (!Object.prototype.hasOwnProperty.call(controles, id)) continue;
      var valor = String(controles[id].value || '').trim();
      if (valor) cambios[id] = id === 'fechaFin' ? valor : Number(RM.util.soloDigitos(valor));
    }

    guardar.disabled = true;
    guardar.textContent = 'Ampliando...';
    RM.servidor.llamar('ampliarCampana', fila.id, cambios).then(function (respuesta) {
      guardar.disabled = false;
      guardar.textContent = 'Ampliar la campaña';
      if (!respuesta || !respuesta.valido) {
        mensaje.className = 'mensaje-error';
        mensaje.textContent = respuesta && respuesta.errores ? respuesta.errores[0].mensaje : 'No pudimos ampliar la campaña.';
        return;
      }
      RM.util.vaciar(seccion);
      seccion.appendChild(crear('h3', { texto: 'Listo: versión ' + respuesta.version }));
      seccion.appendChild(crear('p', {
        texto: 'Abre el documento nuevo, cópialo completo y reemplaza el texto en la misma página de Squarespace. El enlace no cambia: la gente ya lo tiene.',
      }));
      if (respuesta.linkPublicado) {
        seccion.appendChild(RM.util.paraCopiar('La página que hay que actualizar', respuesta.linkPublicado, ''));
      }
      seccion.appendChild(crear('div', { clase: 'fila-botones' }, [
        crear('a', { clase: 'boton', href: respuesta.linkDoc, target: '_blank', rel: 'noopener' }, [
          document.createTextNode('Abrir el documento nuevo'), RM.util.icono('abrir', 16),
        ]),
      ]));
    }).catch(function (error) {
      guardar.disabled = false;
      guardar.textContent = 'Ampliar la campaña';
      mensaje.className = 'mensaje-error';
      mensaje.textContent = 'No pudimos ampliar la campaña: ' + error.message;
    });
  });

  seccion.appendChild(mensaje);
  seccion.appendChild(crear('div', { clase: 'fila-botones' }, [guardar]));
  caja.appendChild(seccion);
  destino.appendChild(caja);
  caja.scrollIntoView({ block: 'nearest' });
}

function usarComoBase(id) {
  RM.servidor.llamar('datosDeSolicitud', id).then(function (respuesta) {
    if (!respuesta.valido) {
      RM.app.mostrarError(respuesta.errores[0].mensaje);
      return;
    }
    var base = respuesta.entrada;
    // Las fechas no se copian: casi nunca sirven para la campaña nueva.
    base.fechaInicio = '';
    base.fechaFin = '';
    base.fechaCarga = '';
    base.fechaFinRedencion = '';
    base.fechaNotificacion = '';
    base.declaracion = false;

    estado.reiniciarFormulario(base);
    E.filtroRespondido = true;
    RM.app.ir('pasos');
  }).catch(function (error) {
    RM.app.mostrarError('No pudimos abrir esa campaña: ' + error.message);
  });
}

// --- Ayuda -------------------------------------------------------------------

function listaSimple(items, clase) {
  var lista = crear('ul', { clase: clase || '' });
  for (var i = 0; i < items.length; i++) lista.appendChild(crear('li', { texto: items[i] }));
  return lista;
}

/** Quién tiene usuario de Squarespace, país por país, y el canal de Legal. */
function fichaDeAccesos() {
  var ficha = crear('div', { clase: 'ficha' });

  for (var codigo in ACCESOS_SQUARESPACE) {
    if (!Object.prototype.hasOwnProperty.call(ACCESOS_SQUARESPACE, codigo)) continue;
    (function (accesos, codigoDePais) {
      var seccion = crear('div', { clase: 'ficha-seccion' }, [
        crear('h3', { texto: nombreDelPais(codigoDePais) }),
      ]);

      var grupos = [
        { titulo: 'Cashback y descuentos', personas: accesos.cashback || [], nota: '' },
        { titulo: 'Concursos', personas: accesos.concursos || [], nota: accesos.notaConcursos || '' },
      ];

      for (var g = 0; g < grupos.length; g++) {
        seccion.appendChild(crear('p', { clase: 'copiable-etiqueta', texto: grupos[g].titulo }));
        if (grupos[g].personas.length > 0) {
          var lista = crear('ul');
          for (var i = 0; i < grupos[g].personas.length; i++) {
            lista.appendChild(crear('li', { texto: grupos[g].personas[i].nombre + ' · ' + grupos[g].personas[i].correo }));
          }
          seccion.appendChild(lista);
        } else {
          seccion.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: grupos[g].nota || 'Todavía no hay nadie asignado. Pídelo por el canal.' }));
        }
      }
      ficha.appendChild(seccion);
    })(ACCESOS_SQUARESPACE[codigo], codigo);
  }

  ficha.appendChild(crear('div', { clase: 'ficha-seccion' }, [
    crear('h3', { texto: 'Los demás países' }),
    crear('p', { clase: 'pregunta-ayuda', texto: 'Todavía no tenemos la lista. Pide la publicación en #tyc-rappi.' }),
    crear('p', {}, [
      document.createTextNode(CANAL_TC.para + ' '),
      crear('a', { href: CANAL_TC.url, target: '_blank', rel: 'noopener', texto: CANAL_TC.nombre }),
    ]),
  ]));
  return ficha;
}

/** El nombre del país tal como lo trae el servidor, o su código. */
function nombreDelPais(codigo) {
  var paises = E.configuracion.paises || [];
  for (var i = 0; i < paises.length; i++) {
    if (paises[i].codigo === codigo) return paises[i].nombre;
  }
  return codigo;
}

/**
 * La pantalla de Ayuda.
 *
 * El orden lo cambio Juan el 20 de septiembre de 2026 (punto F8), y sale de lo
 * que el comercial viene a buscar de verdad. Antes abria con el aviso de azar,
 * que es lo mas serio pero lo menos consultado: quien entra aqui suele venir de
 * una campana de descuento que no encuentra en la lista de tipos, o de no saber
 * como publicar.
 *
 * Queda asi: primero los descuentos y cupones, despues como publicar y quien
 * puede hacerlo, y despues el azar y las demas preguntas.
 */
function pantallaAyuda(raiz) {
  var contenido = crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('h1', { texto: estado.T('Ayuda') }),
  ]);

  // 1. Lo que mas se pregunta: la campana que no esta en la lista de tipos,
  // porque su T&C ya existe y no hay que generar nada.
  var descuentos = null;
  for (var q = 0; q < PREGUNTAS_FRECUENTES.length; q++) {
    if (PREGUNTAS_FRECUENTES[q].pregunta.indexOf('descuento o un cupón') !== -1) {
      descuentos = PREGUNTAS_FRECUENTES[q];
    }
  }
  if (descuentos) {
    contenido.appendChild(crear('h2', { texto: descuentos.pregunta }));
    contenido.appendChild(crear('p', { texto: descuentos.respuesta }));
  }

  // 2. Guía de Squarespace. Es la misma lista que la pantalla final, para que
  // las dos digan exactamente lo mismo.
  contenido.appendChild(crear('h2', { texto: 'Publicar en Squarespace' }));
  contenido.appendChild(crear('p', {
    clase: 'pregunta-ayuda',
    texto: 'Cuando generes una campaña, al final te damos el título y la dirección ya armados, listos para copiar. Esto es el paso a paso.',
  }));

  var pasos = crear('ol', { clase: 'pasos-publicar' });
  for (var s = 0; s < PASOS_SQUARESPACE.length; s++) {
    pasos.appendChild(crear('li', {}, [
      crear('p', { texto: PASOS_SQUARESPACE[s].hace }),
      crear('p', { clase: 'pregunta-ayuda', texto: 'Deberías ver: ' + PASOS_SQUARESPACE[s].ve }),
    ]));
  }
  contenido.appendChild(pasos);

  contenido.appendChild(crear('h2', { texto: estado.T('¿Quién puede publicar?') }));
  contenido.appendChild(crear('p', {
    texto: 'No todo el mundo tiene usuario de Squarespace: la cuenta la tienen unas pocas personas por país. Si no eres una de ellas, pásales el documento, el título y la dirección que te dio RappiMind, o pídelo en #tyc-rappi.',
  }));
  contenido.appendChild(fichaDeAccesos());

  // 3. El aviso de azar y qué campañas sirven aquí.
  var aviso = crear('div', { clase: 'aviso aviso-serio' }, [
    crear('h3', { texto: AVISO_AZAR.titulo }),
    crear('p', { texto: AVISO_AZAR.entrada }),
  ]);
  contenido.appendChild(aviso);

  for (var i = 0; i < AVISO_AZAR.porQue.length; i++) {
    contenido.appendChild(crear('p', { texto: AVISO_AZAR.porQue[i] }));
  }

  contenido.appendChild(crear('h3', { texto: 'Sirven para esta herramienta' }));
  contenido.appendChild(listaSimple(AVISO_AZAR.validas));
  contenido.appendChild(crear('h3', { texto: 'No sirven: las redacta Legal' }));
  contenido.appendChild(listaSimple(AVISO_AZAR.noValidas));
  contenido.appendChild(crear('h3', { texto: 'Consúltalo igual' }));
  contenido.appendChild(listaSimple(AVISO_AZAR.frontera));
  contenido.appendChild(crear('div', { clase: 'aviso' }, [crear('p', { texto: AVISO_AZAR.regla })]));

  // 4. Si algo sale mal.
  contenido.appendChild(crear('h2', { texto: 'Si algo sale mal' }));
  var problemas = crear('dl', {});
  for (var p = 0; p < SI_ALGO_SALE_MAL.length; p++) {
    problemas.appendChild(crear('dt', { texto: SI_ALGO_SALE_MAL[p].problema }));
    problemas.appendChild(crear('dd', { texto: SI_ALGO_SALE_MAL[p].solucion }));
  }
  contenido.appendChild(crear('div', { clase: 'ficha' }, [crear('div', { clase: 'ficha-seccion' }, [problemas])]));

  // 5. Canal de ayuda. Aquí, y no colgada del aviso de azar, va la línea de
  // qué hacer si esta página no coincide con la herramienta.
  contenido.appendChild(crear('h2', { texto: 'Canal de ayuda' }));
  if (E.configuracion.urlCanalAyuda) {
    contenido.appendChild(crear('p', {}, [
      document.createTextNode('Si te trabaste con algo de la herramienta, escríbenos en '),
      crear('a', { href: E.configuracion.urlCanalAyuda, target: '_blank', rel: 'noopener', texto: 'el canal de ayuda' }),
      document.createTextNode('. Ahí respondemos dudas de uso, no consultas legales.'),
    ]));
  } else {
    contenido.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: 'Falta configurar el canal de ayuda en las propiedades del script (CANAL_AYUDA_URL).' }));
  }
  if (AVISO_AZAR.borrador) {
    contenido.appendChild(crear('p', { clase: 'pregunta-ayuda', texto: SI_ALGO_NO_COINCIDE }));
  }

  // 6. Contactos.
  contenido.appendChild(crear('h2', { texto: 'A quién buscar' }));
  var contactos = crear('div', { clase: 'ficha' });
  for (var c = 0; c < CONTACTOS.length; c++) {
    contactos.appendChild(crear('div', { clase: 'ficha-seccion' }, [
      crear('h3', { texto: CONTACTOS[c].nombre }),
      crear('p', { clase: 'pregunta-ayuda', texto: CONTACTOS[c].para }),
      crear('p', {
        clase: 'pregunta-ayuda',
        // Sin correo se dice donde buscarlo, en vez de ensenar un hueco en una
        // pantalla que van a leer los equipos legales de todos los paises.
        texto: CONTACTOS[c].correo || 'Escríbele en #tyc-rappi.',
      }),
    ]));
  }
  contenido.appendChild(contactos);

  // 7. Las demás preguntas frecuentes. La de descuentos ya salió arriba.
  contenido.appendChild(crear('h2', { texto: 'Preguntas frecuentes' }));
  for (var f = 0; f < PREGUNTAS_FRECUENTES.length; f++) {
    if (PREGUNTAS_FRECUENTES[f] === descuentos) continue;
    contenido.appendChild(crear('details', { clase: 'por-que' }, [
      crear('summary', { texto: PREGUNTAS_FRECUENTES[f].pregunta }),
      crear('p', { texto: PREGUNTAS_FRECUENTES[f].respuesta }),
    ]));
  }

  raiz.appendChild(contenido);
}

function seccionPaises(datos) {
  var tabla = crear('table', { clase: 'tabla' }, [
    crear('thead', {}, [crear('tr', {}, [
      crear('th', { texto: 'País' }), crear('th', { texto: 'Tipos habilitados' }), crear('th', { texto: 'Estado' }),
    ])]),
  ]);
  var cuerpo = crear('tbody');

  for (var i = 0; i < datos.paises.length; i++) {
    (function (pais) {
      var selector = crear('select', { 'aria-label': 'Estado de ' + pais.nombre });
      for (var e = 0; e < datos.estados.length; e++) {
        selector.appendChild(crear('option', {
          value: datos.estados[e], texto: datos.estados[e], selected: pais.estado === datos.estados[e],
        }));
      }
      selector.addEventListener('change', function () {
        RM.servidor.llamar('adminGuardarEstadoDePais', pais.codigo, selector.value).then(function (respuesta) {
          RM.util.anunciar(respuesta.valido ? pais.nombre + ' quedó en ' + selector.value : respuesta.errores[0].mensaje);
        });
      });
      cuerpo.appendChild(crear('tr', {}, [
        crear('td', { texto: pais.codigo + ' · ' + pais.nombre }),
        crear('td', { texto: (pais.modelos || []).join(', ') || 'ninguno' }),
        crear('td', {}, [selector]),
      ]));
    })(datos.paises[i]);
  }
  tabla.appendChild(cuerpo);

  return crear('section', {}, [
    crear('h2', { texto: 'Países' }),
    crear('p', { clase: 'pregunta-ayuda', texto: 'Activo lo ve cualquiera. Piloto lo ven pruebas, legal y administración. Bloqueado no lo ve nadie.' }),
    crear('div', { clase: 'envoltorio-tabla' }, [tabla]),
  ]);
}

      crear('th', { texto: 'Rol' }), crear('th', { texto: 'País' }), crear('th', { texto: 'Activo' }),

          RM.servidor.llamar('adminGuardarMiembro', {

          }).then(function (respuesta) {
            if (!respuesta.valido) {
              mensaje.className = 'mensaje-error';
              mensaje.textContent = respuesta.errores[0].mensaje;
