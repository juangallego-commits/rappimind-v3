'use strict';

/**
 * Normalizacion de la configuracion por pais.
 *
 * Los paises viven en data/paises.json (semilla) y en la pestana Paises del
 * Sheet, donde una lista se guarda como texto separado por comas. Este archivo
 * convierte entre las dos formas y decide que paises ve cada persona.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTablas = require('./tablas.js');
  var comoBooleano = moduloTablas.comoBooleano;
  var fechaComoTexto = moduloTablas.fechaComoTexto;

  var moduloFechas = require('./fechas.js');
  var listaY = moduloFechas.listaY;
  var formatearFecha = moduloFechas.formatearFecha;
}

var ESTADOS = ['activo', 'piloto', 'bloqueado'];

/* Los roles del equipo. De legal para arriba se ven los paises en piloto. */
var ROLES = ['comercial', 'pruebas', 'legal', 'admin'];

/** Columnas que en el Sheet son una lista separada por comas. */
var COLUMNAS_DE_LISTA = ['modelos', 'por_confirmar_en_pruebas'];

function comoLista(valor) {
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor;
  var partes = String(valor === null || valor === undefined ? '' : valor).split(',');
  var limpias = [];
  for (var i = 0; i < partes.length; i++) {
    var parte = partes[i].trim();
    if (parte) limpias.push(parte);
  }
  return limpias;
}

/** Fila del Sheet -> pais utilizable por el motor. */
function paisDesdeFila(fila) {
  var pais = {};
  for (var llave in fila) {
    if (!Object.prototype.hasOwnProperty.call(fila, llave)) continue;
    if (llave === '_fila') continue;

    // Google Sheets convierte sola en fecha una celda que diga 2027-03-31, y
    // travel_rnt_vence es una de esas. Comparada como texto, "Wed Mar 31 2027"
    // nunca es mayor que "2026-09-17", asi que el aviso de vencimiento del
    // Registro Nacional de Turismo no se disparaba nunca.
    pais[llave] = Object.prototype.toString.call(fila[llave]) === '[object Date]'
      ? fechaComoTexto(fila[llave])
      : fila[llave];
  }

  for (var i = 0; i < COLUMNAS_DE_LISTA.length; i++) {
    var columna = COLUMNAS_DE_LISTA[i];
    pais[columna] = comoLista(pais[columna]);
  }

  pais.codigo = String(pais.codigo || '').trim().toUpperCase();
  pais.estado = String(pais.estado || '').trim().toLowerCase();
  if (ESTADOS.indexOf(pais.estado) === -1) pais.estado = 'bloqueado';

  pais._fila = fila._fila;
  return pais;
}

/** Pais -> fila del Sheet, con las listas convertidas a texto. */
function paisComoFila(pais) {
  var fila = {};
  for (var llave in pais) {
    if (!Object.prototype.hasOwnProperty.call(pais, llave)) continue;
    if (llave === '_fila') continue;
    var valor = pais[llave];
    fila[llave] = Object.prototype.toString.call(valor) === '[object Array]' ? valor.join(', ') : valor;
  }
  return fila;
}

function paisPorCodigo(paises, codigo) {
  var buscado = String(codigo || '').trim().toUpperCase();
  for (var i = 0; i < paises.length; i++) {
    if (String(paises[i].codigo).toUpperCase() === buscado) return paises[i];
  }
  return null;
}

/**
 * Los paises que puede elegir quien pide: los activos siempre, y los de piloto
 * solo si esta en el equipo. Los bloqueados no aparecen nunca.
 */
function paisesDisponibles(paises, usuarioEnEquipo) {
  var disponibles = [];
  for (var i = 0; i < paises.length; i++) {
    var pais = paises[i];
    if (pais.estado === 'activo') disponibles.push(pais);
    else if (pais.estado === 'piloto' && usuarioEnEquipo) disponibles.push(pais);
  }
  return disponibles;
}

/** Los tipos de campana habilitados para un pais, en el orden del catalogo. */
function tiposDelPais(pais, catalogoDeTipos) {
  var habilitados = [];
  var modelos = pais && pais.modelos ? pais.modelos : [];
  for (var i = 0; i < catalogoDeTipos.length; i++) {
    var tipo = catalogoDeTipos[i];
    for (var m = 0; m < modelos.length; m++) {
      if (modelos[m] === tipo.modelo) {
        habilitados.push(tipo);
        break;
      }
    }
  }
  return habilitados;
}

/** Fila de Equipo -> miembro. */
function miembroDesdeFila(fila) {
  return {
    email: String(fila.email || '').trim().toLowerCase(),
    nombre: String(fila.nombre || '').trim(),
    rol: String(fila.rol || 'comercial').trim().toLowerCase(),
    pais: String(fila.pais || '').trim().toUpperCase(),
    activo: comoBooleano(fila.activo),
    _fila: fila._fila,
  };
}

/** Busca a alguien en el equipo por correo. Devuelve null si no esta o no esta activo. */
function miembroPorCorreo(equipo, correo) {
  var buscado = String(correo || '').trim().toLowerCase();
  for (var i = 0; i < equipo.length; i++) {
    if (equipo[i].email === buscado && equipo[i].activo) return equipo[i];
  }
  return null;
}

/**
 * La fila de alguien en el equipo, este activo o no.
 *
 * Es para escribir, no para dar permisos. Al volver a agregar a alguien que
 * tenia activo en "no", buscar solo entre los activos no lo encontraba y la
 * pestaña Equipo quedaba con dos filas del mismo correo.
 */
function filaDeMiembro(equipo, correo) {
  var buscado = String(correo || '').trim().toLowerCase();
  for (var i = 0; i < equipo.length; i++) {
    if (equipo[i].email === buscado) return equipo[i];
  }
  return null;
}

/** Solo se atiende a cuentas del dominio, y con forma de correo completa. */
function esCorreoDelDominio(correo) {
  return /^[\w.+-]+@rappi\.com$/i.test(String(correo || '').trim());
}

var FORMA_DE_CORREO = /[\w.+-]+@[\w-]+(\.[\w-]+)+/g;

/**
 * Los correos que vienen en un texto pegado de cualquier parte.
 *
 * Pegado de Gmail o de Slack, el texto trae nombres, picos y "mailto:":
 * "Ana Pérez <ana@rappi.com>, Bruno Díaz <bruno@rappi.com>". Partirlo por
 * espacios devolvia "ana" y "pérez" como correos rechazados. Aqui se sacan los
 * correos por su forma. Lo que sobra y parece un correo mal escrito
 * ("ana.rappi.com", "ana@rappi") tambien se devuelve, para que se rechace con
 * su nombre; las palabras sueltas, como los nombres, se ignoran.
 */
function separarCorreos(texto) {
  var original = String(texto || '');
  var correos = original.match(FORMA_DE_CORREO) || [];
  var sobrantes = original.replace(FORMA_DE_CORREO, ' ').split(/[\s,;<>()\[\]"]+/);

  var limpios = [];
  function agregar(candidato) {
    var correo = String(candidato || '').trim().toLowerCase();
    if (correo && limpios.indexOf(correo) === -1) limpios.push(correo);
  }
  for (var i = 0; i < correos.length; i++) agregar(correos[i]);
  for (var s = 0; s < sobrantes.length; s++) {
    if (/@|\w\.\w/.test(sobrantes[s])) agregar(sobrantes[s]);
  }
  return limpios;
}

/**
 * Rol efectivo de quien pide. Quien no esta en el equipo es comercial.
 * Roles: comercial, pruebas, legal, admin.
 */
function rolDe(equipo, correo) {
  var miembro = miembroPorCorreo(equipo, correo);
  return miembro ? miembro.rol : 'comercial';
}

// --- Rappi Travel ----------------------------------------------------------

/**
 * Los tipos de campana de Rappi Travel.
 *
 * Travel tiene su propia entidad legal (Travel Moustache S.A.S.), su propio
 * Registro Nacional de Turismo y su propia politica de datos. Nada de eso se
 * hereda de la fila del pais, asi que un pais sin bloque travel no ofrece estos
 * tipos. Ver docs/INVESTIGACION_TRAVEL.md.
 */
var TIPOS_DE_TRAVEL = ['cashback_travel', 'descuento_travel'];

/** Los datos de Travel sin los cuales un T&C saldria incompleto. */
var DATOS_DE_TRAVEL_OBLIGATORIOS = [
  { llave: 'travel_entidad', nombre: 'la razón social de Rappi Travel' },
  { llave: 'travel_id_fiscal', nombre: 'el NIT de Rappi Travel' },
  { llave: 'travel_rnt', nombre: 'el número del Registro Nacional de Turismo' },
  { llave: 'travel_rnt_vence', nombre: 'la fecha de vencimiento del Registro Nacional de Turismo' },
  { llave: 'travel_url_sitio', nombre: 'la dirección del sitio de Rappi Travel' },
  { llave: 'travel_url_tc', nombre: 'el enlace a los T&C de los Sistemas Rappi Travel' },
  { llave: 'travel_politica_privacidad', nombre: 'el nombre de la política de datos de Rappi Travel' },
  { llave: 'travel_url_privacidad', nombre: 'el enlace a la política de datos de Rappi Travel' },
  { llave: 'travel_entidad_vigilancia', nombre: 'la entidad de vigilancia de Rappi Travel' },
];

function esTipoDeTravel(tipo) {
  return TIPOS_DE_TRAVEL.indexOf(String(tipo || '')) !== -1;
}

/**
 * Si el pais puede generar T&C de Travel hoy, y por que no.
 *
 * Mientras falte un dato o el RNT este vencido no se genera. Un T&C de agencia
 * de viajes sin RNT vigente no cumple la ley 300 de 1996, y uno sin politica de
 * datos deja al usuario sin saber quien trata sus datos ni como reclamarlos.
 *
 * Devuelve { disponible, motivo }.
 */
function travelDisponible(pais, hoyIso) {
  if (!pais) return { disponible: false, motivo: 'No encontramos el país de la campaña.' };

  var faltantes = [];
  for (var i = 0; i < DATOS_DE_TRAVEL_OBLIGATORIOS.length; i++) {
    var dato = DATOS_DE_TRAVEL_OBLIGATORIOS[i];
    if (!String(pais[dato.llave] === null || pais[dato.llave] === undefined ? '' : pais[dato.llave]).trim()) {
      faltantes.push(dato.nombre);
    }
  }
  if (faltantes.length > 0) {
    return {
      disponible: false,
      faltantes: faltantes,
      motivo: 'Rappi Travel todavía no está habilitado en ' + (pais.nombre || pais.codigo) +
        ': falta ' + listaY(faltantes) + '. Escríbele a Legal para que lo complete.',
    };
  }

  var vence = String(pais.travel_rnt_vence || '').trim();
  var hoy = String(hoyIso || '').trim();
  if (hoy && vence && hoy > vence) {
    return {
      disponible: false,
      vencido: true,
      motivo: 'El Registro Nacional de Turismo de Rappi Travel venció el ' + formatearFecha(vence) +
        '. No se pueden generar T&C de Travel hasta renovarlo. Escríbele a Legal.',
    };
  }
  return { disponible: true, motivo: '' };
}

/** Solo pruebas, legal y admin pueden generar en paises en piloto. */
/**
 * Como se llama, en palabras, cada dato que un pais tiene sin confirmar.
 *
 * La columna por_confirmar_en_pruebas del Sheet lleva los nombres tecnicos. Esto
 * los pasa a algo que un abogado pueda leer y reconocer dentro del documento.
 */
var NOMBRE_DEL_DATO = {
  separador_miles: 'cómo se separan los miles en un monto',
  termino_dias: 'cómo se llaman los días (calendario, corridos, naturales)',
  texto_hora_local: 'cómo se nombra la hora local',
  texto_derechos_datos: 'los derechos del titular sobre sus datos personales',
  autoridad_datos: 'la autoridad de protección de datos',
  entidad_vigilancia: 'la autoridad de protección al consumidor',
  pais_legal: 'el nombre del país como va escrito en el documento',
  ley_aplicable: 'la ley aplicable',
  jurisdiccion: 'la jurisdicción',
  politica_privacidad: 'el nombre de la política de privacidad',
  moneda_nombre: 'el nombre de la moneda',
  edad_minima: 'la edad mínima para participar',
  texto_persona: 'cómo se nombra a la persona natural',
  travel_rnt: 'el número del Registro Nacional de Turismo',
  travel_rnt_vence: 'cuándo vence el Registro Nacional de Turismo',
  travel_entidad_vigilancia: 'la entidad que vigila a Rappi Travel',
  // Lo unico que le queda pendiente a un pais cuyos valores legales ya
  // confirmo Legal: que el abogado de ese pais los vea y los apruebe. Sin
  // esta llave, confirmar los cuatro datos de un pais apagaba el aviso
  // entero y el abogado local entraba a probar sin saber que le tocaba a el.
};

/**
 * Lo que este pais tiene sin confirmar, en palabras, o lista vacia.
 *
 * Existe para que un abogado que entra a probar sepa que esta mirando: los
 * valores de un pais en piloto los puso la herramienta por analogia con
 * Colombia, no los aprobo nadie. Sin decirselo, lee el documento, le parece
 * bien, y confirma algo que nadie escribio.
 */
function datosPorConfirmar(pais) {
  var llaves = (pais && pais.por_confirmar_en_pruebas) || [];
  var nombres = [];
  for (var i = 0; i < llaves.length; i++) {
    var llave = String(llaves[i]).trim();
    if (!llave) continue;
    nombres.push(NOMBRE_DEL_DATO[llave] || llave.replace(/_/g, ' '));
  }
  return nombres;
}

/** Si a este pais hay que ponerle el aviso de que esta en pruebas. */
function paisEnPruebas(pais) {
  return !!pais && pais.estado === 'piloto';
}

function puedeVerPiloto(rol) {
  return rol === 'pruebas' || rol === 'legal' || rol === 'admin';
}

if (typeof module !== 'undefined') {

    ESTADOS: ESTADOS,
    ROLES: ROLES,
    paisDesdeFila: paisDesdeFila,
    paisComoFila: paisComoFila,
    paisPorCodigo: paisPorCodigo,
    paisesDisponibles: paisesDisponibles,
    tiposDelPais: tiposDelPais,
    miembroDesdeFila: miembroDesdeFila,
    miembroPorCorreo: miembroPorCorreo,
    filaDeMiembro: filaDeMiembro,
    esCorreoDelDominio: esCorreoDelDominio,

    rolDe: rolDe,

    NOMBRE_DEL_DATO: NOMBRE_DEL_DATO,
    datosPorConfirmar: datosPorConfirmar,
    paisEnPruebas: paisEnPruebas,

    DATOS_DE_TRAVEL_OBLIGATORIOS: DATOS_DE_TRAVEL_OBLIGATORIOS,
    esTipoDeTravel: esTipoDeTravel,
    travelDisponible: travelDisponible,
  };
}

/**
 * La pregunta de un campo, para el tipo de campana que se esta llenando.
 *
 * Unos pocos campos cambian de texto segun el tipo: en delivery se habla de
 * "pedido" y en Rappi Travel de "orden", y el segmento y la redencion tienen
 * opciones distintas. Eso vive en `variantes`, para no duplicar el campo ni
 * partir en dos el historico del Sheet.
 */
function preguntaDe(campo, tipo) {
  if (!Object.prototype.hasOwnProperty.call(PREGUNTAS, campo)) return null;
  var pregunta = PREGUNTAS[campo];

  var variante = pregunta.variantes && tipo ? pregunta.variantes[tipo] : null;
  if (!variante) return pregunta;

  var mezclada = {};
  for (var llave in pregunta) {
    if (Object.prototype.hasOwnProperty.call(pregunta, llave) && llave !== 'variantes') mezclada[llave] = pregunta[llave];
  }
  for (var cambio in variante) {
    if (Object.prototype.hasOwnProperty.call(variante, cambio)) mezclada[cambio] = variante[cambio];
  }
  return mezclada;
}

function nombreDelHueco(placeholder) {
  return Object.prototype.hasOwnProperty.call(NOMBRE_DEL_HUECO, placeholder)
    ? NOMBRE_DEL_HUECO[placeholder]
    : placeholder.toLowerCase().replace(/_/g, ' ');
}

function pasoDe(id) {
  for (var i = 0; i < PASOS.length; i++) {
    if (PASOS[i].id === id) return PASOS[i];
  }
  return null;
}

if (typeof module !== 'undefined') {
  module.exports = {
    PASOS: PASOS,
    PREGUNTAS: PREGUNTAS,
    GLOSARIO: GLOSARIO,
    NOMBRE_DEL_HUECO: NOMBRE_DEL_HUECO,
    CIUDADES_SUGERIDAS: CIUDADES_SUGERIDAS,
    preguntaDe: preguntaDe,
    nombreDelHueco: nombreDelHueco,
    pasoDe: pasoDe,
  };
}

var PREGUNTAS_POR_IDIOMA = { pt: PREGUNTAS_PT };

var TEXTOS_TRADUCIBLES = ['pregunta', 'ayuda', 'porQue', 'ejemplo', 'razonDeshabilitado', 'aviso'];

function copiaPlana(objeto) {
  var copia = {};
  for (var llave in objeto) {
    if (Object.prototype.hasOwnProperty.call(objeto, llave)) copia[llave] = objeto[llave];
  }
  return copia;
}

/**
 * La traduccion de un campo para un tipo de campana: la raiz, y encima lo que
 * diga `variantes[tipo]`. Los errores y las opciones se mezclan llave por
 * llave, para que la variante solo tenga que escribir lo que cambia.
 */
function traduccionPara(base, tipo) {
  var variante = base.variantes && tipo ? base.variantes[tipo] : null;
  var mezclada = copiaPlana(base);
  delete mezclada.variantes;
  if (!variante) return mezclada;

  for (var llave in variante) {
    if (!Object.prototype.hasOwnProperty.call(variante, llave)) continue;
    if (llave === 'errores' || llave === 'opciones') {
      var unidas = copiaPlana(mezclada[llave] || {});
      for (var sub in variante[llave]) {
        if (Object.prototype.hasOwnProperty.call(variante[llave], sub)) unidas[sub] = variante[llave][sub];
      }
      mezclada[llave] = unidas;
    } else {
      mezclada[llave] = variante[llave];
    }
  }
  return mezclada;
}

/**
 * La pregunta traducida al idioma de la interfaz, para el tipo de campana que
 * se esta llenando.
 *
 * Campo por campo: lo que no este traducido se queda en espanol. Las opciones se
 * traducen por su valor, no por su posicion, para que agregar una opcion nueva
 * en espanol no desalinee las etiquetas del otro idioma.
 *
 * `pregunta` es lo que devuelve preguntaDe(campo, tipo), ya con la variante del
 * tipo aplicada en espanol; `tipo` hace falta otra vez para elegir la variante
 * en el otro idioma.
 */
function preguntaEnIdioma(pregunta, campoId, idioma, tipo) {
  if (!pregunta || !idioma || idioma === 'es') return pregunta;

  var diccionario = PREGUNTAS_POR_IDIOMA[idioma];
  var base = diccionario ? diccionario[campoId] : null;
  if (!base) return pregunta;
  var traduccion = traduccionPara(base, tipo);

  var mezclada = copiaPlana(pregunta);

  for (var t = 0; t < TEXTOS_TRADUCIBLES.length; t++) {
    if (traduccion[TEXTOS_TRADUCIBLES[t]]) mezclada[TEXTOS_TRADUCIBLES[t]] = traduccion[TEXTOS_TRADUCIBLES[t]];
  }

  if (traduccion.errores) {
    var errores = copiaPlana(pregunta.errores || {});
    for (var e in traduccion.errores) {
      if (Object.prototype.hasOwnProperty.call(traduccion.errores, e)) errores[e] = traduccion.errores[e];
    }
    mezclada.errores = errores;
  }

  if (traduccion.opciones && pregunta.opciones) {
    var opciones = [];
    for (var o = 0; o < pregunta.opciones.length; o++) {
      var opcion = pregunta.opciones[o];
      var deIdioma = traduccion.opciones[opcion.valor];
      if (!deIdioma) { opciones.push(opcion); continue; }
      opciones.push({
        valor: opcion.valor,
        etiqueta: deIdioma.etiqueta || opcion.etiqueta,
        nota: deIdioma.nota || opcion.nota,
      });
    }
    mezclada.opciones = opciones;
  }

  return mezclada;
}

if (typeof module !== 'undefined') {
  module.exports = {
    PREGUNTAS_PT: PREGUNTAS_PT,
    preguntaEnIdioma: preguntaEnIdioma,
    traduccionPara: traduccionPara,
  };
}

'use strict';

/**
 * Lectura y escritura de tablas: la parte del Sheet que no necesita Google.
 *
 * El servidor pide un rango a SpreadsheetApp y le pasa el arreglo a estas
 * funciones. Asi la logica de las pestanas se prueba entera en Node y el
 * codigo que toca el Sheet queda reducido a leer y escribir un rectangulo.
 */

/** Normaliza un encabezado para comparar: sin espacios sobrantes. */
function normalizarEncabezado(valor) {
  return String(valor === null || valor === undefined ? '' : valor).trim();
}

/**
 * Valores de una pestana (primera fila = encabezados) -> lista de objetos.
 * Las filas totalmente vacias se descartan.
 */
function filasComoObjetos(valores) {
  if (!valores || valores.length < 2) return [];

  var encabezados = [];
  for (var c = 0; c < valores[0].length; c++) {
    encabezados.push(normalizarEncabezado(valores[0][c]));
  }

  var objetos = [];
  for (var f = 1; f < valores.length; f++) {
    var fila = valores[f];
    var objeto = {};
    var tieneAlgo = false;

    for (var i = 0; i < encabezados.length; i++) {
      if (!encabezados[i]) continue;
      var valor = fila[i];
      objeto[encabezados[i]] = valor === undefined ? '' : valor;
      if (valor !== '' && valor !== null && valor !== undefined) tieneAlgo = true;
    }

    if (tieneAlgo) {
      objeto._fila = f + 1; // numero de fila real en el Sheet
      objetos.push(objeto);
    }
  }
  return objetos;
}

/** Objeto -> fila en el orden de los encabezados. Lo que falta queda vacio. */
function objetoComoFila(objeto, encabezados) {
  var fila = [];
  for (var i = 0; i < encabezados.length; i++) {
    var llave = encabezados[i];
    var valor = Object.prototype.hasOwnProperty.call(objeto, llave) ? objeto[llave] : '';
    fila.push(valor === null || valor === undefined ? '' : valor);
  }
  return fila;
}

/** Lee un valor de verdad escrito en el Sheet: si, true, TRUE, 1, x. */
/**
 * Deja un valor del Sheet listo para cruzar a google.script.run.
 *
 * Apps Script solo deja pasar numeros, textos, booleanos, nulos, listas y
 * objetos de esos. Una fecha NO pasa: si va una sola en toda la respuesta,
 * Apps Script no falla ni avisa, simplemente le entrega null al navegador. Ahi
 * la pantalla revienta con un "no puedo leer length de null" que no apunta a
 * ninguna parte.
 *
 * Google Sheets convierte sola a fecha una celda que diga 2026-09-17, asi que
 * esto pasa apenas hay una campana guardada. Por eso todo lo que sale del Sheet
 * pasa por aqui.
 */
function valorPlano(valor) {
  if (valor === null || valor === undefined) return '';
  if (Object.prototype.toString.call(valor) === '[object Date]') return fechaComoTexto(valor);
  if (typeof valor === 'number' || typeof valor === 'boolean' || typeof valor === 'string') return valor;

  // Las listas y los objetos SI pasan por google.script.run: se recorren, no se
  // convierten a texto. Convertirlos rompio la lista de tipos de campana, que
  // llega como pais.modelos y se volvio la cadena "cashback,carrera_compras,...".
  if (Object.prototype.toString.call(valor) === '[object Array]') {
    var lista = [];
    for (var i = 0; i < valor.length; i++) lista.push(valorPlano(valor[i]));
    return lista;
  }
  if (typeof valor === 'object') {
    var objeto = {};
    for (var llave in valor) {
      if (Object.prototype.hasOwnProperty.call(valor, llave)) objeto[llave] = valorPlano(valor[llave]);
    }
    return objeto;
  }
  return String(valor);
}

/** Una fecha del Sheet como texto. Sin hora cuando es medianoche. */
function fechaComoTexto(fecha) {
  if (isNaN(fecha.getTime())) return '';
  function dos(numero) {
    return numero < 10 ? '0' + numero : String(numero);
  }
  var dia = fecha.getFullYear() + '-' + dos(fecha.getMonth() + 1) + '-' + dos(fecha.getDate());
  if (fecha.getHours() === 0 && fecha.getMinutes() === 0 && fecha.getSeconds() === 0) return dia;
  return dia + ' ' + dos(fecha.getHours()) + ':' + dos(fecha.getMinutes()) + ':' + dos(fecha.getSeconds());
}

/** Lo mismo, para una lista de objetos del Sheet. */
function filasPlanas(objetos) {
  var lista = objetos || [];
  var salida = [];
  for (var i = 0; i < lista.length; i++) {
    var original = lista[i] || {};
    var limpio = {};
    for (var llave in original) {
      if (Object.prototype.hasOwnProperty.call(original, llave)) limpio[llave] = valorPlano(original[llave]);
    }
    salida.push(limpio);
  }
  return salida;
}

/** Un objeto nuevo con las llaves de los dos. El segundo manda si chocan. */
function unirObjetos(uno, otro) {
  var salida = {};
  for (var a in uno) if (Object.prototype.hasOwnProperty.call(uno, a)) salida[a] = uno[a];
  for (var b in otro) if (Object.prototype.hasOwnProperty.call(otro, b)) salida[b] = otro[b];
  return salida;
}

function comoBooleano(valor) {
  if (valor === true) return true;
  if (valor === false || valor === null || valor === undefined) return false;
  var texto = String(valor).trim().toLowerCase();
  return texto === 'si' || texto === 'sí' || texto === 'true' || texto === '1' || texto === 'x';
}

/**
 * Siguiente consecutivo del dia para los identificadores RM-AAAAMMDD-NNNN.
 * Solo cuenta los del mismo dia, asi el numero vuelve a 1 cada manana.
 */
function siguienteConsecutivo(identificadores, fechaIso) {
  var prefijo = 'RM-' + String(fechaIso || '').replace(/-/g, '') + '-';
  var mayor = 0;

  for (var i = 0; i < identificadores.length; i++) {
    var id = String(identificadores[i] || '');
    if (id.indexOf(prefijo) !== 0) continue;
    var numero = parseInt(id.slice(prefijo.length), 10);
    if (!isNaN(numero) && numero > mayor) mayor = numero;
  }
  return mayor + 1;
}

/**
 * Filtra solicitudes por lo que puede ver quien pregunta.
 * comercial y pruebas ven las suyas; legal ve las de su pais; admin ve todo.
 */
function solicitudesVisibles(solicitudes, correo, rol, paisDelUsuario) {
  var visibles = [];
  var correoNormalizado = String(correo || '').trim().toLowerCase();

  for (var i = 0; i < solicitudes.length; i++) {
    var solicitud = solicitudes[i];
    var propia = String(solicitud.email || '').trim().toLowerCase() === correoNormalizado;

    if (rol === 'admin' || propia) {
      visibles.push(solicitud);
    } else if (rol === 'legal' && solicitud.pais === paisDelUsuario) {
      visibles.push(solicitud);
    }
  }
  return visibles;
}

/** Busca texto en los campos visibles de una solicitud. */
function buscarEnSolicitudes(solicitudes, texto) {
  var buscado = String(texto || '').trim().toLowerCase();
  if (!buscado) return solicitudes;

  var encontradas = [];
  var campos = ['id', 'nombre_campana', 'tienda', 'organizador', 'pais', 'tipo', 'estado'];

  for (var i = 0; i < solicitudes.length; i++) {
    for (var c = 0; c < campos.length; c++) {
      var valor = String(solicitudes[i][campos[c]] || '').toLowerCase();
      if (valor.indexOf(buscado) !== -1) {
        encontradas.push(solicitudes[i]);
        break;
      }
    }
  }
  return encontradas;
}

/** Arma un CSV con separador de coma y comillas donde hace falta. */
function comoCsv(objetos, encabezados) {
  function escapar(valor) {
    var texto = valor === null || valor === undefined ? '' : String(valor);
    if (/[",\n]/.test(texto)) return '"' + texto.replace(/"/g, '""') + '"';
    return texto;
  }

  var lineas = [encabezados.map(escapar).join(',')];
  for (var i = 0; i < objetos.length; i++) {
    lineas.push(objetoComoFila(objetos[i], encabezados).map(escapar).join(','));
  }
  return lineas.join('\n');
}

if (typeof module !== 'undefined') {
  module.exports = {
    filasComoObjetos: filasComoObjetos,
    objetoComoFila: objetoComoFila,
    unirObjetos: unirObjetos,
    valorPlano: valorPlano,
    fechaComoTexto: fechaComoTexto,
    filasPlanas: filasPlanas,
    comoBooleano: comoBooleano,
    siguienteConsecutivo: siguienteConsecutivo,
    solicitudesVisibles: solicitudesVisibles,
    buscarEnSolicitudes: buscarEnSolicitudes,
    comoCsv: comoCsv,
  };
}

'use strict';

/**
 * Normalizacion de texto del motor.
 *
 * Vive en src/core porque la usan por igual Node (pruebas), Apps Script
 * (generacion del documento) y el navegador (vista previa en vivo).
 *
 * Los modelos y las salidas esperadas se editan en Windows, macOS y Linux. El
 * motor ignora los retornos de carro y la marca BOM para que el texto generado
 * sea identico en los tres sistemas, sin depender de la configuracion de git
 * de quien edite el archivo.
 *
 * Sin import ni require: en Apps Script estas funciones son globales.
 */

/** Quita la marca BOM y convierte \r\n y \r sueltos en \n. */
/**
 * Si un dato viene con algo adentro. Una lista vacia no cuenta.
 *
 * Esta aqui, una sola vez, porque estuvo definida tres veces (en derivados.js,
 * derivados_br.js y derivados_eta.js) con dos criterios distintos para las
 * listas. En Apps Script y en el navegador la ultima definicion pisa a las
 * otras, asi que el mismo dato se evaluaba distinto en Node y en produccion.
 */
function tieneValor(valor) {
  if (valor === null || valor === undefined || valor === '') return false;
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor.length > 0;
  return true;
}

function normalizarTexto(texto) {
  if (texto === null || texto === undefined) return '';
  var limpio = String(texto);
  if (limpio.charCodeAt(0) === 0xfeff) limpio = limpio.slice(1);
  return limpio.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

/** Separa en lineas despues de normalizar. */
function lineasDe(texto) {
  return normalizarTexto(texto).split('\n');
}

/** Quita espacios y tabulaciones al final de cada linea. */
function recortarFinalDeLinea(texto) {
  return lineasDe(texto)
    .map(function (linea) {
      return linea.replace(/[ \t]+$/, '');
    })
    .join('\n');
}

/**
 * Normalizacion usada para comparar el texto generado contra una salida
 * esperada: sin \r, sin espacios al final de linea y sin lineas en blanco al
 * principio ni al final.
 */
function normalizarParaComparar(texto) {
  return recortarFinalDeLinea(texto).replace(/^\n+/, '').replace(/\n+$/, '');
}

/**
 * El documento sin sus marcas de formato: lo que el documento dice, no como
 * se ve. Se usa para buscar frases y para la red de seguridad, donde un "**"
 * en medio no debe esconder un espacio de mas ni una frase rota.
 */
function textoPlano(texto) {
  return normalizarTexto(texto).replace(/\*\*/g, '');
}

/**
 * El termino de dias del pais, en singular cuando la cantidad es uno.
 *
 * La columna termino_dias de la pestana Paises guarda siempre el plural
 * ("dias calendario", "dias naturales", "dias corridos", "dias corridos" en
 * Brasil), porque es como aparece en las clausulas. Cuando la respuesta del
 * comercial es 1, ese plural sale pegado a la cifra y el documento publica
 * "una vigencia de un (1) dias calendario".
 *
 * Paso de verdad: la vigencia de los Creditos admite 1 dia (la pregunta acepta
 * de 1 a 365) y ningun caso dorado usaba ese valor, asi que ninguna prueba lo
 * veia. La red de seguridad del motor tampoco, porque la frase no tiene ningun
 * signo roto: solo esta mal escrita.
 *
 * No se reescribe el texto de Legal: se pone en singular la misma palabra que
 * Legal escribio. La regla es mecanica, sobre cada palabra del termino: lo que
 * termina en "es" pierde el "es" (naturales a natural), lo que termina en "s"
 * pierde la "s" (dias a dia, corridos a corrido) y lo demas se queda igual
 * (calendario). Si alguien escribe otro termino en el Sheet, lo peor que pasa
 * es que se quede como estaba.
 */
function terminoDeDias(pais, cantidad) {
  var termino = (pais && pais.termino_dias) || '';
  if (Number(cantidad) !== 1) return termino;
  return termino
    .split(' ')
    .map(function (palabra) {
      if (/es$/.test(palabra)) return palabra.slice(0, -2);
      if (/s$/.test(palabra)) return palabra.slice(0, -1);
      return palabra;
    })
    .join(' ');
}

/** true si el texto trae algun retorno de carro. */
function tieneRetornoDeCarro(texto) {
  return String(texto === null || texto === undefined ? '' : texto).indexOf('\r') !== -1;
}

if (typeof module !== 'undefined') {
  module.exports = {
    tieneValor: tieneValor,
    normalizarTexto: normalizarTexto,
    lineasDe: lineasDe,
    recortarFinalDeLinea: recortarFinalDeLinea,
    normalizarParaComparar: normalizarParaComparar,
    textoPlano: textoPlano,
    terminoDeDias: terminoDeDias,
    tieneRetornoDeCarro: tieneRetornoDeCarro,
  };
}

/**
 * Traduce un texto de interfaz. Sin traduccion devuelve el espanol, que es la
 * degradacion correcta: se entiende, aunque no este en el idioma pedido.
 */
function traducirInterfaz(texto, idioma) {
  if (!idioma || idioma === 'es') return texto;
  var diccionario = DICCIONARIOS[idioma];
  if (!diccionario) return texto;
  var traducido = diccionario[texto];
  return traducido === undefined ? texto : traducido;
}

if (typeof module !== 'undefined') {
  module.exports = {
    IDIOMAS_DE_INTERFAZ: IDIOMAS_DE_INTERFAZ,
    TEXTOS_PT: TEXTOS_PT,
    traducirInterfaz: traducirInterfaz,
  };
}

'use strict';

/**
 * Los T&C generales que Legal ya publico.
 *
 * En Colombia hay campanas para las que NO hay que generar nada: descuentos,
 * cupones, envio gratis y tarifa de servicio gratis ya tienen T&C publicados
 * por Legal, con su enlace fijo. El comercial solo tiene que poner ese enlace
 * en la pieza.
 *
 * Es casi la mitad de la demanda real: los descuentos que no son cashback son
 * 319 de 711 promociones (docs/PENDIENTES_LEGAL.md). Hasta hoy la herramienta
 * no los cubria y esa gente terminaba escribiendole a Legal para pedir algo que
 * ya existia.
 *
 * Aqui no se redacta ni se corrige nada: los textos salen tal cual de
 * data/tyc_genericos.json, que es la transcripcion del Excel de Legal.
 *
 * En Apps Script TYC_GENERICOS es global: lo genera el build desde
 * data/tyc_genericos.json. En Node se carga el JSON directamente.
 */
if (typeof module !== 'undefined' && typeof require === 'function' && typeof TYC_GENERICOS === 'undefined') {
  var TYC_GENERICOS = require('../../data/tyc_genericos.json');
}

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloDeFechas = require('./fechas.js');
  var formatearFecha = moduloDeFechas.formatearFecha;
  var comoNumeroFecha = moduloDeFechas.comoNumeroFecha;
}

/** Los T&C generales publicados para un pais, en el orden del Excel. */
function tycGenericosDelPais(codigoPais) {
  if (typeof TYC_GENERICOS === 'undefined' || !TYC_GENERICOS) return [];
  var porPais = TYC_GENERICOS.paises || {};
  return porPais[String(codigoPais || '').trim().toUpperCase()] || [];
}

/** Si este pais tiene algun T&C general publicado. Hoy solo Colombia. */
function hayTycGenericos(codigoPais) {
  return tycGenericosDelPais(codigoPais).length > 0;
}

/**
 * Los T&C generales que hoy se pueden usar: los vigentes.
 *
 * Catorce de los quince vencen el 31 de diciembre de 2026 y el otro el 31 de
 * octubre. Si nadie actualiza la lista, el 1 de enero de 2027 la tarjeta
 * seguia diciendo "Buena noticia: Legal ya publico los T&C" y detras habia
 * quince botones grises que no respondian al clic. Con esto, quien dibuja la
 * pantalla puede decir la verdad: que vencieron y que hay que escribirle a
 * Legal.
 */
function tycGenericosUsables(codigoPais, hoyIso) {
  var lista = tycGenericosDelPais(codigoPais);
  var usables = [];
  for (var i = 0; i < lista.length; i++) {
    if (estadoDeTycGenerico(lista[i], hoyIso).usable) usables.push(lista[i]);
  }
  return usables;
}

function hayTycGenericosUsables(codigoPais, hoyIso) {
  return tycGenericosUsables(codigoPais, hoyIso).length > 0;
}

function tycGenericoPorId(codigoPais, id) {
  var lista = tycGenericosDelPais(codigoPais);
  for (var i = 0; i < lista.length; i++) {
    if (lista[i].id === id) return lista[i];
  }
  return null;
}

/**
 * En que estado esta la vigencia de un T&C general, hoy.
 *
 * Importa porque un T&C vencido sigue estando en la lista de Legal: la Tarifa
 * de Servicio Gratis vence el 31 de octubre de 2026 y las demas el 31 de
 * diciembre. Ofrecer el enlace de uno vencido como si nada seria mandar a
 * publicar una pieza respaldada por un documento que ya no rige.
 *
 * Devuelve { estado, usable, mensaje, vigencia }. El estado es un
 * identificador interno; lo que se lee en pantalla es mensaje y vigencia.
 */
function estadoDeTycGenerico(tyc, hoyIso) {
  var inicio = comoNumeroFecha(tyc && tyc.vigenciaInicio);
  var fin = comoNumeroFecha(tyc && tyc.vigenciaFin);
  var hoy = comoNumeroFecha(hoyIso);

  var vigencia = vigenciaEnPalabras(tyc);

  // Sin fechas no se puede afirmar nada, y afirmar de menos es mejor que
  // afirmar de mas: se ofrece, pero diciendo que la vigencia no consta.
  if (inicio === null || fin === null) {
    return {
      estado: 'sin_vigencia',
      usable: true,
      vigencia: vigencia,
      mensaje: 'La lista de Legal no dice hasta cuándo rige este T&C. Confírmalo con Legal antes de publicar la pieza.',
    };
  }

  if (hoy === null) {
    return { estado: 'vigente', usable: true, vigencia: vigencia, mensaje: '' };
  }

  if (hoy < inicio) {
    return {
      estado: 'aun_no_arranca',
      usable: false,
      vigencia: vigencia,
      mensaje: 'Todavía no está vigente: arranca el ' + formatearFecha(tyc.vigenciaInicio) +
        '. Si tu campaña sale antes, escríbele a Legal.',
    };
  }

  if (hoy > fin) {
    return {
      estado: 'vencido',
      usable: false,
      vigencia: vigencia,
      mensaje: 'Venció el ' + formatearFecha(tyc.vigenciaFin) +
        '. No lo uses todavía: escríbele a Legal para que publique la versión nueva.',
    };
  }

  return { estado: 'vigente', usable: true, vigencia: vigencia, mensaje: '' };
}

/** "Del 1 de enero de 2026 al 31 de diciembre de 2026." */
function vigenciaEnPalabras(tyc) {
  var inicio = formatearFecha(tyc && tyc.vigenciaInicio);
  var fin = formatearFecha(tyc && tyc.vigenciaFin);
  if (!inicio && !fin) return 'Vigencia sin confirmar.';
  if (!fin) return 'Desde el ' + inicio + '.';
  if (!inicio) return 'Hasta el ' + fin + '.';
  return 'Del ' + inicio + ' al ' + fin + '.';
}

/**
 * Para que sirve un T&C general, en palabras.
 *
 * Dos filas del Excel de Legal llegaron sin descripcion (las de los cupones).
 * No se inventa una: se dice que falta, porque un comercial que lee una
 * descripcion inventada publica una pieza creyendo que esta cubierta.
 */
function descripcionDeTycGenerico(tyc) {
  var texto = String((tyc && tyc.paraQue) || '').trim();
  if (texto) return texto;
  return 'La lista de Legal no dice para qué sirve este T&C. Confírmalo con Legal antes de publicar la pieza.';
}

if (typeof module !== 'undefined') {
  module.exports = {
    tycGenericosDelPais: tycGenericosDelPais,
    hayTycGenericos: hayTycGenericos,
    tycGenericosUsables: tycGenericosUsables,
    hayTycGenericosUsables: hayTycGenericosUsables,
    tycGenericoPorId: tycGenericoPorId,
    estadoDeTycGenerico: estadoDeTycGenerico,
    vigenciaEnPalabras: vigenciaEnPalabras,
    descripcionDeTycGenerico: descripcionDeTycGenerico,
  };
}

'use strict';

/**
 * Validacion de la solicitud antes de generar.
 *
 * Bloquea la generacion (seccion 4.3). Cada error trae el campo y un mensaje
 * en lenguaje claro: que pasó y cómo se arregla.
 *
 * El orden importa. Si el pais no esta disponible para quien pide, no tiene
 * sentido revisar el resto: se devuelve solo ese error.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloEsquemas = require('./esquemas.js');
  var esquemaDe = moduloEsquemas.esquemaDe;
  var camposVisibles = moduloEsquemas.camposVisibles;
  var tieneCampo = moduloEsquemas.tieneCampo;
  var resolverAtributo = moduloEsquemas.resolverAtributo;

  var moduloFechas = require('./fechas.js');
  var comoNumeroFecha = moduloFechas.comoNumeroFecha;
  var comoNumeroFechaHora = moduloFechas.comoNumeroFechaHora;
  var partesDeFecha = moduloFechas.partesDeFecha;
  var partesDeHora = moduloFechas.partesDeHora;

  var moduloIdentificaciones = require('./identificaciones.js');
  var validarIdentificacion = moduloIdentificaciones.validarIdentificacion;

  var separarPorComas = moduloFechas.separarPorComas;
  var travelDisponible = require('./paises.js').travelDisponible;

  var preguntaDe = require('./preguntas.js').preguntaDe;
  var preguntaEnIdioma = require('./preguntas_pt.js').preguntaEnIdioma;
}

function error(campo, mensaje) {
  return { campo: campo, mensaje: mensaje };
}

/**
 * El mensaje escrito para una pregunta, en el idioma de la interfaz.
 *
 * Cada pregunta trae sus mensajes en `errores` (vacio, pasado, orden, cero...),
 * escritos para el comercial. Durante mucho tiempo solo se uso errores.vacio y
 * el resto se armaba aqui a mano, generico y en espanol: un KAM de Brasil con
 * la interfaz en portugues leia "La campaña no puede empezar en una fecha que
 * ya pasó" en medio de una pantalla en portugues, y un comercial de Colombia
 * leia "Tope por pedido debe ser al menos 1" en vez de la frase que alguien
 * escribio para eso. El generico queda solo para cuando la pregunta no tiene
 * ese mensaje.
 *
 * `claves` puede ser una sola o una lista en orden de preferencia.
 */
function mensajeDe(campoId, tipo, claves, idioma, generico) {
  var pregunta = preguntaDe(campoId, tipo);
  if (pregunta && typeof preguntaEnIdioma === 'function') {
    pregunta = preguntaEnIdioma(pregunta, campoId, idioma, tipo);
  }
  var lista = Object.prototype.toString.call(claves) === '[object Array]' ? claves : [claves];
  for (var i = 0; i < lista.length; i++) {
    if (pregunta && pregunta.errores && pregunta.errores[lista[i]]) return pregunta.errores[lista[i]];
  }
  return generico;
}

function estaVacio(valor) {
  if (valor === null || valor === undefined || valor === '') return true;
  if (typeof valor === 'boolean') return valor === false;
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor.length === 0;
  return false;
}

/** El pais esta disponible para quien pide (seccion 4.3, punto 6). */
function validarPais(pais, usuarioEnEquipo) {
  if (!pais) {
    return error('pais', 'No reconocemos ese país. Elige uno de la lista.');
  }
  if (pais.estado === 'bloqueado') {
    return error('pais', 'Todavía no generamos documentos para ' + pais.nombre + '. Escríbele a Legal.');
  }
  if (pais.estado === 'piloto' && !usuarioEnEquipo) {
    return error('pais', pais.nombre + ' está en piloto. Pídele a Legal que te agregue al equipo de pruebas.');
  }
  return null;
}

/** El tipo de campana existe y esta habilitado para el pais (punto 7). */
function validarTipo(tipo, pais) {
  var esquema = esquemaDe(tipo);
  if (!esquema) {
    return error('tipo', 'No reconocemos ese tipo de campaña. Elige uno de la lista.');
  }
  var habilitados = pais.modelos || [];
  for (var i = 0; i < habilitados.length; i++) {
    if (habilitados[i] === esquema.modelo) return null;
  }
  return error('tipo', 'El tipo "' + esquema.nombre + '" todavía no está habilitado para ' + pais.nombre + '.');
}

/** Campos obligatorios visibles que quedaron vacios. */
function validarObligatorios(entrada, esquema, idioma) {
  var errores = [];
  var visibles = camposVisibles(esquema.id, entrada);

  for (var i = 0; i < visibles.length; i++) {
    var campo = visibles[i];
    // Los repetibles se revisan aparte, con su minimo y su maximo.
    if (campo.tipo === 'repetible') continue;
    if (!resolverAtributo(campo.obligatorio, entrada, false)) continue;

    if (estaVacio(entrada[campo.id])) {
      // El mensaje escrito para esa pregunta manda sobre el generico. Cada
      // pregunta tiene uno en errores.vacio, y estuvieron sin usarse: el
      // comercial leia "Falta minutos del eta." en vez de "Escribe en cuantos
      // minutos prometes la entrega.".
      errores.push(error(campo.id, mensajeDe(campo.id, esquema.id, 'vacio', idioma,
        'Falta ' + campo.etiqueta.toLowerCase() + '.')));
    }
  }
  return errores;
}

/** Rangos, formatos de fecha y hora, y largo de los textos. */
function validarFormatos(entrada, esquema, idioma) {
  var errores = [];
  var visibles = camposVisibles(esquema.id, entrada);

  for (var i = 0; i < visibles.length; i++) {
    var campo = visibles[i];
    var valor = entrada[campo.id];
    if (estaVacio(valor)) continue;

    if (campo.tipo === 'numero') {
      var numero = Number(valor);
      if (isNaN(numero)) {
        errores.push(error(campo.id, campo.etiqueta + ' debe ser un número.'));
      } else if (campo.minimo !== undefined && numero < campo.minimo) {
        // Un minimo de uno es "mayor que cero": si la pregunta escribio ese
        // mensaje (errores.cero), se prefiere al de rango.
        errores.push(error(campo.id, mensajeDe(campo.id, esquema.id, campo.minimo === 1 ? ['rango', 'cero'] : ['rango'], idioma,
          campo.etiqueta + ' debe ser al menos ' + campo.minimo + '.')));
      } else if (campo.maximo !== undefined && numero > campo.maximo) {
        errores.push(error(campo.id, mensajeDe(campo.id, esquema.id, 'rango', idioma,
          campo.etiqueta + ' no puede pasar de ' + campo.maximo + '.')));
      }
    } else if (campo.tipo === 'fecha' && !partesDeFecha(valor)) {
      errores.push(error(campo.id, campo.etiqueta + ' no es una fecha válida.'));
    } else if (campo.tipo === 'hora' && !partesDeHora(valor)) {
      errores.push(error(campo.id, campo.etiqueta + ' no es una hora válida.'));
    } else if (campo.tipo === 'texto' && campo.maximo !== undefined && String(valor).length > campo.maximo) {
      errores.push(error(campo.id, mensajeDe(campo.id, esquema.id, 'largo', idioma,
        campo.etiqueta + ' no puede pasar de ' + campo.maximo + ' caracteres.')));
    }
  }
  return errores;
}

/**
 * El dia en que termina la campana.
 *
 * Un tipo que no pregunta la fecha de fin (el cashback por ETA es de un solo
 * dia) termina el dia que empieza. Leer entrada.fechaFin ahi era leer un dato
 * que la interfaz fijaba una vez y nunca actualizaba: al cambiar el dia de
 * inicio, el resumen decia "la campana no puede terminar antes de empezar" y
 * no habia ninguna pregunta donde arreglarlo.
 */
function fechaFinDeLaCampana(entrada, esquema) {
  if (esquema && !tieneCampo(esquema, 'fechaFin')) return entrada.fechaInicio;
  return entrada.fechaFin;
}

/**
 * Vigencia: fin posterior al inicio y nada anterior a la fecha de referencia.
 *
 * esAmpliacion: la campana ya arranco y se esta ampliando. Ahi el inicio en el
 * pasado es lo normal, no un error. Sin esta excepcion, ampliar solo funcionaba
 * el mismo dia del inicio, porque el documento nuevo se vuelve a validar
 * completo y "Esa fecha ya paso" tumbaba la ampliacion desde el segundo dia.
 */
function validarVigencia(entrada, fechaReferencia, esquema, idioma, esAmpliacion) {
  var errores = [];
  var tipo = esquema ? esquema.id : undefined;
  var preguntaElFin = !esquema || tieneCampo(esquema, 'fechaFin');

  var inicio = comoNumeroFechaHora(entrada.fechaInicio, entrada.horaInicio);
  var fin = comoNumeroFechaHora(fechaFinDeLaCampana(entrada, esquema), entrada.horaFin);
  if (inicio !== null && fin !== null && fin <= inicio) {
    // El error va a la pregunta que existe: en un tipo de un solo dia, la hora.
    errores.push(preguntaElFin
      ? error('fechaFin', mensajeDe('fechaFin', tipo, 'orden', idioma,
        'La campaña no puede terminar antes de empezar. Revisa la fecha y la hora de fin.'))
      : error('horaFin', mensajeDe('horaFin', tipo, 'orden', idioma,
        'La hora de fin tiene que ser después de la de inicio.')));
  }

  if (esAmpliacion) return errores;

  var hoy = comoNumeroFecha(fechaReferencia);
  var dia = comoNumeroFecha(entrada.fechaInicio);
  if (hoy !== null && dia !== null && dia < hoy) {
    errores.push(error('fechaInicio', mensajeDe('fechaInicio', tipo, 'pasado', idioma,
      'La campaña no puede empezar en una fecha que ya pasó.')));
  }
  return errores;
}

/** Identificacion del organizador, con el algoritmo del pais. */
function validarOrganizador(entrada, pais) {
  if (estaVacio(entrada.organizadorId)) return [];
  var revision = validarIdentificacion(pais.codigo, entrada.organizadorId);
  return revision.valido ? [] : [error('organizadorId', revision.mensaje)];
}

/**
 * Las marcas que delatan una anotacion interna dentro de un valor del pais.
 *
 * La fila de Brasil llego a tener la autoridad de datos escrita como
 * "a Autoridade Nacional de Protecao de Dados (ANPD) (confirmar)". Ese valor se
 * imprime tal cual en la clausula de datos personales, asi que un T&C publicado
 * habria salido con la palabra "(confirmar)" dentro. Para marcar lo que falta
 * esta la columna por_confirmar_en_pruebas, no el texto.
 */
var MARCAS_DE_ANOTACION = [
  // Entre parentesis o corchetes, con lo que sea alrededor: "(a confirmar)",
  // "[pendiente]", "(revisar con Legal)", "(por definir)".
  /[\[(][^\])]*\b(confirmar|revisar|pendiente|verificar|definir|ojo|dudoso)\b[^\])]*[\])]/i,
  // Las marcas de programador, solo en mayusculas: "todo" es una palabra normal.
  /\b(TODO|TBD|FIXME|XXX|PENDIENTE)\b/,
  // Signos de duda, y la sintaxis de los modelos, que en un valor del pais no
  // pinta nada.
  /\?\?|\(\?\)|\{\{|\[\[/,
];

/** true si el valor trae una anotacion interna. */
function tieneMarcaDeAnotacion(valor) {
  var texto = String(valor || '');
  for (var i = 0; i < MARCAS_DE_ANOTACION.length; i++) {
    if (MARCAS_DE_ANOTACION[i].test(texto)) return true;
  }
  return false;
}

/**
 * Un valor del pais con una anotacion interna adentro no se publica.
 *
 * Se revisan solo las columnas que de verdad salen impresas: las que un modelo
 * puede pedir con un placeholder.
 */
function validarAnotacionesDelPais(pais) {
  var errores = [];
  if (!pais) return errores;

  for (var llave in pais) {
    if (!Object.prototype.hasOwnProperty.call(pais, llave)) continue;
    if (llave === 'por_confirmar_en_pruebas' || llave === '_fila' || llave === 'modelos') continue;

    var valor = pais[llave];
    if (typeof valor !== 'string') continue;
    if (!tieneMarcaDeAnotacion(valor)) continue;

    errores.push(error('pais',
      'La configuración de ' + (pais.nombre || pais.codigo) + ' tiene una nota interna dentro de un dato que se imprime: "' +
      valor.trim() + '". Eso saldría publicado en el documento. Quítala de la pestaña Paises y marca ese dato en la columna de pendientes.'));
  }
  return errores;
}

/**
 * Un modelo escrito en otro idioma exige que el pais lo diga.
 *
 * El idioma del documento sale de la columna idioma de la pestaña Paises, que
 * se edita a mano y manda sobre la semilla. Con esa celda vacia, el motor caia
 * a espanol en silencio y el T&C de Brasil salia con "1 de octubre de 2026 às
 * 12:01 a. m." y "diez por ciento (10%)" en medio del portugues, sin un solo
 * error. Regla 2 de CLAUDE.md: si falta un dato, no se genera.
 */
function validarIdiomaDelPais(esquema, pais) {
  if (!esquema) return null;
  var idiomaDelPais = String((pais && pais.idioma) || '').trim().toLowerCase();

  if (esquema.idioma) {
    if (idiomaDelPais === esquema.idioma) return null;
    return error('pais', 'La configuración de ' + (pais.nombre || pais.codigo) +
      ' no dice que el documento va en ' + nombreDelIdioma(esquema.idioma) +
      ': la columna idioma de la pestaña Paises tiene que decir "' + esquema.idioma +
      '". Sin eso las fechas y los montos saldrían en español.');
  }

  // Al reves tambien. Un modelo en espanol habilitado en un pais que genera en
  // otro idioma saldria mezclado: "vinte por cento" y "horário de Brasília"
  // dentro de un articulado en espanol, sin un solo error.
  if (!idiomaDelPais || idiomaDelPais === 'es') return null;
  return error('tipo', 'Este tipo de campaña está escrito en español y la configuración de ' +
    (pais.nombre || pais.codigo) + ' dice que sus documentos van en ' + nombreDelIdioma(idiomaDelPais) +
    '. Hasta que Legal tenga este modelo en ese idioma, no se puede generar ahí.');
}

function nombreDelIdioma(codigo) {
  return codigo === 'pt' ? 'portugués' : codigo === 'es' ? 'español' : codigo;
}

/**
 * El cashback por ETA es de una sola ciudad.
 *
 * La pregunta lo dice, pero los chips de ciudades heredados del cashback dejaban
 * agregar dos, y el documento salia "en la ciudad de Bogotá, Medellín".
 */
function validarEta(entrada, tipo, idioma) {
  if (separarPorComas(entrada.ciudades).length <= 1) return [];
  return [error('ciudades', mensajeDe('ciudades', tipo, 'unaSola', idioma,
    'Escribe una sola ciudad. Para otra ciudad, haz otra campaña.'))];
}

/** Cruces propios del Cashback. */
function validarCashback(entrada, tipo, idioma) {
  var errores = [];
  var tope = Number(entrada.tope);
  var presupuesto = Number(entrada.presupuesto);

  if (entrada.tope !== null && entrada.tope !== undefined && entrada.tope !== '' && tope <= 0) {
    errores.push(error('tope', mensajeDe('tope', tipo, 'cero', idioma, 'El tope por pedido debe ser mayor que cero.')));
  }
  if (entrada.presupuesto !== null && entrada.presupuesto !== undefined && entrada.presupuesto !== '' && presupuesto <= 0) {
    errores.push(error('presupuesto', mensajeDe('presupuesto', tipo, 'cero', idioma, 'El presupuesto debe ser mayor que cero.')));
  }
  if (tope > 0 && presupuesto > 0 && tope > presupuesto) {
    errores.push(error('tope', mensajeDe('tope', tipo, 'mayorQuePresupuesto', idioma,
      'El tope por pedido no puede ser mayor que el presupuesto total.')));
  }
  return errores;
}

/** Cruces de los Creditos: carga y redencion frente a la vigencia. */
function validarCreditos(entrada, esquema, idioma) {
  var errores = [];
  var tipo = esquema ? esquema.id : undefined;
  var inicio = comoNumeroFecha(entrada.fechaInicio);
  var fin = comoNumeroFecha(fechaFinDeLaCampana(entrada, esquema));

  if (entrada.carga === 'fecha') {
    var carga = comoNumeroFecha(entrada.fechaCarga);
    if (carga !== null && inicio !== null && carga < inicio) {
      errores.push(error('fechaCarga', mensajeDe('fechaCarga', tipo, 'antes', idioma,
        'La fecha de carga no puede ser anterior al inicio de la campaña.')));
    }
  }

  if (entrada.vigencia === 'fecha') {
    var redencion = comoNumeroFecha(entrada.fechaFinRedencion);
    if (redencion !== null && fin !== null && redencion <= fin) {
      errores.push(error('fechaFinRedencion', mensajeDe('fechaFinRedencion', tipo, 'orden', idioma,
        'La fecha límite de redención debe ser posterior al fin de la campaña.')));
    }
  }
  return errores;
}

/** Cruces de la Carrera de Compras. */
function validarCarrera(entrada, tipo, idioma) {
  var errores = [];

  if (entrada.desempate && entrada.desempate === entrada.criterioGanador) {
    errores.push(error('desempate', mensajeDe('desempate', tipo, 'igual', idioma,
      'El desempate no puede ser el mismo criterio con el que se define el ganador. Elige otro.')));
  }

  var fin = comoNumeroFecha(entrada.fechaFin);
  var notificacion = comoNumeroFecha(entrada.fechaNotificacion);
  if (fin !== null && notificacion !== null && notificacion <= fin) {
    errores.push(error('fechaNotificacion', mensajeDe('fechaNotificacion', tipo, 'orden', idioma,
      'La fecha de notificación debe ser posterior al fin de la campaña.')));
  }
  return errores;
}

/** La lista de tiendas del Cashback Day. */
function validarTiendas(entrada, pais, esquema) {
  var errores = [];
  var tiendas = entrada.tiendas || [];
  var definicion = null;

  for (var i = 0; i < esquema.campos.length; i++) {
    if (esquema.campos[i].id === 'tiendas') definicion = esquema.campos[i];
  }
  var minimo = definicion && definicion.minimo !== undefined ? definicion.minimo : 2;
  var maximo = definicion && definicion.maximo !== undefined ? definicion.maximo : 60;

  if (tiendas.length < minimo) {
    errores.push(error('tiendas', 'Agrega al menos ' + minimo + ' tiendas participantes.'));
    return errores;
  }
  if (tiendas.length > maximo) {
    errores.push(error('tiendas', 'No puedes agregar más de ' + maximo + ' tiendas.'));
    return errores;
  }

  var vistos = {};
  for (var t = 0; t < tiendas.length; t++) {
    var tienda = tiendas[t];
    var fila = t + 1;

    for (var c = 0; c < esquema.camposPorTienda.length; c++) {
      var campo = esquema.camposPorTienda[c];
      if (!resolverAtributo(campo.obligatorio, tienda, false)) continue;
      if (estaVacio(tienda[campo.id])) {
        errores.push(error('tiendas', 'Tienda ' + fila + ': falta ' + campo.etiqueta.toLowerCase() + '.'));
        continue;
      }
      /*
       * Los numeros de la tienda pasaban sin revisar. Un presupuesto en cero no
       * esta vacio (estaVacio(0) es false), asi que llegaba hasta el documento y
       * la fila de esa tienda salia "Beer Station (Bogota): cero (0) Creditos".
       * La pantalla si lo marcaba en rojo, porque alli 0 se lee como falta de
       * dato: la pantalla y el motor decian cosas distintas del mismo numero.
       */
      if (campo.tipo === 'numero') {
        var numeroDeTienda = Number(tienda[campo.id]);
        if (isNaN(numeroDeTienda)) {
          errores.push(error('tiendas', 'Tienda ' + fila + ': ' + campo.etiqueta.toLowerCase() + ' tiene que ser un número.'));
        } else if (campo.minimo !== undefined && numeroDeTienda < campo.minimo) {
          errores.push(error('tiendas', 'Tienda ' + fila + ': ' + campo.etiqueta.toLowerCase() +
            ' tiene que ser al menos ' + campo.minimo + '.'));
        } else if (campo.maximo !== undefined && numeroDeTienda > campo.maximo) {
          errores.push(error('tiendas', 'Tienda ' + fila + ': ' + campo.etiqueta.toLowerCase() +
            ' no puede pasar de ' + campo.maximo + '.'));
        }
      }
    }

    if (!estaVacio(tienda.id)) {
      var revision = validarIdentificacion(pais.codigo, tienda.id);
      if (!revision.valido) {
        errores.push(error('tiendas', 'Tienda ' + fila + ': ' + revision.mensaje));
      } else if (vistos[revision.formateado]) {
        errores.push(error('tiendas', 'Tienda ' + fila + ': esa identificación ya está en la tienda ' + vistos[revision.formateado] + '.'));
      } else {
        vistos[revision.formateado] = fila;
      }
    }
  }
  return errores;
}

var PREFIJO_PUBLICACION = 'https://promos.rappi.com/';

/**
 * El link publicado tiene que vivir en promos.rappi.com. Cualquier otro sitio
 * significa que el T&C no quedo donde la campana lo va a referenciar.
 */
function validarLinkPublicado(url) {
  var texto = String(url || '').trim();
  if (!texto) {
    return { valido: false, mensaje: 'Pega el enlace de la página publicada.' };
  }
  if (texto.indexOf(PREFIJO_PUBLICACION) !== 0) {
    return { valido: false, mensaje: 'El enlace debe empezar por ' + PREFIJO_PUBLICACION + '. Copia la dirección de la página ya publicada en Squarespace.' };
  }
  if (texto.length <= PREFIJO_PUBLICACION.length) {
    return { valido: false, mensaje: 'Falta la parte final del enlace, después de ' + PREFIJO_PUBLICACION + '.' };
  }
  return { valido: true, mensaje: '', url: texto };
}

// --- Rappi Travel ----------------------------------------------------------

/** Solo los digitos de una identificacion, para comparar sin formato. */
function soloDigitosDeId(valor) {
  return String(valor === null || valor === undefined ? '' : valor).replace(/[^0-9]/g, '');
}

/** El NIT sin su digito de verificacion. */
function nitSinVerificacion(valor) {
  var digitos = soloDigitosDeId(valor);
  return digitos.length > 9 ? digitos.slice(0, 9) : digitos;
}

/** Texto en minusculas y sin tildes, para comparar nombres de empresas. */
function comoClaveDeNombre(texto) {
  var original = String(texto === null || texto === undefined ? '' : texto).toLowerCase();
  var con = 'áàäâãéèëêíìïîóòöôõúùüûñç';
  var sin = 'aaaaaeeeeiiiiooooouuuunc';
  var salida = '';
  for (var i = 0; i < original.length; i++) {
    var posicion = con.indexOf(original.charAt(i));
    salida += posicion === -1 ? original.charAt(i) : sin.charAt(posicion);
  }
  return salida;
}

/** Nombres que nunca pueden ser el Organizador de una campana de Travel. */
var NOMBRES_PROHIBIDOS_DE_TRAVEL = ['rappi', 'travel moustache', 'travel mustache'];

var MENSAJE_ORGANIZADOR_DE_TRAVEL =
  'Rappi Travel nunca es el Organizador. Escribe la empresa dueña de la marca que paga el beneficio. ' +
  'Si la campaña la paga Rappi Travel, la redacta Legal.';

/**
 * El Organizador de una campana de Travel no puede ser Rappi ni Travel Moustache.
 *
 * Es la regla 1 de CLAUDE.md llevada a Travel: el Organizador es siempre quien
 * pone la plata, y que Rappi Travel opere la mecanica no lo vuelve organizador.
 */
function validarOrganizadorDeTravel(entrada, pais) {
  var errores = [];

  var nombre = comoClaveDeNombre(entrada.organizadorRazonSocial);
  for (var i = 0; i < NOMBRES_PROHIBIDOS_DE_TRAVEL.length; i++) {
    if (nombre.indexOf(NOMBRES_PROHIBIDOS_DE_TRAVEL[i]) !== -1) {
      errores.push(error('organizadorRazonSocial', MENSAJE_ORGANIZADOR_DE_TRAVEL));
      break;
    }
  }

  var nitDado = nitSinVerificacion(entrada.organizadorId);
  var prohibidos = [nitSinVerificacion(pais && pais.id_fiscal), nitSinVerificacion(pais && pais.travel_id_fiscal)];
  if (nitDado && prohibidos.indexOf(nitDado) !== -1) {
    errores.push(error('organizadorId', MENSAJE_ORGANIZADOR_DE_TRAVEL));
  }
  return errores;
}

/** Las reglas propias de los dos tipos de Travel. Seccion 10 del modelo base. */
function validarTravel(entrada, pais, fechaReferencia, esAmpliacion) {
  var errores = [];
  var esDescuento = entrada.tipo === 'descuento_travel';

  errores = errores.concat(validarOrganizadorDeTravel(entrada, pais));

  // Si el aliado pide algo que el formulario no cubre, el documento se queda
  // corto: eso lo redacta Legal.
  if (entrada.otraCondicion === 'si') {
    errores.push(error('otraCondicion', 'El aliado pide una condición que este documento no cubre. Esta campaña la redacta Legal.'));
  }

  // Periodo de viaje.
  var viajeInicio = comoNumeroFecha(entrada.periodoViajeInicio);
  var viajeFin = comoNumeroFecha(entrada.periodoViajeFin);
  if (viajeInicio !== null && viajeFin !== null && viajeFin < viajeInicio) {
    errores.push(error('periodoViajeFin', 'El periodo de viaje no puede terminar antes de empezar.'));
  }

  var excluidas = separarPorComas(entrada.fechasExcluidas);
  for (var f = 0; f < excluidas.length; f++) {
    var excluida = comoNumeroFecha(excluidas[f]);
    if (excluida === null) {
      errores.push(error('fechasExcluidas', 'Las fechas excluidas van en formato año-mes-día, separadas por comas. Revisa "' + excluidas[f] + '".'));
      break;
    }
    if (viajeInicio !== null && viajeFin !== null && (excluida < viajeInicio || excluida > viajeFin)) {
      errores.push(error('fechasExcluidas', 'Las fechas excluidas tienen que estar dentro del periodo de viaje. Revisa "' + excluidas[f] + '".'));
      break;
    }
  }

  // Clases tarifarias: una letra cada una, sin repetir.
  var clases = separarPorComas(entrada.clasesExcluidas);
  var vistas = {};
  for (var c = 0; c < clases.length; c++) {
    var clase = String(clases[c]).toUpperCase();
    if (!/^[A-Z]$/.test(clase)) {
      errores.push(error('clasesExcluidas', 'Cada clase tarifaria es una sola letra, separada por comas. Revisa "' + clases[c] + '".'));
      break;
    }
    if (vistas[clase]) {
      errores.push(error('clasesExcluidas', 'La clase tarifaria "' + clase + '" está repetida.'));
      break;
    }
    vistas[clase] = true;
  }

  // Dias de alquiler.
  var minimoDias = Number(entrada.diasAlquilerMinimo);
  var maximoDias = Number(entrada.diasAlquilerMaximo);
  if (isFinite(minimoDias) && minimoDias > 0 && isFinite(maximoDias) && maximoDias > 0 && minimoDias > maximoDias) {
    errores.push(error('diasAlquilerMaximo', 'El mínimo de días de alquiler no puede ser mayor que el máximo.'));
  }

  // El medio de pago de "Pro o RappiCard" no puede excluir a quien paga con
  // otra cosa: el segmento ya dice que RappiCard es una via de entrada.
  if (entrada.segmento === 'pro_o_rappicard' && entrada.metodoPago !== 'digitales') {
    errores.push(error('metodoPago', 'Si pueden participar quienes pagan con RappiCard, el medio de pago tiene que ser "digitales, excepto efectivo". Si no, el documento se contradice.'));
  }

  // La primera comunicacion nunca puede haber salido ya: el T&C se publica
  // antes. Salvo al ampliar, que la campana ya esta corriendo.
  var hoy = comoNumeroFecha(fechaReferencia);
  var primera = comoNumeroFecha(entrada.fechaPrimeraComunicacion);
  if (!esAmpliacion && hoy !== null && primera !== null && primera < hoy) {
    errores.push(error('fechaPrimeraComunicacion', 'La primera comunicación no puede ser una fecha que ya pasó: el T&C se publica antes de que salga la primera pieza.'));
  }

  if (esDescuento) {
    errores = errores.concat(validarDescuentoTravel(entrada));
  } else {
    errores = errores.concat(validarCashbackTravel(entrada));
  }
  return errores;
}

/** Reglas del cashback_travel: montos, ordenes y redencion. */
function validarCashbackTravel(entrada) {
  var errores = [];
  var presupuesto = Number(entrada.presupuesto);

  if (entrada.formaBeneficio === 'porcentaje' && !entrada.sinTope) {
    var tope = Number(entrada.tope);
    if (isFinite(tope) && tope > 0 && isFinite(presupuesto) && presupuesto > 0 && tope > presupuesto) {
      errores.push(error('tope', 'El tope por orden es mayor que el presupuesto total. Con eso, la primera orden se lleva toda la campaña. Revisa los dos números.'));
    }
  }
  if (entrada.formaBeneficio === 'monto_fijo') {
    var monto = Number(entrada.montoFijo);
    if (isFinite(monto) && monto > 0 && isFinite(presupuesto) && presupuesto > 0 && monto > presupuesto) {
      errores.push(error('montoFijo', 'Los Créditos por orden son más que el presupuesto total. Revisa los dos números.'));
    }
  }

  var porUsuario = Number(entrada.limitePorUsuario);
  var deLaCampana = Number(entrada.maxOrdenes);
  if (!entrada.sinMaxOrdenes && isFinite(porUsuario) && porUsuario > 0 && isFinite(deLaCampana) && deLaCampana > 0 && deLaCampana < porUsuario) {
    errores.push(error('maxOrdenes', 'El máximo de órdenes de la campaña es menor que el máximo por persona. Una sola persona agotaría la campaña.'));
  }

  if (entrada.redencion === 'categorias') {
    var elegidas = entrada.categoriasRedencion || [];
    if (elegidas.length === 0) {
      errores.push(error('categoriasRedencion', 'Marca al menos una categoría donde se puedan usar los Créditos.'));
    }
  }
  return errores;
}

/** Reglas del descuento_travel: porcentajes, asistencia y visibilidad. */
function validarDescuentoTravel(entrada) {
  var errores = [];

  if (entrada.formaDescuento === 'variable') {
    var minimo = Number(entrada.porcentajeMinimo);
    var maximo = Number(entrada.porcentaje);
    if (isFinite(minimo) && isFinite(maximo) && minimo >= maximo) {
      errores.push(error('porcentajeMinimo', 'El porcentaje mínimo tiene que ser menor que el máximo. Si son iguales, el descuento es fijo.'));
    }
  }

  // Una asistencia al viajero se compra junto con el vuelo o el paquete, y el
  // descuento solo cubre la asistencia. Mezclarla con otra categoria haria que
  // el documento no pueda decir sobre que aplica.
  var categorias = entrada.categorias || [];
  if (categorias.indexOf('Asistencia') !== -1 && categorias.length > 1) {
    errores.push(error('categorias', 'Si la campaña incluye "Asistencia", esa tiene que ser la única categoría. Para las demás, haz una campaña aparte.'));
  }

  if ((entrada.visibilidad || []).length === 0) {
    errores.push(error('visibilidad', 'Marca al menos un lugar donde el usuario vea el descuento.'));
  }
  return errores;
}

/**
 * Avisos de Travel: no bloquean, se muestran en el resumen.
 *
 * PENDIENTE (R17 de docs/MODELO_BASE_TRAVEL.md): Juan decide si alguno pasa a
 * ser un bloqueo.
 */
function avisosDeTravel(entrada) {
  var avisos = [];

  var dias = Number(entrada.diasVigencia);
  if (isFinite(dias) && dias > 0 && dias < 5) {
    avisos.push('Los Créditos duran menos de cinco días. En las campañas reales, una vigencia tan corta genera reclamos de usuarios que no alcanzan a usarlos.');
  }

  var primera = comoNumeroFecha(entrada.fechaPrimeraComunicacion);
  var inicio = comoNumeroFecha(entrada.fechaInicio);
  if (primera !== null && inicio !== null && primera < inicio) {
    avisos.push('La primera pieza sale antes de que arranque la campaña. Publica el T&C antes de esa fecha.');

 * Son dos empresas distintas: los domicilios los opera Rappi S.A.S. y los
 * viajes Travel Moustache S.A.S. Un documento con el negocio de una y el tipo
 * de la otra saldria a nombre de quien no es.

function validarNegocio(entrada, esquema) {
  if (!esquema || estaVacio(entrada.negocio)) return [];
  var esperado = esquema.esDeTravel ? 'travel' : 'rappi';
  if (entrada.negocio === esperado) return [];
  return [error('negocio', esquema.esDeTravel

}

/**
 * Valida la solicitud completa.
 *
 * contexto: { fechaReferencia, usuarioEnEquipo, idioma, ampliacion }
 * `idioma` es el de la interfaz de quien pide (es o pt): los mensajes salen en
 * ese idioma cuando la pregunta los tiene traducidos. El documento no cambia.
 * `ampliacion` es true cuando se rearma el documento de una campana que ya
 * arranco: las fechas que ya pasaron dejan de ser un error.
 * Devuelve { valido, errores: [{campo, mensaje}] }.
 */
function validarSolicitud(entrada, pais, contexto) {
  var opciones = contexto || {};
  var errorPais = validarPais(pais, !!opciones.usuarioEnEquipo);
  if (errorPais) return { valido: false, errores: [errorPais] };

  var errorTipo = validarTipo(entrada.tipo, pais);
  if (errorTipo) return { valido: false, errores: [errorTipo] };

  var esquema = esquemaDe(entrada.tipo);
  var errorIdioma = validarIdiomaDelPais(esquema, pais);
  if (errorIdioma) return { valido: false, errores: [errorIdioma] };

  var errores = [];
  var idioma = opciones.idioma;

  errores = errores.concat(validarObligatorios(entrada, esquema, idioma));
  errores = errores.concat(validarFormatos(entrada, esquema, idioma));
  errores = errores.concat(validarVigencia(entrada, opciones.fechaReferencia, esquema, idioma, !!opciones.ampliacion));
  errores = errores.concat(validarOrganizador(entrada, pais));
  errores = errores.concat(validarCreditos(entrada, esquema, idioma));
  errores = errores.concat(validarNegocio(entrada, esquema));

  errores = errores.concat(validarAnotacionesDelPais(pais));

  // El cashback por ETA tiene los mismos dos numeros y el mismo riesgo: un tope
  // mayor que el presupuesto deja que la primera orden se lleve la campana.
  // El Cashback Multitienda tiene el mismo tope por pedido, y hasta ahora nadie
  // revisaba que fuera mayor que cero: con un 0 el documento salia prometiendo
  // un maximo de cero Creditos por pedido. No tiene presupuesto de campana
  // (cada tienda pone el suyo), asi que el cruce contra el presupuesto no aplica.
  if (entrada.tipo === 'cashback' || entrada.tipo === 'cashback_eta' || entrada.tipo === 'cashback_day') {
    errores = errores.concat(validarCashback(entrada, esquema.id, idioma));
  }
  if (esquema.esPorEta) {
    errores = errores.concat(validarEta(entrada, esquema.id, idioma));
  }
  if (entrada.tipo === 'carrera_compras') {
    errores = errores.concat(validarCarrera(entrada, esquema.id, idioma));
  }
  if (entrada.tipo === 'cashback_day') {
    errores = errores.concat(validarTiendas(entrada, pais, esquema));
  }
  if (esquema && esquema.esDeTravel) {
    // Sin los datos de Travel del pais, o con el RNT vencido, no se genera.
    var estadoTravel = travelDisponible(pais, opciones.fechaReferencia);
    if (!estadoTravel.disponible) {
      return { valido: false, errores: [error('tipo', estadoTravel.motivo)] };
    }
    errores = errores.concat(validarTravel(entrada, pais, opciones.fechaReferencia, !!opciones.ampliacion));
  }

  return { valido: errores.length === 0, errores: errores };
}

if (typeof module !== 'undefined') {

    validarLinkPublicado: validarLinkPublicado,
    PREFIJO_PUBLICACION: PREFIJO_PUBLICACION,

    validarObligatorios: validarObligatorios,
    validarVigencia: validarVigencia,
    tieneMarcaDeAnotacion: tieneMarcaDeAnotacion,
    validarTiendas: validarTiendas,

    validarTravel: validarTravel,

    validarCashbackTravel: validarCashbackTravel,
    validarDescuentoTravel: validarDescuentoTravel,

    validarIdiomaDelPais: validarIdiomaDelPais,
    fechaFinDeLaCampana: fechaFinDeLaCampana,
    validarEta: validarEta,
  };
}

      if (!esCorreoDelDominio(correo)) return { valido: false, errores: [{ campo: 'email', mensaje: 'El correo debe ser @rappi.com.' }] };
      var rol = String(miembro.rol || 'comercial').trim().toLowerCase();

      var existente = filaDeMiembro(equipo, correo);
      var fila = { email: correo, nombre: miembro.nombre || '', rol: rol, pais: pais, activo: true };
      if (existente) { for (var k in fila) existente[k] = fila[k]; } else { equipo.push(fila); }
      return { valido: true };
    },

    // El mismo contrato que Api.js: { valido, agregados, yaEstaban, rechazados }.
    adminAgregarMiembros: function (texto, rol, pais) {
      if (ROLES.indexOf(rol) === -1) return { valido: false, errores: [{ campo: 'rol', mensaje: 'Ese rol no existe.' }] };
      var codigoPais = String(pais || '').trim().toUpperCase();
      if (codigoPais && !paisPorCodigo(paises, codigoPais)) return { valido: false, errores: [{ campo: 'pais', mensaje: 'No encontramos el país "' + codigoPais + '". Escribe el código de dos letras de la pestaña Paises, como CO o MX, o déjalo vacío.' }] };
      var correos = separarCorreos(texto);
      if (correos.length === 0) return { valido: false, errores: [{ campo: 'correos', mensaje: 'Pega al menos un correo.' }] };

      var agregados = [];
      var yaEstaban = [];
      var rechazados = [];
      for (var i = 0; i < correos.length; i++) {
        var correo = correos[i];
        if (!esCorreoDelDominio(correo)) { rechazados.push(correo); continue; }
        var fila = filaDeMiembro(equipo, correo);
        if (fila && fila.activo) { yaEstaban.push(correo); continue; }
        var datos = { email: correo, nombre: fila ? fila.nombre : '', rol: rol, pais: codigoPais, activo: true };

      }
      return { valido: true, agregados: agregados, yaEstaban: yaEstaban, rechazados: rechazados };
    },

    adminSolicitudes: function (busqueda) {
      return buscarEnSolicitudes(solicitudes, busqueda).slice().reverse();
    },

    adminSolicitudesCsv: function (busqueda) {
      var columnas = ['id', 'fecha', 'email', 'pais', 'tipo', 'nombre_campana', 'tienda', 'estado', 'link_publicado'];
      return comoCsv(buscarEnSolicitudes(solicitudes, busqueda), columnas);
    },
  };

/** Crea un elemento. Los hijos de texto entran como texto, nunca como HTML. */
function crear(etiqueta, atributos, hijos) {
  var elemento = document.createElement(etiqueta);
  var propiedades = atributos || {};

  for (var llave in propiedades) {
    if (!Object.prototype.hasOwnProperty.call(propiedades, llave)) continue;
    var valor = propiedades[llave];
    if (valor === null || valor === undefined || valor === false) continue;

    if (llave === 'clase') elemento.className = valor;
    else if (llave === 'texto') elemento.textContent = valor;
    else if (llave === 'html') throw new Error('No se inserta HTML: usa texto.');
    else if (llave.indexOf('on') === 0 && typeof valor === 'function') {
      elemento.addEventListener(llave.slice(2), valor);
    } else if (valor === true) elemento.setAttribute(llave, '');
    else elemento.setAttribute(llave, valor);
  }

  var lista = hijos || [];
  for (var i = 0; i < lista.length; i++) {
    var hijo = lista[i];
    if (hijo === null || hijo === undefined || hijo === false) continue;
    elemento.appendChild(typeof hijo === 'string' ? document.createTextNode(hijo) : hijo);
  }
  return elemento;
}

 * que pegar tal cual en Squarespace. Copiar a mano es donde se cuelan los
 * errores de dedo.
 */
function paraCopiar(etiqueta, valor, ayuda) {

  var texto = crear('code', { clase: 'copiable-valor', texto: valor });

  var boton = crear('button', { clase: 'boton boton-secundario boton-chico', type: 'button', texto: 'Copiar' });
  boton.addEventListener('click', function () {
    function listo() {
      boton.textContent = 'Copiado';
      anunciar(etiqueta + ' copiado.');
      setTimeout(function () { boton.textContent = 'Copiar'; }, 1600);
    }

    // los contextos, asi que hay una segunda via con una seleccion.
    if (navigator.clipboard && navigator.clipboard.writeText) {

function almacenamientoDisponible() {
  try {
    var prueba = '__rm__';
    window.localStorage.setItem(prueba, '1');
    window.localStorage.removeItem(prueba);
    return true;
  } catch (error) {
    return false;
  }
}

function guardarBorrador() {
  if (!almacenamientoDisponible()) return false;
  try {
    window.localStorage.setItem(LLAVE_BORRADOR, JSON.stringify({
      version: VERSION_BORRADOR,
      guardado: new Date().toISOString(),
      entrada: estado.entrada,
      respondidas: estado.respondidas,
      pasoActual: estado.pasoActual,
    }));
    return true;
  } catch (error) {
    // Almacenamiento lleno o bloqueado. No se avisa en cada tecla: se sigue.
    return false;
  }

function leerBorrador() {
  if (!almacenamientoDisponible()) return null;
  try {
    var crudo = window.localStorage.getItem(LLAVE_BORRADOR);
    if (!crudo) return null;

    var guardado = JSON.parse(crudo);
    if (!guardado || guardado.version !== VERSION_BORRADOR) {
      borrarBorrador();
      return null;
    }
    if (!guardado.entrada || !guardado.entrada.tipo) return null;
    return guardado;
  } catch (error) {
    borrarBorrador();
    return null;

(function () {
'use strict';

/**
 * Puente con el servidor.
 *
 * En Apps Script llama con google.script.run. En la demostracion estatica llama
 * al servidor simulado, que usa el mismo motor dentro del navegador. El resto de
 * la interfaz no sabe cual de los dos esta corriendo.
 */

var RM = window.RM;

function hayAppsScript() {
  return typeof google !== 'undefined' && google.script && google.script.run;
}

function hayServidorSimulado() {
  return !!RM.servidorSimulado;
}

/** Llama a una funcion del servidor. Siempre devuelve una promesa. */
function llamar(nombre) {
  var argumentos = Array.prototype.slice.call(arguments, 1);

  if (hayAppsScript()) {
    return new Promise(function (resolver, rechazar) {
      var corredor = google.script.run
        .withSuccessHandler(resolver)
        .withFailureHandler(function (error) {
          rechazar(new Error(error && error.message ? error.message : String(error)));
        });
      corredor[nombre].apply(corredor, argumentos);
    });
  }

  if (hayServidorSimulado()) {
    return new Promise(function (resolver, rechazar) {
      // Un retardo corto para que se vea el estado de carga, como en la vida real.
      setTimeout(function () {
        try {
          resolver(RM.servidorSimulado[nombre].apply(null, argumentos));
        } catch (error) {
          rechazar(error);
        }
      }, 120);
    });
  }

  return Promise.reject(new Error('No hay servidor disponible.'));
}

RM.servidor = {
  llamar: llamar,
  hayAppsScript: hayAppsScript,
  hayServidorSimulado: hayServidorSimulado,
};

})();
