'use strict';

/**
 * Fechas, horas y listas, en el idioma del pais.
 *
 * Las fechas se manejan como texto ISO (AAAA-MM-DD) y nunca como objetos Date:
 * asi no dependen de la zona horaria del servidor ni del navegador, que es la
 * causa clasica de que un documento salga con un dia de diferencia.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var textosDelIdioma = require('./idiomas.js').textosDelIdioma;
  var conElIdiomaDe = require('./idiomas.js').conElIdiomaDe;
}

/* Se conserva por compatibilidad: los meses de verdad salen del idioma activo. */
var MESES = [
  'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
  'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
];

/** Descompone una fecha ISO. Devuelve null si no tiene forma valida. */
function partesDeFecha(iso) {
  var encontrado = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
  if (!encontrado) return null;
  var anio = Number(encontrado[1]);
  var mes = Number(encontrado[2]);
  var dia = Number(encontrado[3]);
  if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
  // Rechaza 31 de abril o 30 de febrero.
  var diasPorMes = [31, esBisiesto(anio) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  if (dia > diasPorMes[mes - 1]) return null;
  return { anio: anio, mes: mes, dia: dia };
}

function esBisiesto(anio) {
  return (anio % 4 === 0 && anio % 100 !== 0) || anio % 400 === 0;
}

/** "2026-09-17" -> "17 de septiembre de 2026", o "17 de setembro de 2026". */
function formatearFecha(iso) {
  var p = partesDeFecha(iso);
  if (!p) return '';
  return p.dia + ' de ' + textosDelIdioma().meses[p.mes - 1] + ' de ' + p.anio;
}

/**
 * La fecha y la hora como las escribe el pais de la campana, fuera del documento.
 *
 * El idioma se enciende solo mientras se calcula el documento. Fuera de ahi
 * (las respuestas plegadas y el resumen) todo salia en espanol, y un KAM de
 * Brasil veia "1 de octubre de 2026" y "12:00 a. m." arriba de un documento que
 * decia "1 de outubro de 2026 às 00:00".
 */
function formatearFechaDelPais(iso, pais) {
  return conElIdiomaDe(pais, function () { return formatearFecha(iso); });
}

function formatearHoraDelPais(texto, pais) {
  return conElIdiomaDe(pais, function () { return formatearHora(texto); });
}

/** Descompone una hora HH:MM. Devuelve null si no es valida. */
function partesDeHora(texto) {
  var encontrado = /^(\d{1,2}):(\d{2})$/.exec(String(texto || '').trim());
  if (!encontrado) return null;
  var hora = Number(encontrado[1]);
  var minuto = Number(encontrado[2]);
  if (hora > 23 || minuto > 59) return null;
  return { hora: hora, minuto: minuto };
}

/**
 * La hora como la escribe cada pais.
 *
 * En espanol, reloj de doce horas: "09:00" -> "9:00 a. m."; "23:59" -> "11:59 p. m.".
 * En portugues, reloj de veinticuatro con cero inicial: "00:01" -> "00:01";
 * "23:59" -> "23:59". Asi va en los T&C aprobados de Brasil.
 */
function formatearHora(texto) {
  var p = partesDeHora(texto);
  if (!p) return '';
  var idioma = textosDelIdioma();
  var minutos = p.minuto < 10 ? '0' + p.minuto : String(p.minuto);

  if (idioma.reloj === 24) {
    var horas = p.hora < 10 ? '0' + p.hora : String(p.hora);
    return horas + idioma.separadorDeHora + minutos;
  }

  var sufijo = p.hora < 12 ? idioma.sufijoAntesDelMediodia : idioma.sufijoDespuesDelMediodia;
  var hora12 = p.hora % 12 || 12;
  return hora12 + ':' + minutos + ' ' + sufijo;
}

/** Comparable para ordenar y comparar fechas ISO sin usar Date. */
function comoNumeroFecha(iso) {
  var p = partesDeFecha(iso);
  if (!p) return null;
  return p.anio * 10000 + p.mes * 100 + p.dia;
}

/** Comparable para fecha + hora juntas. */
function comoNumeroFechaHora(iso, hora) {
  var f = comoNumeroFecha(iso);
  var h = partesDeHora(hora);
  if (f === null || !h) return null;
  return f * 10000 + h.hora * 100 + h.minuto;
}

/** "a", "a y b", "a, b y c". En portugues la conjuncion es "e". */
function listaY(elementos) {
  var limpios = [];
  for (var i = 0; i < elementos.length; i++) {
    var elemento = String(elementos[i]).trim();
    if (elemento) limpios.push(elemento);
  }
  if (limpios.length === 0) return '';
  if (limpios.length === 1) return limpios[0];
  return limpios.slice(0, -1).join(', ') + ' ' + textosDelIdioma().conjuncionDeLista + ' ' + limpios[limpios.length - 1];
}

/** Separa un texto con comas en una lista limpia. */
function separarPorComas(texto) {
  var partes = String(texto || '').split(',');
  var limpias = [];
  for (var i = 0; i < partes.length; i++) {
    var parte = partes[i].trim();
    if (parte) limpias.push(parte);
  }
  return limpias;
}

if (typeof module !== 'undefined') {
  module.exports = {
    MESES: MESES,
    partesDeFecha: partesDeFecha,
    partesDeHora: partesDeHora,
    formatearFecha: formatearFecha,
    formatearHora: formatearHora,
    formatearFechaDelPais: formatearFechaDelPais,
    formatearHoraDelPais: formatearHoraDelPais,
    comoNumeroFecha: comoNumeroFecha,
    comoNumeroFechaHora: comoNumeroFechaHora,
    listaY: listaY,
    separarPorComas: separarPorComas,
  };
}

'use strict';

/**
 * Punto de entrada del motor: valida y, solo si todo esta bien, renderiza.
 *
 * Es lo unico que necesita llamar el servidor (Apps Script) o la vista previa
 * del navegador. Si algo falta, devuelve la lista de errores y ningun texto:
 * el documento no se crea a medias.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloEsquemas = require('./esquemas.js');
  var esquemaDe = moduloEsquemas.esquemaDe;

  var moduloValidaciones = require('./validaciones.js');
  var validarSolicitud = moduloValidaciones.validarSolicitud;

  var moduloMotor = require('./motor.js');
  var renderizar = moduloMotor.renderizar;

  var calcularDerivados = require('./derivados.js').calcularDerivados;
  var moduloLeyendas = require('./leyendas.js');
  var cargarCatalogo = moduloLeyendas.cargarCatalogo;
  var leyendasDeLaPieza = moduloLeyendas.leyendasDeLaPieza;
  var moduloDerivadosLeyendas = require('./derivados_leyendas.js');
  var calcularDerivadosDeLeyendas = moduloDerivadosLeyendas.calcularDerivadosDeLeyendas;
  var faltantesParaLaLeyenda = moduloDerivadosLeyendas.faltantesParaLaLeyenda;
  var esDeTurbo = moduloDerivadosLeyendas.esDeTurbo;
  var PENDIENTES_POR_MARCADOR = moduloDerivadosLeyendas.PENDIENTES_POR_MARCADOR;
  var conElIdiomaDe = require('./idiomas.js').conElIdiomaDe;
  var urlDelTcDeLaCampana = moduloDerivadosLeyendas.urlDelTcDeLaCampana;
  var tieneValor = require('./texto.js').tieneValor;
}

/**
 * entrada   hechos del formulario
 * pais      fila de data/paises.json
 * modelos   { modelos, bloques } (en Apps Script, la constante MODELOS)
 * contexto  { fechaReferencia, usuarioEnEquipo }
 *
 * Devuelve { valido, errores: [{campo, mensaje}], texto }.
 */
function generarTexto(entrada, pais, modelos, contexto) {
  var revision = validarSolicitud(entrada, pais, contexto);
  if (!revision.valido) {
    return { valido: false, errores: revision.errores, texto: '' };
  }

  var esquema = esquemaDe(entrada.tipo);
  var render = renderizar(esquema.modelo, entrada, pais, modelos);

  if (render.errores.length > 0) {
    var errores = [];
    for (var i = 0; i < render.errores.length; i++) {
      errores.push({ campo: 'documento', mensaje: render.errores[i] });
    }
    return { valido: false, errores: errores, texto: '' };
  }

  return { valido: true, errores: [], texto: render.texto };
}

/**
 * Las leyendas de las piezas publicitarias de esta campana, una por formato.
 *
 * Se entregan junto con el documento, en la pantalla final: el comercial copia
 * la que necesite segun el arte. No se le pregunta en que pieza va (seccion
 * 7B.4 de la respuesta del encargo 03).
 *
 * entrada    los mismos hechos con que se genero el documento
 * pais       fila de data/paises.json
 * textos     { id: texto } de modelos/leyendas/ (en Apps Script, LEYENDAS)
 * opciones   { nombreCampana, enlacePublicado }
 *
 * Devuelve { hay, leyendas, complementos, faltantes, errores }. "hay" es false
 * cuando este pais todavia no tiene leyenda de campana aprobada, que hoy es todo
 * pais distinto de Colombia.
 */
function generarLeyendasDeLaCampana(entrada, pais, textos, opciones) {
  var catalogo = cargarCatalogo(textos || {});
  var config = opciones || {};

  var faltantes = faltantesParaLaLeyenda(entrada, pais);
  if (faltantes.length > 0) {
      return {
      hay: false, leyendas: [], complementos: [], faltantes: faltantes, pendientes: [], errores: [],
      enlacePrevisto: '', enlaceUsado: '', enlaceConfirmado: false, enlaceCambio: false,
    };
  }

  // Con el idioma del pais, igual que el documento: los numeros y las fechas de
  // la leyenda se escriben como los del T&C o se contradicen entre si.
  var armadas = conElIdiomaDe(pais, function () {
    var valores = calcularDerivadosDeLeyendas(
      entrada, pais, calcularDerivados(entrada, pais),
      { nombreCampana: config.nombreCampana, enlacePublicado: config.enlacePublicado }
    );
    return leyendasDeLaPieza(catalogo, pais.codigo, entrada.tipo, valores, {
      categoria: entrada.categoriaProducto,
      esDeTurbo: esDeTurbo(entrada),
    });
  });

  // Un marcador que espera una decision no es un defecto. La leyenda de push
  // necesita el enlace corto, que todavia no existe: si eso contara como error,
  // las otras cuatro leyendas de la campana se caerian con ella.
  var entregadas = [];
  var pendientes = [];
  var errores = armadas.errores.slice();

  for (var i = 0; i < armadas.leyendas.length; i++) {
    var armada = armadas.leyendas[i];
    var razones = [];
    var propios = [];

    for (var v = 0; v < (armada.vacios || []).length; v++) {
      var marcador = armada.vacios[v];
      if (PENDIENTES_POR_MARCADOR[marcador]) razones.push(PENDIENTES_POR_MARCADOR[marcador]);
      else propios.push(marcador);
    }

    if (razones.length > 0 && propios.length === 0) {
      pendientes.push({ formato: armada.formato, nombre: armada.nombre, razones: razones });
      continue;
    }
    for (var e = 0; e < armada.errores.length; e++) {
      errores.push(armada.id + ': ' + armada.errores[e]);
    }
    entregadas.push(armada);
  }

  var previsto = urlDelTcDeLaCampana(entrada, pais, config.nombreCampana, '');
  return {
    hay: entregadas.length > 0,
    leyendas: entregadas,
    complementos: armadas.complementos,
    faltantes: [],
    pendientes: pendientes,
    errores: errores,
    // El enlace que lleva la leyenda, y si ya esta confirmado contra el
    // publicado. Es el camino 4 de la seccion 6 de la respuesta: la leyenda
    // sale completa el mismo dia, marcada "enlace por confirmar", y cuando el
    // comercial pega el publicado se compara y se rehace si es distinto.
    enlacePrevisto: previsto,
    enlaceUsado: tieneValor(config.enlacePublicado) ? String(config.enlacePublicado).trim() : previsto,
    enlaceConfirmado: !!tieneValor(config.enlacePublicado),
    enlaceCambio: !!tieneValor(config.enlacePublicado) &&
      String(config.enlacePublicado).trim() !== previsto,
  };
}

if (typeof module !== 'undefined') {
  module.exports = {
    generarTexto: generarTexto,
    generarLeyendasDeLaCampana: generarLeyendasDeLaCampana,
  };
}

'use strict';

/**
 * Validacion y formato del identificador tributario del organizador, por pais.
 *
 * Los algoritmos de digito de verificacion estan en la seccion 6 de
 * docs/ESPECIFICACION_V3.md y se verificaron contra los identificadores reales
 * de las sociedades Rappi de cada pais.
 *
 * Cada validador devuelve { valido, mensaje, formateado }.
 */

function soloDigitos(texto) {
  return String(texto || '').replace(/\D/g, '');
}

function sumaPonderada(digitos, pesos) {
  var suma = 0;
  for (var i = 0; i < pesos.length; i++) {
    suma += Number(digitos.charAt(i)) * pesos[i];
  }
  return suma;
}

/** Agrupa de a tres con el separador dado: 900111222 -> 900.111.222 */
function agruparMiles(digitos, separador) {
  return digitos.replace(/\B(?=(\d{3})+(?!\d))/g, separador);
}

function resultado(valido, mensaje, formateado) {
  return { valido: valido, mensaje: mensaje || '', formateado: formateado || '' };
}

// --- Colombia: NIT ---------------------------------------------------------

var PESOS_NIT = [3, 7, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 67, 71];

function digitoNit(cuerpo) {
  var suma = 0;
  // Los pesos se aplican desde la derecha.
  for (var i = 0; i < cuerpo.length; i++) {
    var digito = Number(cuerpo.charAt(cuerpo.length - 1 - i));
    suma += digito * PESOS_NIT[i];
  }
  var r = suma % 11;
  return r === 0 || r === 1 ? r : 11 - r;
}

function validarNit(valor) {
  var limpio = String(valor || '').trim().replace(/[.\s]/g, '');
  var partido = /^(\d{9})-?(\d)$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'El NIT tiene 9 dígitos más el de verificación, por ejemplo 900.111.222-1.');
  }
  var cuerpo = partido[1];
  var dv = Number(partido[2]);
  /*
   * Si el digito no cuadra, se dice cual es el que cuadra.
   *
   * El mensaje decia solo "revisa el numero", y la herramienta sabe la
   * respuesta: el digito de verificacion sale de los nueve primeros con una
   * formula. Juan escribio 900.898.545-1, que es 900.898.545-0, y no tenia como
   * saberlo sin ir a buscar el RUT. Decirlo no inventa nada: es aritmetica, y
   * el comercial sigue teniendo que confirmar que el NIT es el correcto.
   */
  var correcto = digitoNit(cuerpo);
  if (correcto !== dv) {
    return resultado(false, 'El dígito de verificación no cuadra con ese NIT. Para ' +
      agruparMiles(cuerpo, '.') + ' el dígito es ' + correcto + '. Revisa el número completo.');
  }
  return resultado(true, '', 'NIT ' + agruparMiles(cuerpo, '.') + '-' + dv);
}

// --- Mexico: RFC -----------------------------------------------------------

var ALFABETO_RFC = '0123456789ABCDEFGHIJKLMN&OPQRSTUVWXYZ';

function valorCaracterRfc(caracter) {
  if (caracter === ' ') return 37;
  if (caracter === 'Ñ') return 38;
  // La posicion en el alfabeto ya es el valor: 0 a 9 valen 0 a 9,
  // A a N valen 10 a 23, & vale 24 y O a Z valen 25 a 36.
  return ALFABETO_RFC.indexOf(caracter);
}

function digitoRfc(doce) {
  var suma = 0;
  for (var i = 0; i < 12; i++) {
    var valor = valorCaracterRfc(doce.charAt(i));
    if (valor === -1) return null;
    suma += valor * (13 - i);
  }
  var r = suma % 11;
  if (r === 0) return '0';
  var dv = 11 - r;
  if (dv === 10) return 'A';
  return String(dv);
}

function validarRfc(valor) {
  var limpio = String(valor || '').trim().toUpperCase().replace(/[-\s]/g, '');

  var esMoral = /^[A-ZÑ&]{3}\d{6}[A-Z0-9]{3}$/.test(limpio);
  var esFisica = /^[A-ZÑ&]{4}\d{6}[A-Z0-9]{3}$/.test(limpio);

  if (!esMoral && !esFisica) {
    return resultado(false, 'El RFC debe tener 12 caracteres (persona moral) o 13 (persona física), por ejemplo PRU200101AB5.');
  }

  // A la persona moral se le antepone un espacio para completar 13 posiciones.
  var completo = esMoral ? ' ' + limpio : limpio;
  var esperado = digitoRfc(completo.slice(0, 12));

  if (esperado === null || esperado !== completo.charAt(12)) {
    return resultado(false, 'El dígito verificador del RFC no corresponde. Revisa el número.');
  }
  return resultado(true, '', 'RFC ' + limpio);
}

// --- Modulo 11 con pesos fijos (Peru, Argentina, Uruguay) ------------------

function validarModulo11(valor, opciones) {
  var digitos = soloDigitos(valor);
  if (digitos.length !== opciones.largo) {
    return resultado(false, opciones.mensajeFormato);
  }
  var cuerpo = digitos.slice(0, opciones.largo - 1);
  var dv = Number(digitos.charAt(opciones.largo - 1));

  var r = sumaPonderada(cuerpo, opciones.pesos) % 11;
  var esperado = 11 - r;
  if (esperado === 11) esperado = opciones.once;
  if (esperado === 10) {
    if (opciones.diez === null) {
      return resultado(false, opciones.mensajeDigito);
    }
    esperado = opciones.diez;
  }

  if (esperado !== dv) {
    return resultado(false, opciones.mensajeDigito);
  }
  return resultado(true, '', opciones.formatear(digitos));
}

function validarRucPe(valor) {
  return validarModulo11(valor, {
    largo: 11,
    pesos: [5, 4, 3, 2, 7, 6, 5, 4, 3, 2],
    once: 1,
    diez: 0,
    mensajeFormato: 'El RUC debe tener 11 dígitos.',
    mensajeDigito: 'El dígito verificador del RUC no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'RUC ' + digitos;
    },
  });
}

function validarCuit(valor) {
  return validarModulo11(valor, {
    largo: 11,
    pesos: [5, 4, 3, 2, 7, 6, 5, 4, 3, 2],
    once: 0,
    diez: null,
    mensajeFormato: 'El CUIT debe tener 11 dígitos, por ejemplo 30-71580389-1.',
    mensajeDigito: 'El dígito verificador del CUIT no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'CUIT ' + digitos.slice(0, 2) + '-' + digitos.slice(2, 10) + '-' + digitos.slice(10);
    },
  });
}

function validarRutUy(valor) {
  return validarModulo11(valor, {
    largo: 12,
    pesos: [4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2],
    once: 0,
    diez: null,
    mensajeFormato: 'El RUT debe tener 12 dígitos.',
    mensajeDigito: 'El dígito verificador del RUT no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'RUT ' + digitos;
    },
  });
}

// --- Chile: RUT (pesos ciclicos 2 a 7) -------------------------------------

function validarRutCl(valor) {
  var limpio = String(valor || '').trim().toUpperCase().replace(/[.\s]/g, '');
  var partido = /^(\d{7,8})-?([\dK])$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'El RUT debe tener el cuerpo y el dígito verificador, por ejemplo 76.837.223-3.');
  }
  var cuerpo = partido[1];
  var dv = partido[2];

  var suma = 0;
  var peso = 2;
  for (var i = cuerpo.length - 1; i >= 0; i--) {
    suma += Number(cuerpo.charAt(i)) * peso;
    peso = peso === 7 ? 2 : peso + 1;
  }
  var esperado = 11 - (suma % 11);
  var dvEsperado = esperado === 11 ? '0' : esperado === 10 ? 'K' : String(esperado);

  if (dvEsperado !== dv) {
    return resultado(false, 'El dígito verificador del RUT no corresponde. Revisa el número.');
  }
  return resultado(true, '', 'RUT ' + agruparMiles(cuerpo, '.') + '-' + dv);
}

// --- Ecuador: RUC ----------------------------------------------------------

function validarRucEc(valor) {
  var digitos = soloDigitos(valor);
  if (digitos.length !== 13) {
    return resultado(false, 'El RUC debe tener 13 dígitos y terminar en 001.');
  }
  if (digitos.slice(10) !== '001') {
    return resultado(false, 'El RUC debe terminar en 001.');
  }

  // Solo la sociedad privada (tercer dígito 9) tiene dígito verificable.
  if (digitos.charAt(2) === '9') {
    var r = sumaPonderada(digitos.slice(0, 9), [4, 3, 2, 7, 6, 5, 4, 3, 2]) % 11;
    var esperado = r === 0 ? 0 : 11 - r;
    if (esperado !== Number(digitos.charAt(9))) {
      return resultado(false, 'El dígito verificador del RUC no corresponde. Revisa el número.');
    }
  }
  return resultado(true, '', 'RUC ' + digitos);
}

// --- Costa Rica: cedula juridica (sin digito verificador) ------------------

function validarCedulaCr(valor) {
  var limpio = String(valor || '').trim().replace(/\s/g, '');
  var partido = /^(\d)-?(\d{3})-?(\d{6})$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'La cédula jurídica debe tener el formato 3-XXX-XXXXXX.');
  }
  return resultado(true, '', 'Cédula jurídica ' + partido[1] + '-' + partido[2] + '-' + partido[3]);
}

// --- Entrada unica ---------------------------------------------------------

var VALIDADORES = {
  CO: validarNit,
  MX: validarRfc,
  PE: validarRucPe,
  AR: validarCuit,
  CL: validarRutCl,
  EC: validarRucEc,
  UY: validarRutUy,
  CR: validarCedulaCr,
};

/**
 * Valida el identificador para un pais y devuelve el texto ya formateado
 * como va en el documento: { valido, mensaje, formateado }.
 */
function validarIdentificacion(codigoPais, valor) {
  var validador = VALIDADORES[codigoPais];
  if (!validador) {
    var crudo = String(valor || '').trim();
    if (!crudo) return resultado(false, 'Falta el identificador del organizador.');
    return resultado(true, '', crudo);
  }
  if (!String(valor || '').trim()) {
    return resultado(false, 'Falta el identificador del organizador.');
  }
  return validador(valor);
}

if (typeof module !== 'undefined') {
  module.exports = {
    validarIdentificacion: validarIdentificacion,
    validarNit: validarNit,
    validarRfc: validarRfc,
    validarRucPe: validarRucPe,
    validarCuit: validarCuit,
    validarRutCl: validarRutCl,
    validarRucEc: validarRucEc,
    validarRutUy: validarRutUy,
    validarCedulaCr: validarCedulaCr,
  };
}

'use strict';

/**
 * El idioma del documento.
 *
 * Cada pais trae su idioma en la columna `idioma` del Sheet (es o pt). De ahi
 * salen las piezas de forma del documento: los meses, la hora, los conectores
 * de una lista y los numeros escritos en letras.
 *
 * Lo que NO sale de aqui es el texto legal. Las clausulas viven en `modelos/` y
 * las frases fijas en `derivados.js`, y las traduce Legal, nunca este archivo.
 * Aqui solo esta la maquinaria: "17 de setembro de 2026" y "duzentos e
 * cinquenta (250)".
 *
 * Como se usa: `calcularDerivados` fija el idioma del pais al empezar el
 * documento y lo devuelve a espanol al terminar. Las funciones de fechas.js y
 * numeros.js preguntan por el idioma activo, en vez de recibirlo en cada una de
 * sus cincuenta y cuatro llamadas. Si nadie lo fija, el idioma es espanol, que
 * es el 99,7% de las solicitudes reales.
 */

var IDIOMA_POR_DEFECTO = 'es';

var IDIOMAS = {
  es: {
    codigo: 'es',
    nombre: 'español',
    meses: [
      'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
    ],
    // "17 de septiembre de 2026"
    formatoFecha: 'dia de mes de anio',
    // Reloj de doce horas con a. m. y p. m., como en los modelos aprobados.
    reloj: 12,
    sufijoAntesDelMediodia: 'a. m.',
    sufijoDespuesDelMediodia: 'p. m.',
    conjuncionDeLista: 'y',
    // El nombre del saldo de la Billetera, tal como va impreso.
    creditos: 'Créditos',
    porCiento: 'por ciento',
    // "cincuenta mil pesos M/Cte. ($50.000)": las letras primero.
    formatoMonto: 'letras_primero',
    mesesCortos: ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'],
    // "doce millones (12.000.000) de Créditos"
    deAntesDelSustantivo: 'de',
    terminacionDeMillon: /(millón|millones)$/,
  },

  pt: {
    codigo: 'pt',
    nombre: 'portugués',
    meses: [
      'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
      'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro',
    ],
    // "17 de setembro de 2026", igual que en espanol.
    formatoFecha: 'dia de mes de anio',
    // Reloj de veinticuatro horas con dos puntos y cero inicial: 00:01, 23:59.
    // Asi va en los cuatro T&C aprobados que mando Legal Brasil, que mandan
    // sobre cualquier convencion tipografica.
    reloj: 24,
    separadorDeHora: ':',
    conjuncionDeLista: 'e',
    creditos: 'Créditos',
    porCiento: 'por cento',
    // "R$300,00 (trezentos reais)": la cifra primero y las letras entre
    // parentesis, como lo escriben los cuatro T&C aprobados de Brasil.
    formatoMonto: 'cifra_primero',
    decimalesDelMonto: ',00',
    mesesCortos: ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'],
    deAntesDelSustantivo: 'de',
    terminacionDeMillon: /(milhão|milhões)$/,
  },
};

/* El idioma que esta generando el documento en este momento. */
var IDIOMA_ACTIVO = IDIOMA_POR_DEFECTO;

function hayIdioma(codigo) {
  return Object.prototype.hasOwnProperty.call(IDIOMAS, String(codigo || '').trim().toLowerCase());
}

/** Fija el idioma y devuelve el que estaba, para poder restaurarlo. */
function fijarIdioma(codigo) {
  var anterior = IDIOMA_ACTIVO;
  var pedido = String(codigo || '').trim().toLowerCase();
  IDIOMA_ACTIVO = hayIdioma(pedido) ? pedido : IDIOMA_POR_DEFECTO;
  return anterior;
}

function idiomaActivo() {
  return IDIOMA_ACTIVO;
}

/** Las piezas del idioma que esta activo. */
function textosDelIdioma() {
  return IDIOMAS[IDIOMA_ACTIVO] || IDIOMAS[IDIOMA_POR_DEFECTO];
}

/**
 * Corre una funcion con el idioma de un pais y devuelve el idioma a como estaba,
 * pase lo que pase.
 *
 * El try/finally no es adorno: si generar un documento en portugues lanza un
 * error a mitad de camino, el siguiente documento saldria con los meses en
 * portugues y nadie entenderia por que.
 */
function conElIdiomaDe(pais, funcion) {
  var anterior = fijarIdioma(pais && pais.idioma ? pais.idioma : IDIOMA_POR_DEFECTO);
  try {
    return funcion();
  } finally {
    IDIOMA_ACTIVO = anterior;
  }
}

if (typeof module !== 'undefined') {
  module.exports = {
    IDIOMAS: IDIOMAS,
    IDIOMA_POR_DEFECTO: IDIOMA_POR_DEFECTO,
    hayIdioma: hayIdioma,
    fijarIdioma: fijarIdioma,
    idiomaActivo: idiomaActivo,
    textosDelIdioma: textosDelIdioma,
    conElIdiomaDe: conElIdiomaDe,
  };
}

'use strict';

/**
 * Leyendas de piezas publicitarias: el texto legal que va dentro del arte.
 *
 * El T&C completo vive en una pagina de Squarespace. La pieza que el usuario ve
 * en la app lleva aparte un texto corto que tiene que decir lo mismo y remitir
 * al T&C. Ese texto es el que arma este archivo.
 *
 * Igual que los modelos, el texto legal es de Legal y vive en modelos/leyendas/.
 * Aqui no se escribe ni se "mejora" una sola frase: esto solo elige que leyenda
 * va, la llena con los mismos datos que llenaron el documento, y avisa si no
 * cabe en el formato.
 *
 * Tres cosas distintas al motor de documentos:
 *
 *   1. Hay un largo maximo. Una letra pequena que no cabe en el arte no se
 *      publica, asi que la leyenda se mide y, si se pasa, se recorta por un
 *      orden que Legal dejo marcado dentro del texto con [[R1]] … [[/R]].
 *      Lo que no esta marcado nunca sale.
 *   2. Hay complementos. Una pieza de licores o de medicamentos suma la leyenda
 *      de su categoria dentro de {{TEXTO_COMPLEMENTOS}}.
 *   3. Se entregan todos los formatos de una vez. No se le pregunta al comercial
 *      en que pieza va: se le dan las de apoyo, letra pequena, banner y push, y
 *      el copia la que necesita.
 *
 * Fuente del catalogo: docs/encargos/respuestas/03-leyendas.md, seccion 9.2.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTextoLeyendas = require('./texto.js');
  var normalizarTexto = moduloTextoLeyendas.normalizarTexto;
  // comoLista es de paises.js. En Apps Script ya es global, y declararla otra
  // vez aqui la pisaria sin avisar: los archivos de src/core/ comparten ambito.
  var comoLista = require('./paises.js').comoLista;
}

/** Las llaves de %% que se leen como lista separada por comas. */
var LLAVES_DE_LISTA = ['pais', 'tipo_campana', 'tipo_pieza', 'origen', 'minimo_irreductible'];

/**
 * Los formatos de pieza que la herramienta entrega, en el orden en que se
 * muestran, con el largo que admite cada uno (seccion 7C de la respuesta).
 *
 * El largo es del formato y no de la leyenda. Una misma leyenda sirve para la
 * letra pequena y para el banner corto (Carrera y los dos de Travel), y esos dos
 * formatos no admiten lo mismo: 620 contra 300. Con un solo numero por leyenda,
 * un banner de Carrera se habria dado por bueno con 620 caracteres.
 */
var TIPOS_DE_PIEZA = [
  { id: 'texto_apoyo', nombre: 'Texto de apoyo', largo_max: 350 },
  { id: 'letra_pequena', nombre: 'Letra pequeña', largo_max: 620 },
  { id: 'banner_corto', nombre: 'Banner corto', largo_max: 300 },
  { id: 'exterior', nombre: 'Valla, exterior e impresos', largo_max: 300 },
  { id: 'push_sms', nombre: 'Push y SMS', largo_max: 70 },
];

/**
 * Como llega cada complemento a la pieza.
 *
 * "pregunta" es la unica que le cuesta algo al comercial: la categoria del
 * producto. "condicion_turbo" sale de algo que ya se pregunta, asi que no se
 * vuelve a preguntar. "ninguna_parte_todavia" son leyendas reales de un playbook
 * que estan en el catalogo pero que la herramienta no alcanza hoy: apuestas y
 * Mundial se escalan a Legal, y awareness y promociones son tipos de campana que
 * v3 no genera.
 */
var FORMAS_DE_ELEGIR = ['pregunta', 'condicion_turbo', 'ninguna_parte_todavia'];

/**
 * Las categorias cuya pieza tiene que mostrar el registro sanitario.
 *
 * Legal CO lo pide para medicamentos y fitoterapeuticos (diapositiva 10). Sin el
 * registro la pieza no se puede publicar, asi que la pregunta aparece sola y,
 * mientras no se responda, no hay leyenda.
 *
 * Viven aqui, con el catalogo, y no en los esquemas: son categorias del
 * catalogo, y asi la pregunta y la leyenda las leen del mismo sitio.
 */
var CATEGORIAS_CON_REGISTRO = ['medicamento', 'medicamentos_varios', 'fitoterapeutico_pfm', 'fitoterapeutico_pft'];

/** Solo los medicamentos llevan ademas el numero de notificacion ante el INVIMA. */
var CATEGORIAS_CON_INVIMA = ['medicamento', 'medicamentos_varios'];

function categoriaPideRegistro(categoria) {
  return CATEGORIAS_CON_REGISTRO.indexOf(String(categoria || '')) !== -1;
}

function categoriaPideInvima(categoria) {
  return CATEGORIAS_CON_INVIMA.indexOf(String(categoria || '')) !== -1;
}

/** Lo que nunca puede quedar dentro de una leyenda entregada. */

 * Frases rotas. Las mismas del motor de documentos, menos la vineta, que en una

var SENALES_DE_LEYENDA_ROTA = [
  { nombre: 'un espacio antes de una coma', patron: / ,/ },
  { nombre: 'un espacio antes de un punto', patron: / \./ },
  { nombre: 'dos puntos seguidos', patron: /(^|[^.])\.\.(?!\.)/ },
  { nombre: 'un paréntesis vacío', patron: /\(\s*\)/ },
  { nombre: 'una coma seguida de un punto', patron: /, \./ },
];

// --- Leer el catalogo ------------------------------------------------------

/**
 * Convierte el archivo de una leyenda en un objeto.
 *
 * Las lineas %% de arriba son la ficha; lo que sigue es el texto legal, que se
 * deja tal cual vino de Legal.
 */
function leyendaDesdeTexto(texto) {
  var normalizado = normalizarTexto(texto);

  var lineas = normalizado.split('\n');
  var ficha = {};
  var cuerpo = [];

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    if (linea.indexOf('%% ') === 0) {
      var resto = linea.slice(3);
      var corte = resto.indexOf(':');
      if (corte === -1) continue;
      ficha[resto.slice(0, corte).trim()] = resto.slice(corte + 1).trim();
      continue;
    }
    cuerpo.push(linea);
  }

  var leyenda = {
    id: ficha.id || '',
    categoria: ficha.categoria || '',
    categoria_id: ficha.categoria_id || '',
    se_elige_en: ficha.se_elige_en || '',
    fuente: ficha.fuente || '',
    largo_max: Number(ficha.largo_max || 0),
    cuerpo: cuerpo.join('\n').trim(),
  };
  for (var l = 0; l < LLAVES_DE_LISTA.length; l++) {
    leyenda[LLAVES_DE_LISTA[l]] = comoLista(ficha[LLAVES_DE_LISTA[l]]);
  }
  return leyenda;
}

/** De { id: texto } a { id: leyenda }, que es con lo que trabaja todo lo demas. */
function cargarCatalogo(textos) {
  var catalogo = {};
  for (var nombre in textos) {
    if (!Object.prototype.hasOwnProperty.call(textos, nombre)) continue;
    var leyenda = leyendaDesdeTexto(textos[nombre]);
    if (leyenda.id) catalogo[leyenda.id] = leyenda;
  }
  return catalogo;
}

function comoLeyendas(catalogo) {
  var lista = [];
  for (var id in catalogo) {
    if (Object.prototype.hasOwnProperty.call(catalogo, id)) lista.push(catalogo[id]);
  }
  lista.sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
  return lista;
}

/**
 * El catalogo cargado, para quien no lo puede recibir por parametro.
 *
 * Lo necesitan dos cosas que corren lejos de aqui: la pregunta de la categoria
 * del producto, que solo se muestra si el pais tiene categorias, y la lista de
 * opciones de esa pregunta. Las dos viven en src/core/esquemas.js, que recibe
 * solo la entrada del formulario.
 *
 * En Apps Script y en el navegador, LEYENDAS ya es una constante global que
 * escribe el build. En Node no hay global que valga, asi que quien corre las
 * pruebas llama a usarCatalogo() una vez. Si nadie lo hizo, el catalogo esta
 * vacio y la pregunta no se muestra, que es preferible a mostrarla sin opciones.
 */
var catalogoEnMemoria = null;

function usarCatalogo(textos) {
  catalogoEnMemoria = cargarCatalogo(textos || {});
  return catalogoEnMemoria;
}

function catalogoActual() {
  if (catalogoEnMemoria) return catalogoEnMemoria;
  if (typeof LEYENDAS !== 'undefined') catalogoEnMemoria = cargarCatalogo(LEYENDAS);
  return catalogoEnMemoria || {};
}

/** Las categorias que este pais puede ofrecer, sin pasar el catalogo. */
function categoriasDeProducto(codigoPais) {
  return categoriasDelPais(catalogoActual(), codigoPais);
}

/** Si este pais tiene alguna leyenda de campana que entregar. */
function hayLeyendasDeCampana(codigoPais, tipo) {
  return leyendasDeLaCampana(catalogoActual(), codigoPais, tipo).length > 0;
}

function aplicaAlPais(leyenda, codigoPais) {
  return leyenda.pais.indexOf(String(codigoPais || '').toUpperCase()) !== -1;
}

function aplicaAlTipo(leyenda, tipo) {
  return leyenda.tipo_campana.indexOf('todas') !== -1 || leyenda.tipo_campana.indexOf(tipo) !== -1;
}

function esComplemento(leyenda) {
  return leyenda.tipo_pieza.indexOf('complemento') !== -1;
}

// --- Elegir que va ---------------------------------------------------------

/**
 * Las categorias de producto que este pais puede ofrecer, sacadas del catalogo.
 *
 * Salen de las leyendas que existen, no de una lista escrita a mano: agregar la
 * leyenda de una categoria nueva la pone sola en la pregunta, y una categoria
 * sin leyenda no se puede elegir, que es lo correcto porque no tendria nada que
 * imprimir. Colombia ofrece diez; Mexico, cinco; Chile, una.
 */
function categoriasDelPais(catalogo, codigoPais) {
  var vistas = {};
  var opciones = [];
  var leyendas = comoLeyendas(catalogo);
  for (var i = 0; i < leyendas.length; i++) {
    var leyenda = leyendas[i];
    if (leyenda.se_elige_en !== 'pregunta') continue;
    if (!aplicaAlPais(leyenda, codigoPais)) continue;
    if (vistas[leyenda.categoria_id]) continue;
    vistas[leyenda.categoria_id] = true;
    opciones.push({
      valor: leyenda.categoria_id,
      etiqueta: leyenda.categoria,
      leyenda: leyenda.id,
      // El principio de la advertencia que se va a imprimir. Sin esto las diez
      // opciones decian lo mismo debajo y el comercial elegia a ciegas.
      adelanto: adelantoDe(leyenda.cuerpo),
    });
  }
  // Por como se lee la etiqueta, no por el identificador: la lista la recorre
  // una persona buscando su producto, no el catalogo.
  opciones.sort(function (a, b) { return a.etiqueta.localeCompare(b.etiqueta, 'es'); });
  return opciones;
}

/** Las primeras palabras de una leyenda, para mostrarlas sin ocupar tres lineas. */
function adelantoDe(cuerpo) {
  var limpio = String(cuerpo || '').replace(/\[\[[^\]]*\]\]/g, '').replace(/\{\{\w+\}\}/g, '').replace(/\s+/g, ' ').trim();
  if (limpio.length <= 64) return limpio;
  var corte = limpio.slice(0, 64);
  var espacio = corte.lastIndexOf(' ');
  return (espacio > 30 ? corte.slice(0, espacio) : corte) + '…';
}

/**
 * Los complementos que se pegan a la pieza, en el orden del catalogo: primero
 * Turbo y despues la categoria (seccion 7A de la respuesta).
 *
 * Turbo no se pregunta: sale de la condicion que el comercial ya respondio.
 */
function complementosQueAplican(catalogo, codigoPais, categoriaId, esDeTurbo) {
  var elegidos = [];
  var leyendas = comoLeyendas(catalogo);

  for (var t = 0; t < leyendas.length && esDeTurbo; t++) {
    if (leyendas[t].se_elige_en === 'condicion_turbo' && aplicaAlPais(leyendas[t], codigoPais)) {
      elegidos.push(leyendas[t]);
      break;
    }
  }

  if (categoriaId && categoriaId !== 'ninguna') {
    for (var c = 0; c < leyendas.length; c++) {
      if (leyendas[c].se_elige_en !== 'pregunta') continue;
      if (leyendas[c].categoria_id !== categoriaId) continue;
      if (!aplicaAlPais(leyendas[c], codigoPais)) continue;
      elegidos.push(leyendas[c]);
      break;
    }
  }

  return elegidos;
}

/**
 * Las leyendas de campana de este pais y este tipo, una por formato de pieza.
 *
 * Una misma leyenda puede servir para dos formatos (la de banner sirve tambien
 * para exterior), asi que se devuelve por formato y no por leyenda.
 */
function leyendasDeLaCampana(catalogo, codigoPais, tipo) {
  var porFormato = [];
  var leyendas = comoLeyendas(catalogo);

  for (var f = 0; f < TIPOS_DE_PIEZA.length; f++) {
    var formato = TIPOS_DE_PIEZA[f];
    for (var i = 0; i < leyendas.length; i++) {
      var leyenda = leyendas[i];
      if (esComplemento(leyenda)) continue;
      if (!aplicaAlPais(leyenda, codigoPais)) continue;
      if (!aplicaAlTipo(leyenda, tipo)) continue;
      if (leyenda.tipo_pieza.indexOf(formato.id) === -1) continue;
      porFormato.push({
        formato: formato.id, nombre: formato.nombre,
        largo_max: formato.largo_max, leyenda: leyenda,
      });
      break;
    }
  }
  return porFormato;
}

// --- Armar el texto --------------------------------------------------------

/**
 * Quita los tramos recortables hasta el nivel pedido.
 *
 * Nivel 0 no quita nada. Nivel 1 quita [[R1]], nivel 2 quita ademas [[R2]], y
 * asi. El numero es el orden en que Legal decidio que sale cada tramo, y vive
 * dentro del texto legal justamente para que se pueda revisar sin leer codigo.
 */
function aplicarRecorte(texto, nivel) {
  return texto.replace(/\[\[R(\d+)\]\]([\s\S]*?)\[\[\/R\]\]/g, function (todo, numero, cuerpo) {
    return Number(numero) <= nivel ? '' : cuerpo;
  });
}

/** Los niveles de recorte que este texto tiene marcados, de menor a mayor. */
function nivelesDeRecorte(texto) {
  var niveles = [];
  var patron = /\[\[R(\d+)\]\]/g;
  var encontrado;
  while ((encontrado = patron.exec(texto)) !== null) {
    var numero = Number(encontrado[1]);
    if (niveles.indexOf(numero) === -1) niveles.push(numero);
  }
  niveles.sort(function (a, b) { return a - b; });
  return niveles;
}

function resolverOpcionalesDeLeyenda(texto, valores) {
  return texto.replace(/\[\[\?(\w+)\]\]([\s\S]*?)\[\[\/\?\]\]/g, function (todo, llave, cuerpo) {
    return valores[llave] ? cuerpo : '';
  });
}

/**
 * Reemplaza los marcadores y anota los que quedaron vacios.
 *
 * El punto de una abreviatura es tambien el punto de la frase. Sin esto, una
 * razon social como "Operador de Prueba S.A.S." dentro de "Cashback ofrecido por
 * {{TIENDA}}." salia con dos puntos seguidos, que es una de las senales de texto
 * roto: la leyenda entera se caia. Paso de verdad con el caso dorado TV05.
 */
function reemplazarEnLeyenda(texto, valores) {
  var vacios = [];
  var resultado = texto.replace(/\{\{(\w+)\}\}/g, function (todo, llave, posicion) {
    var valor = valores[llave];
    if (valor === undefined || valor === null || valor === '') {
      if (vacios.indexOf(llave) === -1) vacios.push(llave);
      return '';
    }
    var escrito = String(valor);
    var siguiente = texto.charAt(posicion + todo.length);
    if (siguiente === '.' && escrito.charAt(escrito.length - 1) === '.') {
      return escrito.slice(0, -1);
    }
    return escrito;
  });
  return { texto: resultado, vacios: vacios };
}

/** Une los espacios que deja un tramo recortado. La leyenda va en una linea. */
function apretar(texto) {
  return texto.replace(/\s+/g, ' ').trim();
}

function senalesDeLeyendaRota(texto) {
  var encontradas = [];
  for (var i = 0; i < SENALES_DE_LEYENDA_ROTA.length; i++) {
    if (SENALES_DE_LEYENDA_ROTA[i].patron.test(texto)) encontradas.push(SENALES_DE_LEYENDA_ROTA[i].nombre);
  }
  return encontradas;
}

/** Un paso del render, sin recortar: opcionales, placeholders y apretar. */
function renderDeUnNivel(cuerpo, valores, nivel) {
  var texto = aplicarRecorte(cuerpo, nivel);
  texto = resolverOpcionalesDeLeyenda(texto, valores);
  var reemplazo = reemplazarEnLeyenda(texto, valores);
  return { texto: apretar(reemplazo.texto), vacios: reemplazo.vacios };
}

/**
 * Arma una leyenda con los datos de la campana.
 *
 * Devuelve el texto, cuanto mide, si cabe, cuanto hubo que recortar y que se
 * quedo por fuera. Si no cabe ni con el ultimo nivel, se devuelve igual con
 * cabe: false, porque el comercial tiene que verlo antes de que alguien diseñe
 * la pieza (seccion 7D de la respuesta). Lo que nunca se devuelve es una
 * leyenda con un hueco: eso es un error, como en el documento.
 */
function armarLeyenda(leyenda, valores, largoDelFormato) {
  var limite = largoDelFormato || leyenda.largo_max;
  var niveles = [0].concat(nivelesDeRecorte(leyenda.cuerpo));
  var elegido = null;

  for (var i = 0; i < niveles.length; i++) {
    var intento = renderDeUnNivel(leyenda.cuerpo, valores, niveles[i]);
    elegido = { nivel: niveles[i], texto: intento.texto, vacios: intento.vacios };
    if (!limite || intento.texto.length <= limite) break;
  }

  var errores = [];
  for (var v = 0; v < elegido.vacios.length; v++) {
    errores.push('Falta un dato: la leyenda necesita "' + elegido.vacios[v] + '" y quedó vacío.');
  }
  if (MARCAS_SIN_RESOLVER_EN_LEYENDA.test(elegido.texto)) {
    errores.push('Quedaron marcas sin resolver en la leyenda.');
  }
  var senales = senalesDeLeyendaRota(elegido.texto);
  for (var s = 0; s < senales.length; s++) {
    errores.push('El texto quedó roto: hay ' + senales[s] + '.');
  }

  // Cuanto se pasa, y cuanto de eso son enlaces. Decir solo "no cabe" deja al
  // comercial sin nada que hacer; con los numeros, Legal puede decidir si el
  // limite del formato es el correcto o si hay que acortar algo.
  var sobra = limite ? Math.max(0, elegido.texto.length - limite) : 0;
  var enEnlaces = 0;
  var enlaces = elegido.texto.match(/https?:\/\/\S+/g) || [];
  for (var u = 0; u < enlaces.length; u++) enEnlaces += enlaces[u].length;

  return {
    id: leyenda.id,
    texto: elegido.texto,
    largo: elegido.texto.length,
    largo_max: limite,
    sobra: sobra,
    enlaces: enlaces.length,
    caracteresEnEnlaces: enEnlaces,
    cabe: !limite || elegido.texto.length <= limite,
    nivel: elegido.nivel,
    recortada: elegido.nivel > 0,
    vacios: elegido.vacios,
    errores: errores,
  };
}

/**
 * El texto de los complementos, listo para entrar en {{TEXTO_COMPLEMENTOS}}.
 *
 * Es un fragmento: cada complemento trae su propia puntuacion, y algunos del SSL
 * van a proposito sin punto final. Aqui solo se unen con un espacio.
 */
function textoDeComplementos(complementos, valores) {
  var partes = [];
  var errores = [];
  for (var i = 0; i < complementos.length; i++) {
    var armada = armarLeyenda(complementos[i], valores);
    for (var e = 0; e < armada.errores.length; e++) {
      errores.push(complementos[i].id + ': ' + armada.errores[e]);
    }
    if (armada.texto) partes.push(armada.texto);
  }
  return { texto: partes.join(' '), errores: errores };
}

/**
 * Todo lo que la herramienta entrega al final: una leyenda por formato de pieza.
 *
 * El comercial copia la que necesite. No se le pregunta en que pieza va a salir
 * (seccion 7B.4): preguntarlo seria una pregunta mas para un dato que el ya sabe
 * y que la herramienta no necesita para nada mas.
 */
function leyendasDeLaPieza(catalogo, codigoPais, tipo, valores, opciones) {
  var config = opciones || {};
  var complementos = complementosQueAplican(catalogo, codigoPais, config.categoria, config.esDeTurbo);
  var deComplementos = textoDeComplementos(complementos, valores);

  var conComplementos = {};
  for (var llave in valores) {
    if (Object.prototype.hasOwnProperty.call(valores, llave)) conComplementos[llave] = valores[llave];
  }
  conComplementos.TEXTO_COMPLEMENTOS = deComplementos.texto;

  var salida = [];
  var deLaCampana = leyendasDeLaCampana(catalogo, codigoPais, tipo);
  for (var i = 0; i < deLaCampana.length; i++) {
    var armada = armarLeyenda(deLaCampana[i].leyenda, conComplementos, deLaCampana[i].largo_max);
    armada.formato = deLaCampana[i].formato;
    armada.nombre = deLaCampana[i].nombre;
    salida.push(armada);
  }

  return {
    leyendas: salida,
    complementos: complementos.map(function (c) { return c.id; }),
    errores: deComplementos.errores,
  };
}

if (typeof module !== 'undefined') {
  module.exports = {
    TIPOS_DE_PIEZA: TIPOS_DE_PIEZA,
    FORMAS_DE_ELEGIR: FORMAS_DE_ELEGIR,
    leyendaDesdeTexto: leyendaDesdeTexto,
    cargarCatalogo: cargarCatalogo,
    usarCatalogo: usarCatalogo,
    catalogoActual: catalogoActual,
    categoriasDeProducto: categoriasDeProducto,
    categoriaPideRegistro: categoriaPideRegistro,
    categoriaPideInvima: categoriaPideInvima,
    CATEGORIAS_CON_REGISTRO: CATEGORIAS_CON_REGISTRO,
    CATEGORIAS_CON_INVIMA: CATEGORIAS_CON_INVIMA,
    hayLeyendasDeCampana: hayLeyendasDeCampana,
    categoriasDelPais: categoriasDelPais,
    complementosQueAplican: complementosQueAplican,
    leyendasDeLaCampana: leyendasDeLaCampana,
    leyendasDeLaPieza: leyendasDeLaPieza,
    armarLeyenda: armarLeyenda,
    textoDeComplementos: textoDeComplementos,
    aplicarRecorte: aplicarRecorte,
    nivelesDeRecorte: nivelesDeRecorte,
  };
}

// --- src/core/motor.js ---
'use strict';

/**
 * Motor de documentos: convierte un modelo de modelos/ y los hechos del
 * formulario en el texto final del documento.
 *
 * Pasos del render (seccion 4.2 de la especificacion):
 *   1. Expandir [[INCLUIR:...]]
 *   2. Quitar los comentarios %%
 *   3. Calcular los valores derivados
 *   4. Expandir los bloques repetibles [[#TIENDAS]]
 *   5. Resolver los bloques opcionales [[?CAMPO]]
 *   6. Reemplazar los placeholders {{CAMPO}}
 *   7. Numerar las clausulas
 *
 * Determinismo (regla 2 de CLAUDE.md): si algo falta, el motor lo reporta y no
 * se genera el documento. Nunca completa ni inventa texto.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTexto = require('./texto.js');
  var normalizarTexto = moduloTexto.normalizarTexto;
  var textoPlano = moduloTexto.textoPlano;

  var moduloDerivados = require('./derivados.js');
  var calcularDerivados = moduloDerivados.calcularDerivados;
  var conElIdiomaDe = require('./idiomas.js').conElIdiomaDe;
  var valoresDeTienda = moduloDerivados.valoresDeTienda;
}

/** Marcas que nunca pueden quedar en el documento final. */
var MARCAS_SIN_RESOLVER = /\{\{|\}\}|\[\[|\]\]/;

/**
 * Red de seguridad sobre el texto final (seccion 4.3, punto 5).
 * Cada patron delata una frase rota por un valor vacio.
 */
var SENALES_DE_TEXTO_ROTO = [
  { nombre: 'un espacio antes de una coma', patron: / ,/ },
  { nombre: 'un espacio antes de un punto', patron: / \./ },
  { nombre: 'dos puntos seguidos', patron: /(^|[^.])\.\.(?!\.)/ },
  { nombre: 'un parentesis vacío', patron: /\(\s*\)/ },
  { nombre: 'dos espacios seguidos', patron: {} },
  { nombre: 'una coma seguida de un punto', patron: /, \./ },
];
// El patron de dos espacios se arma aparte para que no se pierda al leerlo.
SENALES_DE_TEXTO_ROTO[4].patron = /  /;

/** Paso 1: reemplaza cada [[INCLUIR:nombre]] por el bloque correspondiente. */
function expandirInclusiones(texto, bloques) {
  var faltantes = [];
  var resultado = normalizarTexto(texto).replace(/^\[\[INCLUIR:(\w+)\]\]$/gm, function (todo, nombre) {
    if (!Object.prototype.hasOwnProperty.call(bloques, nombre)) {
      faltantes.push(nombre);
      return todo;
    }
    return normalizarTexto(bloques[nombre]).replace(/\n+$/, '');
  });
  return { texto: resultado, faltantes: faltantes };
}

/** Paso 2: quita las lineas de comentario. */
function quitarComentarios(texto) {
  var lineas = texto.split('\n');
  var conservadas = [];
  for (var i = 0; i < lineas.length; i++) {
    if (lineas[i].indexOf('%%') !== 0) conservadas.push(lineas[i]);
  }
  return conservadas.join('\n');
}

/** Paso 4: repite el bloque de tiendas una vez por tienda. */
function expandirTiendas(texto, tiendas, pais) {
  return texto.replace(/^\[\[#TIENDAS\]\]\n([\s\S]*?)\n\[\[\/TIENDAS\]\]$/gm, function (todo, cuerpo) {
    var salida = [];
    for (var i = 0; i < tiendas.length; i++) {
      var valores = valoresDeTienda(tiendas[i], pais);
      salida.push(
        cuerpo.replace(/\{\{(TIENDA_\w+)\}\}/g, function (marca, llave) {
          return Object.prototype.hasOwnProperty.call(valores, llave) ? valores[llave] : marca;
        })
      );
    }
    return salida.join('\n');
  });
}

/** Paso 5: conserva el bloque opcional solo si el campo tiene valor. */
function resolverOpcionales(texto, valores) {
  return texto.replace(/\[\[\?(\w+)\]\]([\s\S]*?)\[\[\/\?\]\]/g, function (todo, llave, cuerpo) {
    return valores[llave] ? cuerpo : '';
  });
}

/** Paso 6: reemplaza los placeholders y anota los que quedaron vacios. */
function reemplazarPlaceholders(texto, valores) {
  var vacios = [];
  var resultado = texto.replace(/\{\{(\w+)\}\}/g, function (todo, llave) {
    var valor = valores[llave];
    if (!valor) {
      if (vacios.indexOf(llave) === -1) vacios.push(llave);
      return '';
    }
    return valor;
  });
  return { texto: resultado, vacios: vacios };
}

/** Paso 7: numera las clausulas y quita las lineas vacias. */
function numerarClausulas(texto) {
  var lineas = texto.split('\n');
  var salida = [];
  var numero = 0;

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    if (!linea.trim()) continue;

    if (linea.indexOf('§ ') === 0) {
      numero += 1;
      var cuerpo = linea.slice(2);
      var titulo;
      var resto;
      var corte = cuerpo.indexOf('. ');
      if (corte !== -1) {
        titulo = cuerpo.slice(0, corte);
        resto = cuerpo.slice(corte + 2);
      } else {
        titulo = cuerpo.replace(/\.+$/, '');
        resto = '';
      }
      linea = ('**' + numero + '. ' + titulo + '.** ' + resto).replace(/\s+$/, '');
    }
    salida.push(linea);
  }
  return salida.join('\n');
}

/** Devuelve los nombres de las senales de texto roto encontradas. */
function senalesDeTextoRoto(texto) {
  var plano = textoPlano(texto);
  var encontradas = [];
  for (var i = 0; i < SENALES_DE_TEXTO_ROTO.length; i++) {
    var senal = SENALES_DE_TEXTO_ROTO[i];
    if (senal.patron.test(plano)) encontradas.push(senal.nombre);
  }
  // Una vineta sin contenido tambien delata un valor vacio.
  if (/^•\s*$/m.test(texto)) encontradas.push('una viñeta vacía');
  return encontradas;
}

/**
 * Render completo.
 *
 * modelos: { modelos: {nombre: texto}, bloques: {nombre: texto} }
 * Devuelve { texto, errores, placeholdersVacios }.
 * Si errores tiene algo, el documento no se debe crear.
 */
function renderizar(nombreModelo, entrada, pais, modelos) {
  var errores = [];

  if (!Object.prototype.hasOwnProperty.call(modelos.modelos, nombreModelo)) {
    return { texto: '', errores: ['No existe el modelo "' + nombreModelo + '".'], placeholdersVacios: [] };
  }

  var inclusiones = expandirInclusiones(modelos.modelos[nombreModelo], modelos.bloques);
  for (var i = 0; i < inclusiones.faltantes.length; i++) {
    errores.push('El modelo incluye el bloque "' + inclusiones.faltantes[i] + '", que no existe.');
  }

  var texto = quitarComentarios(inclusiones.texto);
  var valores = calcularDerivados(entrada, pais);

  // Con el idioma del pais, igual que los derivados: la lista de tiendas se
  // expandia despues de que calcularDerivados devolvia el idioma a espanol, y
  // en un pais en portugues habria salido "doce millones de Créditos" por tienda.
  texto = conElIdiomaDe(pais, function () { return expandirTiendas(texto, entrada.tiendas || [], pais); });
  texto = resolverOpcionales(texto, valores);

  var reemplazo = reemplazarPlaceholders(texto, valores);
  texto = numerarClausulas(reemplazo.texto);

  for (var j = 0; j < reemplazo.vacios.length; j++) {
    errores.push('Falta un dato: el documento necesita "' + reemplazo.vacios[j] + '" y quedó vacío.');
  }

  if (MARCAS_SIN_RESOLVER.test(texto)) {
    errores.push('Quedaron marcas sin resolver en el documento.');
  }

  var senales = senalesDeTextoRoto(texto);
  for (var k = 0; k < senales.length; k++) {
    errores.push('El texto quedó roto: hay ' + senales[k] + '.');
  }

  return { texto: texto, errores: errores, placeholdersVacios: reemplazo.vacios };
}

/** Marca que envuelve un hueco en la vista previa. Nunca aparece en el documento. */
var MARCA_HUECO = String.fromCharCode(1);

/**
 * Render para la vista previa en vivo.
 *
 * Igual que renderizar(), pero en vez de dejar vacio un dato que falta pone un
 * hueco marcado. La interfaz lo convierte en un espacio en blanco gris que dice
 * que pregunta lo llena.
 *
 * Esto NUNCA genera el documento: generar() usa renderizar(), que bloquea si
 * falta algo. Los huecos viven solo en la pantalla.
 */
function renderizarVistaPrevia(nombreModelo, entrada, pais, modelos) {
  if (!Object.prototype.hasOwnProperty.call(modelos.modelos, nombreModelo)) {
    return { texto: '', huecos: [] };
  }

  var inclusiones = expandirInclusiones(modelos.modelos[nombreModelo], modelos.bloques);
  var texto = quitarComentarios(inclusiones.texto);
  var valores = calcularDerivados(entrada, pais);
  var huecos = [];

  // Un bloque repetible sin tiendas deja la lista vacia: se anuncia el hueco.
  var tiendas = entrada.tiendas || [];
  if (tiendas.length === 0) {
    texto = texto.replace(/^\[\[#TIENDAS\]\]\n[\s\S]*?\n\[\[\/TIENDAS\]\]$/gm, function () {
      huecos.push('TIENDA_MARCA');
      return '\u2022 {{TIENDA_MARCA}}';
    });
  } else {
    texto = conElIdiomaDe(pais, function () { return expandirTiendas(texto, tiendas, pais); });
  }

  texto = resolverOpcionales(texto, valores);

  texto = texto.replace(/\{\{(\w+)\}\}/g, function (todo, llave) {
    var valor = valores[llave];
    if (valor) return valor;
    if (huecos.indexOf(llave) === -1) huecos.push(llave);
    return MARCA_HUECO + llave + MARCA_HUECO;

  return { texto: numerarClausulas(texto), huecos: huecos };

/**
 * Parte una linea de la vista previa en tramos de texto y de hueco.
 * Devuelve [{ tipo: 'texto' | 'hueco', valor }].
 */
function tramosDeVistaPrevia(linea) {
  var partes = String(linea).split(MARCA_HUECO);
  var tramos = [];
  for (var i = 0; i < partes.length; i++) {
    if (!partes[i]) continue;
    tramos.push({ tipo: i % 2 === 1 ? 'hueco' : 'texto', valor: partes[i] });

  return tramos;

    renderizar: renderizar,
    renderizarVistaPrevia: renderizarVistaPrevia,
    tramosDeVistaPrevia: tramosDeVistaPrevia,
    MARCA_HUECO: MARCA_HUECO,
    expandirInclusiones: expandirInclusiones,

    expandirTiendas: expandirTiendas,
    resolverOpcionales: resolverOpcionales,

'use strict';

/**
 * El nombre de la campana y la direccion con la que se publica.
 *
 * Nadie los escribe a mano. Los dos salen de las respuestas que ya dio el
 * comercial, y por eso no pueden contradecir el articulado.
 *
 * El caso que obligo a esto: una campana se llamo "99% de Cashback El Corral
 * 20/09" y la clausula decia cincuenta por ciento (50%) con vigencia el 17 de
 * septiembre. Como el documento dice que en caso de discrepancia se aplica la
 * condicion mas favorable para el usuario, un titulo que promete 99% obliga a
 * pagar 99%.
 *
 * Forma del nombre (decidida por Juan el 16 de septiembre):
 *
 *   Tienda · Porcentaje y tipo · Dia de inicio
 *   El Corral · 50% Cashback · 20 sep 2026
 *   Pollo Dorado · Carrera de Compras · 20 sep 2026
 *   Cashback Multitienda · 20 sep 2026
 *
 * Sin etiqueta libre. Dos campanas nunca se pueden llamar igual: cuando el
 * nombre ya existe se le agrega un consecutivo.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloIdiomas = require('./idiomas.js');
  var textosDelIdioma = moduloIdiomas.textosDelIdioma;
  var conElIdiomaDe = moduloIdiomas.conElIdiomaDe;
  var partesDeFecha = require('./fechas.js').partesDeFecha;
  var MODALIDAD_TURBO_POR_DEFECTO = require('./derivados_eta.js').MODALIDAD_TURBO_POR_DEFECTO;
}

var SEPARADOR_NOMBRE = ' · ';

/** Meses cortos para el nombre. En el documento van completos, no aqui. */
/* Se conserva por compatibilidad: los meses de verdad salen del idioma activo. */
var MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

/**
 * "2026-09-20" -> "20 sep 2026", o "20 set 2026" en Brasil.
 *
 * El nombre va impreso como titulo del documento, asi que tiene que estar en el
 * mismo idioma que el articulado. Un titulo que diga "1 oct" sobre un texto que
 * dice "1 de outubro" se lee como un descuido.
 */
function fechaCortaDeNombre(iso) {
  var partes = partesDeFecha(iso);
  if (!partes) return '';
  var cortos = textosDelIdioma().mesesCortos || MESES_CORTOS;
  return partes.dia + ' ' + cortos[partes.mes - 1] + ' ' + partes.anio;
}

/**
 * El tramo que describe el beneficio. Lleva el porcentaje cuando la campana
 * tiene uno solo, porque sale del mismo dato que alimenta la clausula y por eso
 * nunca puede decir algo distinto. El Cashback Multitienda no lo lleva: ahi
 * cada tienda tiene su propio porcentaje.
 */
function tramoDeBeneficio(entrada, esquema) {
  var nombreDelTipo = esquema ? esquema.nombre : '';
  if (!nombreDelTipo) return '';
  var porcentaje = Number(entrada.porcentaje);
  var conPorcentaje = isFinite(porcentaje) && porcentaje > 0;

  // El cashback por ETA: el titulo dice los minutos y el porcentaje, que es lo
  // que el usuario ve prometido. Asi se llaman los documentos publicados.
  if (esquema.id === 'cashback_eta') {
    var minutos = Math.trunc(Number(entrada.etaMinutos));
    if (!isFinite(minutos) || minutos <= 0) return '';
    var promesa = minutos + (minutos === 1 ? ' minuto' : ' minutos');
    return conPorcentaje ? promesa + ' o ' + porcentaje + '% Cashback' : promesa + ' o Cashback';
  }

  // Brasil: el titulo dice el beneficio como lo nombran los documentos
  // aprobados ("10% OFF", "Frete gratis"), no el nombre del tipo.
  if (esquema.id === 'promocao_br') {
    if (entrada.beneficioBr === 'desconto') return conPorcentaje ? porcentaje + '% OFF' : 'Desconto';
    if (entrada.beneficioBr === 'frete_gratis') return 'Frete grátis';
    if (entrada.beneficioBr === 'taxa_servico') return 'Taxa de serviço grátis';
    if (entrada.beneficioBr === 'taxa_e_frete') return 'Taxa de serviço e frete grátis';
    return '';
  }

  if (esquema.id === 'cashback') {
    return conPorcentaje ? porcentaje + '% ' + nombreDelTipo : nombreDelTipo;
  }

  // Cashback Travel con monto fijo no lleva porcentaje, porque no tiene.
  if (esquema.id === 'cashback_travel') {
    if (entrada.formaBeneficio !== 'porcentaje' || !conPorcentaje) return nombreDelTipo;
    return porcentaje + '% ' + nombreDelTipo;
  }

  // En el descuento variable el titulo dice "Hasta", que es lo que exige la
  // transparencia: un "40%" a secas prometeria ese porcentaje en todo.
  if (esquema.id === 'descuento_travel') {
    if (!conPorcentaje) return nombreDelTipo;
    var hasta = entrada.formaDescuento === 'variable' ? 'Hasta ' : '';
    return hasta + porcentaje + '% ' + nombreDelTipo;
  }

  return nombreDelTipo;
}

/**
 * El nombre de la campana.
 *
 * entrada.sufijoNombre, cuando viene, es el consecutivo que evita que dos
 * campanas se llamen igual. Lo pone el servidor al generar, nunca el comercial.
 *
 * Devuelve cadena vacia mientras falte algun dato: la vista previa lo muestra
 * como un hueco, igual que cualquier otro.
 */
function nombreDeCampana(entrada, esquema, pais) {
  // El nombre va impreso como titulo del documento y como nombre del archivo en
  // Drive, asi que tiene que estar en el mismo idioma que el articulado. Con
  // pais se arma en su idioma; sin pais, en espanol, que es el 99,7% de los
  // casos y lo que hacian todas las llamadas de antes.
  if (pais) {
    return conElIdiomaDe(pais, function () { return nombreDeCampanaEnElIdioma(entrada, esquema); });
  }
  return nombreDeCampanaEnElIdioma(entrada, esquema);
}

function nombreDeCampanaEnElIdioma(entrada, esquema) {
  var datos = entrada || {};
  var tramos = [];

  // El Cashback Multitienda no tiene una sola tienda, asi que arranca por el
  // tipo. En Travel la tienda es la marca aliada y, si no hay, el Organizador.
  var tienda = String(datos.tienda || datos.marcaAliado || '').trim();
  if (!tienda && esquema && esquema.esDeTravel) tienda = String(datos.organizadorRazonSocial || '').trim();
  // En el cashback por ETA no hay una tienda: hay una modalidad y una ciudad.
  // Y una tienda que quedo en la entrada de un tipo anterior no cuenta: el
  // titulo decia "El Corral · 15 minutos o 100% Cashback" sin que el ETA
  // preguntara nunca por El Corral.
  if (esquema && esquema.esPorEta) {
    var ciudad = String(datos.ciudades || '').trim();
    tienda = ciudad ? MODALIDAD_TURBO_POR_DEFECTO + ' ' + ciudad : '';
  }
  if (tienda) tramos.push(tienda);

  var beneficio = tramoDeBeneficio(datos, esquema);
  if (!beneficio) return '';
  tramos.push(beneficio);

  var fecha = fechaCortaDeNombre(datos.fechaInicio);
  if (!fecha) return '';
  tramos.push(fecha);

  var sufijo = Number(datos.sufijoNombre);
  if (isFinite(sufijo) && sufijo > 1) tramos.push(String(sufijo));

  return tramos.join(SEPARADOR_NOMBRE);
}

/**
 * Quita las tildes. No se usa String.normalize porque Apps Script corre en un
 * motor viejo en algunos casos y esto tiene que dar igual en los dos lados.
 */
var LETRAS_CON_TILDE = 'áàäâãéèëêíìïîóòöôõúùüûñçÁÀÄÂÃÉÈËÊÍÌÏÎÓÒÖÔÕÚÙÜÛÑÇ';
var LETRAS_SIN_TILDE = 'aaaaaeeeeiiiiooooouuuuncAAAAAEEEEIIIIOOOOOUUUUNC';

function sinTildes(texto) {
  var salida = '';
  var original = String(texto || '');
  for (var i = 0; i < original.length; i++) {
    var posicion = LETRAS_CON_TILDE.indexOf(original.charAt(i));
    salida += posicion === -1 ? original.charAt(i) : LETRAS_SIN_TILDE.charAt(posicion);
  }
  return salida;
}

/**
 * La parte final de la direccion en Squarespace.
 *
 * "El Corral · 50% Cashback · 20 sep 2026" -> "el-corral-50-cashback-20-sep-2026"
 *
 * Sale del nombre, asi que la direccion y el titulo siempre hablan de la misma
 * campana y se pueden buscar con las mismas palabras.
 */
function direccionDeCampana(nombre) {
  return sinTildes(nombre)
    .toLowerCase()
    .replace(/%/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+/, '')
    .replace(/-+$/, '')
    .replace(/-{2,}/g, '-');
}

/**
 * El consecutivo libre para un nombre, mirando los que ya existen.
 *
 * Devuelve 1 cuando el nombre esta libre, 2 para el segundo, y asi. La
 * comparacion ignora mayusculas y tildes, porque "El Corral" y "el corral" son
 * la misma campana para quien busca.
 */
function sufijoLibreDeNombre(nombreBase, nombresExistentes) {
  var usados = {};
  var lista = nombresExistentes || [];
  for (var i = 0; i < lista.length; i++) {
    usados[direccionDeCampana(lista[i])] = true;
  }

  var base = String(nombreBase || '').trim();
  if (!base) return 1;

  for (var sufijo = 1; sufijo <= 500; sufijo++) {
    var candidato = sufijo === 1 ? base : base + SEPARADOR_NOMBRE + sufijo;
    if (!usados[direccionDeCampana(candidato)]) return sufijo;
  }
  return 1;
}

if (typeof module !== 'undefined') {
  module.exports = {
    SEPARADOR_NOMBRE: SEPARADOR_NOMBRE,
    MESES_CORTOS: MESES_CORTOS,
    fechaCortaDeNombre: fechaCortaDeNombre,
    nombreDeCampana: nombreDeCampana,
    sinTildes: sinTildes,
    direccionDeCampana: direccionDeCampana,
    sufijoLibreDeNombre: sufijoLibreDeNombre,
  };
}

'use strict';

/**
 * Numeros en letras, montos y cantidades de Creditos.
 *
 * Corre igual en Node (pruebas), Apps Script (generacion) y el navegador
 * (vista previa). Sin require ni import: en Apps Script son funciones globales.
 *
 * El comportamiento esperado esta fijado por docs/referencia/motor_prototipo.py,
 * que es el prototipo con el que Legal valido los modelos.
 *
 * El espanol vive aqui entero. Cuando el idioma activo es otro, estas funciones
 * delegan en el archivo de ese idioma (numeros_pt.js) sin tocar una sola letra
 * de lo de abajo: los textos de Colombia no se pueden mover ni un caracter por
 * una campana de Brasil.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloIdiomas = require('./idiomas.js');
  var idiomaActivo = moduloIdiomas.idiomaActivo;
  var textosDelIdioma = moduloIdiomas.textosDelIdioma;

  var moduloPt = require('./numeros_pt.js');
  var numeroEnLetrasPt = moduloPt.numeroEnLetrasPt;
  var enFemeninoPt = moduloPt.enFemeninoPt;
  var letrasYCifraPt = moduloPt.letrasYCifraPt;
  var letrasYCifraFemeninoPt = moduloPt.letrasYCifraFemeninoPt;
}

var UNIDADES = [
  'cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve',
  'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete',
  'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés',
  'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve',
];

var DECENAS = {
  30: 'treinta',
  40: 'cuarenta',
  50: 'cincuenta',
  60: 'sesenta',
  70: 'setenta',
  80: 'ochenta',
  90: 'noventa',
};

var CENTENAS = {
  100: 'ciento',
  200: 'doscientos',
  300: 'trescientos',
  400: 'cuatrocientos',
  500: 'quinientos',
  600: 'seiscientos',
  700: 'setecientos',
  800: 'ochocientos',
  900: 'novecientos',
};

/** Numeros de 0 a 999 en letras. */
function letrasHasta999(n) {
  if (n < 30) return UNIDADES[n];
  if (n < 100) {
    var decena = Math.floor(n / 10) * 10;
    var unidad = n % 10;
    return DECENAS[decena] + (unidad === 0 ? '' : ' y ' + UNIDADES[unidad]);
  }
  if (n === 100) return 'cien';
  var centena = Math.floor(n / 100) * 100;
  var resto = n % 100;
  return CENTENAS[centena] + (resto === 0 ? '' : ' ' + letrasHasta999(resto));
}

/**
 * Apocope ante sustantivo masculino y ante "mil":
 * uno -> un, veintiuno -> veintiún, treinta y uno -> treinta y un.
 * Solo aplica al final del texto, que es donde queda el sustantivo despues.
 */
function apocopar(texto) {
  var t = String(texto);
  if (/veintiuno$/.test(t)) return t.replace(/veintiuno$/, 'veintiún');
  if (/uno$/.test(t)) {
    // No se toca una palabra que solo termine en "uno" siendo parte de otra
    // (por ejemplo "veintiuno" ya quedo resuelto arriba).
    var anterior = t.charAt(t.length - 4);
    if (!/[a-záéíóúñ]/.test(anterior)) return t.replace(/uno$/, 'un');
  }
  return t;
}

/**
 * Numero en letras hasta 999.999.999.999.
 * Con apocope true devuelve la forma que va pegada a un sustantivo masculino.
 */
function numeroEnLetras(n, apocope) {
  // En portugues no hay apocope: "um" va igual solo que ante sustantivo.
  if (idiomaActivo() === 'pt') return numeroEnLetrasPt(n);

  var entero = Math.trunc(Number(n));
  if (!isFinite(entero) || entero < 0) return '';
  if (entero === 0) return 'cero';

  var partes = [];
  var millones = Math.floor(entero / 1000000);
  var resto = entero % 1000000;
  var miles = Math.floor(resto / 1000);
  var unidades = resto % 1000;

  if (millones) {
    partes.push(millones === 1 ? 'un millón' : apocopar(numeroEnLetras(millones)) + ' millones');
  }
  if (miles) {
    // "mil", nunca "un mil".
    partes.push(miles === 1 ? 'mil' : apocopar(letrasHasta999(miles)) + ' mil');
  }
  if (unidades) {
    partes.push(letrasHasta999(unidades));
  }

  var texto = partes.join(' ');
  return apocope ? apocopar(texto) : texto;
}

/**
 * Forma "letras (cifra)" que precede a un sustantivo masculino:
 * "un (1)", "veintiún (21)", "treinta y un (31)".
 * Quien llama agrega el sustantivo: letrasYCifra(1) + ' pedido'.
 */
function letrasYCifra(n) {
  if (idiomaActivo() === 'pt') return letrasYCifraPt(n);
  var entero = Math.trunc(Number(n));
  return numeroEnLetras(entero, true) + ' (' + entero + ')';
}

/**
 * La forma femenina de un numero escrito en letras.
 *
 * "doscientos ordenes" esta mal: son "doscientas ordenes". Igual con unidades y
 * noches. Los modelos de delivery hablan de pedidos y Creditos, que son
 * masculinos, asi que esto nacio con Rappi Travel, donde aparecen ordenes,
 * unidades y noches.
 *
 * Solo cambian las centenas y el uno, y nunca "mil" ni "millones", que no
 * tienen femenino. Esta funcion no toca el texto masculino: se pide aparte.
 */
function enFemenino(texto) {
  if (idiomaActivo() === 'pt') return enFemeninoPt(texto);

  var t = String(texto);
  // Las centenas concuerdan aunque lleven decenas detras: "doscientas treinta".
  // "quinientos" no lleva la silaba "cien", asi que va aparte.
  t = t.replace(/quinientos/g, 'quinientas');
  t = t.replace(/(dos|tres|cuatro|seis|sete|ocho|nove)cientos/g, '$1cientas');
  // El uno concuerda al final, que es donde queda pegado al sustantivo.
  t = t.replace(/veintiuno$/, 'veintiuna');
  t = t.replace(/(^|\s)uno$/, '$1una');
  return t;
}

/**
 * Forma "letras (cifra)" que precede a un sustantivo femenino:
 * "una (1) orden", "doscientas (200) ordenes".
 */
function letrasYCifraFemenino(n) {
  if (idiomaActivo() === 'pt') return letrasYCifraFemeninoPt(n);
  var entero = Math.trunc(Number(n));
  return enFemenino(numeroEnLetras(entero)) + ' (' + entero + ')';
}

/** Entero con el separador de miles del pais. */
function formatearMiles(n, separador) {
  var entero = String(Math.trunc(Math.abs(Number(n))));
  var conSeparador = entero.replace(/\B(?=(\d{3})+(?!\d))/g, separador);
  return Number(n) < 0 ? '-' + conSeparador : conSeparador;
}

/**
 * Cantidad de Creditos: "treinta mil (30.000) Créditos".
 * Lleva "de" antes de Créditos cuando las letras terminan en millón o millones:
 * "doce millones (12.000.000) de Créditos".
 */
function cantidadCreditos(n, pais) {
  var idioma = textosDelIdioma();
  var letras = numeroEnLetras(n, true);
  var de = idioma.terminacionDeMillon.test(letras) ? ' ' + idioma.deAntesDelSustantivo : '';
  return letras + ' (' + formatearMiles(n, pais.separador_miles) + ')' + de + ' ' + idioma.creditos;
}

/**
 * Monto con moneda, en el orden que usa cada pais.
 *
 * Espanol: "cincuenta mil pesos M/Cte. ($50.000)", las letras primero.
 * Portugues: "R$300,00 (trezentos reais)", la cifra primero y las letras entre
 * parentesis, que es como lo escriben los cuatro T&C aprobados de Brasil.
 */
function montoConMoneda(n, pais) {
  var idioma = textosDelIdioma();
  var cifra = pais.moneda_simbolo + formatearMiles(n, pais.separador_miles) + (idioma.decimalesDelMonto || '');

  if (idioma.formatoMonto === 'cifra_primero') {
    return cifra + ' (' + numeroEnLetras(n) + ' ' + pais.moneda_nombre + ')';
  }
  return numeroEnLetras(n) + ' ' + pais.moneda_nombre + ' (' + cifra + ')';
}

/**
 * Porcentaje: "cincuenta por ciento (50%)", "cien por ciento (100%)".
 * No hay apocope ante "por ciento": "veintiuno por ciento (21%)".
 */
function porcentajeEnLetras(p) {
  var entero = Math.trunc(Number(p));
  var esPt = idiomaActivo() === 'pt';
  var letras = entero === 100 ? (esPt ? 'cem' : 'cien') : numeroEnLetras(entero);
  return letras + ' ' + textosDelIdioma().porCiento + ' (' + entero + '%)';
}

if (typeof module !== 'undefined') {
  module.exports = {
    letrasHasta999: letrasHasta999,
    apocopar: apocopar,
    numeroEnLetras: numeroEnLetras,
    letrasYCifra: letrasYCifra,
    enFemenino: enFemenino,
    letrasYCifraFemenino: letrasYCifraFemenino,
    formatearMiles: formatearMiles,
    cantidadCreditos: cantidadCreditos,
    montoConMoneda: montoConMoneda,
    porcentajeEnLetras: porcentajeEnLetras,
  };
}

'use strict';

/**
 * Numeros en letras en portugues de Brasil.
 *
 * Vive aparte de numeros.js a proposito. Los numeros en espanol estan fijados
 * por docs/referencia/motor_prototipo.py, que es el prototipo con el que Legal
 * valido los modelos de Colombia, y esos textos no se pueden mover ni un
 * caracter. Mezclar los dos idiomas en las mismas funciones habria puesto en
 * riesgo mil ciento ochenta y cuatro documentos por una campana de Brasil.
 *
 * Esto es ortografia, no texto legal: cuanto vale un numero escrito en letras
 * no lo decide un abogado. Lo que si decide Legal Brasil es como se llama el
 * saldo de la Billetera y como se escribe la hora en un T&C, y eso esta anotado
 * en docs/PENDIENTES_LEGAL.md.
 */

var UNIDADES_PT = [
  'zero', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove',
  'dez', 'onze', 'doze', 'treze', 'catorze', 'quinze', 'dezesseis', 'dezessete',
  'dezoito', 'dezenove',
];

var DEZENAS_PT = {
  20: 'vinte',
  30: 'trinta',
  40: 'quarenta',
  50: 'cinquenta',
  60: 'sessenta',
  70: 'setenta',
  80: 'oitenta',
  90: 'noventa',
};

var CENTENAS_PT = {
  100: 'cento',
  200: 'duzentos',
  300: 'trezentos',
  400: 'quatrocentos',
  500: 'quinhentos',
  600: 'seiscentos',
  700: 'setecentos',
  800: 'oitocentos',
  900: 'novecentos',
};

/**
 * Numeros de 0 a 999 en letras.
 *
 * En portugues la "e" va entre todos los tramos: duzentos e trinta e um. Y cien
 * exacto es "cem"; con algo detras es "cento e ...".
 */
function letrasHasta999Pt(n) {
  if (n < 20) return UNIDADES_PT[n];
  if (n < 100) {
    var dezena = Math.floor(n / 10) * 10;
    var unidade = n % 10;
    return DEZENAS_PT[dezena] + (unidade === 0 ? '' : ' e ' + UNIDADES_PT[unidade]);
  }
  if (n === 100) return 'cem';
  var centena = Math.floor(n / 100) * 100;
  var resto = n % 100;
  return CENTENAS_PT[centena] + (resto === 0 ? '' : ' e ' + letrasHasta999Pt(resto));
}

/**
 * Si el ultimo tramo se une con "e" o solo con un espacio.
 *
 * La regla del portugues: lleva "e" cuando el tramo final es menor que cien o
 * es una centena redonda. Por eso "mil e quinhentos" pero "mil duzentos e
 * cinquenta", y "dois mil e um" pero "dois mil trezentos e vinte".
 */
function seUneConE(valorDelUltimoTramo) {
  if (valorDelUltimoTramo === 0) return false;
  if (valorDelUltimoTramo < 100) return true;
  return valorDelUltimoTramo % 100 === 0;
}

/** Numero en letras hasta 999.999.999.999. */
function numeroEnLetrasPt(n) {
  var entero = Math.trunc(Number(n));
  // Un negativo entraba en recursion sin fin y tumbaba la vista previa; algo
  // que no es un numero queda como hueco, no como " undefined (NaN)".
  if (!isFinite(entero) || entero < 0) return '';
  if (entero === 0) return 'zero';

  var milhoes = Math.floor(entero / 1000000);
  var resto = entero % 1000000;
  var milhares = Math.floor(resto / 1000);
  var unidades = resto % 1000;

  var partes = [];
  if (milhoes) {
    partes.push(milhoes === 1 ? 'um milhão' : numeroEnLetrasPt(milhoes) + ' milhões');
  }
  if (milhares) {
    // "mil", nunca "um mil".
    partes.push(milhares === 1 ? 'mil' : letrasHasta999Pt(milhares) + ' mil');
  }
  if (unidades) partes.push(letrasHasta999Pt(unidades));

  if (partes.length === 1) return partes[0];

  // La "e" solo decide el ultimo empalme, y la decide el valor de ese ultimo
  // tramo: "um milhão e duzentos mil" pero "um milhão duzentos e cinquenta mil".
  var valorDelUltimo = unidades || milhares;
  var union = seUneConE(valorDelUltimo) ? ' e ' : ' ';

  var cabeza = partes.slice(0, -1).join(' ');
  return cabeza + union + partes[partes.length - 1];
}

/**
 * La forma femenina de un numero escrito en letras.
 *
 * En portugues concuerdan el uno, el dos y las centenas de doscientos para
 * arriba: uma, duas, duzentas. Mil y milhões no tienen femenino.
 */
function enFemeninoPt(texto) {
  var t = String(texto);
  t = t.replace(/quinhentos/g, 'quinhentas');
  t = t.replace(/(duz|trez|quatroc|seisc|setec|oitoc|novec)entos/g, '$1entas');
  t = t.replace(/(^|\s)dois$/, '$1duas');
  t = t.replace(/(^|\s)um$/, '$1uma');
  return t;
}

/** "duzentos e cinquenta (250)". Quien llama agrega el sustantivo. */
function letrasYCifraPt(n) {
  var entero = Math.trunc(Number(n));
  return numeroEnLetrasPt(entero) + ' (' + entero + ')';
}

/** "duzentas e cinquenta (250)", para un sustantivo femenino. */
function letrasYCifraFemeninoPt(n) {
  var entero = Math.trunc(Number(n));
  return enFemeninoPt(numeroEnLetrasPt(entero)) + ' (' + entero + ')';
}

if (typeof module !== 'undefined') {
  module.exports = {
    letrasHasta999Pt: letrasHasta999Pt,
    numeroEnLetrasPt: numeroEnLetrasPt,
    enFemeninoPt: enFemeninoPt,
    letrasYCifraPt: letrasYCifraPt,
    letrasYCifraFemeninoPt: letrasYCifraFemeninoPt,
  };
}
