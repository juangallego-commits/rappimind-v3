'use strict';

/**
 * Lectura y escritura de tablas: la parte del Sheet que no necesita Google.
 *
 * El servidor pide un rango a SpreadsheetApp y le pasa el arreglo a estas
 * funciones. Asi la logica de las pestanas se prueba entera en Node y el
 * codigo que toca el Sheet queda reducido a leer y escribir un rectangulo.
 */

/** Normaliza un encabezado para comparar: sin espacios sobrantes. */
function normalizarEncabezado(valor) {
  return String(valor === null || valor === undefined ? '' : valor).trim();
}

/**
 * Valores de una pestana (primera fila = encabezados) -> lista de objetos.
 * Las filas totalmente vacias se descartan.
 */
function filasComoObjetos(valores) {
  if (!valores || valores.length < 2) return [];

  var encabezados = [];
  for (var c = 0; c < valores[0].length; c++) {
    encabezados.push(normalizarEncabezado(valores[0][c]));
  }

  var objetos = [];
  for (var f = 1; f < valores.length; f++) {
    var fila = valores[f];
    var objeto = {};
    var tieneAlgo = false;

    for (var i = 0; i < encabezados.length; i++) {
      if (!encabezados[i]) continue;
      var valor = fila[i];
      objeto[encabezados[i]] = valor === undefined ? '' : valor;
      if (valor !== '' && valor !== null && valor !== undefined) tieneAlgo = true;
    }

    if (tieneAlgo) {
      objeto._fila = f + 1; // numero de fila real en el Sheet
      objetos.push(objeto);
    }
  }
  return objetos;
}

/** Objeto -> fila en el orden de los encabezados. Lo que falta queda vacio. */
function objetoComoFila(objeto, encabezados) {
  var fila = [];
  for (var i = 0; i < encabezados.length; i++) {
    var llave = encabezados[i];
    var valor = Object.prototype.hasOwnProperty.call(objeto, llave) ? objeto[llave] : '';
    fila.push(valor === null || valor === undefined ? '' : valor);
  }
  return fila;
}

/** Lee un valor de verdad escrito en el Sheet: si, true, TRUE, 1, x. */
function comoBooleano(valor) {
  if (valor === true) return true;
  if (valor === false || valor === null || valor === undefined) return false;
  var texto = String(valor).trim().toLowerCase();
  return texto === 'si' || texto === 'sí' || texto === 'true' || texto === '1' || texto === 'x';
}

/**
 * Siguiente consecutivo del dia para los identificadores RM-AAAAMMDD-NNNN.
 * Solo cuenta los del mismo dia, asi el numero vuelve a 1 cada manana.
 */
function siguienteConsecutivo(identificadores, fechaIso) {
  var prefijo = 'RM-' + String(fechaIso || '').replace(/-/g, '') + '-';
  var mayor = 0;

  for (var i = 0; i < identificadores.length; i++) {
    var id = String(identificadores[i] || '');
    if (id.indexOf(prefijo) !== 0) continue;
    var numero = parseInt(id.slice(prefijo.length), 10);
    if (!isNaN(numero) && numero > mayor) mayor = numero;
  }
  return mayor + 1;
}

/**
 * Filtra solicitudes por lo que puede ver quien pregunta.
 * comercial y pruebas ven las suyas; legal ve las de su pais; admin ve todo.
 */
function solicitudesVisibles(solicitudes, correo, rol, paisDelUsuario) {
  var visibles = [];
  var correoNormalizado = String(correo || '').trim().toLowerCase();

  for (var i = 0; i < solicitudes.length; i++) {
    var solicitud = solicitudes[i];
    var propia = String(solicitud.email || '').trim().toLowerCase() === correoNormalizado;

    if (rol === 'admin' || propia) {
      visibles.push(solicitud);
    } else if (rol === 'legal' && solicitud.pais === paisDelUsuario) {
      visibles.push(solicitud);
    }
  }
  return visibles;
}

/** Busca texto en los campos visibles de una solicitud. */
function buscarEnSolicitudes(solicitudes, texto) {
  var buscado = String(texto || '').trim().toLowerCase();
  if (!buscado) return solicitudes;

  var encontradas = [];
  var campos = ['id', 'nombre_campana', 'tienda', 'organizador', 'pais', 'tipo', 'estado'];

  for (var i = 0; i < solicitudes.length; i++) {
    for (var c = 0; c < campos.length; c++) {
      var valor = String(solicitudes[i][campos[c]] || '').toLowerCase();
      if (valor.indexOf(buscado) !== -1) {
        encontradas.push(solicitudes[i]);
        break;
      }
    }
  }
  return encontradas;
}

/** Arma un CSV con separador de coma y comillas donde hace falta. */
function comoCsv(objetos, encabezados) {
  function escapar(valor) {
    var texto = valor === null || valor === undefined ? '' : String(valor);
    if (/[",\n]/.test(texto)) return '"' + texto.replace(/"/g, '""') + '"';
    return texto;
  }

  var lineas = [encabezados.map(escapar).join(',')];
  for (var i = 0; i < objetos.length; i++) {
    lineas.push(objetoComoFila(objetos[i], encabezados).map(escapar).join(','));
  }
  return lineas.join('\n');
}

if (typeof module !== 'undefined') {
  module.exports = {
    filasComoObjetos: filasComoObjetos,
    objetoComoFila: objetoComoFila,
    comoBooleano: comoBooleano,
    siguienteConsecutivo: siguienteConsecutivo,
    solicitudesVisibles: solicitudesVisibles,
    buscarEnSolicitudes: buscarEnSolicitudes,
    comoCsv: comoCsv,
  };
}

// --- src/core/texto.js ---
'use strict';

/**
 * Normalizacion de texto del motor.
 *
 * Vive en src/core porque la usan por igual Node (pruebas), Apps Script
 * (generacion del documento) y el navegador (vista previa en vivo).
 *
 * Los modelos y las salidas esperadas se editan en Windows, macOS y Linux. El
 * motor ignora los retornos de carro y la marca BOM para que el texto generado
 * sea identico en los tres sistemas, sin depender de la configuracion de git
 * de quien edite el archivo.
 *
 * Sin import ni require: en Apps Script estas funciones son globales.
 */

/** Quita la marca BOM y convierte \r\n y \r sueltos en \n. */
function normalizarTexto(texto) {
  if (texto === null || texto === undefined) return '';
  var limpio = String(texto);
  if (limpio.charCodeAt(0) === 0xfeff) limpio = limpio.slice(1);
  return limpio.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
}

/** Separa en lineas despues de normalizar. */
function lineasDe(texto) {
  return normalizarTexto(texto).split('\n');
}

/** Quita espacios y tabulaciones al final de cada linea. */
function recortarFinalDeLinea(texto) {
  return lineasDe(texto)
    .map(function (linea) {
      return linea.replace(/[ \t]+$/, '');
    })
    .join('\n');
}

/**
 * Normalizacion usada para comparar el texto generado contra una salida
 * esperada: sin \r, sin espacios al final de linea y sin lineas en blanco al
 * principio ni al final.
 */
function normalizarParaComparar(texto) {
  return recortarFinalDeLinea(texto).replace(/^\n+/, '').replace(/\n+$/, '');
}

/**
 * El documento sin sus marcas de formato: lo que el documento dice, no como
 * se ve. Se usa para buscar frases y para la red de seguridad, donde un "**"
 * en medio no debe esconder un espacio de mas ni una frase rota.
 */
function textoPlano(texto) {
  return normalizarTexto(texto).replace(/\*\*/g, '');
}

/** true si el texto trae algun retorno de carro. */
function tieneRetornoDeCarro(texto) {
  return String(texto === null || texto === undefined ? '' : texto).indexOf('\r') !== -1;
}

if (typeof module !== 'undefined') {
  module.exports = {
    normalizarTexto: normalizarTexto,
    lineasDe: lineasDe,
    recortarFinalDeLinea: recortarFinalDeLinea,
    normalizarParaComparar: normalizarParaComparar,
    textoPlano: textoPlano,
    tieneRetornoDeCarro: tieneRetornoDeCarro,
  };
}

// --- src/core/validaciones.js ---
'use strict';

/**
 * Validacion de la solicitud antes de generar.
 *
 * Bloquea la generacion (seccion 4.3). Cada error trae el campo y un mensaje
 * en lenguaje claro: que pasó y cómo se arregla.
 *
 * El orden importa. Si el pais no esta disponible para quien pide, no tiene
 * sentido revisar el resto: se devuelve solo ese error.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloEsquemas = require('./esquemas.js');
  var esquemaDe = moduloEsquemas.esquemaDe;
  var camposVisibles = moduloEsquemas.camposVisibles;
  var resolverAtributo = moduloEsquemas.resolverAtributo;

  var moduloFechas = require('./fechas.js');
  var comoNumeroFecha = moduloFechas.comoNumeroFecha;
  var comoNumeroFechaHora = moduloFechas.comoNumeroFechaHora;
  var partesDeFecha = moduloFechas.partesDeFecha;
  var partesDeHora = moduloFechas.partesDeHora;

  var moduloIdentificaciones = require('./identificaciones.js');
  var validarIdentificacion = moduloIdentificaciones.validarIdentificacion;
}

function error(campo, mensaje) {
  return { campo: campo, mensaje: mensaje };
}

function estaVacio(valor) {
  if (valor === null || valor === undefined || valor === '') return true;
  if (typeof valor === 'boolean') return valor === false;
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor.length === 0;
  return false;
}

/** El pais esta disponible para quien pide (seccion 4.3, punto 6). */
function validarPais(pais, usuarioEnEquipo) {
  if (!pais) {
    return error('pais', 'No reconocemos ese país. Elige uno de la lista.');
  }
  if (pais.estado === 'bloqueado') {
    return error('pais', 'Todavía no generamos documentos para ' + pais.nombre + '. Escríbele a Legal.');
  }
  if (pais.estado === 'piloto' && !usuarioEnEquipo) {
    return error('pais', pais.nombre + ' está en piloto. Pídele a Legal que te agregue al equipo de pruebas.');
  }
  return null;
}

/** El tipo de campana existe y esta habilitado para el pais (punto 7). */
function validarTipo(tipo, pais) {
  var esquema = esquemaDe(tipo);
  if (!esquema) {
    return error('tipo', 'No reconocemos ese tipo de campaña. Elige uno de la lista.');
  }
  var habilitados = pais.modelos || [];
  for (var i = 0; i < habilitados.length; i++) {
    if (habilitados[i] === esquema.modelo) return null;
  }
  return error('tipo', 'El tipo "' + esquema.nombre + '" todavía no está habilitado para ' + pais.nombre + '.');
}

/** Campos obligatorios visibles que quedaron vacios. */
function validarObligatorios(entrada, esquema) {
  var errores = [];
  var visibles = camposVisibles(esquema.id, entrada);

  for (var i = 0; i < visibles.length; i++) {
    var campo = visibles[i];
    // Los repetibles se revisan aparte, con su minimo y su maximo.
    if (campo.tipo === 'repetible') continue;
    if (!resolverAtributo(campo.obligatorio, entrada, false)) continue;

    if (estaVacio(entrada[campo.id])) {
      errores.push(error(campo.id, 'Falta ' + campo.etiqueta.toLowerCase() + '.'));
    }
  }
  return errores;
}

/** Rangos, formatos de fecha y hora, y largo de los textos. */
function validarFormatos(entrada, esquema) {
  var errores = [];
  var visibles = camposVisibles(esquema.id, entrada);

  for (var i = 0; i < visibles.length; i++) {
    var campo = visibles[i];
    var valor = entrada[campo.id];
    if (estaVacio(valor)) continue;

    if (campo.tipo === 'numero') {
      var numero = Number(valor);
      if (isNaN(numero)) {
        errores.push(error(campo.id, campo.etiqueta + ' debe ser un número.'));
      } else if (campo.minimo !== undefined && numero < campo.minimo) {
        errores.push(error(campo.id, campo.etiqueta + ' debe ser al menos ' + campo.minimo + '.'));
      } else if (campo.maximo !== undefined && numero > campo.maximo) {
        errores.push(error(campo.id, campo.etiqueta + ' no puede pasar de ' + campo.maximo + '.'));
      }
    } else if (campo.tipo === 'fecha' && !partesDeFecha(valor)) {
      errores.push(error(campo.id, campo.etiqueta + ' no es una fecha válida.'));
    } else if (campo.tipo === 'hora' && !partesDeHora(valor)) {
      errores.push(error(campo.id, campo.etiqueta + ' no es una hora válida.'));
    } else if (campo.tipo === 'texto' && campo.maximo !== undefined && String(valor).length > campo.maximo) {
      errores.push(error(campo.id, campo.etiqueta + ' no puede pasar de ' + campo.maximo + ' caracteres.'));
    }
  }
  return errores;
}

/** Vigencia: fin posterior al inicio y nada anterior a la fecha de referencia. */
function validarVigencia(entrada, fechaReferencia) {
  var errores = [];

  var inicio = comoNumeroFechaHora(entrada.fechaInicio, entrada.horaInicio);
  var fin = comoNumeroFechaHora(entrada.fechaFin, entrada.horaFin);
  if (inicio !== null && fin !== null && fin <= inicio) {
    errores.push(error('fechaFin', 'La campaña no puede terminar antes de empezar. Revisa la fecha y la hora de fin.'));
  }

  var hoy = comoNumeroFecha(fechaReferencia);
  var dia = comoNumeroFecha(entrada.fechaInicio);
  if (hoy !== null && dia !== null && dia < hoy) {
    errores.push(error('fechaInicio', 'La campaña no puede empezar en una fecha que ya pasó.'));
  }
  return errores;
}

/** Identificacion del organizador, con el algoritmo del pais. */
function validarOrganizador(entrada, pais) {
  if (estaVacio(entrada.organizadorId)) return [];
  var revision = validarIdentificacion(pais.codigo, entrada.organizadorId);
  return revision.valido ? [] : [error('organizadorId', revision.mensaje)];
}

/** Cruces propios del Cashback. */
function validarCashback(entrada) {
  var errores = [];
  var tope = Number(entrada.tope);
  var presupuesto = Number(entrada.presupuesto);

  if (entrada.tope !== null && entrada.tope !== undefined && entrada.tope !== '' && tope <= 0) {
    errores.push(error('tope', 'El tope por pedido debe ser mayor que cero.'));
  }
  if (entrada.presupuesto !== null && entrada.presupuesto !== undefined && entrada.presupuesto !== '' && presupuesto <= 0) {
    errores.push(error('presupuesto', 'El presupuesto debe ser mayor que cero.'));
  }
  if (tope > 0 && presupuesto > 0 && tope > presupuesto) {
    errores.push(error('tope', 'El tope por pedido no puede ser mayor que el presupuesto total.'));
  }
  return errores;
}

/** Cruces de los Creditos: carga y redencion frente a la vigencia. */
function validarCreditos(entrada) {
  var errores = [];
  var inicio = comoNumeroFecha(entrada.fechaInicio);
  var fin = comoNumeroFecha(entrada.fechaFin);

  if (entrada.carga === 'fecha') {
    var carga = comoNumeroFecha(entrada.fechaCarga);
    if (carga !== null && inicio !== null && carga < inicio) {
      errores.push(error('fechaCarga', 'La fecha de carga no puede ser anterior al inicio de la campaña.'));
    }
  }

  if (entrada.vigencia === 'fecha') {
    var redencion = comoNumeroFecha(entrada.fechaFinRedencion);
    if (redencion !== null && fin !== null && redencion <= fin) {
      errores.push(error('fechaFinRedencion', 'La fecha límite de redención debe ser posterior al fin de la campaña.'));
    }
  }
  return errores;
}

/** Cruces de la Carrera de Compras. */
function validarCarrera(entrada) {
  var errores = [];

  if (entrada.desempate && entrada.desempate === entrada.criterioGanador) {
    errores.push(error('desempate', 'El desempate no puede ser el mismo criterio con el que se define el ganador. Elige otro.'));
  }

  var fin = comoNumeroFecha(entrada.fechaFin);
  var notificacion = comoNumeroFecha(entrada.fechaNotificacion);
  if (fin !== null && notificacion !== null && notificacion <= fin) {
    errores.push(error('fechaNotificacion', 'La fecha de notificación debe ser posterior al fin de la campaña.'));
  }
  return errores;
}

/** La lista de tiendas del Cashback Day. */
function validarTiendas(entrada, pais, esquema) {
  var errores = [];
  var tiendas = entrada.tiendas || [];
  var definicion = null;

  for (var i = 0; i < esquema.campos.length; i++) {
    if (esquema.campos[i].id === 'tiendas') definicion = esquema.campos[i];
  }
  var minimo = definicion && definicion.minimo !== undefined ? definicion.minimo : 2;
  var maximo = definicion && definicion.maximo !== undefined ? definicion.maximo : 60;

  if (tiendas.length < minimo) {
    errores.push(error('tiendas', 'Agrega al menos ' + minimo + ' tiendas participantes.'));
    return errores;
  }
  if (tiendas.length > maximo) {
    errores.push(error('tiendas', 'No puedes agregar más de ' + maximo + ' tiendas.'));
    return errores;
  }

  var vistos = {};
  for (var t = 0; t < tiendas.length; t++) {
    var tienda = tiendas[t];
    var fila = t + 1;

    for (var c = 0; c < esquema.camposPorTienda.length; c++) {
      var campo = esquema.camposPorTienda[c];
      if (!resolverAtributo(campo.obligatorio, tienda, false)) continue;
      if (estaVacio(tienda[campo.id])) {
        errores.push(error('tiendas', 'Tienda ' + fila + ': falta ' + campo.etiqueta.toLowerCase() + '.'));
      }
    }

    if (!estaVacio(tienda.id)) {
      var revision = validarIdentificacion(pais.codigo, tienda.id);
      if (!revision.valido) {
        errores.push(error('tiendas', 'Tienda ' + fila + ': ' + revision.mensaje));
      } else if (vistos[revision.formateado]) {
        errores.push(error('tiendas', 'Tienda ' + fila + ': esa identificación ya está en la tienda ' + vistos[revision.formateado] + '.'));
      } else {
        vistos[revision.formateado] = fila;
      }
    }
  }
  return errores;
}

var PREFIJO_PUBLICACION = 'https://promos.rappi.com/';

/**
 * El link publicado tiene que vivir en promos.rappi.com. Cualquier otro sitio
 * significa que el T&C no quedo donde la campana lo va a referenciar.
 */
function validarLinkPublicado(url) {
  var texto = String(url || '').trim();
  if (!texto) {
    return { valido: false, mensaje: 'Pega el enlace de la página publicada.' };
  }
  if (texto.indexOf(PREFIJO_PUBLICACION) !== 0) {
    return { valido: false, mensaje: 'El enlace debe empezar por ' + PREFIJO_PUBLICACION + '. Copia la dirección de la página ya publicada en Squarespace.' };
  }
  if (texto.length <= PREFIJO_PUBLICACION.length) {
    return { valido: false, mensaje: 'Falta la parte final del enlace, después de ' + PREFIJO_PUBLICACION + '.' };
  }
  return { valido: true, mensaje: '', url: texto };
}

/**
 * Valida la solicitud completa.
 *
 * contexto: { fechaReferencia, usuarioEnEquipo }
 * Devuelve { valido, errores: [{campo, mensaje}] }.
 */
function validarSolicitud(entrada, pais, contexto) {
  var opciones = contexto || {};
  var errorPais = validarPais(pais, !!opciones.usuarioEnEquipo);
  if (errorPais) return { valido: false, errores: [errorPais] };

  var errorTipo = validarTipo(entrada.tipo, pais);
  if (errorTipo) return { valido: false, errores: [errorTipo] };

  var esquema = esquemaDe(entrada.tipo);
  var errores = [];

  errores = errores.concat(validarObligatorios(entrada, esquema));
  errores = errores.concat(validarFormatos(entrada, esquema));
  errores = errores.concat(validarVigencia(entrada, opciones.fechaReferencia));
  errores = errores.concat(validarOrganizador(entrada, pais));
  errores = errores.concat(validarCreditos(entrada));

  if (entrada.tipo === 'cashback') {
    errores = errores.concat(validarCashback(entrada));
  }
  if (entrada.tipo === 'carrera_compras') {
    errores = errores.concat(validarCarrera(entrada));
  }
  if (entrada.tipo === 'cashback_day') {
    errores = errores.concat(validarTiendas(entrada, pais, esquema));
  }

  return { valido: errores.length === 0, errores: errores };
}

if (typeof module !== 'undefined') {
  module.exports = {
    validarSolicitud: validarSolicitud,
    validarLinkPublicado: validarLinkPublicado,
    PREFIJO_PUBLICACION: PREFIJO_PUBLICACION,
    validarPais: validarPais,
    validarTipo: validarTipo,
    validarObligatorios: validarObligatorios,
    validarVigencia: validarVigencia,
    validarTiendas: validarTiendas,
    estaVacio: estaVacio,
  };
}

/** Crea un elemento. Los hijos de texto entran como texto, nunca como HTML. */
function crear(etiqueta, atributos, hijos) {
  var elemento = document.createElement(etiqueta);
  var propiedades = atributos || {};

  for (var llave in propiedades) {
    if (!Object.prototype.hasOwnProperty.call(propiedades, llave)) continue;
    var valor = propiedades[llave];
    if (valor === null || valor === undefined || valor === false) continue;

    if (llave === 'clase') elemento.className = valor;
    else if (llave === 'texto') elemento.textContent = valor;
    else if (llave === 'html') throw new Error('No se inserta HTML: usa texto.');
    else if (llave.indexOf('on') === 0 && typeof valor === 'function') {
      elemento.addEventListener(llave.slice(2), valor);
    } else if (valor === true) elemento.setAttribute(llave, '');
    else elemento.setAttribute(llave, valor);
  }

  var lista = hijos || [];
  for (var i = 0; i < lista.length; i++) {
    var hijo = lista[i];
    if (hijo === null || hijo === undefined || hijo === false) continue;
    elemento.appendChild(typeof hijo === 'string' ? document.createTextNode(hijo) : hijo);
  }

}

/** Número con el separador de miles del país, mientras se escribe. */

function diasEntre(desdeIso, hastaIso) {

function almacenamientoDisponible() {
  try {
    var prueba = '__rm__';
    window.localStorage.setItem(prueba, '1');

    return true;
  } catch (error) {
    return false;
  }
}

function guardarBorrador() {
  if (!almacenamientoDisponible()) return false;
  try {
    window.localStorage.setItem(LLAVE_BORRADOR, JSON.stringify({
      version: VERSION_BORRADOR,
      guardado: new Date().toISOString(),
      entrada: estado.entrada,

    // Almacenamiento lleno o bloqueado. No se avisa en cada tecla: se sigue.
    return false;
  }
}

function leerBorrador() {
  if (!almacenamientoDisponible()) return null;
  try {
    var crudo = window.localStorage.getItem(LLAVE_BORRADOR);
    if (!crudo) return null;

    var guardado = JSON.parse(crudo);
    if (!guardado || guardado.version !== VERSION_BORRADOR) {
      borrarBorrador();
      return null;
    }
    if (!guardado.entrada || !guardado.entrada.tipo) return null;
    return guardado;
  } catch (error) {
    borrarBorrador();
    return null;
  }

  } catch (error) {

  }
}

(function () {
'use strict';

/**
 * Puente con el servidor.
 *
 * En Apps Script llama con google.script.run. En la demostracion estatica llama
 * al servidor simulado, que usa el mismo motor dentro del navegador. El resto de
 * la interfaz no sabe cual de los dos esta corriendo.
 */

var RM = window.RM;

function hayAppsScript() {
  return typeof google !== 'undefined' && google.script && google.script.run;
}

function hayServidorSimulado() {
  return !!RM.servidorSimulado;
}

/** Llama a una funcion del servidor. Siempre devuelve una promesa. */
function llamar(nombre) {
  var argumentos = Array.prototype.slice.call(arguments, 1);

  if (hayAppsScript()) {
    return new Promise(function (resolver, rechazar) {
      var corredor = google.script.run
        .withSuccessHandler(resolver)
        .withFailureHandler(function (error) {
          rechazar(new Error(error && error.message ? error.message : String(error)));
        });
      corredor[nombre].apply(corredor, argumentos);
    });
  }

  if (hayServidorSimulado()) {
    return new Promise(function (resolver, rechazar) {
      // Un retardo corto para que se vea el estado de carga, como en la vida real.
      setTimeout(function () {
        try {
          resolver(RM.servidorSimulado[nombre].apply(null, argumentos));
        } catch (error) {
          rechazar(error);
        }
      }, 120);
    });
  }

  return Promise.reject(new Error('No hay servidor disponible.'));
}

RM.servidor = {
  llamar: llamar,
  hayAppsScript: hayAppsScript,
  hayServidorSimulado: hayServidorSimulado,
};

})();

(function () {
'use strict';

/**
 * La hoja: el T&C que se va llenando mientras el comercial responde.
 *
 * Es el elemento protagonista de la interfaz. Usa el mismo motor de src/core
 * que genera el documento de verdad, asi que lo que se ve aqui es literalmente
 * lo que va a salir.
 *
 * Todo dato del usuario entra como texto, nunca como HTML.
 */

var RM = window.RM;
var crear = RM.util.crear;
var vaciar = RM.util.vaciar;

/** Convierte una linea con marcas ** en nodos, respetando las negritas. */
function nodosConNegritas(texto, destino) {
  var partes = String(texto).split('**');
  for (var i = 0; i < partes.length; i++) {
    if (!partes[i]) continue;
    if (i % 2 === 1 && i < partes.length - (partes.length % 2 === 0 ? 1 : 0)) {
      destino.appendChild(crear('strong', { texto: partes[i] }));
    } else {
      destino.appendChild(document.createTextNode(partes[i]));
    }
  }
}

/** El tipo de bloque de una linea del texto renderizado. */
function claseDeLinea(linea) {
  if (linea.indexOf('## ') === 0) return { clase: 'doc-subtitulo', desde: 3 };
  if (linea.indexOf('# ') === 0) return { clase: 'doc-titulo', desde: 2 };
  if (linea.indexOf('• ') === 0) return { clase: 'doc-vineta', desde: 2 };
  if (/^\*\*\d+\.\s/.test(linea)) return { clase: 'doc-clausula', desde: 0 };
  return { clase: 'doc-parrafo', desde: 0 };
}

/**
 * Dibuja el documento.
 *
 * texto: salida de renderizarVistaPrevia (puede traer huecos marcados)
 * anterior: el texto de la vez pasada, para saber que cambio y resaltarlo
 */
function dibujar(contenedor, texto, anterior) {
  vaciar(contenedor);

  if (!texto) {
    contenedor.appendChild(crear('p', {
      clase: 'hoja-vacia',
      texto: 'Tu documento aparece aquí y se va llenando mientras respondes.',
    }));
    return null;
  }

  var lineas = texto.split('\n');
  var lineasAnteriores = (anterior || '').split('\n');
  var primeraCambiada = null;

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    var forma = claseDeLinea(linea);
    var contenido = linea.slice(forma.desde);
    var parrafo = crear('p', { clase: forma.clase });

    // Cambió esta línea respecto al render anterior. Solo se marca si antes
    // había algo: la primera vez no se resalta el documento entero.
    var cambio = anterior && lineasAnteriores[i] !== linea;

    var tramos = tramosDeVistaPrevia(contenido);
    for (var t = 0; t < tramos.length; t++) {
      var tramo = tramos[t];

      if (tramo.tipo === 'hueco') {
        parrafo.appendChild(crear('span', {
          clase: 'falta',
          texto: 'falta ' + nombreDelHueco(tramo.valor),
          'data-hueco': tramo.valor,
        }));
        continue;
      }

      if (cambio) {
        var resaltado = crear('mark');

  var contenedor = crear('span');
  var terminos = Object.keys(GLOSARIO).sort(function (a, b) { return b.length - a.length; });
  var patron = new RegExp('\\b(' + terminos.map(function (t) {
    return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }).join('|') + ')\\b', 'g');

  var ultimo = 0;
  var encontrado;
  while ((encontrado = patron.exec(texto)) !== null) {
    if (encontrado.index > ultimo) {
      contenedor.appendChild(document.createTextNode(texto.slice(ultimo, encontrado.index)));
    }
    contenedor.appendChild(botonDeGlosario(encontrado[1]));
    ultimo = encontrado.index + encontrado[1].length;

(function () {
'use strict';

/**
 * El flujo de generacion: inicio, filtro de entrada, los pasos, el resumen y la
 * pantalla final.
 *
 * Dentro de cada paso va UNA pregunta a la vez. Las ya respondidas quedan
 * arriba en una linea, con boton para cambiarlas. Se avanza solo cuando la
 * respuesta es inequivoca (elegir una opcion); si hay que escribir algo, el
 * comercial confirma con Siguiente.
 */

var RM = window.RM;
var crear = RM.util.crear;
var vaciar = RM.util.vaciar;
var estado = RM.estado;
var E = estado.estado;

/** Los pasos que tienen alguna pregunta visible para el tipo elegido. */
function pasosDelTipo(entrada) {
  if (!entrada.tipo) return [];
  var visibles = camposVisibles(entrada.tipo, entrada);
  var conPreguntas = {};
  for (var i = 0; i < visibles.length; i++) {
    var pregunta = preguntaDe(visibles[i].id);
    if (pregunta && pregunta.pregunta) conPreguntas[visibles[i].paso] = true;
  }
  // El paso de confirmación no entra al formulario: la casilla de declaración
  // va en el resumen, que es donde el comercial ve todo junto antes de generar.
  return PASOS.filter(function (paso) {
    return conPreguntas[paso.id] && paso.id !== 'confirmacion';
  });
}

function camposDelPaso(entrada, pasoId) {
  var visibles = camposVisibles(entrada.tipo, entrada);
  var campos = [];
  for (var i = 0; i < visibles.length; i++) {
    if (visibles[i].paso !== pasoId) continue;
    var pregunta = preguntaDe(visibles[i].id);
    if (pregunta && pregunta.pregunta) campos.push(visibles[i]);
  }
  return campos;
}

function tieneRespuesta(campoId) {
  // Un valor por defecto no basta: la pregunta se muestra igual, preseleccionada.
  if (!E.respondidas[campoId]) return false;

  var valor = estado.entrada()[campoId];
  if (campoId === 'maxPedidos') return opcionDeVeces() !== null && (opcionDeVeces() !== 'varias' || valor > 1);
  if (valor === null || valor === undefined || valor === '') return false;
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor.length > 0;
  if (valor === false) return false;
  return true;
}

/** "¿Cuántas veces puede ganar?" reúne maxPedidos y sinLimite en una pregunta. */
function opcionDeVeces() {
  var entrada = estado.entrada();
  if (entrada.sinLimite) return 'sin_limite';
  if (entrada.maxPedidos === 1) return 'una';
  if (entrada.maxPedidos > 1) return 'varias';
  if (entrada.__veces) return entrada.__veces;
  return null;
}

function fijarVeces(valor) {
  E.respondidas.maxPedidos = true;
  if (valor === 'una') estado.fijarVarios({ __veces: 'una', maxPedidos: 1, sinLimite: false });
  else if (valor === 'sin_limite') estado.fijarVarios({ __veces: 'sin_limite', maxPedidos: null, sinLimite: true });
  else estado.fijarVarios({ __veces: 'varias', maxPedidos: null, sinLimite: false });
}

/** Errores de la solicitud, indexados por campo. */
function erroresPorCampo() {
  var pais = paisElegido();
  if (!pais || !estado.entrada().tipo) return {};

  var revision = validarSolicitud(estado.entrada(), pais, {
    fechaReferencia: E.configuracion.hoy || RM.util.hoyEnElNavegador(),
    usuarioEnEquipo: puedeVerPiloto(E.configuracion.rol),
  });

  var porCampo = {};
  for (var i = 0; i < revision.errores.length; i++) {
    var error = revision.errores[i];
    if (!porCampo[error.campo]) porCampo[error.campo] = error.mensaje;
  }
  return porCampo;
}

function paisElegido() {
  return paisPorCodigo(E.configuracion.paises, estado.entrada().pais);
}

function modeloDelTipo() {
  var esquema = esquemaDe(estado.entrada().tipo);
  return esquema ? esquema.modelo : null;
}

// --- Vista previa ------------------------------------------------------------

function refrescarDocumento() {
  var contenedores = document.querySelectorAll('[data-hoja]');
  if (contenedores.length === 0) return;

  var pais = paisElegido();
  var modelo = modeloDelTipo();

  // Todavía sin tipo de campaña: la hoja explica qué va a pasar ahí.
  if (!pais || !modelo) {
    for (var v = 0; v < contenedores.length; v++) RM.documento.dibujar(contenedores[v], '', '');
    var sinTipo = RM.util.porId('cuenta-huecos');
    if (sinTipo) sinTipo.textContent = 'Sin empezar';
    E.ultimoTextoVistaPrevia = '';
    return;
  }

  var resultado = renderizarVistaPrevia(modelo, estado.entrada(), pais, MODELOS);

  for (var i = 0; i < contenedores.length; i++) {
    var cambiada = RM.documento.dibujar(contenedores[i], resultado.texto, E.ultimoTextoVistaPrevia);
    RM.documento.desplazarHasta(contenedores[i], cambiada);
  }

  var cuenta = RM.util.porId('cuenta-huecos');
  if (cuenta) {
    cuenta.textContent = resultado.huecos.length === 0
      ? 'Completo'
      : 'Faltan ' + resultado.huecos.length + (resultado.huecos.length === 1 ? ' dato' : ' datos');
  }
  E.ultimoTextoVistaPrevia = resultado.texto;
}

    { id: 'rappiFondea', texto: '¿La campaña la fondea Rappi y no una tienda o marca?', razon: 'En esta herramienta el organizador siempre es la tienda o la marca que pone la plata. Rappi nunca es el organizador.' },

  for (var i = 0; i < preguntas.length; i++) {

          onclick: function () {

            var hermanos = grupo.querySelectorAll('.opcion');

            this.classList.add('elegida');
            revisar();
          },
        }));

      bloque.appendChild(grupo);
      lista.appendChild(bloque);

// --- src/client/js/62-pasos.js ---
(function () {
'use strict';

/**
 * El formulario por pasos, con el T&C en vivo al lado.
 *
 * Dos columnas en escritorio: preguntas a la izquierda, documento a la derecha.
 * En celular el documento se ve con el boton fijo "Ver cómo va mi T&C".
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;
var flujo = RM.flujo;

/** Valor de un campo en palabras, para el resumen y las respuestas cerradas. */
function comoTexto(campo) {
  var entrada = estado.entrada();
  var valor = entrada[campo.id];
  var pregunta = preguntaDe(campo.id);

  if (campo.id === 'maxPedidos') {
    var opcion = flujo.opcionDeVeces();
    if (opcion === 'sin_limite') return 'Sin límite';
    if (opcion === 'una') return 'Una sola vez';
    if (opcion === 'varias') return valor ? valor + ' veces' : 'Varias veces';
    return '';
  }
  if (valor === null || valor === undefined || valor === '') return '';
  if (campo.tipo === 'casilla') return valor ? 'Confirmado' : '';

  // País y tipo traen sus nombres del servidor, no del esquema.
  if (campo.id === 'pais') {
    var pais = paisPorCodigo(E.configuracion.paises, valor);
    return pais ? pais.nombre : String(valor);
  }
  if (campo.id === 'tipo') {
    for (var t = 0; t < E.configuracion.tipos.length; t++) {
      if (E.configuracion.tipos[t].id === valor) return E.configuracion.tipos[t].nombre;
    }
    return String(valor);
  }

  if (Object.prototype.toString.call(valor) === '[object Array]') {
    if (campo.id === 'tiendas') return valor.length + (valor.length === 1 ? ' tienda' : ' tiendas');
    var etiquetas = valor.map(function (v) {
      var encontrada = (pregunta.opciones || campo.opciones || []).filter(function (o) { return o.valor === v; })[0];
      return encontrada ? encontrada.etiqueta : v;
    });
    return etiquetas.join(', ');
  }

  var opciones = pregunta.opciones || campo.opciones;
  if (opciones) {
    var elegida = opciones.filter(function (o) { return o.valor === valor; })[0];
    if (elegida) return elegida.etiqueta;
  }

  if (campo.tipo === 'fecha') return formatearFecha(valor);
  if (campo.tipo === 'hora') return formatearHora(valor);

  // La identificación se muestra como va en el documento, no como se escribió.
  if (campo.tipo === 'identificacion') {
    var paisId = flujo.paisElegido();
    if (paisId) {
      var revision = validarIdentificacion(paisId.codigo, valor);
      if (revision.valido) return revision.formateado;
    }
    return String(valor);
  }
  if (campo.id === 'porcentaje') return valor + '%';
  if (pregunta.moneda) {
    var pais = flujo.paisElegido();
    return (pais ? pais.moneda_simbolo : '$') + formatearMiles(valor, pais ? pais.separador_miles : '.');
  }
  return String(valor);
}

/** Opciones que hay que deshabilitar, con la razón visible. */
function opcionesDeshabilitadas(campo) {
  if (campo.id !== 'desempate') return null;
  var criterio = estado.entrada().criterioGanador;
  if (!criterio) return null;
  var razon = {};
  razon[criterio] = preguntaDe('desempate').razonDeshabilitado;
  return razon;
}

/** Las opciones reales de un campo de casillas que las saca de los datos. */
function opcionesDeCasillas(campo) {
  if (campo.id !== 'secciones') return null;
  var pais = flujo.paisElegido();
  var nombres = (E.configuracion.secciones && pais) ? (E.configuracion.secciones[pais.codigo] || []) : [];
  return nombres.map(function (nombre) { return { valor: nombre, etiqueta: nombre, nota: 'Sección de la app.' }; });
}

/** Aviso contextual de un campo, si aplica. */
function avisoDe(campo) {
  if (campo.id !== 'fechaInicio') return null;
  var inicio = estado.entrada().fechaInicio;
  if (!inicio) return null;
  var hoy = E.configuracion.hoy || RM.util.hoyEnElNavegador();
  var dias = RM.util.diasEntre(hoy, inicio);
  if (dias < 0 || dias > 1) return null;
  return preguntaDe('fechaInicio').aviso;
}

/** La calculadora de ejemplo del Cashback. */
function calculadora() {
  var entrada = estado.entrada();
  if (entrada.tipo !== 'cashback' && entrada.tipo !== 'cashback_day') return null;
  if (!entrada.porcentaje) return null;

  var pais = flujo.paisElegido();
  if (!pais) return null;

  var simbolo = pais.moneda_simbolo;
  var separador = pais.separador_miles;
  var ejemplo = 100000;
  var bruto = Math.round(ejemplo * Number(entrada.porcentaje) / 100);
  var recibe = entrada.tope ? Math.min(bruto, Number(entrada.tope)) : bruto;

  var lineas = [
    crear('p', {
      texto: 'Con estos datos, un pedido de ' + simbolo + formatearMiles(ejemplo, separador) +
        ' recibe ' + simbolo + formatearMiles(recibe, separador) + ' en Créditos.',
    }),
  ];
  if (entrada.tope && bruto > Number(entrada.tope)) {
    lineas.push(crear('p', {
      clase: 'pregunta-ayuda',
      texto: 'El tope lo frena: sin tope habrían sido ' + simbolo + formatearMiles(bruto, separador) + '.',
    }));
  }
  if (entrada.tope && entrada.presupuesto && Number(entrada.tope) > Number(entrada.presupuesto)) {
    lineas.push(crear('p', {
      clase: 'mensaje-error',
      texto: 'Ojo: el tope por pedido es mayor que el presupuesto total. El primer pedido se llevaría toda la campaña.',
    }));
  }
  return crear('div', { clase: 'aviso' }, lineas);
}

/**
 * Barra de progreso.
 *
 * En escritorio va el nombre de cada paso. En celular no caben siete nombres
 * sin encaramarse uno sobre otro, así que se muestra "Paso 2 de 7" con el
 * nombre del actual y una línea que avanza. La hoja de estilos decide cuál de
 * los dos se ve.
 */
function barraDeProgreso(pasos) {
  var compacta = crear('p', { clase: 'progreso-compacto' }, [
    crear('span', { clase: 'progreso-cuenta', texto: 'Paso ' + (E.pasoActual + 1) + ' de ' + pasos.length }),
    document.createTextNode(' \u00B7 '),
    crear('strong', { texto: pasos[E.pasoActual].nombre }),
    crear('span', {
      clase: 'progreso-linea',
      role: 'progressbar',
      'aria-valuenow': String(E.pasoActual + 1),
      'aria-valuemin': '1',
      'aria-valuemax': String(pasos.length),
      style: '--avance: ' + Math.round(((E.pasoActual + 1) / pasos.length) * 100) + '%',
    }),
  ]);

  var lista = crear('ol', { clase: 'progreso' });
  for (var i = 0; i < pasos.length; i++) {
    (function (paso, indice) {
      var clase = indice < E.pasoActual ? 'hecho' : (indice === E.pasoActual ? 'actual' : '');
      lista.appendChild(crear('li', { clase: clase }, [
        crear('button', {
          type: 'button', texto: paso.nombre,
          disabled: indice > E.pasoActual,
          'aria-current': indice === E.pasoActual ? 'step' : null,
          onclick: function () { E.pasoActual = indice; E.campoAbierto = null; RM.app.dibujar(); },
        }),
      ]));
    })(pasos[i], i);
  }
  return crear('div', {}, [compacta, lista]);
}

/** La columna del documento. */
function columnaDocumento() {
  return crear('div', { clase: 'columna-documento' }, [
    crear('div', { clase: 'documento-encabezado' }, [
      crear('h2', { texto: 'Tu T&C' }),
      crear('span', { clase: 'cuenta', id: 'cuenta-huecos' }),
    ]),
    crear('div', { clase: 'hoja', 'data-hoja': '1', tabindex: '0', role: 'region', 'aria-label': 'Vista previa del documento' }),
  ]);
}

function pantallaPasos(raiz) {
  var entrada = estado.entrada();
  var pasos = flujo.pasosDelTipo(entrada);

  // Sin tipo elegido todavía: se pregunta país y tipo primero.
  if (pasos.length === 0) {
    pasos = [pasoDe('campana')];
  }
  if (E.pasoActual >= pasos.length) E.pasoActual = pasos.length - 1;

  var pasoActual = pasos[E.pasoActual];
  var campos = flujo.camposDelPaso(entrada, pasoActual.id);
  if (campos.length === 0 && !entrada.tipo) {
    campos = [
      { id: 'pais', tipo: 'lista', paso: 'campana', etiqueta: 'País' },
      { id: 'tipo', tipo: 'tarjetas', paso: 'campana', etiqueta: 'Tipo' },
    ];
  }

  var errores = flujo.erroresPorCampo();

  // Cuál pregunta está abierta: la que se pidió editar, o la primera sin responder.
  var indiceAbierto = 0;
  if (E.campoAbierto) {
    for (var i = 0; i < campos.length; i++) if (campos[i].id === E.campoAbierto) indiceAbierto = i;
  } else {
    indiceAbierto = campos.length - 1;
    for (var j = 0; j < campos.length; j++) {
      if (!flujo.tieneRespuesta(campos[j].id)) { indiceAbierto = j; break; }
    }
  }

  var columna = crear('div', { clase: 'columna-preguntas' });
  columna.appendChild(barraDeProgreso(pasos));
  columna.appendChild(crear('h1', { texto: pasoActual.titulo || pasoActual.nombre }));

  // Respondidas, en una línea.
  var respondidas = crear('div', { clase: 'ficha' });
  var cuantasRespondidas = 0;
  for (var r = 0; r < indiceAbierto; r++) {
    (function (campo) {
      if (!flujo.tieneRespuesta(campo.id)) return;
      cuantasRespondidas += 1;
      respondidas.appendChild(RM.campos.dibujarRespondida(campo, comoTexto(campo), function () {
        E.campoAbierto = campo.id;
        RM.app.dibujar();
      }));
    })(campos[r]);
  }
  if (cuantasRespondidas > 0) columna.appendChild(respondidas);

  // La pregunta abierta.
  var campoAbierto = campos[indiceAbierto];
  if (campoAbierto) {
    var opcionesEspeciales = opcionesDeCasillas(campoAbierto);
    var bloque = RM.campos.dibujarPregunta(campoAbierto, {
      pais: flujo.paisElegido(),
      error: E.errores[campoAbierto.id] ? errores[campoAbierto.id] : null,
      confirmacion: confirmacionDe(campoAbierto),
      deshabilitadas: opcionesDeshabilitadas(campoAbierto),
      opciones: opcionesEspeciales,
      aviso: avisoDe(campoAbierto),
      alCambiar: function (campoId, valor) { alResponder(campoId, valor, campos, indiceAbierto); },
      alAvanzar: function () { avanzar(campos, indiceAbierto, pasos); },
    });

    if (bloque) {
      // País y tipo se dibujan a mano porque sus opciones salen del servidor.
      if (campoAbierto.id === 'pais' || campoAbierto.id === 'tipo') {
        bloque = preguntaDeCatalogo(campoAbierto, campos, indiceAbierto, pasos);
      }
      if (campoAbierto.id === 'maxPedidos') {
        bloque = preguntaDeVeces(campos, indiceAbierto, pasos, errores);
      }
      if (campoAbierto.id === 'tiendas') {
        bloque = RM.tiendas.dibujar(function () { RM.app.dibujar(); });
      }
      columna.appendChild(bloque);
    }

    var extra = campoAbierto.id === 'tope' || campoAbierto.id === 'presupuesto' || campoAbierto.id === 'porcentaje'
      ? calculadora() : null;
    if (extra) columna.appendChild(extra);
  }

  // Cuántas faltan en este paso.
  var faltan = campos.length - indiceAbierto - 1;
  if (faltan > 0) {
    columna.appendChild(crear('p', {
      clase: 'pregunta-ayuda',
      texto: faltan === 1 ? 'Queda 1 pregunta en este paso.' : 'Quedan ' + faltan + ' preguntas en este paso.',
    }));
  }

  columna.appendChild(crear('div', { clase: 'fila-botones' }, [
    E.pasoActual > 0 || indiceAbierto > 0
      ? crear('button', {
          clase: 'boton boton-secundario', type: 'button', texto: 'Atrás',
          onclick: function () { retroceder(campos, indiceAbierto, pasos); },
        })
      : null,
    crear('button', {
      clase: 'boton', type: 'button',
      texto: entrada.tipo && indiceAbierto === campos.length - 1 && E.pasoActual === pasos.length - 1
        ? 'Revisar y generar' : 'Siguiente',
      onclick: function () { avanzar(campos, indiceAbierto, pasos); },
    }),
  ]));

  var contenido = crear('div', { clase: 'pagina' }, [
    crear('div', { clase: 'dos-columnas' }, [columna, columnaDocumento()]),
  ]);
  raiz.appendChild(contenido);
  RM.app.agregarHojaDeCelular(raiz);
  flujo.refrescarDocumento();
}

function confirmacionDe(campo) {
  if (campo.id !== 'organizadorId') return null;
  var valor = estado.entrada().organizadorId;
  if (!valor) return null;
  var pais = flujo.paisElegido();
  if (!pais) return null;
  var revision = validarIdentificacion(pais.codigo, valor);
  return revision.valido ? revision.formateado + ' válido' : null;
}

/** País y tipo: las opciones vienen del servidor, no del esquema. */
function preguntaDeCatalogo(campo, campos, indice, pasos) {
  var pregunta = preguntaDe(campo.id);
  var bloque = crear('div', { clase: 'pregunta' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.pregunta }),
    crear('p', { clase: 'pregunta-ayuda' }, [RM.campos.conGlosario(pregunta.ayuda)]),
  ]);

  var elegido = estado.entrada()[campo.id];
  var grupo = crear('div', { clase: 'opciones', role: 'radiogroup' });

  var opciones;
  if (campo.id === 'pais') {
    opciones = E.configuracion.paises.map(function (p) {
      return { valor: p.codigo, etiqueta: p.nombre, nota: p.estado === 'piloto' ? 'En piloto: solo para el equipo de pruebas.' : 'Disponible.' };
    });
  } else {
    var pais = flujo.paisElegido();
    opciones = tiposDelPais(pais || { modelos: [] }, E.configuracion.tipos).map(function (t) {
      return { valor: t.id, etiqueta: t.nombre, nota: t.descripcion };
    });
  }

  for (var i = 0; i < opciones.length; i++) {
    (function (opcion) {
      grupo.appendChild(crear('button', {
        clase: 'opcion' + (elegido === opcion.valor ? ' elegida' : ''),
        type: 'button', role: 'radio', 'aria-checked': String(elegido === opcion.valor),
        onclick: function () {
          alResponder(campo.id, opcion.valor, campos, indice);
          E.campoAbierto = null;
          RM.app.dibujar();
        },
      }, [
        crear('span', { clase: 'opcion-titulo', texto: opcion.etiqueta }),
        crear('span', { clase: 'opcion-nota', texto: opcion.nota }),
      ]));
    })(opciones[i]);
  }

  bloque.appendChild(grupo);
  bloque.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: '¿Por qué te preguntamos esto?' }),
    crear('p', { texto: pregunta.porQue }),
  ]));
  return bloque;
}

/** "¿Cuántas veces puede ganar la misma persona?" */
function preguntaDeVeces(campos, indice, pasos, errores) {
  var pregunta = preguntaDe('maxPedidos');
  var elegido = flujo.opcionDeVeces();

  var bloque = crear('div', { clase: 'pregunta' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.pregunta }),
    crear('p', { clase: 'pregunta-ayuda' }, [RM.campos.conGlosario(pregunta.ayuda)]),
  ]);

  var grupo = crear('div', { clase: 'opciones', role: 'radiogroup' });
  for (var i = 0; i < pregunta.opciones.length; i++) {
    (function (opcion) {
      grupo.appendChild(crear('button', {
        clase: 'opcion' + (elegido === opcion.valor ? ' elegida' : ''),
        type: 'button', role: 'radio', 'aria-checked': String(elegido === opcion.valor),
        onclick: function () {
          flujo.fijarVeces(opcion.valor);
          E.errores.maxPedidos = true;
          if (opcion.valor !== 'varias') avanzar(campos, indice, pasos);
          else RM.app.dibujar();
          flujo.refrescarDocumento();
        },
      }, [
        crear('span', { clase: 'opcion-titulo', texto: opcion.etiqueta }),
        crear('span', { clase: 'opcion-nota', texto: opcion.nota }),
      ]));
    })(pregunta.opciones[i]);
  }
  bloque.appendChild(grupo);

  if (elegido === 'varias') {
    var cuantas = crear('input', {
      type: 'text', inputmode: 'numeric', id: 'campo-maxPedidos',
      value: estado.entrada().maxPedidos || '', placeholder: '3',
    });
    cuantas.addEventListener('input', function () {
      cuantas.value = RM.util.soloDigitos(cuantas.value);
      estado.fijar('maxPedidos', cuantas.value ? Number(cuantas.value) : null);
      flujo.refrescarDocumento();
      var frase = RM.campos.asiQueda('maxPedidos', flujo.paisElegido());
      var vieja = bloque.querySelector('.asi-queda');
      if (vieja) vieja.parentNode.removeChild(vieja);
      if (frase) bloque.appendChild(frase);
    });
    bloque.appendChild(crear('label', { clase: 'campo' }, [
      crear('p', { clase: 'pregunta-ayuda', texto: '¿Cuántas veces?' }),
      crear('div', { clase: 'campo-caja' }, [cuantas]),
    ]));
  }

  if (E.errores.maxPedidos && errores.maxPedidos) {
    bloque.appendChild(crear('p', { clase: 'mensaje-error', role: 'alert', texto: errores.maxPedidos }));
  }

  var frase = RM.campos.asiQueda('maxPedidos', flujo.paisElegido());
  if (frase) bloque.appendChild(frase);

  bloque.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: '¿Por qué te preguntamos esto?' }),
    crear('p', { texto: pregunta.porQue }),
  ]));
  return bloque;
}

// --- Navegación --------------------------------------------------------------

function alResponder(campoId, valor, campos, indice) {
  estado.fijar(campoId, valor);
  E.errores[campoId] = true;
  E.respondidas[campoId] = true;

  // Al elegir el día de inicio se propone el mismo día de fin: tres de cada
  // cuatro campañas de cashback duran un solo día.
  if (campoId === 'fechaInicio' && !estado.entrada().fechaFin) estado.fijar('fechaFin', valor);
  if (campoId === 'pais') estado.fijar('tipo', null);
  if (campoId === 'criterioGanador' && estado.entrada().desempate === valor) estado.fijar('desempate', null);

  flujo.refrescarDocumento();
  actualizarValidacionEnVivo(campoId);
}

/** Refresca solo el mensaje de error del campo abierto, sin redibujar todo. */
function actualizarValidacionEnVivo(campoId) {
  var bloque = document.querySelector('[data-campo="' + campoId + '"]');
  if (!bloque) return;

  var errores = flujo.erroresPorCampo();
  var viejo = bloque.querySelector('.mensaje-error, .mensaje-ok');
  if (viejo) viejo.parentNode.removeChild(viejo);

  var control = bloque.querySelector('input, select, .opciones');
  var mensaje = null;

  if (errores[campoId]) {
    bloque.classList.add('campo-error');
    mensaje = crear('p', { clase: 'mensaje-error', role: 'alert' }, [
      RM.util.icono('alerta', 16), document.createTextNode(errores[campoId]),
    ]);
  } else {
    bloque.classList.remove('campo-error');
    var confirmacion = confirmacionDe({ id: campoId });
    if (confirmacion) {
      mensaje = crear('p', { clase: 'mensaje-ok' }, [
        RM.util.icono('visto', 16), document.createTextNode(confirmacion),
      ]);
    }
  }
  if (mensaje && control) control.parentNode.insertBefore(mensaje, control.nextSibling);

  var frase = RM.campos.asiQueda(campoId, flujo.paisElegido());
  var vieja = bloque.querySelector('.asi-queda');
  if (vieja) vieja.parentNode.removeChild(vieja);
  if (frase) {
    var detalle = bloque.querySelector('.por-que');
    bloque.insertBefore(frase, detalle);
  }
}

/**
 * Recalcula los pasos y las preguntas del momento.
 *
 * Hay que recalcular siempre: elegir el país o el tipo cambia qué pasos existen
 * y qué preguntas se ven, así que las listas que se armaron para dibujar la
 * pantalla anterior ya no sirven para decidir a dónde ir.
 */
function situacionActual() {
  var entrada = estado.entrada();
  var pasos = flujo.pasosDelTipo(entrada);
  if (pasos.length === 0) pasos = [pasoDe('campana')];
  if (E.pasoActual >= pasos.length) E.pasoActual = pasos.length - 1;

  var campos = flujo.camposDelPaso(entrada, pasos[E.pasoActual].id);
  if (campos.length === 0 && !entrada.tipo) {
    campos = [
      { id: 'pais', tipo: 'lista', paso: 'campana' },
      { id: 'tipo', tipo: 'tarjetas', paso: 'campana' },
    ];
  }
  return { pasos: pasos, campos: campos };
}

function avanzar(camposViejos, indiceViejo, pasosViejos) {
  var ahora = situacionActual();
  var campos = ahora.campos;
  var pasos = ahora.pasos;

  // El índice se vuelve a buscar por identificador: la lista pudo cambiar.
  var indice = indiceViejo;
  if (camposViejos && camposViejos[indiceViejo]) {
    var buscado = camposViejos[indiceViejo].id;
    for (var b = 0; b < campos.length; b++) if (campos[b].id === buscado) indice = b;
  }
  if (indice >= campos.length) indice = campos.length - 1;

  var errores = flujo.erroresPorCampo();
  var campo = campos[indice];

  if (campo && errores[campo.id]) {
    E.errores[campo.id] = true;
    E.campoAbierto = campo.id;
    RM.app.dibujar();
    RM.util.anunciar(errores[campo.id]);
    return;
  }

  if (campo) E.respondidas[campo.id] = true;

  E.campoAbierto = null;
  if (indice < campos.length - 1) {
    E.campoAbierto = campos[indice + 1].id;
    RM.app.dibujar();
    return;
  }
  if (E.pasoActual < pasos.length - 1) {
    E.pasoActual += 1;
    RM.app.dibujar();
    return;
  }
  RM.app.ir('resumen');
}

function retroceder(camposViejos, indiceViejo, pasosViejos) {
  var ahora = situacionActual();
  var campos = ahora.campos;
  var pasos = ahora.pasos;
  var indice = Math.min(indiceViejo, campos.length - 1);

  E.campoAbierto = null;
  if (indice > 0) {
    E.campoAbierto = campos[indice - 1].id;
    RM.app.dibujar();
    return;
  }
  if (E.pasoActual > 0) {
    E.pasoActual -= 1;
    RM.app.dibujar();
    return;
  }
  RM.app.ir('filtro');
}

RM.pasos = {
  pantallaPasos: pantallaPasos,
  comoTexto: comoTexto,
  columnaDocumento: columnaDocumento,
  calculadora: calculadora,
};

(function () {
'use strict';

/**
 * La lista de tiendas del Cashback Day.
 *
 * Es el unico componente repetible. Cada tienda entra con su marca, su razon
 * social, su NIT, su cobertura y su presupuesto, porque cada una organiza su
 * propio beneficio y responde por el.
 *
 * Tambien acepta pegar filas desde Excel: 78 de las solicitudes reales meten
 * tres o mas tiendas dentro de un campo de texto, asi que pegar es como
 * trabajan de verdad.
 */

var RM = window.RM;
var crear = RM.util.crear;
var estado = RM.estado;
var E = estado.estado;

var COLUMNAS = ['marca', 'razonSocial', 'id', 'ciudades', 'presupuesto'];

function tiendas() {
  if (!estado.entrada().tiendas) estado.fijar('tiendas', []);
  return estado.entrada().tiendas;
}

function tiendaVacia() {
  return { marca: '', razonSocial: '', id: '', ciudades: '', nacional: false, presupuesto: null };
}

/** Revisa una fila y devuelve los problemas, campo por campo. */
function revisarTienda(tienda, indice, todas) {
  var pais = RM.flujo.paisElegido();
  var problemas = {};
  var textos = preguntaDe('tiendas').camposPorTienda;

  if (!tienda.marca) problemas.marca = 'Falta ' + textos.marca.pregunta.toLowerCase() + '.';
  if (!tienda.razonSocial) problemas.razonSocial = 'Falta la razón social.';
  if (!tienda.presupuesto) problemas.presupuesto = 'Falta el presupuesto de esta tienda.';
  if (!tienda.nacional && !tienda.ciudades) problemas.ciudades = 'Escribe las ciudades o marca cobertura nacional.';

  if (!tienda.id) {
    problemas.id = 'Falta el NIT de esta tienda.';
  } else if (pais) {
    var revision = validarIdentificacion(pais.codigo, tienda.id);
    if (!revision.valido) {
      problemas.id = revision.mensaje;
    } else {
      for (var i = 0; i < todas.length; i++) {
        if (i === indice || !todas[i].id) continue;
        var otra = validarIdentificacion(pais.codigo, todas[i].id);
        if (otra.valido && otra.formateado === revision.formateado) {
          problemas.id = preguntaDe('tiendas').errores.repetida;
          break;
        }
      }
    }
  }
  return problemas;
}

function filaDeTienda(tienda, indice, alCambiar) {
  var textos = preguntaDe('tiendas').camposPorTienda;
  var pais = RM.flujo.paisElegido();
  var problemas = revisarTienda(tienda, indice, tiendas());

  var fila = crear('div', { clase: 'ficha-seccion', 'data-tienda': String(indice) }, [
    crear('div', { clase: 'ficha-encabezado' }, [
      crear('h3', { texto: 'Tienda ' + (indice + 1) + (tienda.marca ? ': ' + tienda.marca : '') }),
      crear('button', {
        clase: 'boton-texto', type: 'button', texto: 'Quitar',
        onclick: function () {
          var lista = tiendas().slice();
          lista.splice(indice, 1);
          estado.fijar('tiendas', lista);
          alCambiar();
        },
      }),
    ]),
  ]);

  function campoTexto(llave, esMonto) {
    var control = crear('input', {
      type: 'text',
      inputmode: esMonto ? 'numeric' : null,
      value: esMonto
        ? (tienda[llave] ? RM.util.conSeparadorDeMiles(tienda[llave], pais ? pais.separador_miles : '.') : '')
        : (tienda[llave] || ''),
      placeholder: textos[llave].ejemplo || '',
      'aria-label': textos[llave].pregunta + ' de la tienda ' + (indice + 1),
      disabled: llave === 'ciudades' && tienda.nacional,
    });
    control.addEventListener('input', function () {
      var lista = tiendas().slice();
      if (esMonto) {
        var digitos = RM.util.soloDigitos(control.value);
        control.value = RM.util.conSeparadorDeMiles(digitos, pais ? pais.separador_miles : '.');
        lista[indice][llave] = digitos ? Number(digitos) : null;
      } else {
        lista[indice][llave] = control.value;
      }
      estado.fijar('tiendas', lista);
      RM.flujo.refrescarDocumento();
    });
    control.addEventListener('blur', alCambiar);

    return crear('label', { clase: 'campo' }, [
      crear('p', { clase: 'pregunta-ayuda', texto: textos[llave].pregunta + '. ' + textos[llave].ayuda }),
      crear('div', { clase: 'campo-caja' + (esMonto ? ' con-moneda' : '') }, [
        esMonto ? crear('span', { clase: 'simbolo-moneda', texto: pais ? pais.moneda_simbolo : '$' }) : null,
        control,
      ]),
      problemas[llave] ? crear('p', { clase: 'mensaje-error', texto: problemas[llave] }) : null,
    ]);
  }

  fila.appendChild(campoTexto('marca', false));
  fila.appendChild(campoTexto('razonSocial', false));
  fila.appendChild(campoTexto('id', false));

  var nacional = crear('input', { type: 'checkbox', checked: !!tienda.nacional });
  nacional.addEventListener('change', function () {
    var lista = tiendas().slice();
    lista[indice].nacional = nacional.checked;
    if (nacional.checked) lista[indice].ciudades = '';
    estado.fijar('tiendas', lista);
    alCambiar();
  });
  fila.appendChild(crear('label', { clase: 'casilla' }, [
    nacional, crear('span', { texto: textos.nacional.pregunta }),
  ]));

  fila.appendChild(campoTexto('ciudades', false));
  fila.appendChild(campoTexto('presupuesto', true));
  return fila;
}

/** Pegar desde Excel: una fila por tienda, columnas separadas por tabulación. */
function bloqueDePegar(alCambiar) {
  var area = crear('textarea', {
    rows: '4',
    placeholder: 'Beer Station\tCervecerías del Sur S.A.S.\t900.777.888-2\tBogotá, Medellín\t5000000',
    'aria-label': 'Pega aquí las filas copiadas de Excel',
  });

  var resultado = crear('div', {});

  function procesar() {
    var lineas = area.value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (lineas.length === 0) return;

    var nuevas = [];
    var rechazadas = [];

    for (var i = 0; i < lineas.length; i++) {
      var celdas = lineas[i].split(/\t|;/).map(function (c) { return c.trim(); });
      if (celdas.length === 1) celdas = lineas[i].split(/\s{2,}/).map(function (c) { return c.trim(); });
      if (celdas.length < 3) { rechazadas.push('Fila ' + (i + 1) + ': necesita al menos marca, razón social y NIT.'); continue; }

      var tienda = tiendaVacia();
      tienda.marca = celdas[0] || '';
      tienda.razonSocial = celdas[1] || '';
      tienda.id = celdas[2] || '';
      var cobertura = celdas[3] || '';
      if (/^nacional$/i.test(cobertura)) tienda.nacional = true;
      else tienda.ciudades = cobertura;
      tienda.presupuesto = celdas[4] ? Number(RM.util.soloDigitos(celdas[4])) : null;
      nuevas.push(tienda);
    }

    var lista = tiendas().slice().filter(function (t) { return t.marca || t.razonSocial || t.id; });
    estado.fijar('tiendas', lista.concat(nuevas));
    area.value = '';

    RM.util.vaciar(resultado);
    resultado.appendChild(crear('p', {
      clase: 'mensaje-ok',
      texto: nuevas.length + (nuevas.length === 1 ? ' tienda agregada.' : ' tiendas agregadas.') + ' Revisa que cada una haya quedado bien.',
    }));
    for (var r = 0; r < rechazadas.length; r++) {
      resultado.appendChild(crear('p', { clase: 'mensaje-error', texto: rechazadas[r] }));
    }
    alCambiar();
  }

  return crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: 'Pegar varias tiendas desde Excel' }),
    crear('div', {}, [
      crear('p', {
        clase: 'pregunta-ayuda',
        texto: 'Copia las filas de tu hoja de cálculo con las columnas en este orden: marca, razón social, NIT, ciudades (o la palabra Nacional) y presupuesto.',
      }),
      area,
      crear('div', { clase: 'fila-botones' }, [
        crear('button', { clase: 'boton boton-secundario', type: 'button', texto: 'Agregar estas tiendas', onclick: procesar }),
      ]),
      resultado,
    ]),
  ]);
}

function dibujar(alCambiar) {
  var pregunta = preguntaDe('tiendas');
  var lista = tiendas();

  var bloque = crear('div', { clase: 'pregunta', 'data-campo': 'tiendas' }, [
    crear('h2', { clase: 'pregunta-titulo', texto: pregunta.pregunta }),
    crear('p', { clase: 'pregunta-ayuda' }, [RM.campos.conGlosario(pregunta.ayuda)]),
  ]);

  var ficha = crear('div', { clase: 'ficha' });
  for (var i = 0; i < lista.length; i++) {
    ficha.appendChild(filaDeTienda(lista[i], i, alCambiar));
  }
  if (lista.length === 0) {
    ficha.appendChild(crear('div', { clase: 'ficha-seccion' }, [
      crear('p', { clase: 'pregunta-ayuda', texto: 'Todavía no has agregado ninguna tienda.' }),
    ]));
  }
  bloque.appendChild(ficha);

  if (lista.length < 2) {
    bloque.appendChild(crear('p', { clase: 'mensaje-error', texto: pregunta.errores.minimo }));
  }
  if (lista.length > 60) {
    bloque.appendChild(crear('p', { clase: 'mensaje-error', texto: pregunta.errores.maximo }));
  }

  bloque.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: 'Agregar tienda',
      disabled: lista.length >= 60,
      onclick: function () {
        estado.fijar('tiendas', lista.concat([tiendaVacia()]));
        alCambiar();
      },
    }),
  ]));

  bloque.appendChild(bloqueDePegar(alCambiar));
  bloque.appendChild(crear('details', { clase: 'por-que' }, [
    crear('summary', { texto: '¿Por qué te preguntamos esto?' }),
    crear('p', { texto: pregunta.porQue }),
  ]));

  return bloque;
}

RM.tiendas = { dibujar: dibujar, revisarTienda: revisarTienda, COLUMNAS: COLUMNAS };

/** Lo que falta, en palabras del comercial. */
function loQueFalta() {
  var pais = flujo.paisElegido();

function generar(boton) {
  boton.disabled = true;
  boton.textContent = 'Generando...';
  RM.util.anunciar('Generando el documento.');

  RM.servidor.llamar('generar', estado.entrada()).then(function (resultado) {

function pantallaListo(raiz) {

  if (resultado.demostracion) {
    contenido.appendChild(crear('div', { clase: 'aviso' }, [
      crear('h3', { texto: 'Modo demostración' }),
      crear('p', { texto: 'No se creó ningún documento ni se envió ningún correo. Este es el texto que habría salido.' }),
    ]));
    var hoja = crear('div', { clase: 'hoja' });
    RM.documento.dibujar(hoja, resultado.texto, '');
    contenido.appendChild(hoja);
    contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
      crear('button', {
        clase: 'boton boton-secundario', type: 'button', texto: 'Hacer otra campaña',
        onclick: function () { estado.reiniciarFormulario({}); RM.app.ir('inicio'); },
      }),
    ]));
    raiz.appendChild(contenido);
    return;
  }

  contenido.appendChild(crear('p', {
    clase: 'pregunta-ayuda',
    texto: 'Te mandamos el documento por correo. Solicitud ' + (resultado.id || '') + '.',
  }));

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
    resultado.linkDoc
      ? crear('a', { clase: 'boton', href: resultado.linkDoc, target: '_blank', rel: 'noopener' }, [
          document.createTextNode('Abrir el documento'), RM.util.icono('abrir', 16),

      : null,
  ]));

  contenido.appendChild(crear('h2', { texto: 'Cómo publicarlo en Squarespace' }));
  var pasos = crear('ol', { clase: 'pasos-publicar' });
  for (var i = 0; i < PASOS_SQUARESPACE.length; i++) {
    pasos.appendChild(crear('li', {}, [
      crear('p', { texto: PASOS_SQUARESPACE[i].texto }),
      crear('p', { clase: 'pregunta-ayuda', texto: 'Deberías ver: ' + PASOS_SQUARESPACE[i].ve }),
      crear('div', { clase: 'captura', texto: '[CAPTURA ' + (i + 1) + ']' }),
    ]));
  }
  contenido.appendChild(pasos);

  // Link publicado.
  contenido.appendChild(crear('h2', { texto: 'Cuando ya esté publicado' }));
  var campo = crear('input', {
    type: 'text', id: 'link-publicado',
    placeholder: 'https://promos.rappi.com/',
    'aria-label': 'Enlace de la página publicada',
  });
  var mensaje = crear('p', { clase: 'pregunta-ayuda', texto: 'Pega el enlace de la página que publicaste.' });

  var guardar = crear('button', {
    clase: 'boton', type: 'button', texto: 'Marcar como publicado',
    onclick: function () {
      var revision = validarLinkPublicado(campo.value);
      if (!revision.valido) {
        mensaje.className = 'mensaje-error';
        mensaje.textContent = revision.mensaje;
        campo.focus();
        return;
      }
      guardar.disabled = true;
      guardar.textContent = 'Guardando...';
      RM.servidor.llamar('marcarPublicado', resultado.id, revision.url).then(function (respuesta) {
        guardar.disabled = false;
        guardar.textContent = 'Marcar como publicado';
        if (!respuesta.valido) {
          mensaje.className = 'mensaje-error';
          mensaje.textContent = respuesta.errores[0].mensaje;
          return;
        }
        mensaje.className = 'mensaje-ok';
        mensaje.textContent = 'Listo: tu campaña quedó marcada como publicada.';
        campo.disabled = true;
        guardar.disabled = true;
      }).catch(function (error) {
        guardar.disabled = false;
        guardar.textContent = 'Marcar como publicado';
        mensaje.className = 'mensaje-error';
        mensaje.textContent = 'No pudimos guardarlo: ' + error.message;
      });
    },
  });

  contenido.appendChild(crear('div', { clase: 'pregunta' }, [
    crear('div', { clase: 'campo-caja' }, [campo]),
    mensaje,
    crear('div', { clase: 'fila-botones' }, [guardar]),
  ]));

  contenido.appendChild(crear('div', { clase: 'fila-botones' }, [
    crear('button', {
      clase: 'boton boton-secundario', type: 'button', texto: 'Hacer otra campaña',
      onclick: function () { estado.reiniciarFormulario({}); RM.app.ir('inicio'); },
    }),

      onclick: function () { RM.app.ir('historial'); },

  raiz.appendChild(contenido);
}

};

  RM.servidor.llamar('datosDeSolicitud', id).then(function (respuesta) {

      RM.app.mostrarError(respuesta.errores[0].mensaje);
      return;

    // Las fechas no se copian: casi nunca sirven para la campaña nueva.
    base.fechaInicio = '';
    base.fechaFin = '';
    base.fechaCarga = '';
    base.fechaFinRedencion = '';
    base.fechaNotificacion = '';

      nav.appendChild(crear('button', {
        clase: 'enlace-nav', type: 'button', texto: seccion.nombre,
        'aria-current': E.pantalla === seccion.id ? 'page' : null,
        onclick: function () { ir(seccion.id); },
      }));
    })(NAVEGACION[i]);
  }

  if (E.configuracion && E.configuracion.rol === 'admin') {
    nav.appendChild(crear('button', {
      clase: 'enlace-nav', type: 'button', texto: 'Administración',
      'aria-current': E.pantalla === 'admin' ? 'page' : null,
      onclick: function () { ir('admin'); },
    }));
  }

  return crear('header', { clase: 'barra-superior' }, [
    crear('span', { clase: 'marca' }, [
      RM.util.corona(),
      document.createTextNode('RappiMind '),
      crear('em', { texto: 'v3' }),
    ]),
    nav,
  ]);
}

/** El botón fijo y la hoja deslizable del celular. */
function agregarHojaDeCelular(raiz) {
  var cortina = crear('div', { clase: 'cortina' });
  var hoja = crear('div', {
    clase: 'hoja-deslizable', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Vista previa del documento',
  }, [
    crear('div', { clase: 'asa' }),
    crear('div', { clase: 'hoja', 'data-hoja': '1' }),
    crear('div', { clase: 'fila-botones', style: 'padding: 0 16px 16px' }, [
      crear('button', { clase: 'boton boton-secundario', type: 'button', texto: 'Cerrar', onclick: cerrar }),
    ]),
  ]);

  var boton = crear('button', {
    clase: 'boton-flotante', type: 'button',
    onclick: abrir,
  }, [RM.util.icono('documento', 18), document.createTextNode('Ver cómo va mi T&C')]);

  function abrir() {
    cortina.classList.add('abierta');
    hoja.classList.add('abierta');
    RM.flujo.refrescarDocumento();
    hoja.querySelector('button').focus();
  }
  function cerrar() {
    cortina.classList.remove('abierta');
    hoja.classList.remove('abierta');
    boton.focus();
  }

  cortina.addEventListener('click', cerrar);
  document.addEventListener('keydown', function (evento) {
    if (evento.key === 'Escape' && hoja.classList.contains('abierta')) cerrar();
  });

  raiz.appendChild(boton);
  raiz.appendChild(cortina);
  raiz.appendChild(hoja);
}

function mostrarError(mensaje) {
  var caja = RM.util.porId('error-global');
  if (!caja) return;
  vaciar(caja);
  caja.appendChild(crear('div', { clase: 'aviso aviso-serio' }, [
    crear('p', { texto: mensaje }),
  ]));
  caja.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  RM.util.anunciar(mensaje);
}

function dibujar() {
  var raiz = RM.util.porId('app');
  vaciar(raiz);
  RM.campos.ocultarGlosario();

  raiz.appendChild(barraSuperior());

  if (E.configuracion && E.configuracion.demostracion) {
    raiz.appendChild(crear('div', { clase: 'pagina', style: 'padding-bottom:0' }, [
      crear('div', { clase: 'aviso' }, [
        crear('h3', { texto: 'Modo demostración' }),
        crear('p', { texto: 'No se crea ningún documento, no se manda ningún correo y nada queda guardado. Al final verás el texto que habría salido.' }),
      ]),
    ]));
  }

  raiz.appendChild(crear('div', { id: 'error-global' }));

  var pintar = PANTALLAS[E.pantalla] || PANTALLAS.inicio;
  pintar(raiz);
}

function ir(pantalla) {
  E.pantalla = pantalla;
  var caja = RM.util.porId('error-global');
  if (caja) vaciar(caja);
  dibujar();
  window.scrollTo(0, 0);
}

/**
 * Los valores con que arranca un formulario nuevo: los por defecto de cada
 * pregunta, más el país. Preseleccionar no es responder: la pregunta se muestra
 * igual, con la opción ya marcada.
 */
function valoresIniciales() {
  var iniciales = {};
  for (var campoId in PREGUNTAS) {
    if (!Object.prototype.hasOwnProperty.call(PREGUNTAS, campoId)) continue;
    if (PREGUNTAS[campoId].porDefecto !== undefined) iniciales[campoId] = PREGUNTAS[campoId].porDefecto;
  }
  // Colombia es el 99,7% de las solicitudes reales: viene preseleccionada.
  if (E.configuracion && E.configuracion.paises.length > 0) iniciales.pais = E.configuracion.paises[0].codigo;
  return iniciales;
}

function arrancar() {
  var raiz = RM.util.porId('app');
  vaciar(raiz);
  raiz.appendChild(crear('div', { clase: 'pagina pagina-angosta' }, [
    crear('p', { clase: 'pregunta-ayuda', texto: 'Cargando RappiMind...' }),
  ]));

  RM.servidor.llamar('estadoInicial').then(function (configuracion) {
    E.configuracion = configuracion;
    estado.reiniciarFormulario(valoresIniciales(), {});
    ir('inicio');
  }).catch(function (error) {
    vaciar(raiz);
    raiz.appendChild(crear('div', { clase: 'pagina pagina-angosta' }, [
      crear('div', { clase: 'aviso aviso-serio' }, [
        crear('h3', { texto: 'No pudimos abrir RappiMind' }),
        crear('p', { texto: error.message }),
        crear('p', { clase: 'pregunta-ayuda', texto: 'Si sigue pasando, avísale a Juan.' }),
      ]),
    ]));
  });
}

RM.app = {
  dibujar: dibujar,
  valoresIniciales: valoresIniciales,
  ir: ir,
  arrancar: arrancar,
  mostrarError: mostrarError,
  agregarHojaDeCelular: agregarHojaDeCelular,
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', arrancar);
} else {
  arrancar();
}

})();

</script>
  </body>
</html>
