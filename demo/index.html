  }

  var hayAlgo = false;
  for (var llave in aplicables) {
    if (Object.prototype.hasOwnProperty.call(aplicables, llave)) hayAlgo = true;
  }
  if (!hayAlgo && errores.length === 0) {
    errores.push({ campo: 'id', mensaje: 'No pediste ningún cambio. Escribe la fecha nueva, o el número nuevo, de lo que quieras ampliar.' });
  }

  return { valido: errores.length === 0, errores: errores, cambios: aplicables };
}

/**
 * Aplica la ampliacion a las respuestas guardadas y agrega la nota.
 *
 * No muta la entrada original: devuelve una copia. La nota la imprime el
 * modelo al final del documento, con su fecha.
 */
function aplicarAmpliacion(entrada, cambios, hoyIso) {
  var nueva = {};
  for (var llave in entrada) {
    if (Object.prototype.hasOwnProperty.call(entrada, llave)) nueva[llave] = entrada[llave];
  }

  var nota = { fecha: hoyIso };
  for (var campo in cambios) {
    if (!Object.prototype.hasOwnProperty.call(cambios, campo)) continue;
    nueva[campo] = cambios[campo];
    if (campo !== 'horaFin') nota[campo] = cambios[campo];
  }
  if (cambios.fechaFin) nota.horaFin = cambios.horaFin || nueva.horaFin;

  nueva.modificaciones = (entrada.modificaciones || []).slice();
  nueva.modificaciones.push(nota);
  return nueva;
}

/**
 * Las respuestas de una campana sin lo que le dejo una ampliacion.
 *
 * "Usar como base" devolvia datos_json tal cual, y despues de ampliar ese JSON
 * trae `modificaciones` (la nota que el modelo imprime al final del documento)
 * y `sufijoNombre` (el consecutivo del nombre). La campana nueva salia con la
 * nota de modificacion de la vieja adentro, y su primera ampliacion decia
 * "version 3". Tambien se aplica al generar, por si un borrador viejo la trae.
 */
function sinRastroDeAmpliacion(entrada) {
  var limpia = {};
  for (var llave in entrada) {
    if (!Object.prototype.hasOwnProperty.call(entrada, llave)) continue;
    if (llave === 'modificaciones' || llave === 'sufijoNombre') continue;
    limpia[llave] = entrada[llave];
  }
  return limpia;
}

/** Lo que el comercial lee en el historial cuando no puede ampliar. */
function textoDeAmpliacion(solicitud, entrada, ahoraIso, ahoraHora) {
  var estado = puedeAmpliar(solicitud, entrada, ahoraIso, ahoraHora);
  if (estado.puede) {
    return 'Esta campaña está en curso. Puedes ampliar la fecha de fin, el presupuesto, el máximo de órdenes o las unidades. Cualquier otro cambio necesita una campaña nueva.';
  }
  return estado.motivo;
}

if (typeof module !== 'undefined') {
  module.exports = {
    CAMPOS_AMPLIABLES: CAMPOS_AMPLIABLES,
    momentoDeLaCampana: momentoDeLaCampana,
    puedeAmpliar: puedeAmpliar,
    validarAmpliacion: validarAmpliacion,
    aplicarAmpliacion: aplicarAmpliacion,
    textoDeAmpliacion: textoDeAmpliacion,
    sinRastroDeAmpliacion: sinRastroDeAmpliacion,
  };
}

'use strict';

/**
 * Lo que se guarda en el Sheet para poder auditar una campana.
 *
 * La pestana Solicitudes tiene una columna por cada respuesta, con el valor
 * legible: "Solo en esta tienda", no "tienda". Asi se puede abrir el Sheet,
 * filtrar y ver que contesto cada comercial sin abrir nada mas.
 *
 * La columna datos_json sigue estando y guarda la respuesta cruda, tal cual
 * llego. Es la que permite volver a generar el documento identico. Las columnas
 * de aqui son para leer; datos_json es para reconstruir.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloEsquemas = require('./esquemas.js');
  var ESQUEMAS = moduloEsquemas.ESQUEMAS;
  var esquemaDe = moduloEsquemas.esquemaDe;
  var camposVisibles = moduloEsquemas.camposVisibles;

  var moduloPreguntas = require('./preguntas.js');
  var preguntaDe = moduloPreguntas.preguntaDe;
}

/** Prefijo de las columnas de respuesta. Evita chocar con id, pais o tipo. */
var PREFIJO_RESPUESTA = 'resp_';

/**
 * Las columnas de respuesta, en el orden en que se preguntan y sin repetir.
 *
 * Sale de los esquemas, no de una lista escrita a mano: agregar un campo nuevo
 * agrega su columna sola, y asi el Sheet no se queda atras sin que nadie lo note.
 */
function columnasDeRespuestas() {
  var vistos = {};
  var columnas = [];

  for (var tipo in ESQUEMAS) {
    if (!Object.prototype.hasOwnProperty.call(ESQUEMAS, tipo)) continue;
    var campos = ESQUEMAS[tipo].campos || [];
    for (var i = 0; i < campos.length; i++) {
      if (vistos[campos[i].id]) continue;
      vistos[campos[i].id] = true;
      columnas.push(PREFIJO_RESPUESTA + campos[i].id);
    }
  }

  // Las tiendas del Cashback Multitienda son una lista de fichas, no un campo
  // suelto: van juntas en una columna, una tienda por linea.
  if (!vistos.tiendas) columnas.push(PREFIJO_RESPUESTA + 'tiendas');
  return columnas;
}

/**
 * La etiqueta de una opcion, o el valor crudo si no la encuentra.
 *
 * Primero se busca en la pregunta, porque ahi estan las palabras que el
 * comercial leyo en pantalla, y la auditoria tiene que decir lo que el vio. El
 * esquema es el respaldo.
 */
function etiquetaDeOpcion(campo, valor, tipo) {
  // Con el tipo, porque una misma pregunta puede tener opciones distintas en
  // cada tipo de campana. Sin el, el metodo de pago de una campana quedaba
  // guardado como "sin_efectivo" en vez de lo que el comercial leyo.
  var pregunta = campo && campo.id ? preguntaDe(campo.id, tipo) : null;
  var listas = [pregunta && pregunta.opciones, campo && campo.opciones];

  for (var l = 0; l < listas.length; l++) {
    var opciones = listas[l] || [];
    for (var i = 0; i < opciones.length; i++) {
      if (String(opciones[i].valor) === String(valor)) return opciones[i].etiqueta;
    }
  }
  return String(valor);
}

/** Un valor como se lee en el Sheet. Los numeros siguen siendo numeros. */
function valorLegible(campo, valor, tipo) {
  if (valor === null || valor === undefined || valor === '') return '';

  if (campo.tipo === 'casilla') return valor ? 'Sí' : 'No';
  if (campo.tipo === 'numero') return typeof valor === 'number' ? valor : Number(valor);

  // El tipo de campana se guarda con su nombre, no con su identificador: quien
  // audita el Sheet quiere leer "15 minutos o Cashback", no "cashback_eta".
  if (campo.id === 'tipo') {
    var esquemaDelTipo = esquemaDe(valor);
    return esquemaDelTipo ? esquemaDelTipo.nombre : String(valor);
  }

  if (campo.tipo === 'casillas' || Object.prototype.toString.call(valor) === '[object Array]') {
    var lista = [];
    for (var i = 0; i < valor.length; i++) lista.push(etiquetaDeOpcion(campo, valor[i], tipo));
    return lista.join(', ');
  }

  // Las opciones pueden venir del esquema o de la pregunta. Mirar solo el
  // esquema dejaba en crudo todo campo que reusara una pregunta con opciones.
  var preguntaDelCampo = preguntaDe(campo.id, tipo);
  if (campo.opciones || (preguntaDelCampo && preguntaDelCampo.opciones)) {
    return etiquetaDeOpcion(campo, valor, tipo);
  }
  return String(valor);
}

/** Las tiendas de un Cashback Multitienda, una por linea. */
function tiendasLegibles(tiendas) {
  var lista = tiendas || [];
  var lineas = [];
  for (var i = 0; i < lista.length; i++) {
    var t = lista[i] || {};
    var partes = [t.tienda || '', t.organizadorRazonSocial || '', t.organizadorId || ''];
    if (t.porcentaje) partes.push(t.porcentaje + '%');
    if (t.tope) partes.push('tope ' + t.tope);
    if (t.presupuesto) partes.push('presupuesto ' + t.presupuesto);
    lineas.push(partes.join(' · '));
  }
  return lineas.join('\n');
}

/**
 * Las respuestas de una solicitud, listas para escribir en el Sheet.
 *
 * Solo se llenan las columnas del tipo de campana que se generó. Las demas
 * quedan vacias, que es la verdad: esa pregunta no se hizo.
 */
function respuestasParaElSheet(entrada) {
  var datos = entrada || {};
  var fila = {};

  var esquema = esquemaDe(datos.tipo);
  if (!esquema) return fila;

  // Solo las preguntas que de verdad se le hicieron: un campo oculto puede
  // tener un valor viejo de antes de que el comercial cambiara una respuesta.
  var campos = camposVisibles(datos.tipo, datos);
  for (var i = 0; i < campos.length; i++) {
    var campo = campos[i];
    fila[PREFIJO_RESPUESTA + campo.id] = valorLegible(campo, datos[campo.id], datos.tipo);
  }

  if (esquema.camposPorTienda) {
    fila[PREFIJO_RESPUESTA + 'tiendas'] = tiendasLegibles(datos.tiendas);
  }
  return fila;
}

if (typeof module !== 'undefined') {
  module.exports = {
    PREFIJO_RESPUESTA: PREFIJO_RESPUESTA,
    columnasDeRespuestas: columnasDeRespuestas,
    valorLegible: valorLegible,
    tiendasLegibles: tiendasLegibles,
    respuestasParaElSheet: respuestasParaElSheet,
  };
}

'use strict';

/**
 * Armado del correo que recibe el comercial cuando se genera el documento.
 *
 * Es una funcion pura: recibe datos y devuelve asunto, HTML y texto plano.

 *
 * Todo dato del usuario se escapa antes de entrar al HTML.
 */

/** Escapa lo que va dentro del HTML. Nunca se inserta texto del usuario sin esto. */
function escaparHtml(valor) {
  return String(valor === null || valor === undefined ? '' : valor)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/** Escapa lo que va dentro de un atributo href. Solo se aceptan http y https. */
function urlSegura(valor) {
  var texto = String(valor === null || valor === undefined ? '' : valor).trim();
  if (!/^https?:\/\//i.test(texto)) return '';
  return escaparHtml(texto);
}

  if (entrada.segmento === 'reactivados') {

function textoLimitePedidos(entrada) {
  if (entrada.sinLimite) {

  }
  var maximo = Number(entrada.maxPedidos);
  if (!maximo) return '';
  var sustantivo = maximo === 1 ? 'pedido' : 'pedidos';

  // Decision 20 de la respuesta del encargo 01, confirmada por Juan el 18 de
  // septiembre: en el Cashback Multitienda el maximo se cuenta por cada tienda,
  // no por campana. Son varias tiendas en una misma jornada y cada una pone su
  // propio presupuesto, asi que un limite unico repartia mal el beneficio.
  if (entrada.tipo === 'cashback_day') {

      'Puedes obtener el Beneficio en un máximo de ' + letrasYCifra(maximo) + ' ' + sustantivo +

function textoVigenciaCreditos(entrada, pais) {
  if (entrada.vigencia === 'dias') {
    var dias = Number(entrada.diasVigencia);
    if (!dias) return '';
    // Con un solo dia salia "un (1) dias calendario contados a partir de su carga".
    return 'tendrán una vigencia de ' + letrasYCifra(dias) + ' ' + terminoDeDias(pais, dias) +
      (dias === 1 ? ' contado' : ' contados') + ' a partir de su carga';
  }
  if (entrada.vigencia === 'fecha' && entrada.fechaFinRedencion) {
    return 'podrán redimirse hasta las 11:59 p. m. del ' + formatearFecha(entrada.fechaFinRedencion);
  }
  return '';
}

/** ORACION: donde se pueden redimir los Creditos. */
function textoLugarRedencion(entrada) {
  var fijo = TEXTO_LUGAR_REDENCION_POR_OPCION[entrada.redencion];
  if (fijo) return fijo;
  if (entrada.redencion !== 'secciones') return '';

  var secciones = entrada.secciones || [];
  if (secciones.length === 0) return '';
  var entrecomilladas = [];
  for (var i = 0; i < secciones.length; i++) {
    entrecomilladas.push('“' + secciones[i] + '”');
  }
  var articulo = entrecomilladas.length === 1 ? 'la sección' : 'las secciones';
  return (
    'Los Créditos podrán redimirse en cualquier tienda de ' + articulo + ' ' + listaY(entrecomilladas) +
    ' de la Plataforma Rappi, dentro del Territorio.'
  );
}

/** ORACION: que productos participan en la Carrera. */
function textoProductos(entrada) {
  if (entrada.productos === 'todos') {
    return 'Participan en el concurso todos los productos del catálogo de la Tienda Participante en la Plataforma Rappi (en adelante, los “Productos Participantes”).';
  }
  if (entrada.productos === 'marca') {
    return (
      'Participan en el concurso únicamente los productos de la marca ' + (entrada.makerMarca || '') +
      ' disponibles en la Tienda Participante a través de la Plataforma Rappi (en adelante, los “Productos Participantes”).'
    );
  }
  if (entrada.productos === 'especificos') {
    return (
      'Participan en el concurso únicamente los siguientes productos de la Tienda Participante ' +
      '(en adelante, los “Productos Participantes”): ' + (entrada.productosLista || '') + '.'
    );
  }
  return '';
}

/** Derivados propios de la Carrera de Compras. */
function derivadosCarrera(entrada, pais, valores) {
  valores.TEXTO_PRODUCTOS = textoProductos(entrada);
  valores.CRITERIO_GANADOR = CRITERIO_GANADOR_POR_OPCION[entrada.criterioGanador] || '';
  valores.TEXTO_DESEMPATE = TEXTO_DESEMPATE_POR_OPCION[entrada.desempate] || '';

  var ganadores = Number(entrada.numeroGanadores);
  valores.FRASE_GANADORES = !ganadores
    ? ''
    : ganadores === 1
      ? 'Resultará ganador el participante que ocupe la primera posición del ranking.'
      : 'Resultarán ganadores los ' + letrasYCifra(ganadores) + ' participantes que ocupen las primeras posiciones del ranking.';

  var quien = ganadores > 1 ? 'Cada ganador' : 'El ganador';
  if (entrada.tipoPremio === 'creditos' && tieneValor(entrada.creditosPremio)) {
    valores.LISTA_PREMIOS = quien + ' recibirá ' + cantidadCreditos(entrada.creditosPremio, pais) + ', que serán acreditados en su Billetera de Créditos.';
    valores.TEXTO_NATURALEZA_PREMIO =
      'El premio consiste en Créditos acreditados en la Billetera de Créditos de la Plataforma Rappi, los cuales son intangibles, ' +
      'no constituyen dinero en efectivo, no son transferibles a terceros y se rigen por los Términos y Condiciones de Funcionamiento ' +
      'de los Créditos de la Plataforma Rappi, disponibles en: ' + pais.url_tc_creditos + '.';
  } else if (entrada.tipoPremio === 'fisico' && tieneValor(entrada.descripcionPremio)) {
    valores.LISTA_PREMIOS = quien + ' recibirá el siguiente premio: ' + entrada.descripcionPremio + '.';
    valores.TEXTO_NATURALEZA_PREMIO =
      'El premio consiste en un bien de carácter físico, cuya existencia, calidad, garantía y entrega son responsabilidad exclusiva ' +
      'del Organizador. Rappi no fabrica, comercializa ni garantiza dicho bien.';
  }

  /*
   * La vinneta de entrega.
   *
   * Con premio fisico la escribe quien entrega. Con Creditos no se pregunta,
   * porque no hay nada que llevar: los acredita Rappi en la Billetera. La frase
   * es la que propuso la respuesta del encargo 01 en la falla (a) de la decision
   * 36, y que Juan aprobo el 18 de septiembre.
   */
  valores.TEXTO_ENTREGA = entrada.tipoPremio === 'creditos'
    ? 'Los Créditos serán acreditados por Rappi en la Billetera de Créditos del ganador, ' +
      'por cuenta del Organizador, una vez aceptado el premio.'
    : (TEXTO_ENTREGA_POR_OPCION[entrada.entregaPor] || '');

  /*
   * Los datos del ganador solo se transfieren cuando hay algo fisico que llevar
   * a una direccion y lo lleva el Organizador.
   *
   * Antes bastaba con que entregara el Organizador. Con premio en Creditos, que
   * Rappi acredita en la Billetera, el documento anunciaba una transferencia de
   * datos que nunca ocurre: el caso dorado CC01 la imprimia. Falla (a) de la
   * decision 36 de la respuesta del encargo 01.
   *
   * El texto es el DESPUES de la falla (b) de esa misma decision, copiado tal
   * cual. El anterior decia solo "datos de contacto", cuando el Anexo A del
   * Acuerdo Marco incluye tambien la direccion de entrega y el numero de
   * documento; dejaba la autorizacion para despues, cuando el acuerdo dice que
   * consta en el T&C de la campana; y no decia la finalidad, que la clausula
   * cuarta obliga a informar en el T&C.
   */
  valores.TEXTO_DATOS_ENTREGA =
    (entrada.tipoPremio === 'fisico' && entrada.entregaPor === 'organizador')
      ? 'Si resultas ganador, al aceptar el premio autorizas a Rappi para transferir al Organizador únicamente ' +
        'los datos estrictamente necesarios para entregártelo, que pueden ser tu nombre y apellidos, correo ' +
        'electrónico, número de teléfono celular, dirección de entrega y número de documento de identidad. ' +
        'El Organizador solo podrá usar esos datos para entregarte el premio, coordinar la entrega, verificar ' +
        'tu identidad al recibirlo y atender los reclamos sobre ella, y deberá suprimirlos una vez cumplida esa finalidad.'
      : '';

  valores.MEDIO_NOTIFICACION = MEDIO_NOTIFICACION_POR_OPCION[entrada.medioNotificacion] || '';
  valores.FECHA_NOTIFICACION = entrada.fechaNotificacion ? formatearFecha(entrada.fechaNotificacion) : '';

  var plazo = Number(entrada.plazoConfirmacion);
  valores.PLAZO_CONFIRMACION = plazo ? letrasYCifra(plazo) + ' ' + (plazo === 1 ? 'día hábil' : 'días hábiles') : '';

  valores.TEXTO_UMBRAL = tieneValor(entrada.compraMinima)
    ? 'Únicamente contabilizarán para el concurso los pedidos cuyo valor sea igual o superior a ' + montoConMoneda(entrada.compraMinima, pais) + '.'
    : 'No se exige un valor mínimo de compra por pedido para participar en la Campaña.';
}

/** Valores de una tienda del Cashback Day. */
function valoresDeTienda(tienda, pais) {
  var identificacion = validarIdentificacion(pais.codigo, tienda.id);
  return {
    TIENDA_MARCA: tienda.marca || '',
    TIENDA_RAZON_SOCIAL: tienda.razonSocial || '',
    TIENDA_ID: identificacion.valido ? identificacion.formateado : '',
    TIENDA_CIUDADES: tienda.nacional ? 'cobertura nacional' : listaY(separarPorComas(tienda.ciudades)),
    TIENDA_PRESUPUESTO: tieneValor(tienda.presupuesto) ? cantidadCreditos(tienda.presupuesto, pais) : '',
  };
}

/**
 * Calcula todos los valores del documento a partir de la entrada y del pais.
 * No valida: validar es trabajo de validaciones.js.
 *
 * Este es el unico sitio donde se enciende el idioma. Todo lo que sale impreso
 * pasa por aqui, asi que basta con fijar el idioma del pais al entrar y
 * devolverlo a espanol al salir: no hay que pasarle el idioma a cada una de las
 * cincuenta y cuatro llamadas a fechas y numeros que hay aqui dentro.
 */
function calcularDerivados(entrada, pais) {
  return conElIdiomaDe(pais, function () {
    return calcularDerivadosEnElIdiomaDelPais(entrada, pais);
  });
}

function calcularDerivadosEnElIdiomaDelPais(entrada, pais) {
  var valores = {};

  // El nombre no lo escribe nadie: sale de las respuestas, asi que el titulo
  // del documento no puede contradecir el articulado. Ver src/core/nombres.js.
  valores.NOMBRE_CAMPANA = nombreDeCampana(entrada, esquemaDe(entrada.tipo));
  valores.NOMBRE_CAMPANA_MAYUS = valores.NOMBRE_CAMPANA.toUpperCase();
  valores.TIENDA = entrada.tienda || '';
  valores.TEXTO_TERRITORIO = textoTerritorio(entrada, pais);

  valores.FECHA_INICIO = entrada.fechaInicio ? formatearFecha(entrada.fechaInicio) : '';
  valores.FECHA_FIN = entrada.fechaFin ? formatearFecha(entrada.fechaFin) : '';
  valores.HORA_INICIO = entrada.horaInicio ? formatearHora(entrada.horaInicio) : '';
  valores.HORA_FIN = entrada.horaFin ? formatearHora(entrada.horaFin) : '';

  valores.ORGANIZADOR = entrada.organizadorRazonSocial || '';
  if (tieneValor(entrada.organizadorId)) {
    var identificacion = validarIdentificacion(pais.codigo, entrada.organizadorId);
    valores.ID_ORGANIZADOR = identificacion.valido ? identificacion.formateado : '';
  } else {
    valores.ID_ORGANIZADOR = '';
  }

  valores.TEXTO_SEGMENTO = textoSegmento(entrada, pais);
  valores.TEXTO_METODO_PAGO = TEXTO_METODO_PAGO_POR_OPCION[entrada.metodoPago] || '';

  valores.TEXTO_MINIMO_COMPRA = tieneValor(entrada.compraMinima)
    ? 'Para acceder al Beneficio, el valor de los productos de tu pedido deberá ser igual o superior a ' +
      montoConMoneda(entrada.compraMinima, pais) +
      ', sin incluir el costo de envío, la tarifa de servicio ni las propinas.'
    : '';

  valores.TEXTO_LIMITE_PEDIDOS = textoLimitePedidos(entrada);

  var condiciones = entrada.condiciones || [];
  var frases = [];
  for (var i = 0; i < condiciones.length; i++) {
    var frase = TEXTO_CONDICION_POR_OPCION[condiciones[i]];
    if (frase) frases.push(frase);
  }
  valores.TEXTO_CONDICIONES = frases.join(' ');

  if (tieneValor(entrada.porcentaje)) valores.PORCENTAJE = porcentajeEnLetras(entrada.porcentaje);
  if (tieneValor(entrada.tope)) valores.TOPE = cantidadCreditos(entrada.tope, pais);
  if (tieneValor(entrada.presupuesto)) valores.PRESUPUESTO = cantidadCreditos(entrada.presupuesto, pais);

  if (tieneValor(entrada.carga)) {
    valores.TEXTO_CARGA = textoCarga(entrada);
    valores.TEXTO_VERIFICACION = textoVerificacion(entrada);
  }
  if (tieneValor(entrada.vigencia)) valores.TEXTO_VIGENCIA_CREDITOS = textoVigenciaCreditos(entrada, pais);
  if (tieneValor(entrada.redencion)) valores.TEXTO_LUGAR_REDENCION = textoLugarRedencion(entrada);

  if (entrada.tipo === 'carrera_compras') {
    derivadosCarrera(entrada, pais, valores);
  }

  for (var placeholder in VALORES_DEL_PAIS) {
    if (Object.prototype.hasOwnProperty.call(VALORES_DEL_PAIS, placeholder)) {
      valores[placeholder] = pais[VALORES_DEL_PAIS[placeholder]] || '';
    }
  }

  // Rappi Travel tiene su propia entidad, sus propios textos y su propio
  // archivo. Se agregan encima, sin tocar nada de delivery.
  var esquemaActual = esquemaDe(entrada.tipo);
  if (esquemaActual && esquemaActual.esDeTravel) {
    var deTravel = calcularDerivadosTravel(entrada, pais);
    for (var llaveTravel in deTravel) {
      if (Object.prototype.hasOwnProperty.call(deTravel, llaveTravel)) valores[llaveTravel] = deTravel[llaveTravel];
    }
  }

  // El cashback por ETA no tiene aliado ni tienda unica: participan todas las
  // tiendas Turbo de una ciudad y el presupuesto lo pone Rappi.
  if (esquemaActual && esquemaActual.esPorEta) {
    var deEta = calcularDerivadosEta(entrada, pais);
    for (var llaveEta in deEta) {
      if (Object.prototype.hasOwnProperty.call(deEta, llaveEta)) valores[llaveEta] = deEta[llaveEta];
    }
  }

  // Brasil tiene su propio modelo y sus propios textos, en portugues y con su
  // excepcion sobre el organizador. Mismo patron que Travel: encima, sin tocar
  // nada de delivery.
  if (esquemaActual && esquemaActual.esDeBrasil) {
    var deBrasil = calcularDerivadosBr(entrada, pais);
    for (var llaveBr in deBrasil) {
      if (Object.prototype.hasOwnProperty.call(deBrasil, llaveBr)) valores[llaveBr] = deBrasil[llaveBr];
    }
  }

  return valores;
}

if (typeof module !== 'undefined') {
  module.exports = {
    calcularDerivados: calcularDerivados,
    valoresDeTienda: valoresDeTienda,
    textoTerritorio: textoTerritorio,
    textoSegmento: textoSegmento,
    textoLimitePedidos: textoLimitePedidos,
    textoLugarRedencion: textoLugarRedencion,
    textoProductos: textoProductos,
    TEXTO_SEGMENTO_POR_OPCION: TEXTO_SEGMENTO_POR_OPCION,
    TEXTO_METODO_PAGO_POR_OPCION: TEXTO_METODO_PAGO_POR_OPCION,
    TEXTO_CONDICION_POR_OPCION: TEXTO_CONDICION_POR_OPCION,
  };
}

// --- src/core/derivados_br.js ---
'use strict';

/**
 * Los textos del modelo de Brasil.
 *
 * Vive aparte de derivados.js por la misma razon que Travel: los textos de
 * delivery estan aprobados por Legal Colombia y una campana de Brasil no puede
 * moverlos.
 *
 * Todo lo de aqui sale de los cuatro T&C aprobados que mando Legal Brasil. Las
 * correcciones aplicadas estan una por una, con su antes y su despues, en
 * docs/CORRECCIONES_BRASIL.md. El mapa de los cuatro documentos esta en
 * docs/MODELO_BASE_BRASIL.md.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloNumeros = require('./numeros.js');
  var montoConMoneda = moduloNumeros.montoConMoneda;
  var porcentajeEnLetras = moduloNumeros.porcentajeEnLetras;
  var letrasYCifra = moduloNumeros.letrasYCifra;

  var listaY = require('./fechas.js').listaY;
  var tieneValor = require('./texto.js').tieneValor;
}

/** Las cuatro formas del beneficio, tal como las nombran los documentos. */
var FORMAS_DE_BENEFICIO_BR = [
  { valor: 'desconto', etiqueta: 'Desconto % OFF', llevaPorcentaje: true, llevaTope: true },
  { valor: 'frete_gratis', etiqueta: 'Frete grátis', llevaPorcentaje: false, llevaTope: true },
  { valor: 'taxa_servico', etiqueta: 'Taxa de serviço grátis', llevaPorcentaje: false, llevaTope: false },
  { valor: 'taxa_e_frete', etiqueta: 'Taxa de serviço e frete grátis', llevaPorcentaje: false, llevaTope: false },
];

function formaDeBeneficioBr(valor) {
  for (var i = 0; i < FORMAS_DE_BENEFICIO_BR.length; i++) {
    if (FORMAS_DE_BENEFICIO_BR[i].valor === valor) return FORMAS_DE_BENEFICIO_BR[i];
  }
  return null;
}

/** Los medios de pago que aparecen en los cuatro documentos, en su orden. */
var METODOS_DE_PAGO_BR = [
  { valor: 'dinheiro', etiqueta: 'Dinheiro' },
  { valor: 'paypal', etiqueta: 'Paypal' },
  { valor: 'rappipay', etiqueta: 'RappiPay' },
  { valor: 'visa', etiqueta: 'Cartão de crédito Visa' },
  { valor: 'mastercard', etiqueta: 'Cartão de crédito Mastercard' },
  { valor: 'voucher_refeicao', etiqueta: 'Voucher Refeição' },
];

/**
 * El trozo del parrafo de apertura que habla del minimo de compra.
 *
 * FRAGMENTO: se inserta dentro de la frase, sin mayuscula inicial ni punto. Sin
 * minimo devuelve cadena vacia, porque la campana de taxa de servico e frete
 * gratis no lo lleva y la frase tiene que cerrar igual de bien.
 */
function textoMinimoAperturaBr(entrada, pais) {
  if (!tieneValor(entrada.compraMinima)) return '';
  return ' com valor acima de ' + montoConMoneda(entrada.compraMinima, pais) + ',';
}

/** FRAGMENTO: cierra el parrafo de apertura diciendo que recibe el usuario. */
function textoBeneficioAperturaBr(entrada) {
  var forma = formaDeBeneficioBr(entrada.beneficioBr);
  if (!forma) return '';

  if (forma.valor === 'desconto') {
    if (!tieneValor(entrada.porcentaje)) return '';
    return 'receberão até ' + porcentajeEnLetras(entrada.porcentaje) + ' de desconto no pedido';
  }
  if (forma.valor === 'frete_gratis') return 'ganharão frete grátis no pedido';
  if (forma.valor === 'taxa_servico') return 'ganharão taxa de serviço grátis no pedido';
  return 'ganharão taxa de serviço e frete grátis no pedido';
}

/** La vineta que describe el beneficio dentro de REGRAS PRINCIPAIS. */
function textoBeneficioRegraBr(entrada, pais) {
  var forma = formaDeBeneficioBr(entrada.beneficioBr);
  if (!forma) return '';
  // Sin parceiro la vineta quedaba "nas lojas do Parceiro , na plataforma":
  // mejor un hueco que una frase rota.
  if (!String(entrada.tienda || '').trim()) return '';

  var nombre = forma.valor === 'desconto' ? 'o desconto'
    : (forma.valor === 'frete_gratis' ? 'o frete grátis'
      : (forma.valor === 'taxa_servico' ? 'a taxa de serviço grátis' : 'a taxa de serviço e o frete grátis'));
  var verbo = forma.valor === 'taxa_e_frete' ? 'serão válidos' : (nombre.indexOf('a ') === 0 ? 'será válida' : 'será válido');

  var condicion = tieneValor(entrada.compraMinima)
    ? ' para compras com valor acima de ' + montoConMoneda(entrada.compraMinima, pais) + ','
    : ' para compras';

  return 'Esclarece-se que ' + nombre + ' ' + verbo + condicion +
    ' nas lojas do Parceiro ' + String(entrada.tienda || '').trim() + ', na plataforma Rappi';
}

/**
 * La vineta del tope, cuando la forma del beneficio lo lleva.
 *
 * El documento de Frete Gratis decia "o frete gratis nao sera aplicado caso o
 * valor seja superior a 20,00 (vinte reais)": sin el R$, sin decir el valor de
 * que, y dando a entender que el beneficio desaparece entero. Ver el punto B1 de
 * docs/CORRECCIONES_BRASIL.md, que es el que Juan tiene que confirmar.
 */
function textoTopeBeneficioBr(entrada, pais) {
  var forma = formaDeBeneficioBr(entrada.beneficioBr);
  if (!forma || !forma.llevaTope || !tieneValor(entrada.tope)) return '';

  if (forma.valor === 'desconto') {
    if (!tieneValor(entrada.porcentaje)) return '';
    return 'Esclarece-se que o desconto será de até ' + porcentajeEnLetras(entrada.porcentaje) +
      ', limitado ao valor de ' + montoConMoneda(entrada.tope, pais);
  }
  return 'Esclarece-se que o frete grátis está limitado a ' + montoConMoneda(entrada.tope, pais) +
    '; o valor que exceder esse limite será cobrado do Usuário';
}

/** FRAGMENTO: la vineta del limite de pedidos por usuario. */
function textoLimitePedidosBr(entrada) {
  if (entrada.sinLimite) {
    return 'Esclarece-se que não há limite de pedidos por usuário durante o período da promoção';
  }
  if (!tieneValor(entrada.maxPedidos)) return '';

  var cantidad = Number(entrada.maxPedidos);
  // Como su par en espanol: un valor que no es un numero queda como hueco, no
  // como "o limite de  undefined (NaN) pedidos".
  if (!isFinite(cantidad) || cantidad < 1) return '';
  var sustantivo = cantidad === 1 ? 'pedido' : 'pedidos';
  return 'Esclarece-se que há o limite de ' + letrasYCifra(cantidad) + ' ' + sustantivo +
    ' por usuário durante o período da promoção';
}

/** FRAGMENTO: la vineta de los medios de pago, con su lista. */
function textoMetodoPagoBr(entrada) {
  var elegidos = entrada.metodosPagoBr || [];
  if (elegidos.length === 0) return '';

  var etiquetas = [];
  for (var i = 0; i < METODOS_DE_PAGO_BR.length; i++) {
    for (var e = 0; e < elegidos.length; e++) {
      if (elegidos[e] === METODOS_DE_PAGO_BR[i].valor) { etiquetas.push(METODOS_DE_PAGO_BR[i].etiqueta); break; }
    }
  }
  if (etiquetas.length === 0) return '';

  return 'Campanha válida somente para pedidos realizados e pagos através dos meios de pagamento: ' +
    listaY(etiquetas);
}

/** Todos los valores del modelo de Brasil. Se agregan encima de los comunes. */
function calcularDerivadosBr(entrada, pais) {
  return {
    PARCEIRO: String(entrada.tienda || '').trim(),
    TEXTO_MINIMO_APERTURA: textoMinimoAperturaBr(entrada, pais),
    TEXTO_BENEFICIO_APERTURA: textoBeneficioAperturaBr(entrada),
    TEXTO_BENEFICIO_REGRA: textoBeneficioRegraBr(entrada, pais),
    TEXTO_TOPE_BENEFICIO: textoTopeBeneficioBr(entrada, pais),
    TEXTO_LIMITE_PEDIDOS: textoLimitePedidosBr(entrada),
    TEXTO_METODO_PAGO: textoMetodoPagoBr(entrada),
  };
}

if (typeof module !== 'undefined') {
  module.exports = {
    FORMAS_DE_BENEFICIO_BR: FORMAS_DE_BENEFICIO_BR,
    METODOS_DE_PAGO_BR: METODOS_DE_PAGO_BR,
    formaDeBeneficioBr: formaDeBeneficioBr,
    calcularDerivadosBr: calcularDerivadosBr,
  };
}

'use strict';

/**
 * Los textos del cashback por incumplimiento del ETA.
 *
 * Base: los T&C publicados de Bogota (16/09/2026) y Barranquilla (1/09/2026).
 * Son el mismo documento con la ciudad, la fecha, las horas y el presupuesto
 * cambiados.
 *
 * Lo que este tipo tiene de distinto: el beneficio no se gana comprando, se
 * gana cuando Rappi no cumple el tiempo que prometio. Por eso no hay aliado que
 * fondee ni tienda unica, y por eso el documento habla de todas las tiendas
 * Turbo de una ciudad.
 *

if (typeof module !== 'undefined' && typeof require === 'function') {

  var letrasYCifraFemenino = moduloNumeros.letrasYCifraFemenino;

var SECCIONES_EXCLUIBLES_ETA = [

/**
 * FRAGMENTO: el tiempo prometido, en letras y cifra.

function textoEta(entrada) {
  if (!tieneValor(entrada.etaMinutos)) return '';
  var minutos = Math.trunc(Number(entrada.etaMinutos));
  return letrasYCifra(minutos) + (minutos === 1 ? ' minuto' : ' minutos');
}

/** FRAGMENTO: la ciudad, como va dentro de la frase del territorio. */
function textoCiudadEta(entrada) {

}

/**
 * ORACION: el maximo de ordenes por persona.
 *
 * Va en femenino porque en este modelo se cuentan ordenes, no pedidos:
 * "una (1) orden", "doscientas (200) ordenes".
 */
function textoLimiteOrdenes(entrada) {
  if (entrada.sinLimite) {
    return 'No hay límite de órdenes por Usuario/Consumidor durante la vigencia de la Campaña.';
  }
  if (!tieneValor(entrada.maxPedidos)) return '';

  var cantidad = Math.trunc(Number(entrada.maxPedidos));
  var sustantivo = cantidad === 1 ? 'orden' : 'órdenes';

/**

 * que se dice entera de otra forma.
 */
function textoRedencionEta(entrada) {
  var base = 'Se aclara que los Créditos otorgados podrán ser utilizados o redimidos en cualquier sección de la Plataforma Rappi';
  var elegidas = entrada.exclusionesEta || [];
  if (elegidas.length === 0) return base + '.';

  var nombres = [];
  for (var i = 0; i < SECCIONES_EXCLUIBLES_ETA.length; i++) {
    for (var e = 0; e < elegidas.length; e++) {
      if (elegidas[e] === SECCIONES_EXCLUIBLES_ETA[i].valor) { nombres.push(SECCIONES_EXCLUIBLES_ETA[i].nombre); break; }
    }
  }
  if (nombres.length === 0) return base + '.';
  return base + ', a excepción de ' + listaY(nombres) + '.';
}

/**
 * El presupuesto de este modelo, en letras y cifra.
 *
 * Los documentos publicados lo escribian solo en cifra ("37.000.000 de
 * Creditos"), mientras que el resto de numeros del mismo documento si van en
 * letras y cifra. Uno de los dos llego a decir "95.087.585,10 de Creditos", con
 * decimales, que para unos puntos que no se fraccionan no tiene sentido.
 * Ver docs/MEJORAS_ETA.md.
 */
function presupuestoEta(entrada, pais) {
  if (!tieneValor(entrada.presupuesto)) return '';
  return cantidadCreditos(Math.trunc(Number(entrada.presupuesto)), pais);
}

/** Todos los valores del modelo del ETA. Se agregan encima de los comunes. */
function calcularDerivadosEta(entrada, pais) {
  return {
    TEXTO_ETA: textoEta(entrada),
    TEXTO_CIUDAD_ETA: textoCiudadEta(entrada),
    TEXTO_LIMITE_ORDENES: textoLimiteOrdenes(entrada),
    // Va dentro de la clausula de vigencia y redencion de Creditos, que es
    // donde la ponen los demas modelos. En los documentos publicados estaba
    // suelta entre las restricciones. Ver docs/MEJORAS_ETA.md.
    TEXTO_LUGAR_REDENCION: textoRedencionEta(entrada),
    MODALIDAD_TURBO: MODALIDAD_TURBO_POR_DEFECTO,
    PRESUPUESTO: presupuestoEta(entrada, pais),
  };
}

if (typeof module !== 'undefined') {
  module.exports = {
    MODALIDAD_TURBO_POR_DEFECTO: MODALIDAD_TURBO_POR_DEFECTO,
    SECCIONES_EXCLUIBLES_ETA: SECCIONES_EXCLUIBLES_ETA,
    calcularDerivadosEta: calcularDerivadosEta,
  };
}

'use strict';

/**
 * Los marcadores cortos de las leyendas de piezas publicitarias.
 *
 * Ninguno agrega una pregunta: todos salen de los mismos hechos que llenan el
 * documento, asi que la leyenda y el T&C no se pueden contradecir. Eso es lo que
 * hace que valga la pena que los arme la herramienta y no una persona.
 *
 * Por que existen y no se reusan los del documento: los del documento son
 * oraciones largas. {{TEXTO_MINIMO_COMPRA}} pasa de 150 caracteres y
 * {{TOPE}} imprime "veinticinco mil (25.000) Creditos". En una letra pequena de
 * 620 caracteres no caben, y en una push de 70 menos.
 *
 * Las frases son de la seccion 7B.1 de docs/encargos/respuestas/03-leyendas.md,
 * copiadas tal cual. Regla 3 de CLAUDE.md: aqui no se redacta. Donde la
 * respuesta no dio frase, el marcador queda vacio y la leyenda no se entrega,
 * que es lo mismo que hace el documento cuando le falta un dato.
 */

/* En Node las dependencias se cargan con require; en Apps Script ya son globales. */
if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloNumerosLey = require('./numeros.js');
  var formatearMiles = moduloNumerosLey.formatearMiles;

  var moduloFechasLey = require('./fechas.js');
  var formatearFecha = moduloFechasLey.formatearFecha;
  var formatearHora = moduloFechasLey.formatearHora;
  var partesDeFecha = moduloFechasLey.partesDeFecha;
  var listaY = moduloFechasLey.listaY;
  var separarPorComas = moduloFechasLey.separarPorComas;

  var tieneValor = require('./texto.js').tieneValor;
  var direccionDeCampana = require('./nombres.js').direccionDeCampana;
  var SECCIONES_EXCLUIBLES_ETA = require('./derivados_eta.js').SECCIONES_EXCLUIBLES_ETA;
  var categoriaPideRegistro = require('./leyendas.js').categoriaPideRegistro;
}

/** Donde vive el T&C publicado. La ruta del pais sale de la fila del pais. */
var SITIO_DE_PUBLICACION = 'https://promos.rappi.com/';

/**
 * Las horas que no se escriben.
 *
 * "Las horas se omiten cuando son 12:00 a. m. y 11:59 p. m." (seccion 7B.1). Son
 * las de una campana que corre el dia entero, y ponerlas solo gasta caracteres.
 */
var HORA_DE_ARRANQUE = '00:00';
var HORA_DE_CIERRE = '23:59';

// --- Cifras ----------------------------------------------------------------

/** FRAGMENTO: un monto como se escribe en una pieza. "$25.000". */
function cifraDeMonto(valor, pais) {
  if (!tieneValor(valor)) return '';
  var entero = Math.trunc(Number(valor));
  if (!isFinite(entero)) return '';
  return (pais.moneda_simbolo || '') + formatearMiles(entero, pais.separador_miles || '.');
}

/** FRAGMENTO: el porcentaje en cifra. "99%". */
function cifraDePorcentaje(valor) {
  if (!tieneValor(valor)) return '';
  return String(Number(valor)) + '%';
}

// --- La vigencia -----------------------------------------------------------

function esDiaCompleto(horaInicio, horaFin) {
  return (!tieneValor(horaInicio) || horaInicio === HORA_DE_ARRANQUE) &&
    (!tieneValor(horaFin) || horaFin === HORA_DE_CIERRE);
}

/**
 * FRAGMENTO: cuando vale la campana, en la forma corta de las piezas.
 *
 * Seis formas, segun si es un dia o varios y si lleva horas. La fecha larga
 * ("del 09 al 13 de septiembre de 2026") solo es exacta cuando la campana dura
 * lo mismo que los Creditos, asi que aqui se escribe la vigencia de la campana y
 * la de los Creditos va aparte, en TEXTO_CREDITOS_CORTO.
 */
function textoVigenciaCorta(entrada) {
  var inicio = entrada.fechaInicio;
  var fin = tieneValor(entrada.fechaFin) ? entrada.fechaFin : entrada.fechaInicio;
  if (!tieneValor(inicio)) return '';

  var horaInicio = entrada.horaInicio;
  var horaFin = entrada.horaFin;
  var todoElDia = esDiaCompleto(horaInicio, horaFin);

  if (inicio === fin) {
    if (todoElDia) return 'el ' + formatearFecha(inicio);
    return 'el ' + formatearFecha(inicio) +
      ' entre las ' + formatearHora(horaInicio) + ' y las ' + formatearHora(horaFin);
  }

  if (!todoElDia) {
    return 'desde las ' + formatearHora(horaInicio) + ' del ' + formatearFecha(inicio) +
      ' hasta las ' + formatearHora(horaFin) + ' del ' + formatearFecha(fin);
  }

  return 'del ' + fechaAbreviadaContra(inicio, fin) + ' al ' + formatearFecha(fin);
}

/**
 * La primera fecha de un rango, sin repetir lo que la segunda ya dice.
 *
 * "del 9 al 13 de septiembre de 2026" dentro del mismo mes; "del 28 de
 * septiembre al 2 de octubre de 2026" entre meses; y con el ano cuando cambia.
 */
function fechaAbreviadaContra(inicio, fin) {
  var a = partesDeFecha(inicio);
  var b = partesDeFecha(fin);
  if (!a || !b) return formatearFecha(inicio);

  var completa = formatearFecha(inicio);
  if (a.anio !== b.anio) return completa;
  if (a.mes !== b.mes) return completa.replace(/ de \d+$/, '');
  return String(a.dia);
}

// --- Los Creditos ----------------------------------------------------------

/** FRAGMENTO: donde se pueden gastar los Creditos, en corto. */
function dondeSeRedimen(entrada, valores) {
  if (entrada.tipo === 'cashback_day') return 'en la misma tienda del pedido';
  if (entrada.tipo === 'cashback_eta') {
    var nombres = [];
    var elegidas = entrada.exclusionesEta || [];
    for (var i = 0; i < SECCIONES_EXCLUIBLES_ETA.length; i++) {
      for (var e = 0; e < elegidas.length; e++) {
        if (elegidas[e] === SECCIONES_EXCLUIBLES_ETA[i].valor) {
          nombres.push(SECCIONES_EXCLUIBLES_ETA[i].nombre);
          break;
        }
      }
    }
    if (nombres.length === 0) return 'en cualquier sección de Rappi habilitada para Créditos';
    return 'en Rappi, excepto en ' + listaY(nombres);
  }
  if (entrada.redencion === 'tienda') {
    return tieneValor(valores.TIENDA) ? 'en ' + valores.TIENDA : '';
  }
  if (entrada.redencion === 'general') return 'en cualquier sección de Rappi habilitada para Créditos';
  // "secciones" no tiene frase corta aprobada: es el insumo 5 de la lista 3 de
  // la respuesta. Sin frase, la leyenda no se entrega. No se inventa aqui.
  return '';
}

/** FRAGMENTO: hasta cuando se pueden gastar los Creditos, en corto. */
function cuandoSeRedimen(entrada) {
  var cargaEnFecha = entrada.carga === 'fecha' && tieneValor(entrada.fechaCarga);

  if (entrada.vigencia === 'dias') {
    if (!tieneValor(entrada.diasVigencia)) return '';
    var dias = 'durante ' + Math.trunc(Number(entrada.diasVigencia)) + ' días';
    return cargaEnFecha
      ? dias + ' desde el ' + formatearFecha(entrada.fechaCarga)
      : dias + ' desde que los recibes';
  }

  if (entrada.vigencia === 'fecha') {
    if (!tieneValor(entrada.fechaFinRedencion)) return '';
    return cargaEnFecha
      ? 'del ' + fechaAbreviadaContra(entrada.fechaCarga, entrada.fechaFinRedencion) +
        ' al ' + formatearFecha(entrada.fechaFinRedencion)
      : 'hasta el ' + formatearFecha(entrada.fechaFinRedencion);
  }
  return '';
}

/** FRAGMENTO: "para redimir {donde} {cuando}". Vacio si falta cualquiera. */
function textoCreditosCorto(entrada, valores) {
  var donde = dondeSeRedimen(entrada, valores);
  var cuando = cuandoSeRedimen(entrada);
  if (!donde || !cuando) return '';
  return 'para redimir ' + donde + ' ' + cuando;
}

 * No es lo mismo que un dato que el comercial olvido: son casos donde la
 * respuesta del encargo 03 no dio frase corta y, por la regla 3 de CLAUDE.md,
 * aqui no se escribe una. Sin frase no se entrega la leyenda, porque callar una
 * restriccion en la pieza es peor que no dar la pieza: el minimo irreductible de
 * la seccion 7D incluye la condicion del pedido y el segmento.
 *
 * Cada uno de estos esta anotado en docs/PENDIENTES_LEGAL.md con su numero de
 * insumo de la lista 3 de la respuesta.
 */
function faltantesParaLaLeyenda(entrada, pais) {
  var faltantes = [];

  if (entrada.redencion === 'secciones') {
    faltantes.push('cómo se dice en una pieza que los Créditos solo sirven en ciertas secciones');
  }

  var condiciones = entrada.condiciones || [];
  for (var i = 0; i < condiciones.length; i++) {
    if (condiciones[i] === 'consumo_local' && !tieneValor(pais.nombre_modalidad_local)) {
      faltantes.push('cómo se llama dentro de la app la modalidad de consumo en el local');
    }
  }

  if (entrada.segmento === 'pro' && !tieneValor(pais.url_tc_pro)) {
    faltantes.push('el enlace de los términos de RappiPro de este país');
  }

  if (entrada.tipo === 'carrera_compras' && entrada.criterioGanador &&
      entrada.criterioGanador !== 'mayor_valor') {
    faltantes.push('cómo se dice en una pieza que gana quien haga más pedidos');
  }

  // El registro sanitario no bloquea el documento, pero sin el la pieza de un
  // medicamento o de un fitoterapeutico no se puede publicar (Legal CO,
  // diapositiva 10). La leyenda lo lleva en un bloque opcional, asi que sin
  // este aviso desapareceria en silencio y nadie se enteraria.
  if (categoriaPideRegistro(entrada.categoriaProducto) &&
      !tieneValor(entrada.registroSanitario)) {
    faltantes.push('el registro sanitario del producto, que la pieza tiene que mostrar');
  }

  return faltantes;
}

/**
 * Todos los marcadores cortos de una campana.
 *
 * Se calculan encima de los derivados del documento, asi que donde las dos
 * versiones comparten nombre (TEXTO_CIUDAD_ETA) manda la corta: en la pieza dice
 * "Bogota" y en el documento "la ciudad de Bogota".
 */
function calcularDerivadosDeLeyendas(entrada, pais, valoresDelDocumento, opciones) {
  var valores = valoresDelDocumento || {};
  var config = opciones || {};

  var urlDeLaCampana = urlDelTcDeLaCampana(entrada, pais, config.nombreCampana, config.enlacePublicado);

  var cortos = {
    URL_TC_CAMPANA: urlDeLaCampana,
    /*
     * Un solo enlace, el mismo en todas partes.
     *
     * La respuesta del encargo 03 proponia un enlace corto aparte para que la
     * leyenda de push cupiera en 70 caracteres. Juan lo descarto el 18 de
     * septiembre: el enlace tiene que ser el mismo en la letra pequena, en el
     * banner y en la push, porque dos direcciones para el mismo T&C es una que
     * alguien va a copiar mal. Ademas, en push y SMS casi nunca ponen el enlace.
     *
     * Asi que URL_CORTA es la direccion de la campana. La leyenda de push mide
     * mas de lo que admite el formato y la herramienta lo dice, que es la
     * verdad: con el enlace no cabe.
     */
    URL_CORTA: urlDeLaCampana,
    URL_TC_PRO: pais.url_tc_pro || '',
    PORCENTAJE_CIFRA: cifraDePorcentaje(entrada.porcentaje),
    TOPE_CIFRA: cifraDeMonto(entrada.tope, pais),
    MINIMO_CIFRA: cifraDeMonto(entrada.compraMinima, pais),
    TEXTO_VIGENCIA_CORTA: textoVigenciaCorta(entrada),
    TEXTO_CREDITOS_CORTO: textoCreditosCorto(entrada, valores),
    TEXTO_LIMITE_CORTO: textoLimiteCorto(entrada),
    TEXTO_TERRITORIO_CORTO: textoTerritorioCorto(entrada),
    TEXTO_SEGMENTO_CORTO: textoSegmentoCorto(entrada, pais),
    TEXTO_PAGO_CORTO: textoPagoCorto(entrada),
    TEXTO_CONDICIONES_CORTO: textoCondicionesCorto(entrada, pais),
    TEXTO_TIENDAS_SELECCIONADAS: textoTiendasSeleccionadas(entrada),
    LISTA_TIENDAS_CORTA: listaTiendasCorta(entrada),
    TEXTO_GANADORES_CORTO: textoGanadoresCorto(entrada),
    TEXTO_PREMIO_CORTO: textoPremioCorto(entrada, pais),
    TEXTO_BENEFICIO_TRAVEL_CORTO: textoBeneficioTravelCorto(entrada, pais),
    TEXTO_DESCUENTO_TRAVEL_CORTO: textoDescuentoTravelCorto(entrada),
    TEXTO_UNIDADES_TRAVEL: textoUnidadesTravel(entrada),
    TEXTO_CONDICIONES_VIAJE: textoCondicionesViaje(entrada),
    REGISTRO_SANITARIO: String(entrada.registroSanitario || '').trim(),
    NOTIFICACION_INVIMA: String(entrada.notificacionInvima || '').trim(),
  };

  // En Rappi Travel no hay tienda: quien fondea es la marca aliada, y es la que
  // va en "Cashback ofrecido por". Sin esto la frase salia sin nombre.
  if (entrada.tipo === 'cashback_travel' || entrada.tipo === 'descuento_travel') {
    cortos.TIENDA = String(entrada.marcaAliado || '').trim() ||
      String(entrada.organizadorRazonSocial || '').trim();
  }

  // El tiempo prometido y la ciudad del ETA, en la forma corta de la pieza.
  if (entrada.tipo === 'cashback_eta') {
    cortos.ETA_CORTO = tieneValor(entrada.etaMinutos)
      ? Math.trunc(Number(entrada.etaMinutos)) + ' minutos'
      : '';
    cortos.TEXTO_CIUDAD_ETA = String(entrada.ciudades || '').trim();
  }

  var salida = {};
  for (var llave in valores) {
    if (Object.prototype.hasOwnProperty.call(valores, llave)) salida[llave] = valores[llave];
  }
  for (var corto in cortos) {
    if (Object.prototype.hasOwnProperty.call(cortos, corto)) salida[corto] = cortos[corto];
  }
  return salida;
}

if (typeof module !== 'undefined') {
  module.exports = {
    SITIO_DE_PUBLICACION: SITIO_DE_PUBLICACION,
    calcularDerivadosDeLeyendas: calcularDerivadosDeLeyendas,
    faltantesParaLaLeyenda: faltantesParaLaLeyenda,
    PENDIENTES_POR_MARCADOR: PENDIENTES_POR_MARCADOR,
    urlDelTcDeLaCampana: urlDelTcDeLaCampana,
    textoVigenciaCorta: textoVigenciaCorta,
    textoCreditosCorto: textoCreditosCorto,
    textoLimiteCorto: textoLimiteCorto,
    textoTerritorioCorto: textoTerritorioCorto,
    textoSegmentoCorto: textoSegmentoCorto,
    textoPagoCorto: textoPagoCorto,
    textoCondicionesCorto: textoCondicionesCorto,
    listaTiendasCorta: listaTiendasCorta,
    textoGanadoresCorto: textoGanadoresCorto,
    textoPremioCorto: textoPremioCorto,
    textoBeneficioTravelCorto: textoBeneficioTravelCorto,

    esDeTurbo: esDeTurbo,
    cifraDeMonto: cifraDeMonto,
    cifraDePorcentaje: cifraDePorcentaje,
  };
}

 * origen y su estado en ese documento.
 *
 * Marca ORACION: devuelve oracion completa (mayuscula inicial y punto final).
 * Marca FRAGMENTO: se inserta dentro de otra frase (sin mayuscula ni punto).

var TEXTO_VISIBILIDAD_POR_OPCION = {

};

// --- Ayudas ----------------------------------------------------------------

function tieneValorTravel(valor) {
  if (valor === null || valor === undefined) return false;
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor.length > 0;
  return String(valor).trim() !== '';
}

/** Las categorias entre comillas, con "la categoria" o "las categorias" delante. */
function frasePorCategorias(categorias) {
  var entrecomilladas = [];
  for (var i = 0; i < categorias.length; i++) entrecomilladas.push('“' + categorias[i] + '”');
  var articulo = entrecomilladas.length === 1 ? 'la categoría' : 'las categorías';
  return articulo + ' ' + listaY(entrecomilladas);
}

/** true si estan marcadas las ocho categorias de la app. */
function sonTodasLasCategorias(categorias, pais) {
  var todas = (CATEGORIAS_TRAVEL || {})[(pais && pais.codigo) || 'CO'] || [];
  return todas.length > 0 && categorias.length === todas.length;
}

/** Las categorias de la app que NO estan en la lista. */
function categoriasRestantes(categorias, pais) {
  var todas = (CATEGORIAS_TRAVEL || {})[(pais && pais.codigo) || 'CO'] || [];
  var fuera = [];
  for (var i = 0; i < todas.length; i++) {
    if (categorias.indexOf(todas[i]) === -1) fuera.push(todas[i]);
  }
  return fuera;
}

// --- Textos por opcion -----------------------------------------------------

/** ORACION: quien puede participar. */
function textoSegmentoTravel(entrada) {
  return TEXTO_SEGMENTO_TRAVEL_POR_OPCION[entrada.segmento] || '';
}

/** ORACION: con que se paga. */
function textoMetodoPagoTravel(entrada) {
  return TEXTO_METODO_PAGO_TRAVEL_POR_OPCION[entrada.metodoPago] || '';
}

/** ORACION: que productos participan. */
function textoProductosTravel(entrada, pais) {
  var categorias = categoriasDe(entrada);
  if (categorias.length === 0) return '';

  var donde = sonTodasLasCategorias(categorias, pais) ? 'todas las categorías' : frasePorCategorias(categorias);
  var marca = String(entrada.marcaAliado || '').trim();
  var deLaMarca = marca ? 'de **' + marca + '** ' : '';

  return (
    'Participan exclusivamente las compras de productos ' + deLaMarca + 'en ' + donde +
    ' de los Sistemas Rappi Travel, realizadas durante la vigencia de la Campaña (en adelante, los “Productos Participantes”).'
  );
}

/**
 * ORACION: nacionales, internacionales o los dos. Vacio cuando son los dos.
 *
 * La frase se parte segun las categorias marcadas (decision 43 de Legal): una
 * campana de hoteles que habla de vuelos confunde sobre que compra aplica.
 * Solo se acorta cuando no hay duda: "solo vuelos" es la categoria Vuelos y
 * nada mas, y "sin vuelos" es que no haya ninguna categoria aerea. Un Paquete
 * lleva vuelo y alojamiento, asi que cae en la frase completa, que es la
 * aprobada y la que nombra las dos cosas.
 */
function textoAmbitoTravel(entrada, pais) {
  var paisLegal = (pais && pais.pais_legal) || '';
  if (entrada.ambito !== 'nacional' && entrada.ambito !== 'internacional') return '';

  var marcadas = categoriasDe(entrada);
  var soloVuelos = marcadas.length === 1 && marcadas[0] === 'Vuelos';
  var sinVuelos = marcadas.length > 0 && !hayAereasDeTravel(entrada);

  if (entrada.ambito === 'nacional') {
    if (soloVuelos) return 'Aplica únicamente para vuelos con origen y destino en ' + paisLegal + '.';
    if (sinVuelos) return 'Aplica únicamente para servicios que se presten en ' + paisLegal + '.';
    return 'Aplica únicamente para vuelos con origen y destino en ' + paisLegal +
      ' y para servicios que se presten en ' + paisLegal + '.';
  }

  if (soloVuelos) return 'Aplica únicamente para vuelos con origen o destino fuera de ' + paisLegal + '.';
  if (sinVuelos) return 'Aplica únicamente para servicios que se presten fuera de ' + paisLegal + '.';
  return 'Aplica únicamente para vuelos con origen o destino fuera de ' + paisLegal +
    ' y para servicios que se presten fuera de ' + paisLegal + '.';
}

/** ORACION: los destinos, si la campana los limita. */
function textoDestinosTravel(entrada) {
  var destinos = separarPorComas(entrada.destinos);
  if (destinos.length === 0) return '';
  return 'Aplica únicamente para los siguientes destinos: ' + listaY(destinos) + '.';
}

/** ORACION: que hoteles participan. */
function textoHotelesTravel(entrada) {
  if (entrada.hotelesModo === 'etiqueta') {
    return 'En las categorías de alojamiento, participan únicamente los hoteles identificados con la etiqueta de la Campaña en los Sistemas Rappi Travel.';
  }
  if (entrada.hotelesModo !== 'algunos') return '';

  var hoteles = separarPorComas(entrada.hotelesLista);
  if (hoteles.length === 0) return '';
  return 'En las categorías de alojamiento, participan únicamente los siguientes hoteles: ' + listaY(hoteles) + '.';
}

/**
 * Las vinetas de la clausula de condiciones, en el orden del modelo base.
 * Cada una es una ORACION. Devuelve una lista, que el motor convierte en
 * vinetas.
 */
function vinetasDeCondicionesTravel(entrada, pais) {
  var vinetas = [];
  var aerolinea = String(entrada.aerolinea || '').trim();

  if (aerolinea && entrada.soloOperados) {
    vinetas.push(
      'Los vuelos deben ser operados directamente por **' + aerolinea +
      '**. Quedan excluidos los vuelos operados por aerolíneas aliadas bajo acuerdos de código compartido y las rutas operadas por otras compañías aéreas.'
    );
  } else if (aerolinea) {
    vinetas.push('Los vuelos deben ser de **' + aerolinea + '**.');
  }

  if (entrada.trayecto === 'ida_y_regreso') {
    vinetas.push('La compra debe ser de vuelos de ida y regreso. No aplica para compras solo de ida ni para itinerarios con varios destinos.');
  } else if (entrada.trayecto === 'solo_ida') {
    vinetas.push('La compra debe ser de vuelos solo de ida.');
  }

  if (entrada.ambasFechasDentro) {
    vinetas.push('En las compras de ida y regreso, las fechas de los dos trayectos deben estar dentro del periodo de viaje de la Campaña; de lo contrario, el Beneficio no aplica para ninguno de los dos trayectos.');
  }

  var clases = separarPorComas(entrada.clasesExcluidas);
  if (clases.length > 0) {
    vinetas.push('No aplica para las clases tarifarias ' + listaY(clases) + '.');
  }

  if (entrada.soloOrigenPais) {
    vinetas.push('Los vuelos deben tener origen en ' + ((pais && pais.pais_legal) || '') + '.');
  }

  if (tieneValorTravel(entrada.anticipacionDias)) {
    // Con un solo dia salia "al menos un (1) dias calendario de anticipacion".
    var diasAnticipacion = Number(entrada.anticipacionDias);
    vinetas.push(
      'La compra debe hacerse con al menos ' + letrasYCifra(diasAnticipacion) +
      (diasAnticipacion === 1 ? ' día calendario' : ' días calendario') +
      ' de anticipación a la fecha de salida.'
    );
  }

  if (tieneValorTravel(entrada.periodoViajeInicio) && tieneValorTravel(entrada.periodoViajeFin)) {
    vinetas.push(
      'El viaje o el uso del servicio debe realizarse entre el ' + formatearFecha(entrada.periodoViajeInicio) +
      ' y el ' + formatearFecha(entrada.periodoViajeFin) + '.'
    );
  }

  var excluidas = separarPorComas(entrada.fechasExcluidas);
  if (excluidas.length > 0) {
    var enLetras = [];
    for (var f = 0; f < excluidas.length; f++) {
      var comoFecha = formatearFecha(excluidas[f]);
      enLetras.push(comoFecha || excluidas[f]);
    }
    vinetas.push('No aplica para viajes o servicios en las siguientes fechas: ' + listaY(enLetras) + '.');
  }

  if (tieneValorTravel(entrada.nochesMinimas)) {
    // Con una sola noche salia "debe ser de una (1) noches o mas".
    var noches = Number(entrada.nochesMinimas);
    vinetas.push('La reserva de hotel debe ser de ' + letrasYCifraFemenino(noches) +
      (noches === 1 ? ' noche' : ' noches') + ' o más.');
  }

  if (tieneValorTravel(entrada.diasAlquilerMinimo) && tieneValorTravel(entrada.diasAlquilerMaximo)) {
    // El minimo y el maximo pueden ser el mismo numero: la validacion solo
    // impide que el minimo sea mayor. Con los dos en 1 salia "entre un (1) y
    // un (1) dias", que repite el numero y ademas lo deja en plural.
    var alquilerMinimo = Number(entrada.diasAlquilerMinimo);
    var alquilerMaximo = Number(entrada.diasAlquilerMaximo);
    if (alquilerMinimo === alquilerMaximo) {
      vinetas.push('El alquiler de auto debe ser de ' + letrasYCifra(alquilerMinimo) +
        (alquilerMinimo === 1 ? ' día.' : ' días.'));
    } else {
      vinetas.push(
        'El alquiler de auto debe ser de entre ' + letrasYCifra(alquilerMinimo) +
        ' y ' + letrasYCifra(alquilerMaximo) + ' días.'
      );
    }
  }

  if (!entrada.sinCompraMinima && tieneValorTravel(entrada.compraMinima)) {
    vinetas.push('El valor pagado por la orden debe ser igual o superior a **' + montoConMoneda(entrada.compraMinima, pais) + '**.');
  }

  return vinetas;
}

/** FRAGMENTO: en que consiste el beneficio del cashback. */
function textoBeneficioTravel(entrada, pais) {
  if (entrada.formaBeneficio === 'monto_fijo') {
    if (!tieneValorTravel(entrada.montoFijo)) return '';
    return '**' + cantidadCreditos(entrada.montoFijo, pais) + '** por cada orden que cumpla las condiciones de la Campaña';
  }

  if (!tieneValorTravel(entrada.porcentaje)) return '';
  var porcentaje = '**' + porcentajeEnLetras(entrada.porcentaje) + '**';

  if (entrada.sinTope) return 'el ' + porcentaje + ' del valor pagado por tu orden, sin un tope por orden';
  if (!tieneValorTravel(entrada.tope)) return '';
  return 'el ' + porcentaje + ' del valor pagado por tu orden, sin que puedas recibir más de **' +
    cantidadCreditos(entrada.tope, pais) + '** por orden';
}

/** ORACION: sobre que valor se calcula el cashback. */
function textoBaseCalculoTravel(entrada) {
  if (entrada.formaBeneficio !== 'porcentaje') return '';

  var conAsistencia = categoriasDe(entrada).indexOf('Asistencia') !== -1;
  var excluidos = conAsistencia
    ? 'sin incluir cargos por servicio ni otros servicios adicionales'
    : 'sin incluir cargos por servicio, asistencias o seguros de viaje ni otros servicios adicionales';

  return 'El Beneficio aplica únicamente sobre el valor pagado con dinero real por la tarifa o la reserva de los ' +
    'Productos Participantes, antes de impuestos, tasas y contribuciones, ' + excluidos + '. ' +
    'No hacen parte de la base de cálculo el IVA, las tasas aeroportuarias ni ningún otro impuesto, tasa o ' +
    'contribución incluido en el precio total.';
}

/**
 * ORACION: el ejemplo del tope, en cifras.
 *
 * Existe por el reclamo de agosto de 2025: una etiqueta prometia 250.000 de
 * cashback sin la palabra "hasta" y la usuaria reclamo publicidad enganosa.
 */
function textoEjemploTopeTravel(entrada, pais) {
  if (entrada.formaBeneficio !== 'porcentaje' || entrada.sinTope) return '';
  if (!tieneValorTravel(entrada.tope) || !tieneValorTravel(entrada.porcentaje)) return '';

  var porcentaje = Number(entrada.porcentaje);
  var tope = Number(entrada.tope);
  if (!isFinite(porcentaje) || porcentaje <= 0 || !isFinite(tope) || tope <= 0) return '';

  var umbral = Math.ceil(tope * 100 / porcentaje);
  // Cifras sin letras: es un ejemplo para leer rapido, no una clausula.
  return (
    'Por ejemplo, para recibir el máximo de ' + formatearMiles(tope, pais.separador_miles) +
    ' Créditos en una orden, el valor que cuenta para el cálculo del Beneficio debe ser de al menos ' +
    pais.moneda_simbolo + formatearMiles(umbral, pais.separador_miles) +
    '; si es menor, recibirás el ' + porcentaje + '% de ese valor.'
  );
}

/** FRAGMENTO: cuantas ordenes con beneficio puede tener cada persona. */
function textoLimiteOrdenesTravel(entrada) {
  if (entrada.sinLimitePorUsuario) return 'no hay un límite de órdenes por Usuario/Consumidor.';
  if (!tieneValorTravel(entrada.limitePorUsuario)) return '';

  var cuantas = Number(entrada.limitePorUsuario);
  var enPalabras = cuantas === 1 ? 'en una (1) orden' : 'hasta en ' + letrasYCifraFemenino(cuantas) + ' órdenes';
  return 'cada Usuario/Consumidor podrá recibir el Beneficio ' + enPalabras + ' durante la vigencia de la Campaña.';
}

/** FRAGMENTO: que agota la campana antes de la fecha de fin. */
function textoAgotamientoVigenciaTravel(entrada, pais) {
  if (entrada.tipo === 'descuento_travel') {
    if (entrada.sinUnidades || !tieneValorTravel(entrada.unidades)) return '';
    // Con una sola unidad salia "hasta agotar las una (1) unidades con descuento".
    if (Number(entrada.unidades) === 1) return 'la única unidad con descuento';
    return 'las ' + letrasYCifraFemenino(entrada.unidades) + ' unidades con descuento';
  }

  if (!tieneValorTravel(entrada.presupuesto)) return '';
  var presupuesto = 'el presupuesto disponible de **' + cantidadCreditos(entrada.presupuesto, pais) + '**';
  if (entrada.sinMaxOrdenes || !tieneValorTravel(entrada.maxOrdenes)) return presupuesto;
  return presupuesto + ' o el máximo de ' + letrasYCifraFemenino(entrada.maxOrdenes) + ' órdenes con Beneficio';
}

/** ORACION: el limite de toda la campana. */
function textoLimiteCampanaTravel(entrada, pais) {
  if (entrada.tipo === 'descuento_travel') {
    if (entrada.sinUnidades || !tieneValorTravel(entrada.unidades)) return '';
    // Con una sola unidad salia "cuenta con una (1) unidades ... Una vez agotadas".
    if (Number(entrada.unidades) === 1) {
      return 'La Campaña cuenta con una (1) unidad con descuento. Una vez agotada, la Campaña finalizará ' +
        'automáticamente, aunque no haya terminado su vigencia.';
    }
    return 'La Campaña cuenta con ' + letrasYCifraFemenino(entrada.unidades) +
      ' unidades con descuento. Una vez agotadas, la Campaña finalizará automáticamente, aunque no haya terminado su vigencia.';
  }

  if (!tieneValorTravel(entrada.presupuesto)) return '';
  var presupuesto = '**' + cantidadCreditos(entrada.presupuesto, pais) + '**';

  if (entrada.sinMaxOrdenes || !tieneValorTravel(entrada.maxOrdenes)) {
    return 'La Campaña tiene un presupuesto total de ' + presupuesto +
      '. Una vez agotado, la Campaña finalizará automáticamente, aunque no haya terminado su vigencia.';
  }
  return 'La Campaña tiene un presupuesto total de ' + presupuesto + ' y un máximo de ' +
    letrasYCifraFemenino(entrada.maxOrdenes) +
    ' órdenes con Beneficio. Cuando se agote cualquiera de los dos, la Campaña finalizará automáticamente, aunque no haya terminado su vigencia.';
}

/** FRAGMENTO: como cuenta una compra de ida y regreso. */
function textoConteoIdaRegresoTravel(entrada) {
  if (!hayAereasDeTravel(entrada) || entrada.trayecto === 'solo_ida') return '';
  if (entrada.conteoIdaRegreso === 'por_trayecto') {
    return 'en una compra de ida y regreso, cada trayecto cuenta como una (1) orden, y el Beneficio se calcula sobre el valor pagado por cada trayecto.';
  }
  if (entrada.conteoIdaRegreso === 'una_orden') {
    return 'una compra de ida y regreso cuenta como una (1) orden, y el Beneficio se calcula sobre el valor total pagado por la compra.';
  }
  return '';
}

/** FRAGMENTO: cuando llegan los Creditos. */
function textoCargaTravel(entrada) {
  if (entrada.carga === 'al_confirmarse') return 'una vez se confirme la emisión de tu reserva';
  if (!tieneValorTravel(entrada.diasCarga)) return '';

  // Con un solo dia salia "dentro de los un (1) dias calendario siguientes".
  var diasCarga = Number(entrada.diasCarga);
  var variosDiasCarga = diasCarga !== 1;
  var articuloCarga = variosDiasCarga ? 'los ' : '';
  if (entrada.carga === 'dias_calendario') {
    return 'dentro de ' + articuloCarga + letrasYCifra(diasCarga) +
      (variosDiasCarga ? ' días calendario siguientes' : ' día calendario siguiente') +
      ' a la finalización de la Campaña, siempre que tu reserva esté confirmada';
  }
  if (entrada.carga === 'dias_habiles') {
    return 'dentro de ' + articuloCarga + letrasYCifra(diasCarga) +
      (variosDiasCarga ? ' días hábiles siguientes' : ' día hábil siguiente') +
      ' a la finalización de la Campaña, siempre que tu reserva esté confirmada';
  }
  return '';
}

/*
 * La verificacion de elegibilidad de Travel, segun cuando llegan los Creditos.

 * Mismo caso que en delivery (decision 18): con carga al confirmarse la
 * reserva, "verificar antes de acreditar" contradice a "acreditar al

 */
var TEXTO_VERIFICACION_TRAVEL_ANTES =
  'Rappi Travel se reserva el derecho de verificar la elegibilidad de cada orden antes de acreditar el Beneficio; ' +
  'si la verificación determina que la orden no cumple las condiciones de la Campaña, los Créditos no serán ' +
  'acreditados y se te informará a través de la Plataforma Rappi.';

var TEXTO_VERIFICACION_TRAVEL_DESPUES =
  'Rappi Travel podrá verificar la elegibilidad de cada orden después de acreditar el Beneficio; ' +

  'descontar o revocar los Créditos acreditados y te lo informará a través de la Plataforma Rappi.';

/** ORACION: donde se pueden gastar los Creditos. */
function textoRedencionTravel(entrada, pais) {
  if (entrada.redencion === 'travel_y_plataforma') {
    return 'Los Créditos podrán redimirse en cualquier categoría de los Sistemas Rappi Travel y en cualquier sección de la Plataforma Rappi habilitada para el uso de Créditos.';
  }

  }

  if (sonTodasLasCategorias(elegidas, pais)) {

/** FRAGMENTO: en que consiste el descuento. */
function textoDescuentoTravel(entrada) {
  if (!tieneValorTravel(entrada.porcentaje)) return '';
  if (entrada.formaDescuento === 'fijo') {
    return 'un descuento del **' + porcentajeEnLetras(entrada.porcentaje) + '**';
  }
  if (!tieneValorTravel(entrada.porcentajeMinimo)) return '';
  // "segun el Producto Participante" va al final de la frase, no aqui: en medio
  // partia la oracion ("...segun el Producto Participante sobre el valor de la

  return 'un descuento de entre el **' + porcentajeEnLetras(entrada.porcentajeMinimo) +

/**
 * ORACION: a cuantos productos llega el descuento maximo.
 *
 * La SIC admite anunciar un rango de descuento siempre que se diga a cuantos
 * productos aplica el maximo. Sin esta frase, "hasta 40%" es enganoso.
 */
function textoMaximoDisponibleTravel(entrada) {
  if (entrada.formaDescuento !== 'variable') return '';
  if (!tieneValorTravel(entrada.productosConMaximo) || !tieneValorTravel(entrada.porcentaje)) return '';
  // "un (1)" solo va delante de un sustantivo. Aqui la cifra va sola, asi que
  // con un producto se escribe "uno (1) de los Productos Participantes".
  var conMaximo = Number(entrada.productosConMaximo);
  return 'El descuento máximo del **' + porcentajeEnLetras(entrada.porcentaje) + '** aplica a ' +
    (conMaximo === 1 ? 'uno (1)' : letrasYCifra(conMaximo)) + ' de los Productos Participantes.';
}

/** FRAGMENTO: donde ve el usuario el descuento. */
function textoVisibilidadTravel(entrada) {
  var marcadas = entrada.visibilidad || [];
  var textos = [];
  var orden = ['inicio', 'etiqueta', 'precio_tachado'];
  for (var i = 0; i < orden.length; i++) {

  }
  return textos.length === 0 ? '' : listaY(textos);
}

/** ORACION: el descuento de una asistencia no cubre el vuelo con el que se compra. */
function textoAsistenciaTravel(entrada) {
  var categorias = categoriasDe(entrada);
  if (categorias.length !== 1 || categorias[0] !== 'Asistencia') return '';
  return 'El descuento aplica únicamente sobre el valor de la asistencia al viajero y no sobre el valor de los vuelos o paquetes con los que se compre.';
}

/** FRAGMENTO: la vigencia de los Creditos. En Travel siempre es por dias. */
function textoVigenciaCreditosTravel(entrada, pais) {
  if (!tieneValorTravel(entrada.diasVigencia)) return '';
  // Con un solo dia salia "un (1) dias calendario contados a partir de su carga".

    ' a partir de su carga';

    ((pais && pais.url_tc_creditos) || '') + '.';

function calcularDerivadosTravel(entrada, pais) {

  valores.URL_TC_TRAVEL = p.travel_url_tc || '';
  valores.POLITICA_PRIVACIDAD_TRAVEL = p.travel_politica_privacidad || '';
  valores.URL_PRIVACIDAD_TRAVEL = p.travel_url_privacidad || '';
  valores.ENTIDAD_VIGILANCIA_TRAVEL = p.travel_entidad_vigilancia || '';

  // Una campana de Travel cubre todo el pais: no hay pregunta de ciudades,

  valores.TEXTO_TERRITORIO = 'el territorio nacional de ' + (p.pais_legal || '');

  valores.TEXTO_DESTINOS_TRAVEL = textoDestinosTravel(datos);
  valores.TEXTO_HOTELES_TRAVEL = textoHotelesTravel(datos);

  var vinetas = vinetasDeCondicionesTravel(datos, p);
  valores.TEXTO_CONDICIONES_TRAVEL = vinetas.length === 0 ? '' : '• ' + vinetas.join('\n• ');

  valores.TEXTO_BENEFICIO_TRAVEL = textoBeneficioTravel(datos, p);
  valores.TEXTO_BASE_CALCULO_TRAVEL = textoBaseCalculoTravel(datos);

  valores.TEXTO_AGOTAMIENTO_VIGENCIA_TRAVEL = textoAgotamientoVigenciaTravel(datos, p);
  valores.TEXTO_LIMITE_CAMPANA_TRAVEL = textoLimiteCampanaTravel(datos, p);
  valores.TEXTO_CONTEO_IDA_REGRESO_TRAVEL = textoConteoIdaRegresoTravel(datos);
  valores.TEXTO_CARGA_TRAVEL = textoCargaTravel(datos);
  valores.TEXTO_VERIFICACION_TRAVEL = textoVerificacionTravel(datos);
  valores.TEXTO_REDENCION_TRAVEL = textoRedencionTravel(datos, p);

  valores.TEXTO_SEGUN_PRODUCTO_TRAVEL = datos.formaDescuento === 'variable' ? ', según el Producto Participante' : '';
  valores.TEXTO_MAXIMO_DISPONIBLE_TRAVEL = textoMaximoDisponibleTravel(datos);
  valores.TEXTO_VISIBILIDAD_TRAVEL = textoVisibilidadTravel(datos);
  valores.TEXTO_ASISTENCIA_TRAVEL = textoAsistenciaTravel(datos);

  valores.TEXTO_VIGENCIA_CREDITOS = textoVigenciaCreditosTravel(datos, p);
  valores.TEXTO_CREDITOS_FUERA_DE_TRAVEL = textoCreditosFueraDeTravel(datos, p);

  // El tope solo aparece en la clausula de topes cuando la campana lo tiene.
  if (datos.formaBeneficio === 'porcentaje' && !datos.sinTope && tieneValorTravel(datos.tope)) {
    valores.TOPE_TRAVEL = cantidadCreditos(datos.tope, p);
  }

  // Tres palabras que cambian entre los dos tipos, para no duplicar el bloque.
  var esDescuento = datos.tipo === 'descuento_travel';
  valores.VERBO_BENEFICIO_TRAVEL = esDescuento ? 'aplicar' : 'acreditar';
  valores.TEXTO_RESPONSABILIDAD_TRAVEL = esDescuento

    : 'la correcta acreditación de los Créditos conforme a las condiciones de la Campaña';
  valores.TEXTO_YA_OTORGADO_TRAVEL = esDescuento
    ? 'los descuentos ya aplicados'
    : 'los Beneficios ya acreditados';

  valores.TEXTO_NOTAS_DE_MODIFICACION = textoNotasDeModificacion(datos, p);

  return valores;
}

 * ampliacion deja constancia con su fecha. Ver docs/MODELO_BASE_TRAVEL.md,
 * seccion 9.
 */
function textoNotasDeModificacion(entrada, pais) {
  var notas = entrada.modificaciones || [];
  if (notas.length === 0) return '';

  var esDescuento = entrada.tipo === 'descuento_travel';
  var cierre = esDescuento ? 'los descuentos ya aplicados se mantienen' : 'los Beneficios ya otorgados se mantienen';
  var parrafos = [];

  for (var i = 0; i < notas.length; i++) {
    var nota = notas[i] || {};
    var cambios = [];

    if (nota.fechaFin) {
      cambios.push('la vigencia de la Campaña se amplía hasta las ' + formatearHoraTravel(nota.horaFin) +
        ' del ' + formatearFecha(nota.fechaFin));
    }
    if (tieneValorTravel(nota.presupuesto)) {
      cambios.push('el presupuesto de la Campaña se amplía a **' + cantidadCreditos(nota.presupuesto, pais) + '**');
    }
    if (tieneValorTravel(nota.maxOrdenes)) {
      cambios.push('el máximo de órdenes con Beneficio se amplía a ' + letrasYCifraFemenino(nota.maxOrdenes));
    }
    if (tieneValorTravel(nota.unidades)) {
      cambios.push('las unidades con descuento se amplían a ' + letrasYCifraFemenino(nota.unidades));
    }
    if (cambios.length === 0) continue;

    parrafos.push(
      '**Modificación del ' + formatearFecha(nota.fecha) + '.** A partir de esta fecha, ' +
      listaY(cambios) + '. Las demás condiciones de la Campaña no cambian y ' + cierre + '.'
    );
  }
  return parrafos.join('\n');
}

}

// --- src/core/documento.js ---
'use strict';

/**
 * Estructura intermedia del documento.
 *
 * Convierte el texto final del motor en una lista de bloques con formato, sin
 * saber nada de Google. El adaptador de Apps Script (src/server/Documento.js)
 * solo traduce esta estructura a llamadas de DocumentApp.
 *
 * Asi la parte dificil (que es texto, que va en negrita, que es vineta) se
 * prueba entera en Node y el adaptador queda tan simple que casi no puede fallar.
 *
 * Bloques: { tipo, partes } donde tipo es titulo, subtitulo, clausula, parrafo
 * o vineta, y partes es [{ texto, negrita }].
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTextoDoc = require('./texto.js');
  var normalizarTexto = moduloTextoDoc.normalizarTexto;
}

/**
 * Parte un texto con marcas ** en tramos con y sin negrita.
 * "a **b** c" -> [{texto:'a ',negrita:false},{texto:'b',negrita:true},{texto:' c',negrita:false}]
 * Un ** sin cerrar se trata como texto normal, para no perder contenido.
 */
function partirEnNegritas(linea) {
  var tramos = String(linea).split('**');
  var partes = [];

  // Con un numero par de marcas queda un tramo impar: el reparto alterna bien.
  var marcasImpares = tramos.length % 2 === 0;

  for (var i = 0; i < tramos.length; i++) {
    var texto = tramos[i];
    if (!texto) continue;
    var negrita = i % 2 === 1;
    if (marcasImpares && i === tramos.length - 1) negrita = false;
    partes.push({ texto: texto, negrita: negrita });
  }

  if (partes.length === 0) partes.push({ texto: '', negrita: false });
  return partes;
}

/** Une tramos contiguos con el mismo formato. */
function unirPartesIguales(partes) {
  var unidas = [];
  for (var i = 0; i < partes.length; i++) {
    var ultima = unidas[unidas.length - 1];
    if (ultima && ultima.negrita === partes[i].negrita) {
      ultima.texto += partes[i].texto;
    } else {
      unidas.push({ texto: partes[i].texto, negrita: partes[i].negrita });
    }
  }
  return unidas;
}

/**
 * Texto final del motor -> lista de bloques.
 * No inventa ni reordena nada: cada linea no vacia produce exactamente un bloque.
 */
function estructuraDelDocumento(texto) {
  var lineas = normalizarTexto(texto).split('\n');
  var bloques = [];

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    if (!linea.trim()) continue;

    var tipo = 'parrafo';
    var contenido = linea;

    if (linea.indexOf('## ') === 0) {
      tipo = 'subtitulo';
      contenido = linea.slice(3);
    } else if (linea.indexOf('# ') === 0) {
      tipo = 'titulo';
      contenido = linea.slice(2);
    } else if (linea.indexOf('• ') === 0) {
      tipo = 'vineta';
      contenido = linea.slice(2);
    } else if (/^\*\*\d+\.\s/.test(linea)) {
      // Clausula numerada: "**1. Titulo.** resto".
      tipo = 'clausula';
    }

    bloques.push({ tipo: tipo, partes: unirPartesIguales(partirEnNegritas(contenido)) });
  }

  return bloques;
}

/** El texto plano de un bloque, sin formato. Sirve para probar y para el correo. */
function textoDelBloque(bloque) {
  var texto = '';
  for (var i = 0; i < bloque.partes.length; i++) {
    texto += bloque.partes[i].texto;
  }
  return texto;
}

/** Titulo del documento: "T&C · {campana} · {pais} · {id}". */
function tituloDelDocumento(nombreCampana, nombrePais, id) {
  return 'T&C · ' + nombreCampana + ' · ' + nombrePais + ' · ' + id;
}

/** Identificador de solicitud con la forma RM-AAAAMMDD-NNNN. */
function identificadorDeSolicitud(fechaIso, consecutivo) {
  var compacta = String(fechaIso || '').replace(/-/g, '');
  var numero = String(Math.trunc(Number(consecutivo) || 0));
  while (numero.length < 4) numero = '0' + numero;
  return 'RM-' + compacta + '-' + numero;
}

if (typeof module !== 'undefined') {
  module.exports = {
    estructuraDelDocumento: estructuraDelDocumento,
    partirEnNegritas: partirEnNegritas,
    textoDelBloque: textoDelBloque,
    tituloDelDocumento: tituloDelDocumento,
    identificadorDeSolicitud: identificadorDeSolicitud,
  };
}

function insertarDespuesDe(campos, id, nuevo) {
  var salida = [];
  for (var i = 0; i < campos.length; i++) {
    salida.push(campos[i]);
    if (campos[i].id === id) salida.push(nuevo);
  }
  return salida;
}

function unir() {
  var todos = [];
  for (var i = 0; i < arguments.length; i++) {
    todos = todos.concat(arguments[i]);
  }
  return todos;
}

 * esta en docs/MODELO_BASE_TRAVEL.md, seccion 4.

 * Travel no tiene "tienda": tiene categorias de la app y, opcionalmente, una
 * marca aliada. Por eso no reusa CAMPOS_TIENDA_Y_ORGANIZADOR.
 */

/** Las categorias marcadas, como lista. */
function categoriasDe(entrada) {
  var valor = (entrada && entrada.categorias) || [];
  return Object.prototype.toString.call(valor) === '[object Array]' ? valor : [];
}

/** true si alguna categoria marcada esta en el grupo. */
function hayGrupoDeTravel(entrada, grupo) {
  if (typeof CATEGORIAS_TRAVEL === 'undefined') return false;
  var delGrupo = (CATEGORIAS_TRAVEL.grupos || {})[grupo] || [];
  var marcadas = categoriasDe(entrada);
  for (var i = 0; i < marcadas.length; i++) {
    if (delGrupo.indexOf(marcadas[i]) !== -1) return true;
  }
  return false;
}

function hayAereasDeTravel(entrada) {
  return hayGrupoDeTravel(entrada, 'aereas');
}

function hayAlojamientoDeTravel(entrada) {
  return hayGrupoDeTravel(entrada, 'alojamiento');
}

  var marcadas = categoriasDe(entrada);

  for (var i = 0; i < marcadas.length; i++) {
    if (conNoches.indexOf(marcadas[i]) !== -1) return true;
