<!--
  Demostración de RappiMind v3, generada con npm run demo.
  Un solo archivo: ábrelo con doble clic, sin instalar nada.
  Lleva el motor real, así que el texto que ves es el que saldría en producción.
  No crea documentos, no manda correos y nada queda guardado.
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RappiMind v3 · demostración</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>

/*
 * RappiMind v3. El sistema completo está en docs/DISENO.md.
 *
 * Una sola superficie elevada en toda la aplicación: la hoja del documento.
 * Todo lo demás se separa con líneas de un pixel.
 */

:root {
  --naranja-marca: #ff441f;
  --naranja-accion: #d32f0f;
  --naranja-presionado: #a82409;
  --tinta: #16181d;
  --gris-lapiz: #5d626d;
  --papel: #ffffff;
  --niebla: #f4f6f8;

  --verde-confirma: #0b7a52;
  --verde-palido: #e6f4ee;
  --rojo-alerta: #c4320a;
  --rojo-palido: #fdece6;
  --rubor: #ffede8;

  --borde: #e2e6eb;
  --borde-control: #767e8c;

  --titulos: 'Poppins', system-ui, -apple-system, sans-serif;
  --cuerpo: 'Lato', system-ui, -apple-system, sans-serif;

  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px;
  --e5: 24px; --e6: 32px; --e7: 48px; --e8: 64px;

  --r-control: 6px;
  --r-panel: 10px;
  --r-hoja: 14px;

  --sombra-hoja: 0 1px 2px rgba(22, 24, 29, 0.05), 0 8px 24px rgba(22, 24, 29, 0.07);

  --t-rapido: 160ms;
  --t-hoja: 220ms;
  --t-destello: 900ms;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--niebla);
  color: var(--tinta);
  font-family: var(--cuerpo);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .marca, button, .opcion-titulo { font-family: var(--titulos); font-weight: 600; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 var(--e3); letter-spacing: -0.015em; }
h2 { font-size: 21px; line-height: 1.3; margin: 0 0 var(--e2); letter-spacing: -0.01em; }
h3 { font-size: 17px; line-height: 1.35; margin: 0 0 var(--e2); }
p { margin: 0 0 var(--e3); }
a { color: var(--naranja-accion); }

:focus-visible {
  outline: 3px solid var(--naranja-marca);
  outline-offset: 2px;
  border-radius: var(--r-control);
}

.oculto { display: none !important; }
.solo-lectores {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* --- Marca y corona ----------------------------------------------------- */

.marca {
  position: relative;
  display: inline-block;
  font-size: 17px;
  color: var(--tinta);
  letter-spacing: -0.01em;
  padding-top: 6px;
}
.marca .corona {
  position: absolute;
  width: 14px; height: 9px;
  top: -2px; left: 40px;
  color: var(--naranja-marca);
}
.marca em { font-style: normal; color: var(--gris-lapiz); font-weight: 500; }

/* --- Estructura --------------------------------------------------------- */

.barra-superior {
  display: flex; align-items: center; gap: var(--e4);
  padding: var(--e3) var(--e5);
  background: var(--papel);
  border-bottom: 1px solid var(--borde);
  position: sticky; top: 0; z-index: 30;
}
.barra-superior nav { margin-left: auto; display: flex; gap: var(--e1); flex-wrap: wrap; }

.enlace-nav {
  font-family: var(--titulos); font-weight: 600; font-size: 14px;
  color: var(--gris-lapiz); background: none; border: 0;
  padding: var(--e2) var(--e3); border-radius: var(--r-control); cursor: pointer;
}
.enlace-nav:hover { background: var(--niebla); color: var(--tinta); }
.enlace-nav[aria-current='page'] { color: var(--tinta); box-shadow: inset 0 -2px 0 var(--naranja-marca); }

.pagina { max-width: 1320px; margin: 0 auto; padding: var(--e6) var(--e5) var(--e8); }
.pagina-angosta { max-width: 760px; }

.dos-columnas {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--e6);
  align-items: start;
}

/* --- Aviso -------------------------------------------------------------- */

.aviso {
  background: var(--rubor);
  border-left: 3px solid var(--naranja-marca);
  border-radius: 0 var(--r-control) var(--r-control) 0;
  padding: var(--e3) var(--e4);
  margin: 0 0 var(--e5);
  font-size: 15px;
}
.aviso h3 { margin-bottom: var(--e1); }
.aviso p:last-child { margin-bottom: 0; }
.aviso-serio { border-left-color: var(--rojo-alerta); }

/* --- Botones ------------------------------------------------------------ */

button { font-size: 15px; cursor: pointer; }

.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e2);
  padding: 13px var(--e5);
  border-radius: var(--r-control);
  border: 1px solid transparent;
  background: var(--naranja-accion);
  color: var(--papel);
  transition: background var(--t-rapido);
}
.boton:hover { background: #b82a0c; }
.boton:active { background: var(--naranja-presionado); }
.boton[disabled] {
  background: var(--borde); color: var(--borde-control);
  cursor: not-allowed; border-color: var(--borde);
}

.boton-secundario {
  background: transparent; color: var(--tinta);
  border-color: var(--borde-control);
}
.boton-secundario:hover { background: var(--niebla); }
.boton-secundario[disabled] { color: var(--borde-control); background: transparent; }

.boton-texto {
  background: none; border: 0; padding: var(--e1) 0;
  color: var(--naranja-accion); font-family: var(--cuerpo); font-size: 14px;
  text-decoration: underline; text-underline-offset: 3px;
}

.fila-botones { display: flex; gap: var(--e3); flex-wrap: wrap; align-items: center; margin-top: var(--e5); }

/* --- Barra de progreso -------------------------------------------------- */

.progreso-compacto { display: none; }

.progreso { display: flex; gap: var(--e1); margin: 0 0 var(--e6); list-style: none; padding: 0; }
.progreso li { flex: 1; min-width: 0; }
.progreso button {
  width: 100%; text-align: left; background: none; border: 0;
  padding: var(--e2) 0 var(--e2);
  border-bottom: 2px solid var(--borde);
  font-family: var(--cuerpo); font-size: 13px; color: var(--gris-lapiz);
  line-height: 1.25; word-break: normal; hyphens: none;
}
.progreso .hecho button { border-bottom-color: var(--naranja-accion); color: var(--tinta); }
.progreso .actual button { border-bottom-color: var(--naranja-marca); color: var(--tinta); font-weight: 700; }
.progreso button[disabled] { cursor: default; }

/* --- Preguntas ---------------------------------------------------------- */

.columna-preguntas { min-width: 0; }

.pregunta { padding: var(--e5) 0; border-bottom: 1px solid var(--borde); }
.pregunta:first-child { padding-top: 0; }
.pregunta:last-child { border-bottom: 0; }

.pregunta-titulo { font-family: var(--titulos); font-weight: 600; font-size: 21px; line-height: 1.3; margin: 0 0 var(--e2); }
.pregunta-ayuda { color: var(--gris-lapiz); font-size: 14px; margin: 0 0 var(--e3); }

.por-que { margin: var(--e2) 0 0; }
.por-que summary {
  color: var(--naranja-accion); font-size: 14px; cursor: pointer;
  list-style: none; display: inline-block; text-decoration: underline; text-underline-offset: 3px;
}
.por-que summary::-webkit-details-marker { display: none; }
.por-que p {
  margin: var(--e2) 0 0; font-size: 14px; color: var(--gris-lapiz);
  border-left: 2px solid var(--borde); padding-left: var(--e3);
}

/* --- Campos ------------------------------------------------------------- */

.campo { display: block; margin: 0 0 var(--e3); }
.campo-caja { position: relative; display: flex; align-items: center; }

input[type='text'], input[type='number'], input[type='date'], input[type='time'], select, textarea {
  width: 100%;
  font-family: var(--cuerpo); font-size: 16px; color: var(--tinta);
  background: var(--papel);
  border: 1px solid var(--borde-control);
  border-radius: var(--r-control);
  padding: 12px var(--e3);
}
input:hover, select:hover, textarea:hover { border-color: var(--gris-lapiz); }
input:focus, select:focus, textarea:focus { border-color: var(--naranja-marca); }
input[disabled], select[disabled] { background: var(--niebla); color: var(--borde-control); cursor: not-allowed; }

.con-moneda input { padding-left: 34px; }
.simbolo-moneda {
  position: absolute; left: var(--e3); color: var(--gris-lapiz); font-size: 16px; pointer-events: none;
}

.campo-error input, .campo-error select { border-color: var(--rojo-alerta); }
.mensaje-error { color: var(--rojo-alerta); font-size: 14px; margin: var(--e2) 0 0; display: flex; gap: var(--e2); }
.mensaje-ok { color: var(--verde-confirma); font-size: 14px; margin: var(--e2) 0 0; display: flex; gap: var(--e2); align-items: center; }

.asi-queda {
  margin: var(--e3) 0 0; padding: var(--e3);
  background: var(--niebla); border-radius: var(--r-control);
  font-size: 14px;
}
.asi-queda .etiqueta { display: block; color: var(--gris-lapiz); font-size: 13px; font-weight: 700; margin-bottom: var(--e1); }
.asi-queda .frase { color: var(--tinta); }

/* --- Opciones grandes --------------------------------------------------- */

.opciones { display: grid; gap: var(--e2); margin: 0; padding: 0; border: 0; }
.opciones legend { padding: 0; }

.opcion {
  display: block; width: 100%; text-align: left;
  border: 1px solid var(--borde-control); border-radius: var(--r-control);
  background: var(--papel); padding: var(--e3) var(--e4);
  font-family: var(--cuerpo); font-size: 15px; color: var(--tinta);
  transition: border-color var(--t-rapido), background var(--t-rapido);
}
.opcion:hover:not([disabled]) { border-color: var(--gris-lapiz); }
.opcion[aria-pressed='true'], .opcion.elegida {
  border: 2px solid var(--naranja-marca); background: var(--rubor); padding: 11px 15px;
}
.opcion[disabled] { opacity: 0.55; cursor: not-allowed; }
.opcion-titulo { display: block; font-size: 15px; }
.opcion-nota { display: block; color: var(--gris-lapiz); font-size: 13px; margin-top: 2px; }
.opcion[disabled] .opcion-nota { color: var(--rojo-alerta); }

.casillas { display: grid; gap: var(--e2); border: 0; padding: 0; margin: 0; }
.casilla { display: flex; gap: var(--e3); align-items: flex-start; cursor: pointer; padding: var(--e2) 0; }
.casilla input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--naranja-accion); flex: none; }
.casilla span { font-size: 15px; }
.casilla small { display: block; color: var(--gris-lapiz); font-size: 13px; }

.sugerencias { display: flex; flex-wrap: wrap; gap: var(--e2); margin: var(--e2) 0 0; }
.sugerencia {
  border: 1px solid var(--borde-control); background: var(--papel);
  border-radius: 999px; padding: 5px var(--e3); font-size: 13px; font-family: var(--cuerpo);
}
.sugerencia:hover { background: var(--rubor); border-color: var(--naranja-marca); }

/* --- Glosario ----------------------------------------------------------- */

.glosario {
  border-bottom: 1px dotted var(--gris-lapiz); cursor: help;
  background: none; border-top: 0; border-left: 0; border-right: 0;
  font: inherit; color: inherit; padding: 0;
}
.glosario-panel {
  position: absolute; z-index: 50; max-width: 260px;
  background: var(--tinta); color: var(--papel);
  padding: var(--e3); border-radius: var(--r-control);
  font-size: 13px; line-height: 1.45;
  box-shadow: 0 6px 20px rgba(22, 24, 29, 0.25);
}
.glosario-panel strong { display: block; margin-bottom: var(--e1); }

/* --- La hoja del documento ---------------------------------------------- */

.columna-documento { position: sticky; top: 84px; min-width: 0; }
.documento-encabezado { display: flex; align-items: baseline; gap: var(--e3); margin-bottom: var(--e3); }
.documento-encabezado h2 { margin: 0; font-size: 17px; }
.documento-encabezado .cuenta { color: var(--gris-lapiz); font-size: 13px; margin-left: auto; }

.hoja {
  background: var(--papel);
  border: 1px solid var(--borde);
  border-radius: var(--r-hoja);
  box-shadow: var(--sombra-hoja);
  padding: var(--e6) var(--e6) var(--e7);
  min-height: 260px;
  max-height: calc(100vh - 160px);
  overflow-y: auto;
  scroll-behavior: smooth;
  font-size: 15px;
  line-height: 1.65;
}

.hoja .doc-titulo { font-family: var(--titulos); font-size: 17px; text-align: center; margin: 0 0 var(--e2); }
.hoja .doc-subtitulo { font-family: var(--titulos); font-size: 15px; text-align: center; margin: 0 0 var(--e5); }
.hoja .doc-parrafo { margin: 0 0 var(--e3); text-align: justify; }
.hoja .doc-clausula { margin: 0 0 var(--e3); text-align: justify; }
.hoja .doc-vineta { margin: 0 0 var(--e2) var(--e4); position: relative; text-align: justify; }
.hoja .doc-vineta::before { content: '\2022'; position: absolute; left: -14px; color: var(--gris-lapiz); }

.hoja mark {
  background: var(--rubor); color: inherit; border-radius: 3px; padding: 0 2px;
  animation: destello var(--t-destello) ease-out forwards;
}
@keyframes destello {
  0% { background: #ffd2c4; }
  100% { background: transparent; }
}

.falta {
  display: inline; color: var(--gris-lapiz);
  border-bottom: 2px dotted var(--borde-control);
  background: var(--niebla); border-radius: 3px; padding: 0 4px;
  font-size: 13px;
}

.hoja-vacia {
  color: var(--gris-lapiz); text-align: center;
  padding: var(--e7) var(--e4); max-width: 34ch; margin: 0 auto;
}

/* --- Resumen ------------------------------------------------------------ */

.ficha { border: 1px solid var(--borde); border-radius: var(--r-panel); background: var(--papel); }
.ficha-seccion { padding: var(--e4); border-bottom: 1px solid var(--borde); }
.ficha-seccion:last-child { border-bottom: 0; }
.ficha-encabezado { display: flex; align-items: baseline; gap: var(--e3); margin-bottom: var(--e2); }
.ficha-encabezado h3 { margin: 0; }
.ficha-encabezado button { margin-left: auto; }
.ficha dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--e2) var(--e5); margin: 0; }
.ficha dt { color: var(--gris-lapiz); font-size: 14px; }
.ficha dd { margin: 0; font-size: 14px; }

.te-falta { margin: var(--e4) 0 0; padding: 0 0 0 var(--e4); }
.te-falta li { color: var(--rojo-alerta); font-size: 14px; margin-bottom: var(--e1); }

/* --- Tablas de historial y administración ------------------------------- */

.tabla { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--papel); }
.tabla th, .tabla td { text-align: left; padding: var(--e3); border-bottom: 1px solid var(--borde); }
.tabla th { font-family: var(--titulos); font-weight: 600; font-size: 13px; color: var(--gris-lapiz); }
.tabla tr:last-child td { border-bottom: 0; }
.envoltorio-tabla { border: 1px solid var(--borde); border-radius: var(--r-panel); overflow: auto; }

.estado { display: inline-flex; align-items: center; gap: var(--e1); font-size: 13px; font-weight: 700; }
.estado-generado { color: var(--gris-lapiz); }
.estado-publicado { color: var(--verde-confirma); }

.punto { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }

/* --- Hoja deslizable del celular ---------------------------------------- */

.boton-flotante { display: none; }

.cortina {
  position: fixed; inset: 0; background: rgba(22, 24, 29, 0.35);
  z-index: 40; opacity: 0; pointer-events: none; transition: opacity var(--t-hoja);
}
.cortina.abierta { opacity: 1; pointer-events: auto; }

.hoja-deslizable {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  background: var(--papel);
  border-radius: var(--r-hoja) var(--r-hoja) 0 0;
  max-height: 86vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform var(--t-hoja);
}
.hoja-deslizable.abierta { transform: translateY(0); }
.asa { width: 36px; height: 4px; border-radius: 2px; background: var(--borde); margin: var(--e3) auto; flex: none; }

/* --- Pantalla final ------------------------------------------------------ */

.pasos-publicar { counter-reset: paso; list-style: none; padding: 0; margin: var(--e4) 0 0; }
.pasos-publicar li { counter-increment: paso; position: relative; padding: 0 0 var(--e5) var(--e6); }
.pasos-publicar li::before {
  content: counter(paso); position: absolute; left: 0; top: 0;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--rubor); color: var(--naranja-accion);
  font-family: var(--titulos); font-weight: 600; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.captura {
  margin: var(--e3) 0 0; padding: var(--e5) var(--e4);
  border: 1px dashed var(--borde-control); border-radius: var(--r-control);
  color: var(--gris-lapiz); font-size: 13px; text-align: center; background: var(--niebla);
}

/* --- Celular ------------------------------------------------------------ */

@media (max-width: 900px) {
  .pagina { padding: var(--e5) var(--e4) 96px; }
  .dos-columnas { grid-template-columns: 1fr; gap: var(--e5); }
  .columna-documento { display: none; }
  h1 { font-size: 23px; }
  .pregunta-titulo { font-size: 19px; }
  .progreso { display: none; }
  .progreso-compacto {
    display: block; margin: 0 0 var(--e5); font-size: 14px; color: var(--gris-lapiz);
  }
  .progreso-compacto strong { color: var(--tinta); font-family: var(--titulos); font-weight: 600; }
  .progreso-linea {
    display: block; height: 2px; margin-top: var(--e2);
    background: var(--borde); border-radius: 1px; position: relative;
  }
  .progreso-linea::before {
    content: ''; position: absolute; inset: 0 auto 0 0;
    width: var(--avance); background: var(--naranja-marca); border-radius: 1px;
  }

  .barra-superior { padding: var(--e2) var(--e4); gap: var(--e3); }
  .marca { font-size: 15px; white-space: nowrap; flex: none; }
  .marca .corona { width: 11px; left: 36px; }
  .barra-superior nav {
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .barra-superior nav::-webkit-scrollbar { display: none; }
  .enlace-nav { white-space: nowrap; padding: var(--e2); font-size: 13px; }

  .boton-flotante {
    display: flex; align-items: center; justify-content: center; gap: var(--e2);
    position: fixed; left: var(--e4); right: var(--e4); bottom: var(--e4); z-index: 35;
    padding: 14px; border-radius: var(--r-control); border: 0;
    background: var(--tinta); color: var(--papel);
    font-family: var(--titulos); font-weight: 600; font-size: 15px;
  }
  .hoja { max-height: none; border: 0; box-shadow: none; border-radius: 0; padding: var(--e4) var(--e5) var(--e6); }
  .ficha dl { grid-template-columns: 1fr; gap: var(--e1); }
  .ficha dd { margin-bottom: var(--e2); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  /* Sin animación, el destello se queda como borde fijo hasta el próximo cambio. */
  .hoja mark { background: var(--rubor); outline: 2px solid var(--naranja-marca); outline-offset: 1px; }
}


</style>

var module = { exports: {} };

var MODELOS = {

    "carrera_compras": "%% Modelo: Carrera de Compras (concurso mayor comprador) · versión 3.0 · base: modelo v2 y decisiones de Legal CO (julio 2026) · revisar en punto de control A\n# TÉRMINOS Y CONDICIONES\n## {{NOMBRE_CAMPANA_MAYUS}}\nPor medio del presente documento se dan a conocer los términos y condiciones de la campaña promocional denominada “**{{NOMBRE_CAMPANA}}**”, estructurada bajo la modalidad de concurso por carrera de compras. La participación en esta campaña implica la aceptación total de los presentes Términos y Condiciones. Los ganadores se determinan exclusivamente con base en un criterio objetivo, medible y verificable de compras efectivamente realizadas durante la vigencia, y en ningún caso por sorteo, rifa, azar o cualquier otro mecanismo de suerte.\n[[INCLUIR:organizador]]\n[[INCLUIR:cobertura_tienda]]\n§ Vigencia. La Campaña estará vigente desde las **{{HORA_INICIO}}** del **{{FECHA_INICIO}}** hasta las **{{HORA_FIN}}** del **{{FECHA_FIN}}** ({{TEXTO_HORA_LOCAL}}). Únicamente los pedidos realizados y recibidos de manera exitosa dentro de este periodo se tendrán en cuenta para el concurso.\n§ Quiénes pueden participar. {{TEXTO_SEGMENTO}} Además, cada participante debe:\n• Ser {{TEXTO_PERSONA}} y tener al menos {{EDAD_MINIMA}} de edad.\n• Tener una cuenta activa en la Plataforma Rappi.\n• Cumplir la mecánica descrita en los presentes Términos y Condiciones.\nLa participación es gratuita y no exige pago alguno por concepto de inscripción.\n§ Productos participantes. {{TEXTO_PRODUCTOS}} Los productos son ofrecidos y comercializados directamente por los Aliados Comerciales.\n§ Mecánica del concurso. Para participar debes:\n• Realizar uno o más pedidos de Productos Participantes en la Tienda Participante a través de la Plataforma Rappi durante la vigencia de la Campaña.\n• Recibir los pedidos de manera exitosa, sin cancelaciones totales ni parciales.\n• Pagar los pedidos con un medio de pago válido para la Campaña.\n{{TEXTO_METODO_PAGO}}\n{{TEXTO_UMBRAL}}\nEl concurso consiste en acumular {{CRITERIO_GANADOR}} durante la vigencia de la Campaña. Los pedidos cancelados total o parcialmente, ya sea por el Usuario/Consumidor, por el Aliado Comercial o por el Repartidor Independiente, no suman al acumulado.\n§ Selección de ganadores y desempate. Al finalizar la vigencia se elaborará un ranking de participantes con base en el criterio anterior. {{FRASE_GANADORES}} {{TEXTO_DESEMPATE}}\nAntes de declarar a los ganadores, Rappi verificará la elegibilidad de cada participante y de cada pedido. Si la verificación determina que un participante o sus pedidos no cumplen las condiciones de la Campaña, dicho participante no será considerado ganador y se le informará a través de la Plataforma Rappi.\n§ Premio. {{LISTA_PREMIOS}} El premio es personal e intransferible y no podrá canjearse por dinero en efectivo ni por otros bienes o servicios. La cantidad de premios es limitada y corresponde a la indicada en esta cláusula.\n§ Naturaleza del premio. {{TEXTO_NATURALEZA_PREMIO}}\n§ Notificación, aceptación y entrega del premio.\n• **Notificación:** Rappi contactará a cada ganador mediante {{MEDIO_NOTIFICACION}}, a más tardar el **{{FECHA_NOTIFICACION}}**.\n• **Aceptación:** el ganador deberá aceptar el premio y confirmar sus datos, y su dirección de entrega cuando corresponda, dentro de los **{{PLAZO_CONFIRMACION}}** siguientes a la notificación. Si Rappi no logra contactarlo tras intentos razonables, o si no acepta el premio o no confirma sus datos dentro de ese plazo, el premio podrá asignarse al siguiente participante del ranking, de forma sucesiva.\n• **Entrega:** {{TEXTO_ENTREGA}}\n§ Exclusiones. No suman al acumulado del concurso:\n• Los pedidos cancelados, devueltos o que no se completen exitosamente por cualquier causa.\n• Los pedidos pagados con medios de pago diferentes a los aplicables para la Campaña.\n• Los pedidos realizados fuera de la vigencia de la Campaña.\n• El valor de propinas, costos de envío, tarifas de servicio e impuestos.\n§ Impuestos. Los impuestos que se generen con ocasión del premio estarán a cargo de quien corresponda conforme a la legislación tributaria aplicable. Cuando haya lugar a retenciones o tributos a cargo del ganador, estos se aplicarán en los términos de la ley.\n[[INCLUIR:publicidad]]\n[[INCLUIR:atencion]]\n[[INCLUIR:modificaciones]]\n[[INCLUIR:fraude]]\n[[INCLUIR:tyc_plataforma]]\n[[INCLUIR:responsabilidad]]\n§ Responsabilidades frente al premio. Rappi no será responsable por la existencia, calidad, idoneidad o entrega del premio cuando la entrega esté a cargo del Organizador. Rappi es responsable de: (i) la aplicación del criterio de selección de ganadores con base en la información transaccional de la Plataforma Rappi; (ii) la publicación veraz y completa de los presentes Términos y Condiciones; y (iii) la atención oportuna de tus peticiones, quejas y reclamos relacionados con la Campaña.\n[[INCLUIR:datos]]\n[[?TEXTO_DATOS_ENTREGA]]{{TEXTO_DATOS_ENTREGA}}[[/?]]\n[[INCLUIR:ley]]\n",
    "cashback": "%% Modelo: Cashback (una tienda) · versión 3.0 · base: modelo aprobado por Legal CO (julio 2026) · revisar en punto de control A\n# TÉRMINOS Y CONDICIONES\n## {{NOMBRE_CAMPANA_MAYUS}}\n[[INCLUIR:organizador]]\n[[INCLUIR:cobertura_tienda]]\n§ Vigencia. La Campaña estará vigente desde las **{{HORA_INICIO}}** del **{{FECHA_INICIO}}** hasta las **{{HORA_FIN}}** del **{{FECHA_FIN}}** ({{TEXTO_HORA_LOCAL}}), o hasta agotar el presupuesto disponible de **{{PRESUPUESTO}}**, lo que ocurra primero. Los pedidos realizados fuera de la vigencia no darán lugar al beneficio de la Campaña.\n[[INCLUIR:usuarios_beneficio]]\n§ Tienda y productos participantes. La Campaña aplica exclusivamente para pedidos de productos del catálogo de la Tienda Participante, realizados a través de la Plataforma Rappi.\n§ Mecánica y beneficio. Para obtener el beneficio de la Campaña (en adelante, el “Beneficio”) debes:\n• Realizar un pedido en la Tienda Participante a través de la Plataforma Rappi durante la vigencia de la Campaña.\n• Recibir el pedido de manera exitosa, sin que haya sido cancelado.\n• Realizar el pago del pedido con un medio de pago válido para la Campaña.\n{{TEXTO_METODO_PAGO}}\n[[?TEXTO_MINIMO_COMPRA]]{{TEXTO_MINIMO_COMPRA}}[[/?]]\n[[?TEXTO_CONDICIONES]]{{TEXTO_CONDICIONES}}[[/?]]\nEl Beneficio consiste en el **{{PORCENTAJE}}** del valor de tu pedido, acreditado como Créditos en tu Billetera de Créditos, sin que puedas recibir más de **{{TOPE}}** por pedido. El valor sobre el cual se calcula el Beneficio corresponde exclusivamente al precio de los productos adquiridos, sin incluir el costo de envío, la tarifa de servicio ni las propinas.\n§ Topes y límites.\n• **Tope por pedido:** el Beneficio máximo por cada pedido es de **{{TOPE}}**.\n• **Máximo de pedidos:** {{TEXTO_LIMITE_PEDIDOS}}\n• **Presupuesto total:** la Campaña tiene un presupuesto total de **{{PRESUPUESTO}}**. Una vez agotado, la Campaña finalizará automáticamente, aunque no haya terminado su vigencia.\n[ ia no darán lugar al beneficio de la Campaña.\n[[INCLUIR:usuarios_beneficio]]\n§ Tiendas participantes. La Campaña aplica exclusivamente para pedidos de productos del catálogo de las siguientes Tiendas Participantes, realizados a través de la Plataforma Rappi:\n[[#TIENDAS]]\n• {{TIENDA_MARCA}}\n[[/TIENDAS]]\n§ Mecánica y beneficio. Para obtener el beneficio de la Campaña (en adelante, el “Beneficio”) debes:\n• Realizar un pedido en una Tienda Participante a través de la Plataforma Rappi durante la vigencia de la Campaña.\n• Recibir el pedido de manera exitosa, sin que haya sido cancelado.\n• Realizar el pago del pedido con un medio de pago válido para la Campaña.\n{{TEXTO_METODO_PAGO}}\n[[?TEXTO_MINIMO_COMPRA]]{{TEXTO_MINIMO_COMPRA}}[[/?]]\n[[?TEXTO_CONDICIONES]]{{TEXTO_CONDICIONES}}[[/?]]\nEl Beneficio consiste en el **{{PORCENTAJE}}** del valor de tu pedido, acreditado como Créditos en tu Billetera de Créditos, sin que puedas recibir más de **{{TOPE}}** por pedido. El valor sobre el cual se calcula el Beneficio corresponde exclusivamente al precio de los productos adquiridos, sin incluir el costo de envío, la tarifa de servicio ni las propinas.\n§ Existencias por Tienda Participante. Cada Tienda Participante cuenta con el siguiente presupuesto para la Campaña (en adelante, las “Existencias”). Una vez agotadas las Existencias de una Tienda Participante, la Campaña finalizará automáticamente respecto de esa tienda, aunque no haya terminado su vigencia:\n[[#TIENDAS]]\n• **{{TIENDA_MARCA}}** ({{TIENDA_CIUDADES}}): {{TIENDA_PRESUPUESTO}}\n[[/TIENDAS]]\n§ Topes y límites.\n• **Tope por pedido:** el Beneficio máximo por cada pedido es de **{{TOPE}}**.\n• **Máximo de pedidos:** {{TEXTO_LIMITE_PEDIDOS}}\n[[INCLUIR:acreditacion]]\n[[INCLUIR:naturaleza_creditos]]\n[[INCLUIR:vigencia_creditos]]\n[[INCLUIR:exclusiones_beneficio]]\n[[INCLUIR:publicidad]]\n[[INCLUIR:atencion]]\n[[INCLUIR:modificaciones]]\n[[INCLUIR:fraude]]\n[[INCLUIR:tyc_plataforma]]\n[[INCLUIR:responsabilidad]  * Todo dato del usuario se escapa antes de entrar al HTML.
 */

/** Escapa lo que va dentro del HTML. Nunca se inserta texto del usuario sin esto. */
function escaparHtml(valor) {
  return String(valor === null || valor === undefined ? '' : valor)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/** Escapa lo que va dentro de un atributo href. Solo se aceptan http y https. */
function urlSegura(valor) {
  var texto = String(valor === null || valor === undefined ? '' : valor).trim();
  if (!/^https?:\/\//i.test(texto)) return '';
  return escaparHtml(texto);
}

function tieneValor(valor) {
  return valor !== null && valor !== undefined && valor !== '';

/** FRAGMENTO: territorio de la campana. */
function textoTerritorio(entrada, pais) {
  if (entrada.alcance === 'Nacional') {
    return 'el territorio nacional de ' + pais.pais_legal;
  }
  var ciudades = separarPorComas(entrada.ciudades);
  if (ciudades.length === 0) return '';
  var encabezado = ciudades.length === 1 ? 'la ciudad de ' + ciudades[0] : 'las ciudades de ' + listaY(ciudades);
  return encabezado + ', en ' + pais.pais_legal;
}

/** ORACION: quien puede participar. */
function textoSegmento(entrada) {
  if (entrada.segmento === 'reactivados') {
    var dias = Number(entrada.diasSinCompra);
    if (!dias) return '';
    return (
      'Pueden participar únicamente los Usuarios/Consumidores mayores de edad que no hayan realizado pedidos ' +
      'en la Plataforma Rappi durante los ' + letrasYCifra(dias) + ' días anteriores al inicio de la Campaña.'
    );
  }
  return TEXTO_SEGMENTO_POR_OPCION[entrada.segmento] || '';
}

/** ORACION: maximo de pedidos con beneficio. */
function textoLimitePedidos(entrada) {
  if (entrada.sinLimite) {
    return 'La Campaña no establece un número máximo de pedidos con Beneficio por Usuario/Consumidor, sin perjuicio del presupuesto disponible.';
  }
  var maximo = Number(entrada.maxPedidos);
  if (!maximo) return '';
  var sustantivo = maximo === 1 ? 'pedido' : 'pedidos';
  return (
    'Puedes obtener el Beneficio en un máximo de ' + letrasYCifra(maximo) + ' ' + sustantivo +
    ' durante la vigencia de la Campaña; los pedidos adicionales no generarán el Beneficio y se procesarán como pedidos regulares.'
  );
}

/** FRAGMENTO: cuando se cargan los Creditos. */
function textoCarga(entrada) {
  var fijo = TEXTO_CARGA_POR_OPCION[entrada.carga];
  if (fijo) return fijo;
  if (entrada.carga === 'fecha' && entrada.fechaCarga) {
    return 'el ' + formatearFecha(entrada.fechaCarga);
  }
  return '';
}

/** FRAGMENTO: hasta cuando sirven los Creditos. */
function textoVigenciaCreditos(entrada, pais) {
  if (entrada.vigencia === 'dias') {
    var dias = Number(entrada.diasVigencia);
    if (!dias) return '';
    return 'tendrán una vigencia de ' + letrasYCifra(dias) + ' ' + pais.termino_dias + ' contados a partir de su carga';
  }
  if (entrada.vigencia === 'fecha' && entrada.fechaFinRedencion) {

function textoLugarRedencion(entrada) {

  if (fijo) return fijo;
  if (entrada.redencion !== 'secciones') return '';

  var secciones = entrada.secciones || [];
  if (secciones.length === 0) return '';

  for (var i = 0; i < secciones.length; i++) {

 * Calcula todos los valores del documento a partir de la entrada y del pais.

function calcularDerivados(entrada, pais) {
  var valores = {};

  valores.NOMBRE_CAMPANA = entrada.nombreCampana || '';
  valores.NOMBRE_CAMPANA_MAYUS = valores.NOMBRE_CAMPANA.toUpperCase();

  valores.HORA_INICIO = entrada.horaInicio ? formatearHora(entrada.horaInicio) : '';
  valores.HORA_FIN = entrada.horaFin ? formatearHora(entrada.horaFin) : '';

  valores.ORGANIZADOR = entrada.organizadorRazonSocial || '';
  if (tieneValor(entrada.organizadorId)) {
    var identificacion = validarIdentificacion(pais.codigo, entrada.organizadorId);
    valores.ID_ORGANIZADOR = identificacion.valido ? identificacion.formateado : '';
  } else {
    valores.ID_ORGANIZADOR = '';
  }

  valores.TEXTO_SEGMENTO = textoSegmento(entrada);
  valores.TEXTO_METODO_PAGO = TEXTO_METODO_PAGO_POR_OPCION[entrada.metodoPago] || '';

  valores.TEXTO_MINIMO_COMPRA = tieneValor(entrada.compraMinima)
    ? 'Para acceder al Beneficio, el valor de los productos de tu pedido deberá ser igual o superior a ' +
      montoConMoneda(entrada.compraMinima, pais) +

    : '';

  valores.TEXTO_LIMITE_PEDIDOS = textoLimitePedidos(entrada);

  var frases = [];
  for (var i = 0; i < condiciones.length; i++) {

    if (frase) frases.push(frase);
  }

  if (tieneValor(entrada.presupuesto)) valores.PRESUPUESTO = cantidadCreditos(entrada.presupuesto, pais);

'use strict';

/**
 * Estructura intermedia del documento.
 *
 * Convierte el texto final del motor en una lista de bloques con formato, sin
 * saber nada de Google. El adaptador de Apps Script (src/server/Documento.js)
 * solo traduce esta estructura a llamadas de DocumentApp.
 *
 * Asi la parte dificil (que es texto, que va en negrita, que es vineta) se
 * prueba entera en Node y el adaptador queda tan simple que casi no puede fallar.
 *
 * Bloques: { tipo, partes } donde tipo es titulo, subtitulo, clausula, parrafo
 * o vineta, y partes es [{ texto, negrita }].
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTextoDoc = require('./texto.js');
  var normalizarTexto = moduloTextoDoc.normalizarTexto;
}

/**
 * Parte un texto con marcas ** en tramos con y sin negrita.
 * "a **b** c" -> [{texto:'a ',negrita:false},{texto:'b',negrita:true},{texto:' c',negrita:false}]
 * Un ** sin cerrar se trata como texto normal, para no perder contenido.
 */
function partirEnNegritas(linea) {
  var tramos = String(linea).split('**');
  var partes = [];

  // Con un numero par de marcas queda un tramo impar: el reparto alterna bien.
  var marcasImpares = tramos.length % 2 === 0;

  for (var i = 0; i < tramos.length; i++) {
    var texto = tramos[i];
    if (!texto) continue;
    var negrita = i % 2 === 1;
    if (marcasImpares && i === tramos.length - 1) negrita = false;
    partes.push({ texto: texto, negrita: negrita });
  }

  if (partes.length === 0) partes.push({ texto: '', negrita: false });
  return partes;
}

/** Une tramos contiguos con el mismo formato. */
function unirPartesIguales(partes) {
  var unidas = [];
  for (var i = 0; i < partes.length; i++) {
    var ultima = unidas[unidas.length - 1];
    if (ultima && ultima.negrita === partes[i].negrita) {
      ultima.texto += partes[i].texto;
    } else {
      unidas.push({ texto: partes[i].texto, negrita: partes[i].negrita });
    }
  }
  return unidas;
}

/**
 * Texto final del motor -> lista de bloques.
 * No inventa ni reordena nada: cada linea no vacia produce exactamente un bloque.
 */
function estructuraDelDocumento(texto) {
  var lineas = normalizarTexto(texto).split('\n');
  var bloques = [];

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    if (!linea.trim()) continue;

    var tipo = 'parrafo';
    var contenido = linea;

    if (linea.indexOf('## ') === 0) {
      tipo = 'subtitulo';
      contenido = linea.slice(3);
    } else if (linea.indexOf('# ') === 0) {
      tipo = 'titulo';
      contenido = linea.slice(2);
    } else if (linea.indexOf('• ') === 0) {
      tipo = 'vineta';
      contenido = linea.slice(2);
    } else if (/^\*\*\d+\.\s/.test(linea)) {
      // Clausula numerada: "**1. Titulo.** resto".
      tipo = 'clausula';
    }

    bloques.push({ tipo: tipo, partes: unirPartesIguales(partirEnNegritas(contenido)) });
  }

  return bloques;
}

/** El texto plano de un bloque, sin formato. Sirve para probar y para el correo. */
function textoDelBloque(bloque) {
  var texto = '';
  for (var i = 0; i < bloque.partes.length; i++) {
    texto += bloque.partes[i].texto;
  }
  return texto;
}

/** Titulo del documento: "T&C · {campana} · {pais} · {id}". */
function tituloDelDocumento(nombreCampana, nombrePais, id) {
  return 'T&C · ' + nombreCampana + ' · ' + nombrePais + ' · ' + id;
}

/** Identificador de solicitud con la forma RM-AAAAMMDD-NNNN. */
function identificadorDeSolicitud(fechaIso, consecutivo) {
  var compacta = String(fechaIso || '').replace(/-/g, '');
  var numero = String(Math.trunc(Number(consecutivo) || 0));
  while (numero.length < 4) numero = '0' + numero;
  return 'RM-' + compacta + '-' + numero;
}

if (typeof module !== 'undefined') {
  module.exports = {
    estructuraDelDocumento: estructuraDelDocumento,
    partirEnNegritas: partirEnNegritas,
    textoDelBloque: textoDelBloque,
    tituloDelDocumento: tituloDelDocumento,
    identificadorDeSolicitud: identificadorDeSolicitud,
  };
}

'use strict';

/**
 * Fechas, horas y listas en espanol.
 *
 * Las fechas se manejan como texto ISO (AAAA-MM-DD) y nunca como objetos Date:
 * asi no dependen de la zona horaria del servidor ni del navegador, que es la
 * causa clasica de que un documento salga con un dia de diferencia.
 */

var MESES = [
  'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
  'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',
];

/** Descompone una fecha ISO. Devuelve null si no tiene forma valida. */
function partesDeFecha(iso) {
  var encontrado = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
  if (!encontrado) return null;
  var anio = Number(encontrado[1]);
  var mes = Number(encontrado[2]);
  var dia = Number(encontrado[3]);
  if (mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
  // Rechaza 31 de abril o 30 de febrero.
  var diasPorMes = [31, esBisiesto(anio) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  if (dia > diasPorMes[mes - 1]) return null;
  return { anio: anio, mes: mes, dia: dia };
}

function esBisiesto(anio) {
  return (anio % 4 === 0 && anio % 100 !== 0) || anio % 400 === 0;
}

/** "2026-09-17" -> "17 de septiembre de 2026". */
function formatearFecha(iso) {
  var p = partesDeFecha(iso);
  if (!p) return '';
  return p.dia + ' de ' + MESES[p.mes - 1] + ' de ' + p.anio;
}

/** Descompone una hora HH:MM. Devuelve null si no es valida. */
function partesDeHora(texto) {
  var encontrado = /^(\d{1,2}):(\d{2})$/.exec(String(texto || '').trim());
  if (!encontrado) return null;
  var hora = Number(encontrado[1]);
  var minuto = Number(encontrado[2]);
  if (hora > 23 || minuto > 59) return null;
  return { hora: hora, minuto: minuto };
}

/** "09:00" -> "9:00 a. m."; "23:59" -> "11:59 p. m."; "12:00" -> "12:00 p. m.". */
function formatearHora(texto) {
  var p = partesDeHora(texto);
  if (!p) return '';
  var sufijo = p.hora < 12 ? 'a. m.' : 'p. m.';
  var hora12 = p.hora % 12 || 12;
  return hora12 + ':' + (p.minuto < 10 ? '0' + p.minuto : String(p.minuto)) + ' ' + sufijo;
}

/** Comparable para ordenar y comparar fechas ISO sin usar Date. */
function comoNumeroFecha(iso) {
  var p = partesDeFecha(iso);
  if (!p) return null;
  return p.anio * 10000 + p.mes * 100 + p.dia;
}

/** Comparable para fecha + hora juntas. */
function comoNumeroFechaHora(iso, hora) {
  var f = comoNumeroFecha(iso);
  var h = partesDeHora(hora);
  if (f === null || !h) return null;
  return f * 10000 + h.hora * 100 + h.minuto;
}

/** "a", "a y b", "a, b y c". */
function listaY(elementos) {
  var limpios = [];
  for (var i = 0; i < elementos.length; i++) {
    var elemento = String(elementos[i]).trim();
    if (elemento) limpios.push(elemento);
  }
  if (limpios.length === 0) return '';
  if (limpios.length === 1) return limpios[0];
  return limpios.slice(0, -1).join(', ') + ' y ' + limpios[limpios.length - 1];
}

/** Separa un texto con comas en una lista limpia. */
function separarPorComas(texto) {
  var partes = String(texto || '').split(',');
  var limpias = [];
  for (var i = 0; i < partes.length; i++) {
    var parte = partes[i].trim();
    if (parte) limpias.push(parte);
  }
  return limpias;
}

if (typeof module !== 'undefined') {
  module.exports = {
    MESES: MESES,
    partesDeFecha: partesDeFecha,
    partesDeHora: partesDeHora,
    formatearFecha: formatearFecha,
    formatearHora: formatearHora,
    comoNumeroFecha: comoNumeroFecha,
    comoNumeroFechaHora: comoNumeroFechaHora,
    listaY: listaY,
    separarPorComas: separarPorComas,
  };
}

'use strict';

/**
 * Punto de entrada del motor: valida y, solo si todo esta bien, renderiza.
 *
 * Es lo unico que necesita llamar el servidor (Apps Script) o la vista previa
 * del navegador. Si algo falta, devuelve la lista de errores y ningun texto:
 * el documento no se crea a medias.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloEsquemas = require('./esquemas.js');
  var esquemaDe = moduloEsquemas.esquemaDe;

  var moduloValidaciones = require('./validaciones.js');
  var validarSolicitud = moduloValidaciones.validarSolicitud;

  var moduloMotor = require('./motor.js');
  var renderizar = moduloMotor.renderizar;
}

/**
 * entrada   hechos del formulario
 * pais      fila de data/paises.json
 * modelos   { modelos, bloques } (en Apps Script, la constante MODELOS)
 * contexto  { fechaReferencia, usuarioEnEquipo }
 *
 * Devuelve { valido, errores: [{campo, mensaje}], texto }.
 */
function generarTexto(entrada, pais, modelos, contexto) {
  var revision = validarSolicitud(entrada, pais, contexto);
  if (!revision.valido) {
    return { valido: false, errores: revision.errores, texto: '' };
  }

  var esquema = esquemaDe(entrada.tipo);
  var render = renderizar(esquema.modelo, entrada, pais, modelos);

  if (render.errores.length > 0) {
    var errores = [];
    for (var i = 0; i < render.errores.length; i++) {
      errores.push({ campo: 'documento', mensaje: render.errores[i] });
    }
    return { valido: false, errores: errores, texto: '' };
  }

  return { valido: true, errores: [], texto: render.texto };
}

if (typeof module !== 'undefined') {
  module.exports = { generarTexto: generarTexto };
}

'use strict';

/**
 * Validacion y formato del identificador tributario del organizador, por pais.
 *
 * Los algoritmos de digito de verificacion estan en la seccion 6 de
 * docs/ESPECIFICACION_V3.md y se verificaron contra los identificadores reales
 * de las sociedades Rappi de cada pais.
 *
 * Cada validador devuelve { valido, mensaje, formateado }.
 */

function soloDigitos(texto) {
  return String(texto || '').replace(/\D/g, '');
}

function sumaPonderada(digitos, pesos) {
  var suma = 0;
  for (var i = 0; i < pesos.length; i++) {
    suma += Number(digitos.charAt(i)) * pesos[i];
  }
  return suma;
}

/** Agrupa de a tres con el separador dado: 900111222 -> 900.111.222 */
function agruparMiles(digitos, separador) {
  return digitos.replace(/\B(?=(\d{3})+(?!\d))/g, separador);
}

function resultado(valido, mensaje, formateado) {
  return { valido: valido, mensaje: mensaje || '', formateado: formateado || '' };
}

// --- Colombia: NIT ---------------------------------------------------------

var PESOS_NIT = [3, 7, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 67, 71];

function digitoNit(cuerpo) {
  var suma = 0;
  // Los pesos se aplican desde la derecha.
  for (var i = 0; i < cuerpo.length; i++) {
    var digito = Number(cuerpo.charAt(cuerpo.length - 1 - i));
    suma += digito * PESOS_NIT[i];
  }
  var r = suma % 11;
  return r === 0 || r === 1 ? r : 11 - r;
}

function validarNit(valor) {
  var limpio = String(valor || '').trim().replace(/[.\s]/g, '');
  var partido = /^(\d{9})-?(\d)$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'El NIT debe tener 9 dígitos y el dígito de verificación, por ejemplo 900.111.222-1.');
  }
  var cuerpo = partido[1];
  var dv = Number(partido[2]);
  if (digitoNit(cuerpo) !== dv) {
    return resultado(false, 'El dígito de verificación del NIT no corresponde. Revisa el número.');
  }
  return resultado(true, '', 'NIT ' + agruparMiles(cuerpo, '.') + '-' + dv);
}

// --- Mexico: RFC -----------------------------------------------------------

var ALFABETO_RFC = '0123456789ABCDEFGHIJKLMN&OPQRSTUVWXYZ';

function valorCaracterRfc(caracter) {
  if (caracter === ' ') return 37;
  if (caracter === 'Ñ') return 38;
  // La posicion en el alfabeto ya es el valor: 0 a 9 valen 0 a 9,
  // A a N valen 10 a 23, & vale 24 y O a Z valen 25 a 36.
  return ALFABETO_RFC.indexOf(caracter);
}

function digitoRfc(doce) {
  var suma = 0;
  for (var i = 0; i < 12; i++) {
    var valor = valorCaracterRfc(doce.charAt(i));
    if (valor === -1) return null;
    suma += valor * (13 - i);
  }
  var r = suma % 11;
  if (r === 0) return '0';
  var dv = 11 - r;
  if (dv === 10) return 'A';
  return String(dv);
}

function validarRfc(valor) {
  var limpio = String(valor || '').trim().toUpperCase().replace(/[-\s]/g, '');

  var esMoral = /^[A-ZÑ&]{3}\d{6}[A-Z0-9]{3}$/.test(limpio);
  var esFisica = /^[A-ZÑ&]{4}\d{6}[A-Z0-9]{3}$/.test(limpio);

  if (!esMoral && !esFisica) {
    return resultado(false, 'El RFC debe tener 12 caracteres (persona moral) o 13 (persona física), por ejemplo PRU200101AB5.');
  }

  // A la persona moral se le antepone un espacio para completar 13 posiciones.
  var completo = esMoral ? ' ' + limpio : limpio;
  var esperado = digitoRfc(completo.slice(0, 12));

  if (esperado === null || esperado !== completo.charAt(12)) {
    return resultado(false, 'El dígito verificador del RFC no corresponde. Revisa el número.');
  }
  return resultado(true, '', 'RFC ' + limpio);
}

// --- Modulo 11 con pesos fijos (Peru, Argentina, Uruguay) ------------------

function validarModulo11(valor, opciones) {
  var digitos = soloDigitos(valor);
  if (digitos.length !== opciones.largo) {
    return resultado(false, opciones.mensajeFormato);
  }
  var cuerpo = digitos.slice(0, opciones.largo - 1);
  var dv = Number(digitos.charAt(opciones.largo - 1));

  var r = sumaPonderada(cuerpo, opciones.pesos) % 11;
  var esperado = 11 - r;
  if (esperado === 11) esperado = opciones.once;
  if (esperado === 10) {
    if (opciones.diez === null) {
      return resultado(false, opciones.mensajeDigito);
    }
    esperado = opciones.diez;
  }

  if (esperado !== dv) {
    return resultado(false, opciones.mensajeDigito);
  }
  return resultado(true, '', opciones.formatear(digitos));
}

function validarRucPe(valor) {
  return validarModulo11(valor, {
    largo: 11,
    pesos: [5, 4, 3, 2, 7, 6, 5, 4, 3, 2],
    once: 1,
    diez: 0,
    mensajeFormato: 'El RUC debe tener 11 dígitos.',
    mensajeDigito: 'El dígito verificador del RUC no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'RUC ' + digitos;
    },
  });
}

function validarCuit(valor) {
  return validarModulo11(valor, {
    largo: 11,
    pesos: [5, 4, 3, 2, 7, 6, 5, 4, 3, 2],
    once: 0,
    diez: null,
    mensajeFormato: 'El CUIT debe tener 11 dígitos, por ejemplo 30-71580389-1.',
    mensajeDigito: 'El dígito verificador del CUIT no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'CUIT ' + digitos.slice(0, 2) + '-' + digitos.slice(2, 10) + '-' + digitos.slice(10);
    },
  });
}

function validarRutUy(valor) {
  return validarModulo11(valor, {
    largo: 12,
    pesos: [4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2],
    once: 0,
    diez: null,
    mensajeFormato: 'El RUT debe tener 12 dígitos.',
    mensajeDigito: 'El dígito verificador del RUT no corresponde. Revisa el número.',
    formatear: function (digitos) {
      return 'RUT ' + digitos;
    },
  });
}

// --- Chile: RUT (pesos ciclicos 2 a 7) -------------------------------------

function validarRutCl(valor) {
  var limpio = String(valor || '').trim().toUpperCase().replace(/[.\s]/g, '');
  var partido = /^(\d{7,8})-?([\dK])$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'El RUT debe tener el cuerpo y el dígito verificador, por ejemplo 76.837.223-3.');
  }
  var cuerpo = partido[1];
  var dv = partido[2];

  var suma = 0;
  var peso = 2;
  for (var i = cuerpo.length - 1; i >= 0; i--) {
    suma += Number(cuerpo.charAt(i)) * peso;
    peso = peso === 7 ? 2 : peso + 1;
  }
  var esperado = 11 - (suma % 11);
  var dvEsperado = esperado === 11 ? '0' : esperado === 10 ? 'K' : String(esperado);

  if (dvEsperado !== dv) {
    return resultado(false, 'El dígito verificador del RUT no corresponde. Revisa el número.');
  }
  return resultado(true, '', 'RUT ' + agruparMiles(cuerpo, '.') + '-' + dv);
}

// --- Ecuador: RUC ----------------------------------------------------------

function validarRucEc(valor) {
  var digitos = soloDigitos(valor);
  if (digitos.length !== 13) {
    return resultado(false, 'El RUC debe tener 13 dígitos y terminar en 001.');
  }
  if (digitos.slice(10) !== '001') {
    return resultado(false, 'El RUC debe terminar en 001.');
  }

  // Solo la sociedad privada (tercer dígito 9) tiene dígito verificable.
  if (digitos.charAt(2) === '9') {
    var r = sumaPonderada(digitos.slice(0, 9), [4, 3, 2, 7, 6, 5, 4, 3, 2]) % 11;
    var esperado = r === 0 ? 0 : 11 - r;
    if (esperado !== Number(digitos.charAt(9))) {
      return resultado(false, 'El dígito verificador del RUC no corresponde. Revisa el número.');
    }
  }
  return resultado(true, '', 'RUC ' + digitos);
}

// --- Costa Rica: cedula juridica (sin digito verificador) ------------------

function validarCedulaCr(valor) {
  var limpio = String(valor || '').trim().replace(/\s/g, '');
  var partido = /^(\d)-?(\d{3})-?(\d{6})$/.exec(limpio);
  if (!partido) {
    return resultado(false, 'La cédula jurídica debe tener el formato 3-XXX-XXXXXX.');
  }
  return resultado(true, '', 'Cédula jurídica ' + partido[1] + '-' + partido[2] + '-' + partido[3]);
}

// --- Entrada unica ---------------------------------------------------------

var VALIDADORES = {
  CO: validarNit,
  MX: validarRfc,
  PE: validarRucPe,
  AR: validarCuit,
  CL: validarRutCl,
  EC: validarRucEc,
  UY: validarRutUy,
  CR: validarCedulaCr,
};

/**
 * Valida el identificador para un pais y devuelve el texto ya formateado
 * como va en el documento: { valido, mensaje, formateado }.
 */
function validarIdentificacion(codigoPais, valor) {
  var validador = VALIDADORES[codigoPais];
  if (!validador) {
    var crudo = String(valor || '').trim();
    if (!crudo) return resultado(false, 'Falta el identificador del organizador.');
    return resultado(true, '', crudo);
  }
  if (!String(valor || '').trim()) {
    return resultado(false, 'Falta el identificador del organizador.');
  }
  return validador(valor);
}

if (typeof module !== 'undefined') {
  module.exports = {
    validarIdentificacion: validarIdentificacion,
    validarNit: validarNit,
    validarRfc: validarRfc,
    validarRucPe: validarRucPe,
    validarCuit: validarCuit,
    validarRutCl: validarRutCl,
    validarRucEc: validarRucEc,
    validarRutUy: validarRutUy,
    validarCedulaCr: validarCedulaCr,
  };
}

// --- src/core/motor.js ---
'use strict';

/**
 * Motor de documentos: convierte un modelo de modelos/ y los hechos del
 * formulario en el texto final del documento.
 *
 * Pasos del render (seccion 4.2 de la especificacion):
 *   1. Expandir [[INCLUIR:...]]
 *   2. Quitar los comentarios %%
 *   3. Calcular los valores derivados
 *   4. Expandir los bloques repetibles [[#TIENDAS]]
 *   5. Resolver los bloques opcionales [[?CAMPO]]
 *   6. Reemplazar los placeholders {{CAMPO}}
 *   7. Numerar las clausulas
 *
 * Determinismo (regla 2 de CLAUDE.md): si algo falta, el motor lo reporta y no
 * se genera el documento. Nunca completa ni inventa texto.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTexto = require('./texto.js');
  var normalizarTexto = moduloTexto.normalizarTexto;
  var textoPlano = moduloTexto.textoPlano;

  var moduloDerivados = require('./derivados.js');
  var calcularDerivados = moduloDerivados.calcularDerivados;
  var valoresDeTienda = moduloDerivados.valoresDeTienda;
}

/** Marcas que nunca pueden quedar en el documento final. */
var MARCAS_SIN_RESOLVER = /\{\{|\}\}|\[\[|\]\]/;

/**
 * Red de seguridad sobre el texto final (seccion 4.3, punto 5).
 * Cada patron delata una frase rota por un valor vacio.
 */
var SENALES_DE_TEXTO_ROTO = [
  { nombre: 'un espacio antes de una coma', patron: / ,/ },
  { nombre: 'un espacio antes de un punto', patron: / \./ },
  { nombre: 'dos puntos seguidos', patron: /(^|[^.])\.\.(?!\.)/ },
  { nombre: 'un parentesis vacío', patron: /\(\s*\)/ },
  { nombre: 'dos espacios seguidos', patron: {} },
  { nombre: 'una coma seguida de un punto', patron: /, \./ },
];
// El patron de dos espacios se arma aparte para que no se pierda al leerlo.
SENALES_DE_TEXTO_ROTO[4].patron = /  /;

/** Paso 1: reemplaza cada [[INCLUIR:nombre]] por el bloque correspondiente. */
function expandirInclusiones(texto, bloques) {
  var faltantes = [];
  var resultado = normalizarTexto(texto).replace(/^\[\[INCLUIR:(\w+)\]\]$/gm, function (todo, nombre) {
    if (!Object.prototype.hasOwnProperty.call(bloques, nombre)) {
      faltantes.push(nombre);
      return todo;
    }
    return normalizarTexto(bloques[nombre]).replace(/\n+$/, '');
  });
  return { texto: resultado, faltantes: faltantes };
}

/** Paso 2: quita las lineas de comentario. */
function quitarComentarios(texto) {
  var lineas = texto.split('\n');
  var conservadas = [];
  for (var i = 0; i < lineas.length; i++) {
    if (lineas[i].indexOf('%%') !== 0) conservadas.push(lineas[i]);
  }
  return conservadas.join('\n');
}

/** Paso 4: repite el bloque de tiendas una vez por tienda. */
function expandirTiendas(texto, tiendas, pais) {
  return texto.replace(/^\[\[#TIENDAS\]\]\n([\s\S]*?)\n\[\[\/TIENDAS\]\]$/gm, function (todo, cuerpo) {
    var salida = [];
    for (var i = 0; i < tiendas.length; i++) {
      var valores = valoresDeTienda(tiendas[i], pais);
      salida.push(
        cuerpo.replace(/\{\{(TIENDA_\w+)\}\}/g, function (marca, llave) {
          return Object.prototype.hasOwnProperty.call(valores, llave) ? valores[llave] : marca;
        })
      );
    }
    return salida.join('\n');
  });
}

/** Paso 5: conserva el bloque opcional solo si el campo tiene valor. */
function resolverOpcionales(texto, valores) {
  return texto.replace(/\[\[\?(\w+)\]\]([\s\S]*?)\[\[\/\?\]\]/g, function (todo, llave, cuerpo) {
    return valores[llave] ? cuerpo : '';
  });
}

/** Paso 6: reemplaza los placeholders y anota los que quedaron vacios. */
function reemplazarPlaceholders(texto, valores) {
  var vacios = [];
  var resultado = texto.replace(/\{\{(\w+)\}\}/g, function (todo, llave) {
    var valor = valores[llave];
    if (!valor) {
      if (vacios.indexOf(llave) === -1) vacios.push(llave);
      return '';
    }
    return valor;
  });
  return { texto: resultado, vacios: vacios };
}

/** Paso 7: numera las clausulas y quita las lineas vacias. */
function numerarClausulas(texto) {
  var lineas = texto.split('\n');
  var salida = [];
  var numero = 0;

  for (var i = 0; i < lineas.length; i++) {
    var linea = lineas[i];
    if (!linea.trim()) continue;

    if (linea.indexOf('§ ') === 0) {
      numero += 1;
      var cuerpo = linea.slice(2);
      var titulo;
      var resto;
      var corte = cuerpo.indexOf('. ');
      if (corte !== -1) {
        titulo = cuerpo.slice(0, corte);
        resto = cuerpo.slice(corte + 2);
      } else {
        titulo = cuerpo.replace(/\.+$/, '');
        resto = '';
      }
      linea = ('**' + numero + '. ' + titulo + '.** ' + resto).replace(/\s+$/, '');
    }
    salida.push(linea);
  }
  return salida.join('\n');
}

/** Devuelve los nombres de las senales de texto roto encontradas. */
function senalesDeTextoRoto(texto) {
  var plano = textoPlano(texto);
  var encontradas = [];
  for (var i = 0; i < SENALES_DE_TEXTO_ROTO.length; i++) {
    var senal = SENALES_DE_TEXTO_ROTO[i];
    if (senal.patron.test(plano)) encontradas.push(senal.nombre);
  }
  // Una vineta sin contenido tambien delata un valor vacio.
  if (/^•\s*$/m.test(texto)) encontradas.push('una viñeta vacía');
  return encontradas;
}

/**
 * Render completo.
 *
 * modelos: { modelos: {nombre: texto}, bloques: {nombre: texto} }
 * Devuelve { texto, errores, placeholdersVacios }.
 * Si errores tiene algo, el documento no se debe crear.
 */
function renderizar(nombreModelo, entrada, pais, modelos) {
  var errores = [];

  if (!Object.prototype.hasOwnProperty.call(modelos.modelos, nombreModelo)) {
    return { texto: '', errores: ['No existe el modelo "' + nombreModelo + '".'], placeholdersVacios: [] };
  }

  var inclusiones = expandirInclusiones(modelos.modelos[nombreModelo], modelos.bloques);
  for (var i = 0; i < inclusiones.faltantes.length; i++) {
    errores.push('El modelo incluye el bloque "' + inclusiones.faltantes[i] + '", que no existe.');
  }

  var texto = quitarComentarios(inclusiones.texto);
  var valores = calcularDerivados(entrada, pais);

  texto = expandirTiendas(texto, entrada.tiendas || [], pais);
  texto = resolverOpcionales(texto, valores);

  var reemplazo = reemplazarPlaceholders(texto, valores);
  texto = numerarClausulas(reemplazo.texto);

  for (var j = 0; j < reemplazo.vacios.length; j++) {
    errores.push('Falta un dato: el documento necesita "' + reemplazo.vacios[j] + '" y quedó vacío.');
  }

  if (MARCAS_SIN_RESOLVER.test(texto)) {
    errores.push('Quedaron marcas sin resolver en el documento.');
  }

  var senales = senalesDeTextoRoto(texto);
  for (var k = 0; k < senales.length; k++) {
    errores.push('El texto quedó roto: hay ' + senales[k] + '.');
  }

  return { texto: texto, errores: errores, placeholdersVacios: reemplazo.vacios };
}

/** Marca que envuelve un hueco en la vista previa. Nunca aparece en el documento. */
var MARCA_HUECO = String.fromCharCode(1);

/**
 * Render para la vista previa en vivo.
 *
 * Igual que renderizar(), pero en vez de dejar vacio un dato que falta pone un
 * hueco marcado. La interfaz lo convierte en un espacio en blanco gris que dice
 * que pregunta lo llena.
 *
 * Esto NUNCA genera el documento: generar() usa renderizar(), que bloquea si
 * falta algo. Los huecos viven solo en la pantalla.
 */
function renderizarVistaPrevia(nombreModelo, entrada, pais, modelos) {
  if (!Object.prototype.hasOwnProperty.call(modelos.modelos, nombreModelo)) {
    return { texto: '', huecos: [] };
  }

  var inclusiones = expandirInclusiones(modelos.modelos[nombreModelo], modelos.bloques);
  var texto = quitarComentarios(inclusiones.texto);
  var valores = calcularDerivados(entrada, pais);
  var huecos = [];

  // Un bloque repetible sin tiendas deja la lista vacia: se anuncia el hueco.
  var tiendas = entrada.tiendas || [];
  if (tiendas.length === 0) {
    texto = texto.replace(/^\[\[#TIENDAS\]\]\n[\s\S]*?\n\[\[\/TIENDAS\]\]$/gm, function () {
      huecos.push('TIENDA_MARCA');
      return '\u2022 {{TIENDA_MARCA}}';
    });
  } else {
    texto = expandirTiendas(texto, tiendas, pais);
  }

  texto = resolverOpcionales(texto, valores);

  texto = texto.replace(/\{\{(\w+)\}\}/g, function (todo, llave) {
    var valor = valores[llave];
    if (valor) return valor;
    if (huecos.indexOf(llave) === -1) huecos.push(llave);
    return MARCA_HUECO + llave + MARCA_HUECO;
  });

  return { texto: numerarClausulas(texto), huecos: huecos };
}

/**
 * Parte una linea de la vista previa en tramos de texto y de hueco.
 * Devuelve [{ tipo: 'texto' | 'hueco', valor }].
 */
function tramosDeVistaPrevia(linea) {
  var partes = String(linea).split(MARCA_HUECO);
  var tramos = [];
  for (var i = 0; i < partes.length; i++) {
    if (!partes[i]) continue;
    tramos.push({ tipo: i % 2 === 1 ? 'hueco' : 'texto', valor: partes[i] });
  }
  return tramos;
}
if (typeof module !== 'undefined') {
  module.exports = {
    renderizar: renderizar,
    renderizarVistaPrevia: renderizarVistaPrevia,
    tramosDeVistaPrevia: tramosDeVistaPrevia,
    MARCA_HUECO: MARCA_HUECO,
    expandirInclusiones: expandirInclusiones,
    quitarComentarios: quitarComentarios,
    expandirTiendas: expandirTiendas,
    resolverOpcionales: resolverOpcionales,
    reemplazarPlaceholders: reemplazarPlaceholders,
    numerarClausulas: numerarClausulas,
    senalesDeTextoRoto: senalesDeTextoRoto,
  };
}

'use strict';

/**
 * Numeros en letras, montos y cantidades de Creditos.
 *
 * Corre igual en Node (pruebas), Apps Script (generacion) y el navegador
 * (vista previa). Sin require ni import: en Apps Script son funciones globales.
 *
 * El comportamiento esperado esta fijado por docs/referencia/motor_prototipo.py,
 * que es el prototipo con el que Legal valido los modelos.
 */

var UNIDADES = [
  'cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve',
  'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete',
  'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés',
  'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve',
];

var DECENAS = {
  30: 'treinta',
  40: 'cuarenta',
  50: 'cincuenta',
  60: 'sesenta',
  70: 'setenta',
  80: 'ochenta',
  90: 'noventa',
};

var CENTENAS = {
  100: 'ciento',
  200: 'doscientos',
  300: 'trescientos',
  400: 'cuatrocientos',
  500: 'quinientos',
  600: 'seiscientos',
  700: 'setecientos',
  800: 'ochocientos',
  900: 'novecientos',
};

/** Numeros de 0 a 999 en letras. */
function letrasHasta999(n) {
  if (n < 30) return UNIDADES[n];
  if (n < 100) {
    var decena = Math.floor(n / 10) * 10;
    var unidad = n % 10;
    return DECENAS[decena] + (unidad === 0 ? '' : ' y ' + UNIDADES[unidad]);
  }
  if (n === 100) return 'cien';
  var centena = Math.floor(n / 100) * 100;
  var resto = n % 100;
  return CENTENAS[centena] + (resto === 0 ? '' : ' ' + letrasHasta999(resto));
}

/**
 * Apocope ante sustantivo masculino y ante "mil":
 * uno -> un, veintiuno -> veintiún, treinta y uno -> treinta y un.
 * Solo aplica al final del texto, que es donde queda el sustantivo despues.
 */
function apocopar(texto) {
  var t = String(texto);
  if (/veintiuno$/.test(t)) return t.replace(/veintiuno$/, 'veintiún');
  if (/uno$/.test(t)) {
    // No se toca una palabra que solo termine en "uno" siendo parte de otra
    // (por ejemplo "veintiuno" ya quedo resuelto arriba).
    var anterior = t.charAt(t.length - 4);
    if (!/[a-záéíóúñ]/.test(anterior)) return t.replace(/uno$/, 'un');
  }
  return t;
}

/**
 * Numero en letras hasta 999.999.999.999.
 * Con apocope true devuelve la forma que va pegada a un sustantivo masculino.
 */
function numeroEnLetras(n, apocope) {
  var entero = Math.trunc(Number(n));
  if (entero === 0) return 'cero';

  var partes = [];
  var millones = Math.floor(entero / 1000000);
  var resto = entero % 1000000;
  var miles = Math.floor(resto / 1000);
  var unidades = resto % 1000;

  if (millones) {
    partes.push(millones === 1 ? 'un millón' : apocopar(numeroEnLetras(millones)) + ' millones');
  }
  if (miles) {
    // "mil", nunca "un mil".
    partes.push(miles === 1 ? 'mil' : apocopar(letrasHasta999(miles)) + ' mil');
  }
  if (unidades) {
    partes.push(letrasHasta999(unidades));
  }

  var texto = partes.join(' ');
  return apocope ? apocopar(texto) : texto;
}

/**
 * Forma "letras (cifra)" que precede a un sustantivo masculino:
 * "un (1)", "veintiún (21)", "treinta y un (31)".
 * Quien llama agrega el sustantivo: letrasYCifra(1) + ' pedido'.
 */
function letrasYCifra(n) {
  var entero = Math.trunc(Number(n));
  return numeroEnLetras(entero, true) + ' (' + entero + ')';
}

/** Entero con el separador de miles del pais. */
function formatearMiles(n, separador) {
  var entero = String(Math.trunc(Math.abs(Number(n))));
  var conSeparador = entero.replace(/\B(?=(\d{3})+(?!\d))/g, separador);
  return Number(n) < 0 ? '-' + conSeparador : conSeparador;
}

/**
 * Cantidad de Creditos: "treinta mil (30.000) Créditos".
 * Lleva "de" antes de Créditos cuando las letras terminan en millón o millones:
 * "doce millones (12.000.000) de Créditos".
 */
function cantidadCreditos(n, pais) {
  var letras = numeroEnLetras(n, true);
  var de = /(millón|millones)$/.test(letras) ? ' de' : '';
  return letras + ' (' + formatearMiles(n, pais.separador_miles) + ')' + de + ' Créditos';
}

/** Monto con moneda: "cincuenta mil pesos M/Cte. ($50.000)". */
function montoConMoneda(n, pais) {
  return (
    numeroEnLetras(n) +
    ' ' +
    pais.moneda_nombre +
    ' (' +
    pais.moneda_simbolo +
    formatearMiles(n, pais.separador_miles) +
    ')'
  );
}

/**
 * Porcentaje: "cincuenta por ciento (50%)", "cien por ciento (100%)".
 * No hay apocope ante "por ciento": "veintiuno por ciento (21%)".
 */
function porcentajeEnLetras(p) {
  var entero = Math.trunc(Number(p));
  var letras = entero === 100 ? 'cien' : numeroEnLetras(entero);
  return letras + ' por ciento (' + entero + '%)';
}

if (typeof module !== 'undefined') {
  module.exports = {
    letrasHasta999: letrasHasta999,
    apocopar: apocopar,
    numeroEnLetras: numeroEnLetras,
    letrasYCifra: letrasYCifra,
    formatearMiles: formatearMiles,
    cantidadCreditos: cantidadCreditos,
    montoConMoneda: montoConMoneda,
    porcentajeEnLetras: porcentajeEnLetras,
  };
}

// --- src/core/paises.js ---
'use strict';

/**
 * Normalizacion de la configuracion por pais.
 *
 * Los paises viven en data/paises.json (semilla) y en la pestana Paises del
 * Sheet, donde una lista se guarda como texto separado por comas. Este archivo
 * convierte entre las dos formas y decide que paises ve cada persona.
 */

if (typeof module !== 'undefined' && typeof require === 'function') {
  var moduloTablas = require('./tablas.js');
  var comoBooleano = moduloTablas.comoBooleano;
}

var ESTADOS = ['activo', 'piloto', 'bloqueado'];

/** Columnas que en el Sheet son una lista separada por comas. */
var COLUMNAS_DE_LISTA = ['modelos', 'por_confirmar_en_pruebas'];

function comoLista(valor) {
  if (Object.prototype.toString.call(valor) === '[object Array]') return valor;
  var partes = String(valor === null || valor === undefined ? '' : valor).split(',');
  var limpias = [];
  for (var i = 0; i < partes.length; i++) {
    var parte = partes[i].trim();
    if (parte) limpias.push(parte);
  }
  return limpias;
}

/** Fila del Sheet -> pais utilizable por el motor. */
function paisDesdeFila(fila) {
  var pais = {};
  for (var llave in fila) {
    if (!Object.prototype.hasOwnProperty.call(fila, llave)) continue;
    if (llave === '_fila') continue;
    pais[llave] = fila[llave];
  }

  for (var i = 0; i < COLUMNAS_DE_LISTA.length; i++) {
    var columna = COLUMNAS_DE_LISTA[i];
    pais[columna] = comoLista(pais[columna]);
  }

  pais.codigo = String(pais.codigo || '').trim().toUpperCase();
  pais.estado = String(pais.estado || '').trim().toLowerCase();
  if (ESTADOS.indexOf(pais.estado) === -1) pais.estado = 'bloqueado';

  pais._fila = fila._fila;
  return pais;
}

/** Pais -> fila del Sheet, con las listas convertidas a texto. */
function paisComoFila(pais) {
  var fila = {};
  for (var llave in pais) {
    if (!Object.prototype.hasOwnProperty.call(pais, llave)) continue;
    if (llave === '_fila') continue;
    var valor = pais[llave];
    fila[llave] = Object.prototype.toString.call(valor) === '[object Array]' ? valor.join(', ') : valor;
  }
  return fila;
}

function paisPorCodigo(paises, codigo) {
  var buscado = String(codigo || '').trim().toUpperCase();
  for (var i = 0; i < paises.length; i++) {
    if (String(paises[i].codigo).toUpperCase() === buscado) return paises[i];
  }
  return null;
}

/**
 * Los paises que puede elegir quien pide: los activos siempre, y los de piloto
 * solo si esta en el equipo. Los bloqueados no aparecen nunca.
 */
function paisesDisponibles(paises, usuarioEnEquipo) {
  var disponibles = [];
  for (var i = 0; i < paises.length; i++) {
    var pais = paises[i];
    if (pais.estado === 'activo') disponibles.push(pais);
    else if (pais.estado === 'piloto' && usuarioEnEquipo) disponibles.push(pais);
  }
  return disponibles;
}

/** Los tipos de campana habilitados para un pais, en el orden del catalogo. */
function tiposDelPais(pais, catalogoDeTipos) {
  var habilitados = [];
  var modelos = pais && pais.modelos ? pais.modelos : [];
  for (var i = 0; i < catalogoDeTipos.length; i++) {
    var tipo = catalogoDeTipos[i];
    for (var m = 0; m < modelos.length; m++) {
      if (modelos[m] === tipo.modelo) {
        habilitados.push(tipo);
        break;
      }
    }
  }
  return habilitados;
}

/** Fila de Equipo -> miembro. */
function miembroDesdeFila(fila) {
  return {
    email: String(fila.email || '').trim().toLowerCase(),
    nombre: String(fila.nombre || '').trim(),
    rol: String(fila.rol || 'comercial').trim().toLowerCase(),
    pais: String(fila.pais || '').trim().toUpperCase(),
    activo: comoBooleano(fila.activo),
    _fila: fila._fila,
  };
}

/** Busca a alguien en el equipo por correo. Devuelve null si no esta o no esta activo. */
function miembroPorCorreo(equipo, correo) {
  var buscado = String(correo || '').trim().toLowerCase();
  for (var i = 0; i < equipo.length; i++) {
    if (equipo[i].email === buscado && equipo[i].activo) return equipo[i];
  }
  return null;
}

/**
 * Rol efectivo de quien pide. Quien no esta en el equipo es comercial.
 * Roles: comercial, pruebas, legal, admin.
 */
function rolDe(equipo, correo) {
  var miembro = miembroPorCorreo(equipo, correo);
  return miembro ? miembro.rol : 'comercial';
}

/** Solo pruebas, legal y admin pueden generar en paises en piloto. */
function puedeVerPiloto(rol) {
  return rol === 'pruebas' || rol === 'legal' || rol === 'admin';
}

if (typeof module !== 'undefined') {
  module.exports = {
    ESTADOS: ESTADOS,
    paisDesdeFila: paisDesdeFila,
    paisComoFila: paisComoFila,
    paisPorCodigo: paisPorCodigo,
    paisesDisponibles: paisesDisponibles,
    tiposDelPais: tiposDelPais,
    miembroDesdeFila: miembroDesdeFila,
    miembroPorCorreo: miembroPorCorreo,
    rolDe: rolDe,
    puedeVerPiloto: puedeVerPiloto,
    comoLista: comoLista,
  };
}
