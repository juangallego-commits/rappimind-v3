  --gradient-neon: linear-gradient(135deg, #FF7A4D 0%, #FF2526 55%, #FF4583 100%);
  --gradient-neon-hero: radial-gradient(circle at 18% 20%, #FF8559 0%, #FF2526 48%, #E61E5C 100%);
  --gradient-neon-dark: radial-gradient(circle at 80% 90%, #B8001F 0%, #FF2526 60%, #FF7A4D 100%);
  --gradient-neon-45: linear-gradient(-45deg, #FF7A4D 0%, #FF2526 50%, #FF4583 100%);

  --color-celeste: #D9F1FF;
  --color-morado: #E5DCFF;
  --color-rosado: #F4DFF6;
  --color-lavanda: #F4F0FC;
  --color-beige: #FFF0DD;

  --color-turbo-green: #248F63;
  --color-turbo-dark: #00453E;

  --color-pro-bg: #ECEFF3;
  --color-pro-text: #000000;
  --color-pro-muted: #646464;
  --color-pro-gold-light: #F0B769;
  --color-pro-gold-dark: #E8A24C;

  --color-pro-black-bg: #2A2B2B;
  --color-pro-black-text: #FFFFFF;
  --color-pro-black-surface: #ECEFF3;

  --color-ink: #0A0A0A;
  --color-muted: rgba(10,10,10,0.57);
  --color-line: rgba(10,10,10,0.10);

  --color-white: #FFFFFF;

  --color-email-text: #383838;

  --surface-page: var(--color-white);
  --surface-card: var(--color-white);

/* src/client/tokens/typography.css */
:root {

  --font-primary: 'PPObjectSans', sans-serif;

  --font-email: 'PPObjectSans', sans-serif;

  --weight-regular: 400;
  --weight-medium: 500;
  --weight-bold: 700;
  --weight-heavy: 900;

  --text-display: 900 clamp(64px, 12vw, 230px)/0.86 var(--font-primary);
  --text-display-size: clamp(64px, 12vw, 230px);

  --text-h1-size: clamp(40px, 6vw, 100px);
  --text-h1: 900 var(--text-h1-size)/0.96 var(--font-primary);

  --text-h2-size: clamp(28px, 4vw, 64px);
  --text-h2: 900 var(--text-h2-size)/1.03 var(--font-primary);

  --text-h3: 700 var(--text-h3-size)/1.15 var(--font-primary);

  --text-body: 500 var(--text-body-size)/1.7 var(--font-primary);

  --text-lede-size: 22px;
  --text-lede: 500 var(--text-lede-size)/1.55 var(--font-primary);

  --text-meta-size: 12px;
  --text-meta: 600 var(--text-meta-size)/1 var(--font-primary);

  --text-legal-size: 11px;
  --text-legal: 400 var(--text-legal-size)/1.5 var(--font-primary);

  --inapp-title-size: 33px;
  --inapp-desc-size: 21px;
  --banner-home-title: 26px;
  --banner-home-sub: 20px;
  --banner-filtro-title: 88px;
  --banner-filtro-desc: 40px;

  --email-title-size: 40px;
  --email-body-size: 20px;
  --email-cta-size: 28px;

  --tracking-tight: -0.045em;
  --tracking-normal: 0;
  --tracking-wide: 0.12em;

}

/* src/client/tokens/spacing.css */
:root {

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-14: 56px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;
  --space-30: 120px;

  --gap-xs: var(--space-2);
  --gap-sm: var(--space-3);
  --gap-md: var(--space-6);
  --gap-lg: var(--space-10);
  --gap-xl: var(--space-16);

  --page-margin: var(--space-30);
  --content-max: 1280px;
  --card-padding: var(--space-6);
  --card-padding-lg: var(--space-10);

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 32px;

  --logo-safe-area: 1em;

  --inapp-w: 300px;
  --inapp-h: 400px;
  --banner-home-w: 320px;
  --banner-home-h: 136px;
  --push-image-w: 600px;
  --push-image-h: 300px;

  --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.13);
}

/* src/client/tokens/rappimind.css */
:root {

  --rm-papel: #FFFFFF;
  --rm-niebla: #F4F5F6;
  --rm-tinta: #0A0A0A;

  --rm-display: 'PPObjectSans', 'Archivo', system-ui, -apple-system, sans-serif;
  --rm-texto-familia: 'Archivo', system-ui, -apple-system, sans-serif;

  --rm-texto: #0A0A0A;
  --rm-texto-2: #595959;
  --rm-texto-off: #6B6B6B;
  --rm-placeholder: #707070;

  --rm-linea: rgba(10,10,10,.10);
  --rm-borde-control: rgba(10,10,10,.44);
  --rm-borde-secundario: rgba(10,10,10,.22);
  --rm-borde-opcion: rgba(10,10,10,.12);

  --rm-neon: #FF2526;
  --rm-neon-texto: #D41D1E;
  --rm-grad: linear-gradient(135deg, #FF7A4D 0%, #FF2526 55%, #FF4583 100%);
  --rm-grad-hover: linear-gradient(135deg, #E8623A 0%, #D91F20 55%, #E03A72 100%);

  --rm-grad-texto: linear-gradient(135deg, #B95838 0%, #E42122 55%, #D2396C 100%);

  --rm-grad-boton: linear-gradient(135deg, #FF6041 0%, #FF2526 46%, #FF4583 100%);
  --rm-anillo-color: #FF2526;
  --rm-neon-presionado: #A81718;

  --rm-campo-vacio: var(--rm-borde-control);
  --rm-campo-lleno: var(--rm-tinta);
  --rm-campo-error: #FF2526;
  --rm-campo-off-bg: var(--rm-niebla);
  --rm-campo-off-borde: var(--rm-linea);

  --rm-opcion-sel-bg: rgba(255,37,38,.045);
  --rm-opcion-sel-borde: #FF2526;
  --rm-opcion-off-bg: var(--rm-niebla);

  --rm-paso-hecho: var(--rm-tinta);
  --rm-paso-actual: var(--rm-grad);
  --rm-paso-pendiente: rgba(10,10,10,.12);
  --rm-paso-alto: 4px;
  --rm-paso-min-etiqueta: 88px;
  --rm-paso-max-etiqueta: 6;

  --rm-aviso-info-bg: #D9F1FF;
  --rm-aviso-serio-bg: #FFF0DD;
  --rm-aviso-serio-regla: var(--rm-grad);
  --rm-aviso-error-color: var(--rm-neon-texto);

  --rm-estado-publicado-bg: var(--rm-grad-texto);
  --rm-estado-publicado-fg: #FFFFFF;
  --rm-estado-generado-bg: #FFF0DD;
  --rm-estado-generado-fg: #0A0A0A;
  --rm-estado-borrador-bg: var(--rm-niebla);
  --rm-estado-borrador-fg: #595959;
  --rm-estado-vencido-borde: rgba(10,10,10,.20);
  --rm-estado-vencido-fg: #595959;

  --rm-hueco-bg: #FFF0DD;
  --rm-hueco-subrayado: 1.5px dotted #D91F20;
  --rm-destello: rgba(255,122,77,.45);
  --rm-hoja-sombra: 0 1px 4px rgba(10,10,10,.08);

  --rm-cortina: rgba(10,10,10,.35);
  --rm-sombra-glosario: 0 6px 20px rgba(10,10,10,.25);
  --rm-sombra-flotante: 0 2px 12px rgba(10,10,10,.12);

  --rm-t-control: 200ms;
  --rm-t-entrada: 380ms;
  --rm-t-destello: 900ms;
  --rm-ease-entrada: cubic-bezier(.16, 1, .3, 1);
}

/* src/client/estilos.css */
:root {

  --neon: var(--rm-neon);
  --neon-texto: var(--rm-neon-texto);
  --neon-presionado: var(--rm-neon-presionado);
  --gradiente: var(--rm-grad);
  --gradiente-boton: var(--rm-grad-boton);
  --gradiente-hover: var(--rm-grad-hover);

  --tinta: var(--rm-tinta);
  --gris-lapiz: var(--rm-texto-2);
  --texto-off: var(--rm-texto-off);
  --papel: var(--rm-papel);
  --niebla: var(--rm-niebla);
  --beige: var(--rm-hueco-bg);
  --celeste: var(--rm-aviso-info-bg);

  --borde: var(--rm-linea);
  --borde-control: var(--rm-borde-control);
  --borde-opcion: var(--rm-borde-opcion);

  --campo-vacio: var(--rm-campo-vacio);
  --campo-lleno: var(--rm-campo-lleno);
  --campo-error: var(--rm-campo-error);
  --campo-off-bg: var(--rm-campo-off-bg);
  --campo-off-borde: var(--rm-campo-off-borde);
  --marcador: var(--rm-placeholder);

  --paso-hecho: var(--rm-paso-hecho);
  --paso-actual: var(--rm-paso-actual);
  --paso-pendiente: var(--rm-paso-pendiente);
  --paso-alto: var(--rm-paso-alto);

  --display: var(--rm-display);
  --titulos: var(--rm-texto-familia);
  --cuerpo: var(--rm-texto-familia);

  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px;
  --e5: 24px; --e6: 32px; --e7: 48px; --e8: 64px;

  --r-control: var(--radius-sm);
  --r-panel: var(--radius-md);
  --r-hoja: var(--radius-lg);
  --r-pildora: var(--radius-pill);

  --sombra-hoja: var(--rm-hoja-sombra);
  --sombra-glosario: var(--rm-sombra-glosario);
  --sombra-flotante: var(--rm-sombra-flotante);
  --cortina: var(--rm-cortina);
  --destello: var(--rm-destello);

  --t-rapido: var(--rm-t-control);
  --t-hoja: var(--rm-t-entrada);
  --t-destello: var(--rm-t-destello);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--niebla);
  color: var(--tinta);
  font-family: var(--cuerpo);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, .marca { font-family: var(--display); font-weight: 900; }
h3, button, .opcion-titulo { font-family: var(--titulos); font-weight: 700; }
h1 { font-size: 28px; line-height: 1.15; margin: 0 0 var(--e3); letter-spacing: -0.025em; }
h2 { font-size: 21px; line-height: 1.25; margin: 0 0 var(--e2); letter-spacing: -0.02em; }
h3 { font-size: 17px; line-height: 1.35; margin: 0 0 var(--e2); letter-spacing: -0.01em; }
p { margin: 0 0 var(--e3); }
a { color: var(--neon-texto); }

:focus-visible {
  outline: 3px solid var(--neon);
  outline-offset: 2px;
  border-radius: var(--r-control);
}

.oculto { display: none !important; }
.solo-lectores {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.marca {
  position: relative;
  display: inline-block;
  font-size: 17px;
  color: var(--tinta);
  letter-spacing: -0.01em;
  padding-top: 6px;
}
.marca .corona {
  position: absolute;
  width: 14px; height: 9px;
  top: -2px; left: 40px;
  color: var(--neon);
}

.marca em { font-style: normal; font-family: var(--titulos); color: var(--gris-lapiz); font-weight: 500; }

.barra-superior {
  display: flex; align-items: center; gap: var(--e4);
  padding: var(--e3) var(--e5);
  background: var(--papel);
  border-bottom: 1px solid var(--borde);
  position: sticky; top: 0; z-index: 30;
}
.barra-superior nav { margin-left: auto; display: flex; gap: var(--e1); flex-wrap: wrap; }

.enlace-nav {
  font-family: var(--titulos); font-weight: 700; font-size: 14px;
  color: var(--gris-lapiz); background: none; border: 0;
  padding: var(--e2) var(--e3); border-radius: var(--r-control); cursor: pointer;
}
.enlace-nav:hover { background: var(--niebla); color: var(--tinta); }
.enlace-nav[aria-current='page'] { color: var(--tinta); box-shadow: inset 0 -2px 0 var(--neon); }

h1[tabindex='-1']:focus:not(:focus-visible) { outline: none; }

.pagina { max-width: 1320px; margin: 0 auto; padding: var(--e6) var(--e5) var(--e8); }
.pagina-angosta { max-width: 760px; }

.dos-columnas {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--e6);
  align-items: start;
}

.aviso {
  background: var(--celeste);
  border-radius: var(--r-panel);
  padding: var(--e4) 18px;
  margin: 0 0 var(--e5);
  font-size: 14.5px;
}
.aviso h3 { margin-bottom: var(--e1); font-size: 15px; }
.aviso p:last-child { margin-bottom: 0; }

.aviso-serio {
  background: var(--rm-aviso-serio-regla) top/100% 3px no-repeat, var(--rm-aviso-serio-bg);
  padding-top: 19px;
}

.aviso-serio h3 {
  font-family: var(--titulos); font-size: 14px; font-weight: 900;
  letter-spacing: -0.01em; margin: 0 0 6px;
}

.aviso-serio ~ .aviso:not(.aviso-serio) {
  background: var(--papel); border: 1px solid var(--borde);
}

button { font-size: 15px; cursor: pointer; }

.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e2);
  padding: 13px var(--e5);
  border-radius: var(--r-pildora);
  border: 1px solid transparent;
  background: var(--gradiente-boton);
  color: var(--papel);
  font-size: 19px; font-weight: 700; line-height: 1.2;
  transition: background var(--t-rapido), box-shadow var(--t-rapido);
}
.boton:hover { background: var(--gradiente-hover); }
.boton:active { background: var(--neon-presionado); }

.boton[disabled] {
  background: var(--papel); color: var(--texto-off);
  cursor: not-allowed; border-color: var(--rm-borde-secundario);
}

.boton-secundario {
  background: transparent; color: var(--tinta);
  border-color: var(--borde-control);
  font-size: 15px; font-weight: 700;
}
.boton-secundario:hover { background: var(--niebla); border-color: var(--tinta); }
.boton-secundario:active { background: var(--niebla); }
.boton-secundario[disabled] {
  color: var(--texto-off); background: transparent; border-color: var(--borde);
}

.boton-texto {
  background: none; border: 0; padding: var(--e1) 0;
  color: var(--neon-texto); font-family: var(--cuerpo); font-size: 14px;
  text-decoration: underline; text-underline-offset: 3px;
}

.fila-botones { display: flex; gap: var(--e3); flex-wrap: wrap; align-items: center; margin-top: var(--e5); }

.progreso-compacto {
  display: block; margin: 0 0 var(--e3);
  font-size: 13px; font-weight: 700; color: var(--gris-lapiz);
}
.progreso-compacto strong { color: var(--tinta); font-family: var(--titulos); font-weight: 900; }
.progreso-cuenta { color: var(--gris-lapiz); }

.columna-preguntas, .pagina-angosta { container: barra / inline-size; }

.progreso {
  display: flex; flex-wrap: nowrap; gap: var(--e3);
  margin: 0 0 var(--e6); list-style: none; padding: 0;
}
.progreso li { flex: 1 1 0; min-width: 0; }
.progreso button {
  width: 100%; text-align: left; background: none; border: 0; padding: 0;
  font-family: var(--cuerpo); font-size: 11.5px; font-weight: 600;
  color: var(--texto-off); line-height: 1.3; letter-spacing: -0.01em;

  text-indent: -9999px; overflow: hidden; white-space: nowrap;

  height: auto; padding-bottom: 20px;
}
.progreso button::before {
  content: ''; display: block; height: var(--paso-alto); text-indent: 0;
  border-radius: var(--r-pildora); background: var(--paso-pendiente);
  margin-bottom: var(--e2);
}
.progreso .hecho button::before { background: var(--paso-hecho); }
.progreso .actual button::before { background: var(--paso-actual); }
.progreso .hecho button { color: var(--tinta); }
.progreso .actual button { color: var(--tinta); font-weight: 800; }
.progreso button[disabled] { cursor: default; }

@container barra (min-width: 188px) {
  .progreso:not(:has(li:nth-child(3))) button { text-indent: 0; padding-bottom: 0; }
}
@container barra (min-width: 288px) {
  .progreso:not(:has(li:nth-child(4))) button { text-indent: 0; padding-bottom: 0; }
}
@container barra (min-width: 388px) {
  .progreso:not(:has(li:nth-child(5))) button { text-indent: 0; padding-bottom: 0; }
}
@container barra (min-width: 488px) {
  .progreso:not(:has(li:nth-child(6))) button { text-indent: 0; padding-bottom: 0; }
}
@container barra (min-width: 588px) {
  .progreso:not(:has(li:nth-child(7))) button { text-indent: 0; padding-bottom: 0; }
}

.columna-preguntas { min-width: 0; }

.pregunta { padding: var(--e5) 0; border-bottom: 1px solid var(--borde); }
.pregunta:first-child { padding-top: 0; }
.pregunta:last-child { border-bottom: 0; }

.pregunta-titulo { font-family: var(--titulos); font-weight: 700; font-size: 21px; line-height: 1.3; margin: 0 0 var(--e2); }
.pregunta-ayuda { color: var(--gris-lapiz); font-size: 14px; margin: 0 0 var(--e3); }

.marca-opcional {
  display: inline-block; vertical-align: middle; margin-left: var(--e2);
  padding: 3px 10px; border: 1.5px solid var(--rm-borde-secundario);
  border-radius: var(--r-pildora);
  font-family: var(--titulos); font-weight: 800; font-size: 11px;
  letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--gris-lapiz); background: var(--papel);
}

.copiable {
  border: 1px solid var(--borde); border-radius: var(--r-panel);
  padding: var(--e3) var(--e4); margin: 0 0 var(--e3); background: var(--papel);
}
.copiable-encabezado {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--e3); margin-bottom: var(--e2);
}
.copiable-etiqueta {
  font-family: var(--titulos); font-weight: 700; font-size: 13px;
  letter-spacing: 0.02em; color: var(--gris-lapiz);
}
.copiable-valor {
  display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 14px; line-height: 1.5; color: var(--tinta);
  background: var(--niebla); border-radius: var(--r-control);
  padding: var(--e2) var(--e3); word-break: break-word;
}
.copiable .pregunta-ayuda { margin: var(--e2) 0 0; }

.boton-chico { padding: 4px 12px; font-size: 13px; font-weight: 700; min-height: 0; }

.por-que { margin: var(--e2) 0 0; }
.por-que summary {
  color: var(--neon-texto); font-size: 14px; cursor: pointer;
  list-style: none; display: inline-block; text-decoration: underline; text-underline-offset: 3px;
}
.por-que summary::-webkit-details-marker { display: none; }
.por-que p {
  margin: var(--e2) 0 0; font-size: 14px; color: var(--gris-lapiz);
  border-left: 2px solid var(--borde); padding-left: var(--e3);
}

.campo { display: block; margin: 0 0 var(--e3); }
.campo-caja { position: relative; display: flex; align-items: center; }

input[type='text'], input[type='number'], input[type='date'], input[type='time'], input[type='search'], select, textarea {
  width: 100%;
  font-family: var(--cuerpo); font-size: 17px; font-weight: 500; color: var(--tinta);
  background: var(--papel);
  border: 1.5px solid var(--campo-vacio);
  border-radius: var(--r-panel);
  padding: 12px var(--e3);
  transition: border-color var(--t-rapido);
}
::placeholder { color: var(--marcador); opacity: 1; }

input:not([type='date']):not([type='time']):not(:placeholder-shown),
select:not([disabled]),
textarea:not(:placeholder-shown) { border-color: var(--campo-lleno); }

input:hover:not([disabled]), select:hover:not([disabled]), textarea:hover:not([disabled]) {
  border-color: var(--campo-lleno);
}

input[disabled], select[disabled] {
  background: var(--campo-off-bg); color: var(--texto-off);
  border-color: var(--campo-off-borde); cursor: not-allowed;
}

.con-moneda input { padding-left: 34px; }
.simbolo-moneda {
  position: absolute; left: var(--e3); color: var(--gris-lapiz); font-size: 17px; pointer-events: none;
}

.campo-error input:not([type='date']):not([type='time']),
.campo-error input[type='date'], .campo-error input[type='time'],
.campo-error select, .campo-error textarea {
  border-color: var(--campo-error); border-width: 2px;
}

TO_METODO_PAGO}}\n{{TEXTO_UMBRAL}}\nEl concurso consiste en acumular {{CRITERIO_GANADOR}} durante la vigencia de la Campaña. Los pedidos cancelados total o parcialmente, ya sea por el Usuario/Consumidor, por el Aliado Comercial o por el Repartidor Independiente, no suman al acumulado.\n§ Selección de ganadores y desempate. Al finalizar la vigencia se elaborará un ranking de participantes con base en el criterio anterior. {{FRASE_GANADORES}} {{TEXTO_DESEMPATE}}\nAntes de declarar a los ganadores, Rappi verificará la elegibilidad de cada participante y de cada pedido. Si la verificación determina que un participante o sus pedidos no cumplen las condiciones de la Campaña, dicho participante no será considerado ganador y se le informará a través de la Plataforma Rappi.\n§ Premio. {{LISTA_PREMIOS}} El premio es personal e intransferible y no podrá canjearse por dinero en efectivo ni por otros bienes o servicios. La cantidad de premios es limitada y corresponde a la indicada en esta cláusula.\n§ Naturaleza del premio. {{TEXTO_NATURALEZA_PREMIO}}\n§ Notificación, aceptación y entrega del premio.\n• **Notificación:** Rappi contactará a cada ganador mediante {{MEDIO_NOTIFICACION}}, a más tardar el **{{FECHA_NOTIFICACION}}**.\n• **Aceptación:** el ganador deberá aceptar el premio y confirmar sus datos, y su dirección de entrega cuando corresponda, dentro de un plazo de **{{PLAZO_CONFIRMACION}}** a partir de la notificación. Si Rappi no logra contactarlo tras intentos razonables, o si no acepta el premio o no confirma sus datos dentro de ese plazo, el premio podrá asignarse al siguiente participante del ranking, de forma sucesiva.\n• **Entrega:** {{TEXTO_ENTREGA}}\n§ Exclusiones. No suman al acumulado del concurso:\n• Los pedidos cancelados, devueltos o que no se completen exitosamente por cualquier causa.\n• Los pedidos pagados con medios de pago diferentes a los aplicables para la Campaña.\n• Los pedidos realizados fuera de la vigencia de la Campaña.\n• El valor de propinas, costos de envío, tarifas de servicio e impuestos.\n[[?TEXTO_EXCLUSION_SALUD]]{{TEXTO_EXCLUSION_SALUD}}[[/?]]\n§ Impuestos. Los impuestos que se generen con ocasión del premio estarán a cargo de quien corresponda conforme a la legislación tributaria aplicable. Cuando haya lugar a retenciones o tributos a cargo del ganador, estos se aplicarán en los términos de la ley.\n[[INCLUIR:publicidad]]\n[[INCLUIR:atencion]]\n[[INCLUIR:modificaciones]]\n[[INCLUIR:fraude]]\n[[INCLUIR:tyc_plataforma]]\n[[INCLUIR:responsabilidad]]\n§ Responsabilidades frente al premio. Rappi no será responsable por la existencia, calidad, idoneidad o entrega del premio cuando la entrega esté a cargo del Organizador. Rappi es responsable de: (i) la aplicación del criterio de selección de ganadores con base en la información transaccional de la Plataforma Rappi; (ii) la publicación veraz y completa de los presentes Términos y Condiciones; y (iii) la atención oportuna de tus peticiones, quejas y reclamos relacionados con la Campaña.\n[[INCLUIR:datos]]\n[[?TEXTO_DATOS_ENTREGA]]{{TEXTO_DATOS_ENTREGA}}[[/?]]\n[[INCLUIR:ley]]\n",
    "cashback": "%% Modelo: Cashback (una tienda) · versión 3.0 · base: modelo aprobado por Legal CO (julio 2026) · revisar en punto de control A\n# TÉRMINOS Y CONDICIONES\n## {{NOMBRE_CAMPANA_MAYUS}}\n[[INCLUIR:organizador]]\n[[INCLUIR:cobertura_tienda]]\n§ Vigencia. La Campaña estará vigente desde las **{{HORA_INICIO}}** del **{{FECHA_INICIO}}** hasta las **{{HORA_FIN}}** del **{{FECHA_FIN}}** ({{TEXTO_HORA_LOCAL}}), o hasta agotar el presupuesto disponible de **{{PRESUPUESTO}}**, lo que ocurra primero. Los pedidos realizados fuera de la vigencia no darán lugar al beneficio de la Campaña.\n[[INCLUIR:usuarios_beneficio]]\n§ Tienda y productos participantes. La Campaña aplica exclusivamente para pedidos de productos del catálogo de la Tienda Participante, realizados a través de la Plataforma Rappi.[[?TEXTO_TIENDA_TURBO]] {{TEXTO_TIENDA_TURBO}}[[/?]]\n§ Mecánica y beneficio. Para obtener el beneficio de la Campaña (en adelante, el “Beneficio”) debes:\n• Realizar un pedido en la Tienda Participante a través de la Plataforma Rappi durante la vigencia de la Campaña.\n• Recibir el pedido de manera exitosa, sin que haya sido cancelado.\n• Realizar el pago del pedido con un medio de pago válido para la Campaña.\n{{TEXTO_METODO_PAGO}}\n[[?TEXTO_MINIMO_COMPRA]]{{TEXTO_MINIMO_COMPRA}}[[/?]]\nEl Beneficio consiste en el **{{PORCENTAJE}}** del valor de tu pedido, acreditado como Créditos en tu Billetera de Créditos, sin que puedas recibir más de **{{TOPE}}** por pedido. El valor sobre el cual se calcula el Beneficio corresponde exclusivamente al precio de los productos adquiridos, sin incluir el costo de envío, la tarifa de servicio ni las propinas.\n§ Topes y límites.\n• **Tope por pedido:** el Beneficio máximo por cada pedido es de **{{TOPE}}**.\n• **Máximo de pedidos:** {{TEXTO_LIMITE_PEDIDOS}}\n• **Presupuesto total:** la Campaña tiene un presupuesto total de **{{PRESUPUESTO}}**. Una vez agotado, la Campaña finalizará automáticamente, aunque no haya terminado su vigencia.\n[[INCLUIR:acreditacion]]\n[[INCLUIR:naturaleza_creditos]]\n[[INCLUIR:vigencia_creditos]]\n[[INCLUIR:exclusiones_beneficio]]\n[[INCLUIR:publicidad]]\n[[INCLUIR:atencion]]\n[[INCLUIR:modificaciones]]\n[[INCLUIR:fraude]]\n[[INCLUIR:tyc_plataforma]]\n[[INCLUIR:responsabilidad]]\n[[INCLUIR:responsabilidad_rappi_beneficio]]\n[[INCLUIR:datos]]\n[[INCLUIR:ley]]\n",
    "cashback_day": "%% Modelo: Cashback Day (varias tiendas) · versión 3.0 · base: decisiones de Legal CO (julio 2026) · revisar en punto de control A\n# TÉRMINOS Y CONDICIONES\n## {{NOMBRE_CAMPANA_MAYUS}}\n§ Organizadores y rol de Rappi. La presente campaña promocional (en adelante, la “Campaña”) es organizada por cada una de las tiendas que se relacionan a continuación (en adelante, individualmente, la “Tienda Participante” y, en conjunto, las “Tiendas Participantes”), cada una respecto del beneficio ofrecido en su propia tienda y con cargo a su propio presupuesto, y cada una es la única responsable de dicho beneficio frente a los Usuarios/Consumidores:\n[[#TIENDAS]]\n• **{{TIENDA_MARCA}}**: {{TIENDA_RAZON_SOCIAL}}, identificada con {{TIENDA_ID}}.\n[[/TIENDAS]]\n**{{ENTIDAD_LEGAL}}** (en adelante, “Rappi”) actúa únicamente como plataforma de contacto e intermediación tecnológica y como medio de difusión de la Campaña; Rappi no es organizadora de la Campaña ni responsable del beneficio ofrecido por cada Tienda Participante.\nLos términos con mayúscula inicial que no se definan en este documento tendrán el significado que les asignan los Términos y Condiciones de Uso de la Plataforma Rappi.\n§ Cobertura. La Campaña es válida en {{PAIS_LEGAL}}, exclusivamente en las ciudades o la cobertura indicadas para cada Tienda Participante en la cláusula “Existencias por Tienda Participante” (en adelante, el “Territorio”), y dentro de las zonas de cobertura de cada tienda en la Plataforma Rappi. La disponibilidad puede variar según tu ubicación.\n§ Vigencia. La Campaña estará vigente desde las **{{HORA_INICIO}}** del **{{FECHA_INICIO}}** hasta las **{{HORA_FIN}}** del **{{FECHA_FIN}}** ({{TEXTO_HORA_LOCAL}}), o hasta agotar las existencias de cada Tienda Participante, lo que ocurra primero. La disponibilidad del beneficio en cada Tienda Participante depende de que esta se encuentre activa en la Plataforma Rappi dentro de dicho horario. Los pedidos realizados fuera de la vigencia no darán lugar al beneficio de la Campaña.\n[[INCLUIR:usuarios_beneficio]]\n§ Tiendas participantes. La Campaña aplica exclusivamente para pedidos de productos del catálogo de las siguientes Tiendas Participantes, realizados a través de la Plataforma Rappi:\n[[#TIENDAS]]\n• {{TIENDA_MARCA}}{{TIENDA_TURBO}}\n[[/TIENDAS]]\n§ Mecánica y beneficio. Para obtener el beneficio de la Campaña (en adelante, el “Beneficio”) debes:\n• Realizar un pedido en una Tienda Participante a través de la Plataforma Rappi durante la vigencia de la Campaña.\n• Recibir el pedido de manera exitosa, sin que haya sido cancelado.\n• Realizar el pago del pedido con un medio de pago válido para la Campaña.\n{{TEXTO_METODO_PAGO}}\n[[?TEXTO_MINIMO_COMPRA]]{{TEXTO_MINIMO_COMPRA}}[[/?]]\nEl Beneficio consiste en el **{{PORCENTAJE}}** del valor de tu pedido, acreditado como Créditos en tu Billetera de Créditos, sin que puedas recibir más de **{{TOPE}}** por pedido. El valor sobre el cual se calcula el Beneficio corresponde exclusivamente al precio de los productos adquiridos, sin incluir el costo de envío, la tarifa de servicio ni las propinas.\n§ Existencias por Tienda Participante. Cada Tienda Participante cuenta con el siguiente presupuesto para la Campaña (en adelante, las “Existencias”). Una vez agotadas las Existencias de una Tienda Participante, la Campaña finalizará automáticamente respecto de esa tienda, aunque no haya terminado su vigencia:\n[[#TIENDAS]]\n• **{{TIENDA_MARCA}}** ({{TIENDA_CIUDADES}}): {{TIENDA_PRESUPUESTO}}\n[[/TIENDAS]]\n§ Topes y límites.\n• **Tope por pedido:** el Beneficio máximo por cada pedido es de **{{TOPE}}**.\n• **Máximo de pedidos:** {{TEXTO_LIMITE_PEDIDOS}}\n[[INCLUIR:acreditacion]]\n[[INCLUIR:naturaleza_creditos]]\n[[INCLUIR:vigencia_creditos]]\n[[INCLUIR:exclusiones_beneficio]]\n[[INCLUIR:publicidad]]\n[[INCLUIR:atencion]]\n[[INCLUIR:modificaciones]]\n[[INCLUIR:fraude]]\n[[INCLUIR:tyc_plataforma]]\n[[INCLUIR:responsabilidad]]\n[[INCLUIR:responsabilidad_rappi_beneficio]]\n[[INCLUIR:datos]]\n[[INCLUIR:ley]]\n",
    "cashback_eta": "%% Modelo: Cashback por incumplimiento del ETA (Turbo) · versión 3.0\n%% Base: los T&C publicados de Bogotá (16/09/2026) y Barranquilla (1/09/2026).\n%% Los dos son el mismo documento con la ciudad, la fecha, las horas y el\n%% presupuesto cambiados. Las mejoras aplicadas están en docs/MEJORAS_ETA.md.\n%% OJO: en este modelo no hay aliado que fondee. Es una promesa de servicio de\n%% Rappi sobre su propio tiempo de entrega. Ver docs/PENDIENTES_LEGAL.md.\n# TÉRMINOS Y CONDICIONES\n## {{NOMBRE_CAMPANA_MAYUS}}\nPor medio del presente documento **{{ENTIDAD_LEGAL}}**, identificada con **{{ID_FISCAL}}** y domiciliada en {{DOMICILIO_LEGAL}} (en adelante, “Rappi”), da a conocer los términos y condiciones de la campaña denominada “{{NOMBRE_CAMPANA}}” (en adelante la “Campaña”). La participación en la Campaña implica conocimiento y aceptación total, expresa y vinculante de estos Términos y Condiciones por parte del Usuario/Consumidor.\n[[INCLUIR:eta_definiciones]]\n§ Territorio. La Campaña será válida únicamente para las órdenes realizadas dentro de las zonas de cobertura de las Tiendas Participantes en la Plataforma Rappi, en {{TEXTO_CIUDAD_ETA}}, dentro de {{PAIS_LEGAL}}.\n§ Vigencia y presupuesto. La Campaña será válida desde las **{{HORA_INICIO}}** hasta las **{{HORA_FIN}}** del **{{FECHA_INICIO}}** ({{TEXTO_HORA_LOCAL}}) y/o hasta agotar existencias, lo que primero ocurra. Para efectos de la Campaña se ha establecido un valor total máximo de **{{PRESUPUESTO}}** a ser entregados como Cashback a los Usuarios/Consumidores que participen en la Campaña (las “Existencias”). El agotamiento del presupuesto con anterioridad a la hora de finalización implicará la terminación automática de la Campaña.\n§ Tipo de Usuarios Participantes. Podrán participar todos los Usuarios/Consumidores registrados en la Plataforma Rappi que durante la vigencia de la Campaña realicen órdenes en las Tiendas Participantes, con independencia de que cuenten o no con suscripción activa.\n§ Tiendas Participantes. {{TEXTO_TIENDAS_ETA}}\n§ Productos Participantes. Participarán todos los productos que hacen parte del catálogo de las Tiendas Participantes al interior del botón “Turbo” de la Plataforma Rappi.\n§ Beneficio y dinámica de la Campaña. Si durante la vigencia de la Campaña realizas una orden en las Tiendas Participantes y su entrega supera {{TEXTO_ETA}}, contados desde la aceptación de la orden por parte del Aliado Comercial hasta la entrega efectiva por parte del repartidor independiente, recibirás en Créditos el **{{PORCENTAJE}}** del valor de los Productos Participantes. Rappi se obliga a cumplir con el ETA exhibido dentro de la Plataforma Rappi. No habrá lugar al Beneficio cuando el retraso se deba a causas que te sean imputables, como una dirección de entrega incorrecta o incompleta, la modificación de la orden o de la dirección después de realizada, o la falta de disponibilidad para recibirla, ni cuando obedezca a fuerza mayor o caso fortuito.\nEl Cashback será calculado única y exclusivamente sobre el valor efectivamente pagado por los productos adquiridos en la orden, sin que en ningún caso se incluyan para dicho cálculo los costos de envío, la tarifa de servicio, las propinas voluntarias, ni los descuentos u otras promociones aplicadas. El monto máximo del Cashback que se otorgará por orden es de **{{TOPE}}**.\n[[INCLUIR:acreditacion]]\n[[INCLUIR:vigencia_creditos]]\n[[INCLUIR:eta_condiciones]]\n§ Medio de pago. {{TEXTO_METODO_PAGO}}\n§ Modificaciones e interpretación. Rappi se reserva el derecho de modificar, suspender o cancelar la Campaña en cualquier momento y sin previo aviso, en caso de detectarse fraude, abuso del sistema, caso fortuito o fuerza mayor. Rappi podrá cancelar cualquier orden que no aplique para el Beneficio sin previo aviso.\n[[INCLUIR:eta_intermediacion]]\n[[INCLUIR:naturaleza_creditos]]\n[[INCLUIR:datos]]\n[[INCLUIR:ley]]\n",
    "cashback_travel": "%% Modelo: Cashback Travel · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, sección 6 · pendiente de revisión de Juan (docs/PENDIENTES_LEGAL.md)\n# TÉRMINOS Y CONDICIONES\n## {{NOMBRE_CAMPANA_MAYUS}}\n[[INCLUIR:travel_organizador]]\n[[INCLUIR:travel_sistemas]]\n[[INCLUIR:travel_cobertura]]\n§ Vigencia. La Campaña estará vigente desde las **{{HORA_INICIO}}** del **{{FECHA_INICIO}}** hasta las **{{HORA_FIN}}** del **{{FECHA_FIN}}** ({{TEXTO_HORA_LOCAL}})[[?TEXTO_AGOTAMIENTO_VIGENCIA_TRAVEL]], o hasta agotar {{TEXTO_AGOTAMIENTO_VIGENCIA_TRAVEL}}, lo que ocurra primero[[/?]]. Las órdenes realizadas fuera de la vigencia no darán lugar al beneficio de la Campaña.\n[[INCLUIR:travel_usuarios]]\n[[INCLUIR:travel_productos]]\n[[INCLUIR:travel_condiciones]]\n§ Mecánica y Beneficio. Para obtener el beneficio de la Campaña (en adelante, el “Beneficio”) debes:\n• Comprar uno o varios Productos Participantes a través de los Sistemas Rappi Travel durante la vigencia de la Campaña.\n• Obtener la confirmación de tu reserva por parte del Proveedor, sin que haya sido cancelada.\n• Pagar la orden con un medio de pago válido para la Campaña.\n{{TEXTO_METODO_PAGO_TRAVEL}}\nEl Beneficio consiste en {{TEXTO_BENEFICIO_TRAVEL}}, acreditado como Créditos en tu Billetera de Créditos de la Plataforma Rappi.[[?TEXTO_BASE_CALCULO_TRAVEL]] {{TEXTO_BASE_CALCULO_TRAVEL}}[[/?]][[?TEXTO_EJEMPLO_TOPE_TRAVEL]] {{TEXTO_EJEMPLO_TOPE_TRAVEL}}[[/?]]\n§ Topes y límites.\n[[?TOPE_TRAVEL]]• **Tope por orden:** el Beneficio máximo por cada orden es de **{{TOPE_TRAVEL}}**.\n[[/?]]• **Máximo de órdenes por usuario:** {{TEXTO_LIMITE_ORDENES_TRAVEL}}\n• **Límite de la Campaña:** {{TEXTO_LIMITE_CAMPANA_TRAVEL}}\n[[?TEXTO_CONTEO_IDA_REGRESO_TRAVEL]]• **Compras de ida y regreso:** {{TEXTO_CONTEO_IDA_REGRESO_TRAVEL}}\n[[/?]]§ Confirmación de la reserva. Debido a la naturaleza de los inventarios turísticos, el Beneficio está sujeto a la confirmación de la reserva por parte del Proveedor. Si por fallas en la conexión con el Proveedor la orden es rechazada y el servicio no se emite, no se otorgará el Beneficio.\n§ Acreditación del Beneficio. Los Créditos correspondientes al Beneficio se acreditarán en tu Billetera de Créditos **{{TEXTO_CARGA_TRAVEL}}**. Podrás verificar el estado de tus Créditos en las secciones “Cuenta” y “Créditos” de la Plataforma Rappi. {{TEXTO_VERIFICACION_TRAVEL}}\n§ Naturaleza de los Créditos. El Beneficio consiste en Créditos que Rappi Travel otorga y acredita en tu Billetera de Créditos de la Plataforma Rappi. Al participar, reconoces y aceptas que:\n• Los Créditos son intangibles que te permiten adquirir los productos y servicios indicados en la cláusula de vigencia y redención.\n• Los Créditos no constituyen dinero en efectivo, valores ni instrumentos financieros, y no pueden convertirse en dinero ni reembolsarse.\n• Los Créditos no son transferibles a terceros ni a otras cuentas de la Plataforma Rappi.\n• Los Créditos no son acumulables con otros cupones o promociones, salvo que se indique expresamente lo contrario.\n• Los Créditos otorgados en virtud de la Campaña se rigen por los presentes Términos y Condiciones.\n[[?TEXTO_CREDITOS_FUERA_DE_TRAVEL]]{{TEXTO_CREDITOS_FUERA_DE_TRAVEL}}\n[[/?]]§ Vigencia y redención de los Créditos. Los Créditos acreditados en virtud de la Campaña **{{TEXTO_VIGENCIA_CREDITOS}}**. {{TEXTO_REDENCION_TRAVEL}} Una vez vencidos, los Créditos no podrán ser recuperados, reactivados ni compensados. Eres responsable de redimir tus Créditos dentro del plazo indicado.\n§ Cancelaciones, modificaciones y reembolsos. Para proteger la integridad de la Campaña, se establecen de forma estricta las siguientes reglas en caso de modificaciones o cancelaciones de la reserva:\n• **Pérdida del Beneficio:** en caso de cancelación o reembolso de la reserva, o de modificación hecha por el Usuario/Consumidor, este no recibirá los Créditos promocionales. Si el Proveedor modifica la reserva y el Usuario/Consumidor la acepta sin reembolso, conservará el Beneficio.\n• **Reversión de Créditos:** si al momento de la cancelación los Créditos ya hubieren sido acreditados en la cuenta del usuario en la Plataforma Rappi, estos serán eliminados y revocados automáticamente por el sistema.\n• **Cruce de cuentas (deducción de reembolsos):** si el Usuario/Consumidor hubiere utilizado total o parcialmente los Créditos otorgados como Beneficio y posteriormente la orden original es objeto de cancelación o reembolso, el valor en dinero equivalente a los Créditos efectivamente utilizados será descontado de plano del monto total a reembolsar por concepto de la reserva. El usuario autoriza expresamente a Rappi Travel a realizar dicha deducción de su reembolso.\n• **Reembolso parcial:** si la orden se reembolsa parcialmente, el Beneficio se recalculará sobre el valor final pagado.\n• **Plazo:** estas reglas aplican a las cancelaciones, modificaciones y reembolsos que ocurran antes de la prestación del servicio. Una vez prestado el servicio (realizado el vuelo, la estadía, el alquiler o la actividad), el Beneficio queda en firme y no se revertirá, salvo en casos de fraude comprobado.\n§ Exclusiones y restricciones. El Beneficio no aplica para:\n• Órdenes canceladas, reembolsadas o no confirmadas, en los términos de las cláusulas anteriores.\n• Órdenes pagadas con medios de pago diferentes a los aplicables para la Campaña, en efectivo o, total o parcialmente, con Créditos.\n• Órdenes realizadas fuera de la vigencia de la Campaña.\n• Productos que no sean Productos Participantes, aunque se compren en la misma orden.\nEl Beneficio obtenido en virtud de la presente Campaña no es acumulable con otras promociones.\nEn los casos en que el Usuario/Consumidor realice el pago con su tarjeta RappiCard, para asegurar la correcta y automática acreditación del Beneficio, la tarjeta deberá estar registrada de forma nativa dentro de la sección de métodos de pago de la Plataforma Rappi. Aquellas transacciones realizadas con RappiCard a través de billeteras digitales de terceros (tales como Apple Pay o Google Pay) o en las que la tarjeta sea ingresada manualmente como una tarjeta de crédito externa podrían presentar demoras en la validación del Beneficio o requerir una gestión adicional por parte del usuario ante el equipo de soporte, sin que esto implique el incumplimiento de los presentes términos por parte de Rappi Travel.\n[[INCLUIR:travel_beneficio_por_producto]]\n[[INCLUIR:travel_precio_anunciado]]\n[[INCLUIR:travel_publicidad]]\n[[INCLUIR:travel_atencion]]\n[[INCLUIR:travel_modificaciones]]\n§ Fraude, abuso y descalificación. Rappi Travel se reserva el derecho de descalificarte de la Campaña, de rechazar o cancelar órdenes y de bloquear temporal o definitivamente tu cuenta si, a juicio razonable de Rappi Travel:\n• Utilizas la Campaña de manera fraudulenta, incluido el uso de cuentas múltiples, datos falsos o la manipulación del sistema o del historial de compras.\n• Intentas alterar, manipular o interferir con el funcionamiento de los Sistemas Rappi Travel o de la Campaña.\n• Incumples los Términos y Condiciones de los Sistemas Rappi Travel o de la Plataforma Rappi.\nEn caso de descalificación, Rappi Travel podrá revocar los Créditos acreditados en virtud de la Campaña que aún no hayan sido redimidos. Los Créditos ya redimidos no serán objeto de recuperación, salvo en casos de fraude comprobado conforme a la legislación aplicable. Rappi Travel te informará la razón de la descalificación a través de los canales de comunicación de la Plataforma Rappi.\n[[INCLUIR:travel_otros_tyc]]\n[[INCLUIR:travel_responsabilidad]]\n[[INCLUIR:travel_datos]]\n[[INCLUIR:travel_ley]]\n[[?TEXTO_NOTAS_DE_MODIFICACION]]{{TEXTO_NOTAS_DE_MODIFICACION}}[[/?]]\n",
    "descuento_travel": "%% Modelo: Descuento Travel · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, sección 7 · pendiente de revisión de Juan (docs/PENDIENTES_LEGAL.md)\n# TÉRMINOS Y CONDICIONES\n## {{NOMBRE_CAMPANA_MAYUS}}\n[[INCLUIR:travel_organizador]]\n[[INCLUIR:travel_sistemas]]\n[[INCLUIR:travel_cobertura]]\n§ Vigencia. La Campaña estará vigente desde las **{{HORA_INICIO}}** del **{{FECHA_INICIO}}** hasta las **{{HORA_FIN}}** del **{{FECHA_FIN}}** ({{TEXTO_HORA_LOCAL}})[[?TEXTO_AGOTAMIENTO_VIGENCIA_TRAVEL]], o hasta agotar {{TEXTO_AGOTAMIENTO_VIGENCIA_TRAVEL}}, lo que ocurra primero[[/?]]. Las órdenes realizadas fuera de la vigencia no darán lugar al beneficio de la Campaña.\n[[INCLUIR:travel_usuarios]]\n[[INCLUIR:travel_productos]]\n[[INCLUIR:travel_condiciones]]\n§ Mecánica y Beneficio. Para obtener el beneficio de la Campaña (en adelante, el “Beneficio”) debes comprar uno o varios Productos Participantes a través de los Sistemas Rappi Travel durante la vigencia de la Campaña y pagar la orden con un medio de pago válido para la Campaña.\n{{TEXTO_METODO_PAGO_TRAVEL}}\nEl Beneficio consiste en {{TEXTO_DESCUENTO_TRAVEL}} sobre el valor de la tarifa de los Productos Participantes[[?TEXTO_SEGUN_PRODUCTO_TRAVEL]]{{TEXTO_SEGUN_PRODUCTO_TRAVEL}}[[/?]]. El descuento se aplica directamente en el precio y el valor final con descuento se muestra antes de que pagues.[[?TEXTO_MAXIMO_DISPONIBLE_TRAVEL]] {{TEXTO_MAXIMO_DISPONIBLE_TRAVEL}}[[/?]][[?TEXTO_ASISTENCIA_TRAVEL]] {{TEXTO_ASISTENCIA_TRAVEL}}[[/?]]\n§ Cómo identificar el descuento. El descuento estará identificado en {{TEXTO_VISIBILIDAD_TRAVEL}}, y el porcentaje exacto de cada Producto Participante se mostrará antes de que pagues.\n§ Límites.\n• **Máximo de órdenes por usuario:** {{TEXTO_LIMITE_ORDENES_TRAVEL}}\n[[?TEXTO_LIMITE_CAMPANA_TRAVEL]]• **Unidades disponibles:** {{TEXTO_LIMITE_CAMPANA_TRAVEL}}\n[[/?]]§ Cambios, cancelaciones y reembolsos. Los cambios, cancelaciones y reembolsos de las órdenes con descuento se rigen por las condiciones del Proveedor y de la tarifa adquirida, que se informan antes de pagar. En caso de reembolso, se tendrá en cuenta el valor efectivamente pagado con el descuento. Si modificas la reserva, el descuento se mantendrá solo si el nuevo producto también es un Producto Participante y la modificación se hace dentro de la vigencia de la Campaña.\n§ Exclusiones y restricciones. El Beneficio no aplica para:\n• Órdenes pagadas con medios de pago diferentes a los aplicables para la Campaña o en efectivo.\n• Órdenes realizadas fuera de la vigencia de la Campaña.\n• Productos que no sean Productos Participantes, aunque se compren en la misma orden.\nEl Beneficio obtenido en virtud de la presente Campaña no es acumulable con otras promociones.\n[[INCLUIR:travel_beneficio_por_producto]]\n[[INCLUIR:travel_precio_anunciado]]\n[[INCLUIR:travel_publicidad]]\n[[INCLUIR:travel_atencion]]\n[[INCLUIR:travel_modificaciones]]\n§ Fraude, abuso y descalificación. Rappi Travel se reserva el derecho de descalificarte de la Campaña, de rechazar o cancelar órdenes y de bloquear temporal o definitivamente tu cuenta si, a juicio razonable de Rappi Travel:\n• Utilizas la Campaña de manera fraudulenta, incluido el uso de cuentas múltiples, datos falsos o la manipulación del sistema o del historial de compras.\n• Intentas alterar, manipular o interferir con el funcionamiento de los Sistemas Rappi Travel o de la Campaña.\n• Incumples los Términos y Condiciones de los Sistemas Rappi Travel o de la Plataforma Rappi.\nRappi Travel te informará la razón de la descalificación a través de los canales de comunicación de la Plataforma Rappi.\n[[INCLUIR:travel_otros_tyc]]\n[[INCLUIR:travel_responsabilidad]]\n[[INCLUIR:travel_datos]]\n[[INCLUIR:travel_ley]]\n[[?TEXTO_NOTAS_DE_MODIFICACION]]{{TEXTO_NOTAS_DE_MODIFICACION}}[[/?]]\n",
    "promocao_br": "%% Modelo: Brasil · Promoção (desconto, frete grátis, taxa de serviço) · versión 3.0\n%% Base: los cuatro T&C aprobados por Legal BR (septiembre 2026). Ver\n%% docs/MODELO_BASE_BRASIL.md para el mapa y docs/CORRECCIONES_BRASIL.md para\n%% cada corrección aplicada, con su antes y su después.\n%% EXCEPCIÓN de la regla 1 de CLAUDE.md, autorizada por Juan: en Brasil el\n%% documento está escrito con Rappi como quien concede y cancela la promoción.\n# TERMOS E CONDIÇÕES\n## {{NOMBRE_CAMPANA_MAYUS}}\nPor meio desta oferta, divulgamos os Termos e Condições da campanha “{{NOMBRE_CAMPANA}}”, na qual os usuários que realizarem compras[[?TEXTO_MINIMO_APERTURA]]{{TEXTO_MINIMO_APERTURA}}[[/?]] nas lojas do Parceiro **{{PARCEIRO}}**, na plataforma Rappi, em período específico, {{TEXTO_BENEFICIO_APERTURA}}.\n“Usuário” para fins deste T&C significa a pessoa física inscrita na plataforma Rappi.\n§ REGRAS PRINCIPAIS DA PROMOÇÃO\n• Esta campanha aplica-se apenas aos usuários cadastrados na plataforma Rappi que efetuarem a compra no período de **{{FECHA_INICIO}}** às **{{HORA_INICIO}}** até **{{FECHA_FIN}}** às **{{HORA_FIN}}**;\n• {{TEXTO_BENEFICIO_REGRA}};\n[[?TEXTO_TOPE_BENEFICIO]]• {{TEXTO_TOPE_BENEFICIO}};[[/?]]\n• {{TEXTO_LIMITE_PEDIDOS}};\n• Promoção válida nas áreas de cobertura do aplicativo em todo o território brasileiro, onde houver lojas parceiras credenciadas e com estoque dos produtos;\n• {{TEXTO_METODO_PAGO}};\n• É esclarecido que esta campanha não se aplica a pedidos parcialmente ou totalmente cancelados;\n• Promoção sujeita a disponibilidade de estoque;\n• Promoção não cumulativa com outras promoções.\n[[INCLUIR:br_condicoes_gerais]]\n[[INCLUIR:br_plataforma]]\n"
  },
  bloques: {
    "acreditacion": "%% Bloque compartido: acreditacion · versión 3.0\n§ Acreditación del Beneficio. Los Créditos correspondientes al Beneficio se acreditarán en tu Billetera de Créditos **{{TEXTO_CARGA}}**. Podrás verificar el estado de tus Créditos en las secciones “Cuenta” y “Créditos” de la Plataforma Rappi. {{TEXTO_VERIFICACION}}\n",
    "atencion": "%% Bloque compartido: atencion · versión 3.0\n§ Atención al usuario. Para cualquier consulta, petición, queja o reclamo relacionado con la Campaña, puedes comunicarte con Rappi a través de los siguientes canales:\n• El Centro de Ayuda de la Plataforma Rappi.\n• Los demás canales de atención informados en la página web de Rappi del país correspondiente.\n",
    "br_condicoes_gerais": "%% Bloque: Brasil · CONDIÇÕES GERAIS DA PROMOÇÃO · base: los cuatro T&C aprobados por Legal BR (septiembre 2026)\n%% Idénticas en los cuatro documentos. Las correcciones aplicadas están listadas\n%% una por una en docs/CORRECCIONES_BRASIL.md, con su antes y su después.\n§ CONDIÇÕES GERAIS DA PROMOÇÃO\nPromoção válida até a data e hora estipuladas ou enquanto durarem os estoques. Reservamo-nos o direito de cancelar qualquer transação que, devido às suas características, viole as condições de elegibilidade a esta promoção.\nEsta promoção é pessoal e intransferível, será aplicada apenas aos usuários que aplicarem a promoção.\nO Rappi se reserva o direito de encerrar esta promoção a qualquer momento em caso de fraude ou desvio do benefício para terceiros.\nO usuário reconhece e aceita que o fornecedor direto dos produtos é o Parceiro Comercial (estabelecimento), uma vez que este é o único que exibe, oferece, promove e comercializa produtos para os usuários/consumidores através da Plataforma.\nO Usuário reconhece e aceita que as informações fornecidas e registradas na plataforma virtual Rappi são verdadeiras e confiáveis, assumindo total responsabilidade por sua falsidade. As informações fornecidas terão o caráter de uma declaração juramentada, os Usuários têm total responsabilidade pela autenticidade e veracidade das mesmas, não sendo o Rappi responsável, caso o Usuário incorra na omissão e/ou erro no momento do carregamento dos dados solicitados ao Usuário para obter os benefícios da Promoção.\nO Rappi se reserva o direito de cancelar a promoção, cancelar o código e bloquear a conta do Usuário a qualquer momento, se for determinado que estão ocorrendo fraude ou ação ilícita para obtenção do benefício.\nO Rappi se reserva o direito de modificar as condições ou cancelar esta promoção a qualquer momento e a seu critério livre.\nO Rappi não permitirá que o Usuário acesse a promoção quando for verificado que as contas referidas são fictícias ou falsas, ou seja, que não constituem uma pessoa física identificável por meio de um documento de identidade emitido pela autoridade competente.\nO Rappi se reserva o direito de, a seu exclusivo critério, modificar, alterar ou atualizar estes Termos e Condições a qualquer momento. As modificações serão comunicadas no aplicativo RAPPI e entrarão em vigor imediatamente a partir do momento de sua publicação.\nO Rappi não comercializa produtos, pois é apenas uma plataforma tecnológica de intermediação entre terceiros que exibe serviços e produtos aos usuários/consumidores que os adquirem.\n",
    "br_plataforma": "%% Bloque: Brasil · cierre con los enlaces de plataforma y privacidad\n%% El texto aprobado nombraba los dos documentos sin ninguna dirección. Juan pidió\n%% meter los enlaces locales de Brasil el 17 de septiembre de 2026.\n§ Termos aplicáveis. Consulte nossos Termos de Uso e Condições da Plataforma Rappi, disponíveis em: {{URL_TC_PLATAFORMA}}, e o Aviso de Privacidade de Dados, disponível em: {{URL_PRIVACIDAD}}.\n",
    "cobertura_tienda": "%% Bloque compartido: cobertura_tienda · versión 3.0\n§ Cobertura. La Campaña es válida exclusivamente en **{{TEXTO_TERRITORIO}}** (en adelante, el “Territorio”), dentro de las zonas de cobertura de **{{TIENDA}}** (en adelante, la “Tienda Participante”) en la Plataforma Rappi. La disponibilidad puede variar según tu ubicación y los horarios de operación de los Aliados Comerciales.\n",
    "datos": "%% Bloque compartido: datos · versión 3.0\n§ Tratamiento de datos personales. Los datos personales de los participantes serán tratados por **{{ENTIDAD_LEGAL}}** con la finalidad exclusiva de gestionar la participación en la Campaña, verificar el cumplimiento de los requisitos, acreditar el beneficio o gestionar el premio e informar los resultados. Dicho tratamiento se rige por la legislación aplicable y por {{POLITICA_PRIVACIDAD}}, disponible en: {{URL_PRIVACIDAD}}, previamente aceptada por el Usuario/Consumidor. Podrás ejercer en cualquier momento {{TEXTO_DERECHOS_DATOS}}, a través de los canales dispuestos para tal fin en dicho documento, así como acudir ante {{AUTORIDAD_DATOS}}.\n",
    "eta_condiciones": "%% Bloque: cashback por ETA · condiciones y restricciones\n%% Las viñetas que en los dos documentos publicados son fijas. Las que dependen\n%% de una respuesta del comercial van en el modelo, no aquí.\n§ Condiciones y restricciones.\n• Campaña válida únicamente para órdenes realizadas a través de las Tiendas Participantes[[?TEXTO_MODALIDAD_CONDICIONES]]{{TEXTO_MODALIDAD_CONDICIONES}}[[/?]].\n• {{TEXTO_LIMITE_ORDENES}}\n• El Beneficio no es acumulable con otras promociones, campañas, cupones o beneficios vigentes en la Plataforma Rappi.\n• La Campaña no requiere el ingreso de código promocional alguno; el Beneficio se aplicará automáticamente cuando se cumplan las condiciones aquí previstas.\n• Los horarios de participación están sujetos a la operación de las Tiendas Participantes.\n• En caso de cancelación, devolución o anulación de la orden, Rappi podrá descontar o revocar los Créditos otorgados. El Usuario/Consumidor Participante no tendrá derecho al Beneficio en cancelaciones totales o parciales.\n• Los Créditos no son transferibles, acumulables ni redimibles en dinero. No constituyen un medio de pago, y su finalidad no es recibir dinero en efectivo.\n",
    "eta_definiciones": "%% Bloque: cashback por ETA · definiciones · base: los T&C publicados de Bogotá (16/09/2026) y Barranquilla (1/09/2026)\n§ Definiciones. Para efectos de la presente Campaña, los términos que se indican a continuación tendrán el significado que se les atribuye:\n• **Aliado Comercial:** persona natural o jurídica que exhibe, ofrece y comercializa productos a través de la Plataforma Rappi.\n• **Cashback:** beneficio otorgado al Usuario/Consumidor consistente en un reembolso realizado en Créditos de la Plataforma Rappi equivalentes a un porcentaje o valor del pedido.\n• **Créditos:** puntos equivalentes a la moneda local, propios de la Plataforma Rappi. Se aclara que los Créditos no son transferibles, acumulables ni canjeables por dinero en efectivo.\n• **ETA (Estimated Time of Arrival):** tiempo estimado de entrega informado al Usuario/Consumidor al momento de realizar la orden, fijado para esta Campaña en {{TEXTO_ETA}}.\n",
    "eta_intermediacion": "%% Bloque: cashback por ETA · intermediación y seguridad vial\n§ Declaración de intermediación. Rappi actúa únicamente como plataforma de intermediación tecnológica, que facilita la compra de productos ofrecidos por las Tiendas Participantes, quienes son los únicos responsables de la calidad, disponibilidad y cumplimiento de los productos adquiridos. En virtud de lo anterior el Usuario/Consumidor reconoce y acepta que el oferente directo de los productos es el Aliado Comercial, y que Rappi actúa únicamente como plataforma de intermediación tecnológica, por lo que no comercializa productos ni garantiza su disponibilidad. Los presentes términos se sujetan a los Términos y Condiciones del Botón Turbo, disponibles en: {{URL_TC_TURBO}}, y a los Términos y Condiciones de Uso de la Plataforma Rappi, disponibles en: {{URL_TC_PLATAFORMA}}.\n§ Seguridad vial. Rappi no promueve que los repartidores independientes excedan los límites de velocidad ni que infrinjan las normas de tránsito. La velocidad de entrega depende de la gestión de la Tienda Participante y de las condiciones de la vía.\n",
    "exclusiones_beneficio": "%% Bloque compartido: exclusiones_beneficio · versión 3.0\n%% La frase de medicamentos y nicotina solo sale en Colombia (20 de septiembre de 2026).\n§ Exclusiones y restricciones. El Beneficio no aplica para:\n• Pedidos cancelados, devueltos o que no se completen exitosamente por cualquier causa.\n• Pedidos pagados con medios de pago diferentes a los aplicables para la Campaña.\n• Pedidos realizados fuera de la vigencia de la Campaña.\n• Propinas, costos de envío, tarifas de servicio e impuestos.\n[[?TEXTO_EXCLUSION_SALUD]]{{TEXTO_EXCLUSION_SALUD}}[[/?]]\nLa Campaña no es acumulable con otros cupones, descuentos o promociones vigentes en la Plataforma Rappi, salvo que Rappi indique expresamente lo contrario en la comunicación de la Campaña.\n",
    "fraude": "%% Bloque compartido: fraude · versión 3.0\n§ Fraude, abuso y descalificación. Rappi se reserva el derecho de descalificarte de la Campaña y de bloquear temporal o definitivamente tu cuenta si, a juicio razonable de Rappi:\n• Utilizas la Campaña de manera fraudulenta, incluido el uso de cuentas múltiples, datos falsos o la manipulación del sistema o del historial de compras.\n• Intentas alterar, manipular o interferir con el funcionamiento de la Plataforma Rappi o de la Campaña.\n• Incumples los Términos y Condiciones de Uso de la Plataforma Rappi.\nEn caso de descalificación, Rappi podrá revocar los Créditos acreditados o el premio asignado en virtud de la Campaña que aún no hayan sido redimidos o entregados. Los Créditos ya redimidos y los premios ya entregados no serán objeto de recuperación, salvo en casos de fraude comprobado conforme a la legislación aplicable. Rappi te informará la razón de la descalificación a través de los canales de comunicación de la Plataforma Rappi.\n",
    "inhabilidades": "%% Bloque compartido: inhabilidades para participar en un concurso · versión 1.0 · texto de Juan Camilo Gallego, 21 de septiembre de 2026 · solo para modalidades con premio y ganador\n§ Quiénes no pueden participar. Queda expresamente prohibida la participación y la entrega de premios a:\n• Los empleados, directivos, contratistas y colaboradores de Rappi y del Organizador, incluidas sus filiales, subsidiarias, sucursales, agencias de publicidad y demás proveedores logísticos o de ejecución de la Campaña.\n• Sus cónyuges y compañeros o compañeras permanentes.\n• Sus familiares hasta el segundo grado de consanguinidad, segundo de afinidad y primero civil.\nSi al verificar la elegibilidad se identifica que un posible ganador se encuentra en alguno de estos casos, será descalificado de manera automática e inmediata y perderá todo derecho sobre el premio. En ese evento se seleccionará a un nuevo ganador que cumpla la totalidad de los requisitos de elegibilidad.\n",
    "ley": "%% Bloque compartido: ley · versión 3.0\n§ Ley aplicable y jurisdicción. Los presentes Términos y Condiciones se rigen e interpretan de conformidad con {{LEY_APLICABLE}}. Cualquier controversia que surja con ocasión de la Campaña o de los presentes Términos y Condiciones se someterá a {{JURISDICCION}}, sin perjuicio de las acciones, derechos y mecanismos de protección que la ley reconoce a los consumidores ante {{ENTIDAD_VIGILANCIA}}.\n",
    "modificaciones": "%% Bloque compartido: modificaciones · versión 3.0\n§ Modificaciones. Rappi podrá modificar los presentes Términos y Condiciones siempre que se cumplan las siguientes condiciones:\n• Las modificaciones se publicarán en el mismo medio en que se publicaron los Términos y Condiciones originales.\n• Las modificaciones no afectarán los beneficios ya acreditados ni los premios ya asignados con anterioridad a la modificación.\n• Las modificaciones que resulten menos favorables para ti regirán a partir del día siguiente a su publicación y no tendrán efecto retroactivo.\nSi las modificaciones implican un cambio sustancial en las condiciones de la Campaña, como la reducción del beneficio o del premio, la modificación de los comercios o productos participantes o la anticipación de la fecha de finalización, Rappi hará esfuerzos razonables para informarte a través de los canales disponibles en la Plataforma Rappi.\n",
    "naturaleza_creditos": "%% Bloque compartido: naturaleza_creditos · versión 3.0\n§ Naturaleza del Beneficio. El Beneficio consiste en Créditos acreditados en tu Billetera de Créditos de la Plataforma Rappi. Al participar, reconoces y aceptas que:\n• Los Créditos son intangibles que te permiten adquirir productos y/o servicios exhibidos por los Aliados Comerciales a través de la Plataforma Rappi.\n• Los Créditos no constituyen dinero en efectivo, valores ni instrumentos financieros, y no pueden convertirse en dinero.\n• Los Créditos no son transferibles a terceros ni a otras cuentas de la Plataforma Rappi.\n• Los Créditos no son acumulables con otros cupones o promociones, salvo que Rappi indique expresamente lo contrario.\n• El funcionamiento de los Créditos se rige por los Términos y Condiciones de Funcionamiento de los Créditos de la Plataforma Rappi, disponibles en: {{URL_TC_CREDITOS}}.\n",
    "organizador": "%% Bloque compartido: organizador · versión 3.0\n§ Organizador y rol de Rappi. La presente campaña promocional (en adelante, la “Campaña”) es organizada por **{{ORGANIZADOR}}**, identificada con **{{ID_ORGANIZADOR}}** (en adelante, el “Organizador”), quien responde por su desarrollo, sus condiciones y el beneficio o premio ofrecido. **{{ENTIDAD_LEGAL}}** (en adelante, “Rappi”) actúa únicamente como plataforma de contacto e intermediación tecnológica y como medio de difusión de la Campaña; Rappi no es el organizador de la Campaña.\nLos términos con mayúscula inicial que no se definan en este documento tendrán el significado que les asignan los Términos y Condiciones de Uso de la Plataforma Rappi.\n",
    "publicidad": "%% Bloque compartido: publicidad · versión 3.0\n§ Publicidad y prevalencia. Las condiciones específicas de la Campaña son las establecidas en los presentes Términos y Condiciones. En caso de discrepancia entre la información contenida en piezas publicitarias, comunicaciones comerciales o cualquier otro medio de difusión y los presentes Términos y Condiciones, se aplicará la condición más favorable para ti. Rappi se compromete a que la publicidad de la Campaña sea veraz, verificable y no te induzca a error.\n",
    "responsabilidad": "%% Bloque compartido: responsabilidad · versión 3.0\n§ Limitación de responsabilidad. Rappi no será responsable por:\n• La calidad, idoneidad, seguridad o disponibilidad de los productos y/o servicios comercializados por los Aliados Comerciales a través de la Plataforma Rappi, cuya garantía corresponde exclusivamente al Aliado Comercial.\n• Las fallas técnicas, interrupciones o limitaciones en la disponibilidad de la Plataforma Rappi ajenas a su control razonable.\n• Los retrasos en la entrega de los pedidos atribuibles a los Repartidores Independientes o a causas externas.\nLos productos exhibidos en la Plataforma Rappi son ofrecidos y comercializados directamente por los Aliados Comerciales. Rappi no es el vendedor, productor ni expendedor de dichos productos, y la factura de los productos será emitida por el Aliado Comercial correspondiente. La disponibilidad de los Aliados Comerciales depende de sus horarios de operación, cobertura y condiciones propias.\n",
    "responsabilidad_rappi_beneficio": "%% Bloque compartido: responsabilidad_rappi_beneficio · versión 3.0\n§ Responsabilidades de Rappi. Rappi es responsable de: (i) la correcta acreditación de los Créditos en tu Billetera de Créditos conforme a las condiciones de la Campaña; (ii) la publicación veraz y completa de los presentes Términos y Condiciones; y (iii) la atención oportuna de tus peticiones, quejas y reclamos relacionados con la Campaña.\n",
    "travel_atencion": "%% Bloque de Rappi Travel: atención al usuario · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 17 (AJUSTADO)\n§ Atención al usuario. Para cualquier consulta, petición, queja o reclamo relacionado con la Campaña, puedes comunicarte con Rappi Travel a través de los siguientes canales:\n• El Centro de Ayuda de la Plataforma Rappi.\n• Los canales de atención de Rappi Travel disponibles en **{{URL_SITIO_TRAVEL}}**.\n",
    "travel_beneficio_por_producto": "%% Bloque compartido: beneficio que cambia segun el producto · versión 1.0 · 21 de septiembre de 2026 · base: las dos piezas de hoteles de docs/piezas_publicadas/\n[[?TEXTO_BENEFICIO_POR_PRODUCTO]]§ Beneficio por Producto Participante. El Beneficio varía según el Producto Participante seleccionado y está sujeto a disponibilidad. Participan únicamente los siguientes, con el Beneficio que se indica para cada uno:\n{{TEXTO_BENEFICIO_POR_PRODUCTO}}\nEl Beneficio aplicable a cada orden será el que corresponda al Producto Participante seleccionado, conforme a la lista anterior. Los Productos Participantes no incluidos en ella no dan lugar a Beneficio alguno. La aplicación del Beneficio está sujeta a la disponibilidad, a las fechas y a las políticas de reserva, modificación y cancelación de cada Proveedor; en caso de discrepancia entre la lista anterior y la política del Proveedor, prevalecerá esta última.[[/?]]\n",
    "travel_cobertura": "%% Bloque de Rappi Travel: cobertura · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 3 (AJUSTADO)\n§ Cobertura. Esta Campaña es válida exclusivamente para las órdenes realizadas a través de los Sistemas Rappi Travel en {{TEXTO_TERRITORIO}} (en adelante, el “Territorio”). La disponibilidad puede variar según tu ubicación y la oferta de los proveedores y operadores turísticos.\n",
    "travel_condiciones": "%% Bloque de Rappi Travel: condiciones de los productos · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 7 (NUEVO) · revisar con Juan\n[[?TEXTO_CONDICIONES_TRAVEL]]§ Condiciones de los Productos Participantes. El Beneficio aplica únicamente cuando la compra cumple las siguientes condiciones:\n{{TEXTO_CONDICIONES_TRAVEL}}[[/?]]\n",
    "travel_datos": "%% Bloque de Rappi Travel: tratamiento de datos · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 22 (AJUSTADO; política PENDIENTE, R14)\n§ Tratamiento de datos personales. Los datos personales de los participantes serán tratados por **{{ENTIDAD_TRAVEL}}** con la finalidad exclusiva de gestionar la participación en la Campaña, verificar el cumplimiento de los requisitos y {{VERBO_BENEFICIO_TRAVEL}} el Beneficio. Dicho tratamiento se rige por la legislación aplicable y por {{POLITICA_PRIVACIDAD_TRAVEL}}, disponible en: {{URL_PRIVACIDAD_TRAVEL}}, previamente aceptada por el Usuario/Consumidor. Podrás ejercer en cualquier momento {{TEXTO_DERECHOS_DATOS}}, a través de los canales dispuestos para tal fin en dicho documento, así como acudir ante {{AUTORIDAD_DATOS}}.\n",
    "travel_ley": "%% Bloque de Rappi Travel: ley aplicable · versión 1.0 · base: bloque ley de v3, con la entidad de vigilancia de Travel (PENDIENTE, R5)\n§ Ley aplicable y jurisdicción. Los presentes Términos y Condiciones se rigen e interpretan de conformidad con {{LEY_APLICABLE}}. Cualquier controversia que surja con ocasión de la Campaña o de los presentes Términos y Condiciones se someterá a {{JURISDICCION}}, sin perjuicio de las acciones, derechos y mecanismos de protección que la ley reconoce a los consumidores ante {{ENTIDAD_VIGILANCIA_TRAVEL}}.\n",
    "travel_modificaciones": "%% Bloque de Rappi Travel: modificaciones · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 18 (AJUSTADO; última frase NUEVA)\n§ Modificaciones. Rappi Travel podrá modificar los presentes Términos y Condiciones siempre que se cumplan las siguientes condiciones:\n• Las modificaciones se publicarán en el mismo medio en que se publicaron los Términos y Condiciones originales.\n• Las modificaciones no afectarán {{TEXTO_YA_OTORGADO_TRAVEL}} con anterioridad a la modificación.\n• Las modificaciones que resulten menos favorables para ti regirán a partir del día siguiente a su publicación y no tendrán efecto retroactivo.\nSi las modificaciones implican un cambio sustancial en las condiciones de la Campaña, como la reducción del Beneficio, la modificación de los Productos Participantes o la anticipación de la fecha de finalización, Rappi Travel hará esfuerzos razonables para informarte a través de los Sistemas Rappi Travel. Toda modificación quedará registrada al final de este documento, con su fecha.\n",
    "travel_organizador": "%% Bloque de Rappi Travel: organizador · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 1 (AJUSTADO, R1) · revisar con Juan\n§ Organizador y rol de Rappi Travel. La presente campaña promocional (en adelante, la “Campaña”) es organizada por **{{ORGANIZADOR}}**, identificada con **{{ID_ORGANIZADOR}}** (en adelante, el “Organizador”), quien responde por su desarrollo, sus condiciones y el beneficio ofrecido. **{{ENTIDAD_TRAVEL}}**, identificada con **{{ID_FISCAL_TRAVEL}}** e inscrita en el Registro Nacional de Turismo con el número **{{RNT_TRAVEL}}** (en adelante, “Rappi Travel”), actúa como agencia de viajes que opera los Sistemas Rappi Travel y como medio de difusión de la Campaña; Rappi Travel no es el organizador de la Campaña.\nLos términos con mayúscula inicial que no se definan en este documento tendrán el significado que les asignan los Términos y Condiciones de los Sistemas Rappi Travel.\n",
    "travel_otros_tyc": "%% Bloque de Rappi Travel: aplicación de otros T&C · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 20 (AJUSTADO)\n§ Aplicación de otros Términos y Condiciones. Los presentes Términos y Condiciones son especiales y complementarios respecto de los Términos y Condiciones de los Sistemas Rappi Travel, disponibles en: {{URL_TC_TRAVEL}}, y de los Términos y Condiciones de Uso de la Plataforma Rappi, disponibles en: {{URL_TC_PLATAFORMA}}, los cuales continúan aplicando en todo aquello no regulado expresamente en el presente documento. En caso de contradicción respecto de las condiciones específicas de la Campaña, prevalecerán los presentes Términos y Condiciones.\n",
    "travel_precio_anunciado": "%% Bloque compartido: precio anunciado en la pieza · versión 1.0 · 21 de septiembre de 2026 · solo cuando la pieza anuncia un precio\n[[?TEXTO_PRECIO_ANUNCIADO]]§ Precio anunciado. Los precios que se anuncian en las piezas publicitarias de la Campaña, incluidos los que se presentan precedidos de la expresión “desde”, corresponden al valor final por Producto Participante e incluyen los impuestos, tasas y cargos aplicables. Estos precios corresponden a la tarifa más baja disponible al momento de la publicación de la pieza, están sujetos a disponibilidad y pueden variar según la fecha de viaje, el destino, la clase o categoría seleccionada y la fecha en que se realice la reserva. El precio aplicable a cada orden será el que se muestre en los Sistemas Rappi Travel al momento de completar la compra.[[/?]]\n",
    "travel_productos": "%% Bloque de Rappi Travel: productos participantes · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 6 (AJUSTADO)\n§ Productos Participantes. {{TEXTO_PRODUCTOS_TRAVEL}}[[?TEXTO_AMBITO_TRAVEL]] {{TEXTO_AMBITO_TRAVEL}}[[/?]][[?TEXTO_DESTINOS_TRAVEL]] {{TEXTO_DESTINOS_TRAVEL}}[[/?]][[?TEXTO_HOTELES_TRAVEL]] {{TEXTO_HOTELES_TRAVEL}}[[/?]]\nLos productos y servicios turísticos son prestados por aerolíneas, hoteles, rentadoras de autos, operadores de tours y actividades y compañías de asistencia al viajero (en adelante, los “Proveedores”), conforme a sus propias condiciones.\n",
    "travel_publicidad": "%% Bloque de Rappi Travel: publicidad y prevalencia · versión 1.0 · base: bloque publicidad de v3 (TAL CUAL, \"Rappi\" pasa a \"Rappi Travel\")\n§ Publicidad y prevalencia. Las condiciones específicas de la Campaña son las establecidas en los presentes Términos y Condiciones. En caso de discrepancia entre la información contenida en piezas publicitarias, comunicaciones comerciales o cualquier otro medio de difusión y los presentes Términos y Condiciones, se aplicará la condición más favorable para ti. Rappi Travel se compromete a que la publicidad de la Campaña sea veraz, verificable y no te induzca a error.\n",
    "travel_responsabilidad": "%% Bloque de Rappi Travel: limitación de responsabilidad · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 21 (TAL CUAL del Modelo junio) · OJO: R4 propone otra redacción, pendiente de Juan\n§ Limitación de responsabilidad. Rappi Travel actúa como intermediario para la comercialización de productos y servicios turísticos provistos por proveedores y operadores. En consecuencia, Rappi Travel no será responsable por: (i) la prestación, calidad, idoneidad, disponibilidad o cumplimiento de los servicios turísticos a cargo de los proveedores u operadores; (ii) las cancelaciones, modificaciones o penalidades aplicadas por el proveedor, aerolínea u operador conforme a sus propias políticas; (iii) las fallas técnicas, interrupciones o limitaciones en la disponibilidad de los Sistemas Rappi Travel ajenas a su control razonable; ni (iv) los rechazos de órdenes derivados de fallas en la conexión con los proveedores u operadores. Rappi Travel sí es responsable de: (i) {{TEXTO_RESPONSABILIDAD_TRAVEL}}; (ii) la publicación veraz y completa de los presentes Términos y Condiciones; y (iii) la atención oportuna de tus peticiones, quejas y reclamos relacionados con la Campaña.\n",
    "travel_sistemas": "%% Bloque de Rappi Travel: sistemas · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 2 (TAL CUAL del Modelo junio)\n§ Sistemas Rappi Travel. Para efectos de los presentes Términos y Condiciones, los Sistemas Rappi Travel incluyen, sin limitarse a: (i) la Plataforma Rappi; (ii) la sección “Rappi Travel” dentro de la página web **{{URL_SITIO_TRAVEL}}**; y (iii) el Botón Rappi Travel.\n",
    "travel_usuarios": "%% Bloque de Rappi Travel: usuarios participantes · versión 1.0 · base: docs/MODELO_BASE_TRAVEL.md, cláusula 5 (AJUSTADO)\n§ Usuarios participantes. {{TEXTO_SEGMENTO_TRAVEL}} Para participar, el Usuario/Consumidor debe ser persona natural mayor de edad, contar con una cuenta activa en la Plataforma Rappi y cumplir los requisitos establecidos en los presentes Términos y Condiciones.\n",
    "tyc_plataforma": "%% Bloque compartido: tyc_plataforma · versión 3.0\n§ Aplicación de los Términos y Condiciones de Uso de la Plataforma Rappi. Los presentes Términos y Condiciones son especiales y complementarios respecto de los Términos y Condiciones de Uso de la Plataforma Rappi, disponibles en: {{URL_TC_PLATAFORMA}}, los cuales continúan aplicando en todo aquello no regulado expresamente en el presente documento. En caso de contradicción respecto de las condiciones específicas de la Campaña, prevalecerán los presentes Términos y Condiciones.\n",
    "usuarios_beneficio": "%% Bloque compartido: usuarios_beneficio · versión 3.0\n§ Usuarios participantes. {{TEXTO_SEGMENTO}} El Usuario/Consumidor participante deberá cumplir con los requisitos establecidos en los presentes Términos y Condiciones.\n",
    "vigencia_creditos": "%% Bloque compartido: vigencia_creditos · versión 3.0\n§ Vigencia y redención de los Créditos. Los Créditos acreditados en virtud de la Campaña **{{TEXTO_VIGENCIA_CREDITOS}}**. {{TEXTO_LUGAR_REDENCION}} Una vez vencidos, los Créditos no podrán ser recuperados, reactivados ni compensados por Rappi. Eres responsable de redimir tus Créditos dentro del plazo indicado.\n"
  },
};

if (typeof module !== 'undefined') { module.exports = { MODELOS: MODELOS }; }
